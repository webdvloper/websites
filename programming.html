task:K('Постройте список через push значениями 1, 2, 3 (получится 3 2 1), разверните его, выведите и освободите память.',['Функции push, reverse, free_list','Вывод после разворота'],'Вывод: 1 2 3',`#include <stdio.h>

    return n;

    Node *prev = NULL;
    while (h) { Node *nx = h->next; h->next = prev; prev = h; h = nx; }

    while (h) { Node *t = h->next; free(h); h = t; }

}

task:K('Добавьте ограничение: у игрока 7 попыток. Если попытки закончились, выведите «Попытки закончились».',['Цикл по game.attempts()','Сообщение о проигрыше'],'После 7 неверных попыток: Попытки закончились',`#include <iostream>
#include <random>

class Game {
public:
    enum class Result { Low, High, Win };
    explicit Game(int secret) : secret_(secret) {}
    Result guess(int g) {
        ++attempts_;
        if (g < secret_) return Result::Low;
        if (g > secret_) return Result::High;
        return Result::Win;
    }
    int attempts() const { return attempts_; }
private:
    int secret_;
    int attempts_ = 0;
};

int main() {
    std::mt19937 gen{std::random_device{}()};
    Game game(std::uniform_int_distribution<int>(1, 100)(gen));
    const int maxAttempts = 7;
    while (game.attempts() < maxAttempts) {
        int g;
        std::cout << "Попытка " << game.attempts() + 1 << ": ";
        if (!(std::cin >> g)) return 1;
        switch (game.guess(g)) {
            case Game::Result::Low:  std::cout << "Больше\\n"; break;
            case Game::Result::High: std::cout << "Меньше\\n"; break;
            case Game::Result::Win:
                std::cout << "Победа за " << game.attempts() << "\\n";
                return 0;
        }
    }
    std::cout << "Попытки закончились\\n";
}`)}

['c',`public record TodoItem(int Id, string Text, bool Done);

public class TodoService
{
    private readonly List<TodoItem> _items = new();
    public IReadOnlyList<TodoItem> Items => _items;

    public TodoItem Add(string text)
    {
        if (string.IsNullOrWhiteSpace(text))
            throw new ArgumentException("Текст пуст", nameof(text));
        var item = new TodoItem(_items.Count + 1, text.Trim(), false);
        _items.Add(item);
        return item;
    }

    public bool Complete(int id)
    {
        int i = _items.FindIndex(t => t.Id == id);
        if (i < 0) return false;
        _items[i] = _items[i] with { Done = true };   // record неизменяем: делаем копию
        return true;
    }
}`],

{

    switch (parts[0])
    {
        case "add" when parts.Length == 2:
            service.Add(parts[1]); break;
        case "done" when parts.Length == 2 && int.TryParse(parts[1], out int id):

task:K('Создайте класс Shape с методом area(), классы Circle(r) и Rectangle(w, h). Выведите площади круга с r = 1 и прямоугольника 2×3 с двумя знаками (Locale.US).',['Наследование и @Override','String.format(Locale.US, ...)'],'Вывод: 3.14 6.00',`import java.util.Locale;

public class Main {
    public static void main(String[] args) {
        Shape[] shapes = { new Circle(1), new Rectangle(2, 3) };
        StringBuilder sb = new StringBuilder();
        for (Shape s : shapes) {

        }
        System.out.println(sb.toString().strip());
    }

class Shape {
    double area() { return 0; }
}

    private final double r;
    Circle(double r) { this.r = r; }
    @Override double area() { return Math.PI * r * r; }
}

"Java:19":{theory:T(['h','Итоговый проект: менеджер задач'],['p','Консольное приложение с командами add, done, list. Логика вынесена в TaskService, ввод-вывод — в Main, поэтому логику легко тестировать.'],
['c',`record Task(int id, String text, boolean done) { }

class TaskService {
    private final List<Task> tasks = new ArrayList<>();
    private int nextId = 1;

    Task add(String text) {
        if (text == null || text.isBlank())
            throw new IllegalArgumentException("Текст пуст");
        Task t = new Task(nextId++, text.strip(), false);
        tasks.add(t);
        return t;
    }

    boolean complete(int id) {
        for (int i = 0; i < tasks.size(); i++) {
            Task t = tasks.get(i);
            if (t.id() == id) {
                tasks.set(i, new Task(id, t.text(), true));   // record неизменяем: заменяем целиком
                return true;
            }
        }
        return false;
    }

    List<Task> all() { return List.copyOf(tasks); }
}`],

            }
        }
    }
}`],

['c',`// app.js — часть 1: чистые функции (легко тестировать, ничего не знают о странице)
function addTask(list, text) {
  const t = text.trim();
  if (!t) return list;
  return [...list, { id: Date.now() + list.length, text: t, done: false }];
}
function toggleTask(list, id) {
  return list.map(t => (t.id === id ? { ...t, done: !t.done } : t));
}
function removeTask(list, id) {
  return list.filter(t => t.id !== id);
}`],
['c',`// app.js — часть 2: состояние, отрисовка и события
const KEY = "tasks";
let tasks = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) ?? []; }
  catch { return []; }                          // повреждённые данные не ломают приложение
}
function save() { localStorage.setItem(KEY, JSON.stringify(tasks)); }

function render() {
  const ul = document.querySelector("#list");
  ul.innerHTML = "";
  for (const t of tasks) {
    const li = document.createElement("li");
    li.textContent = t.text;                    // textContent защищает от XSS
    li.dataset.id = t.id;
    li.style.textDecoration = t.done ? "line-through" : "none";
    const del = document.createElement("button");
    del.textContent = "×";
    del.dataset.action = "remove";
    li.append(" ", del);
    ul.append(li);
  }
  document.querySelector("#count").textContent =
    \`Осталось: \${tasks.filter(t => !t.done).length}\`;
}

document.querySelector("#form").addEventListener("submit", e => {
  e.preventDefault();
  const input = document.querySelector("#text");
  tasks = addTask(tasks, input.value);
  input.value = "";
  save(); render();
});

document.querySelector("#list").addEventListener("click", e => {   // делегирование
  const li = e.target.closest("li");
  if (!li) return;
  const id = Number(li.dataset.id);
  tasks = e.target.dataset.action === "remove" ? removeTask(tasks, id) : toggleTask(tasks, id);
  save(); render();
});

render();`],

import (

    "strconv"

    ErrNotNumber = errors.New("возраст должен быть числом")

)

    }

type Task struct {

    Text string \`json:"text"\`
    Done bool   \`json:"done"\`

type Store struct {
    mu     sync.Mutex
    tasks  []Task
    nextID int
}

func (s *Store) Add(text string) Task {
    s.mu.Lock()
    defer s.mu.Unlock()
    s.nextID++
    t := Task{ID: s.nextID, Text: text}
    s.tasks = append(s.tasks, t)
    return t
}

    s.mu.Lock()
    defer s.mu.Unlock()
    out := make([]Task, len(s.tasks))   // копия, чтобы не отдавать внутренний срез
    copy(out, s.tasks)

"PHP:19":{theory:T(['h','Итоговый проект: список задач (CRUD)'],['p','CRUD — четыре операции: создание, чтение, обновление, удаление. Разделим код на слой данных (TaskRepository) и страницу, которая только принимает запрос и выводит HTML.'],
['c',`<?php
// TaskRepository.php
class TaskRepository {
    public function __construct(private PDO $pdo) {}
    public function add(string $title): int {
        $st = $this->pdo->prepare("INSERT INTO tasks (title) VALUES (?)");
        $st->execute([$title]);
        return (int)$this->pdo->lastInsertId();
    }
    public function all(): array {
        return $this->pdo->query("SELECT id, title, done FROM tasks ORDER BY id")->fetchAll();
    }
    public function toggle(int $id): void {
        $this->pdo->prepare("UPDATE tasks SET done = 1 - done WHERE id = ?")->execute([$id]);
    }
    public function delete(int $id): void {
        $this->pdo->prepare("DELETE FROM tasks WHERE id = ?")->execute([$id]);
    }
}`],
['h','Страница: POST, redirect и вывод'],
['c',`<?php

    $title = trim($_POST["title"] ?? "");
    if ($title !== "") $repo->add($title);          // валидация на сервере
    header("Location: index.php");                  // PRG: после POST — redirect
    exit;                                           // после header всегда exit
}
foreach ($repo->all() as $t): ?>
  <li><?= htmlspecialchars($t["title"], ENT_QUOTES, "UTF-8") ?></li>
<?php endforeach;`],
['h','Проверка логики без сервера'],
['c',`$pdo = new PDO("sqlite::memory:", null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);

$id = $repo->add("купить молоко");

['c',`data class Todo(val id: Int, val text: String, val done: Boolean = false)

class TodoService {
    private val items = mutableListOf<Todo>()
    val all: List<Todo> get() = items.toList()           // копия: снаружи список не испортить

    fun add(text: String): Todo {
        require(text.isNotBlank()) { "Текст пуст" }
        val t = Todo(items.size + 1, text.trim())
        items.add(t)
        return t
    }
    fun complete(id: Int): Boolean {
        val i = items.indexOfFirst { it.id == id }
        if (i < 0) return false
        items[i] = items[i].copy(done = true)            // data class неизменяем: заменяем копией
        return true
    }
}`],

struct Todo {
    let id: Int
    var text: String
    var done = false
}

struct TodoService {
    private(set) var items: [Todo] = []              // читать можно, менять снаружи нельзя
    private var nextId = 1

    mutating func add(_ text: String) throws -> Todo {
        let t = text.trimmingCharacters(in: .whitespaces)
        guard !t.isEmpty else { throw TodoError.emptyText }
        let todo = Todo(id: nextId, text: t)
        nextId += 1
        items.append(todo)
        return todo
    }
    mutating func complete(_ id: Int) -> Bool {
        guard let i = items.firstIndex(where: { $0.id == id }) else { return false }
        items[i].done = true
        return true
    }
}`],

['h','Модель и хранилище'],['c',`// src/models.ts
export type Category = "food" | "tools" | "toys";
export interface Item { id: number; title: string; qty: number; category: Category }

// src/store.ts
import { Item } from "./models";
export class Store<T extends { id: number }> {
  private items = new Map<number, T>();
  add(item: T): void {
    if (this.items.has(item.id)) throw new Error("Дубликат id " + item.id);
    this.items.set(item.id, item);
  }
  get(id: number): T | undefined { return this.items.get(id); }
  update(id: number, patch: Partial<Omit<T, "id">>): boolean {
    const cur = this.items.get(id);
    if (!cur) return false;
    this.items.set(id, { ...cur, ...patch });
    return true;
  }
  all(): T[] { return [...this.items.values()]; }
}`],
['h','Использование'],['c',`// src/main.ts

store.add({ id: 2, title: "Хлеб", qty: 20, category: "food" });
store.update(1, { qty: 4 });
const total = store.all().reduce((s, i) => s + i.qty, 0);
console.log("Всего единиц:", total);                  // 24
const food = store.all().filter(i => i.category === "food");
console.log(food.map(i => i.title));                  // [ 'Хлеб' ]

"SQL:19":{theory:T(['h','Задача'],['p','Итоговый проект — база данных интернет-магазина: клиенты, товары, заказы и позиции заказов. Нужно спроектировать нормализованную схему, наполнить её данными и написать аналитические запросы. Всё делается в SQLite: sqlite3 shop.db.'],
['h','Схема'],['c',`PRAGMA foreign_keys = ON;
CREATE TABLE customers (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  name TEXT NOT NULL,
  email TEXT NOT NULL UNIQUE,
  created DATE DEFAULT (date('now'))
);
CREATE TABLE products (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  title TEXT NOT NULL,
  category TEXT NOT NULL,
  price DECIMAL(10, 2) NOT NULL CHECK (price >= 0),
  stock INTEGER NOT NULL DEFAULT 0 CHECK (stock >= 0)
);
CREATE TABLE orders (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  customer_id INTEGER NOT NULL REFERENCES customers (id),
  created DATE NOT NULL DEFAULT (date('now')),
  status TEXT NOT NULL DEFAULT 'new' CHECK (status IN ('new', 'paid', 'shipped'))
);
CREATE TABLE order_items (
  order_id INTEGER NOT NULL REFERENCES orders (id) ON DELETE CASCADE,
  product_id INTEGER NOT NULL REFERENCES products (id),
  qty INTEGER NOT NULL CHECK (qty > 0),
  price DECIMAL(10, 2) NOT NULL,     -- цена на момент покупки
  PRIMARY KEY (order_id, product_id)
);
CREATE INDEX idx_orders_customer ON orders (customer_id);
CREATE INDEX idx_items_product ON order_items (product_id);`],
['h','Данные и оформление заказа'],['c',`INSERT INTO customers (name, email) VALUES ('Анна', 'anna@mail.ru'), ('Иван', 'ivan@mail.ru');
INSERT INTO products (title, category, price, stock) VALUES
  ('Хлеб', 'еда', 50, 100), ('Молоко', 'еда', 80, 50), ('Молоток', 'инструменты', 700, 10);
BEGIN;                                                      -- заказ оформляем атомарно
INSERT INTO orders (customer_id, status) VALUES (1, 'paid');
INSERT INTO order_items (order_id, product_id, qty, price)
  SELECT last_insert_rowid(), id, 2, price FROM products WHERE title = 'Хлеб';
UPDATE products SET stock = stock - 2 WHERE title = 'Хлеб';
COMMIT;`],
['h','Аналитика'],['c',`-- выручка по категориям
SELECT p.category, SUM(oi.qty * oi.price) AS revenue
FROM order_items oi JOIN products p ON p.id = oi.product_id
JOIN orders o ON o.id = oi.order_id AND o.status IN ('paid', 'shipped')
GROUP BY p.category ORDER BY revenue DESC;
-- клиенты без заказов
SELECT c.name FROM customers c LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL;
-- топ-3 товара по продажам с рангом
SELECT title, sold, RANK() OVER (ORDER BY sold DESC) AS rnk
FROM (SELECT p.title, SUM(oi.qty) AS sold FROM products p JOIN order_items oi ON oi.product_id = p.id GROUP BY p.id)
LIMIT 3;
-- представление для отчёта
CREATE VIEW order_totals AS
SELECT o.id, c.name, o.created, SUM(oi.qty * oi.price) AS total
FROM orders o JOIN customers c ON c.id = o.customer_id JOIN order_items oi ON oi.order_id = o.id
GROUP BY o.id;`],

"Bash:19":{theory:T(['h','Задача'],['p','Итоговый проект — скрипт резервного копирования backup.sh. Он принимает каталог-источник и каталог-назначение, создаёт архив с датой, проверяет его, хранит только N последних копий и пишет лог. Используем всё пройденное: переменные, функции, getopts, tar, find, trap и строгий режим.'],

['h','Скрипт'],['c',`#!/bin/bash
set -euo pipefail

keep=7
quiet=0
log_file="\${LOG_FILE:-$HOME/backup.log}"

usage() { echo "Использование: $0 [-k число] [-q] <источник> <назначение>" >&2; exit 1; }
log() {
  local msg="[$(date '+%F %T')] $*"
  echo "$msg" >> "$log_file"
  [[ $quiet -eq 1 ]] || echo "$msg"
}

while getopts "k:qh" opt; do
  case $opt in
    k) keep=$OPTARG ;;
    q) quiet=1 ;;
    *) usage ;;
  esac
done
shift $((OPTIND - 1))
[[ $# -eq 2 ]] || usage
src=$1
dest=$2

[[ -d "$src" ]] || { echo "нет каталога: $src" >&2; exit 1; }
[[ $keep =~ ^[0-9]+$ && $keep -ge 1 ]] || { echo "-k: нужно положительное число" >&2; exit 1; }
mkdir -p "$dest"

name="$(basename "$src")_$(date +%F_%H%M%S).tar.gz"
tmp="$dest/.$name.part"
trap 'rm -f "$tmp"' EXIT                       # убрать недописанный архив при сбое

log "старт: $src -> $dest/$name"
tar -czf "$tmp" -C "$(dirname "$src")" "$(basename "$src")"
tar -tzf "$tmp" > /dev/null                    # проверка: архив читается
mv "$tmp" "$dest/$name"
log "готово: $(du -h "$dest/$name" | cut -f1)"

# ротация: оставить keep последних архивов
count=0
while IFS= read -r f; do
  count=$((count + 1))
  if [[ $count -gt $keep ]]; then
    rm -f -- "$f"
    log "удалён старый архив: $f"
  fi
done < <(ls -1t "$dest"/"$(basename "$src")"_*.tar.gz 2>/dev/null)
log "завершено"`],

"Rust:8": "Коротко о главном: Символ & создаёт ссылку. Изменяемая ссылка должна быть единственной. Переменная тоже должна быть объявлена с mut.",
"Rust:9": "Коротко о главном: Это ссылка на часть строки. Кириллица занимает по 2 байта. Правая граница не включается. Литерал &str неизменяем, String — нет.",
"Rust:10": "Коротко о главном: impl Тип { ... } Но экземпляр должен быть объявлен с mut. Через :: у типа. Для {} нужен Display. Это отличие от массива.",
"Rust:11": "Коротко о главном: Каждый вариант должен быть охвачен. Например, Circle(f64). Это краткая запись match с одной веткой. В практической задаче проверьте: Использовать match; Охватить все варианты.",
"Rust:12": "Коротко о главном: Some(x) или None. Result<T, E>. Иначе достаёт значение из Ok. unwrap() на None вызывает панику. Из букв число не получится.",
"Rust:13": "Коротко о главном: v.push(x). В отличие от v[10], паники нет. Возвращает изменяемую ссылку на значение. Доступ по ключу, а не по индексу.",
"Rust:14": "Коротко о главном: Затем реализация через impl ... for .... Её можно переопределить. Или дженерик T: Speak. Наследования в Rust нет. Это обычная практика.",
"Rust:15": "Коротко о главном: Любой тип, подходящий под ограничения. Код специализируется при компиляции. Это аннотация времени жизни.",
"Rust:16": "Коротко о главном: По умолчанию всё приватно. Раздел [dependencies]. Команда cargo run. Cargo — менеджер проектов и пакетов. Нужен pub у поля или метод-геттер.",
"Rust:17": "Коротко о главном: Затем cargo test находит её сам. assert_eq! паникует при несовпадении. Есть также assert! и assert_ne!. В обычную сборку этот код не входит.",
"Rust:18": "Коротко о главном: Параметры в вертикальных чертах. Вычисления запускает collect, sum и подобные методы. 2 + 4 + 6 = 12. map — адаптер, он ленив.",
"Rust:19": "Коротко о главном: args[0] — имя программы. После -- аргументы идут в программу, а не в cargo. Возвращает Result<String, io::Error>. В практической задаче проверьте: Использовать parse::<usize>() и Vec::remove; Проверить границы.",
"TypeScript:0": "Коротко о главном: Результат работает везде, где работает JavaScript. Сначала код нужно скомпилировать в .js. Компилятор называется tsc.",
"TypeScript:1": "Коротко о главном: Все числа в TypeScript — number. Поэтому any стараются не использовать. Также подходит Array<string>. Типа int в TypeScript нет. Ошибка TS2322.",
"TypeScript:2": "Коротко о главном: Для let выводится общий тип number. as влияет только на проверку типов. Иначе тип станет any. В практической задаче проверьте: Явная аннотация у price; const без аннотации.",
"TypeScript:3": "Коротко о главном: Все числа — number, деление дробное. ?? реагирует только на null и undefined. Типы number и string не пересекаются. Это опциональная цепочка.",
"TypeScript:4": "Коротко о главном: for...in перебирает ключи. Это «проваливание» (fallthrough). Остаток тела пропускается. Для значений массива нужен for...of.",
"TypeScript:5": "Коротко о главном: Результат не используют. Число аргументов проверяется. Вопросительный знак после имени. В практической задаче проверьте: Тип результата указан; Значение по умолчанию.",
"TypeScript:6": "Коротко о главном: Также подходит Array<string>. Изменяющие методы недоступны. Например, [string, number]. Лишних элементов быть не может.",
"TypeScript:7": "Коротко о главном: Это контракт на свойства и методы. Это ошибка компиляции. Вопросительный знак после имени. Лишние поля в литерале запрещены.",
"TypeScript:8": "Коротко о главном: Это объединение типов. Это пересечение типов. typeof внутри if сужает тип. type гибче interface. По нему TypeScript сужает тип.",
"TypeScript:9": "Коротко о главном: Up = 0, Down = 1. Например, Status.Ok = \"OK\". Это литеральный union. Работа программы не меняется, меняется только тип.",
"TypeScript:10": "Коротко о главном: Через ключевое слово new. Это сокращённая запись. static принадлежит классу. Главное — поле должно быть инициализировано.",
"TypeScript:11": "Коротко о главном: Наследникам нужен protected. Но не снаружи класса. Без модификатора член публичный. Наследникам такое поле недоступно.",
"TypeScript:12": "Коротко о главном: Затем компилятор проверит все члены. Через extends. Нужен конкретный наследник. Без super() в потомке будет ошибка.",
"TypeScript:13": "Коротко о главном: Подставляется при вызове. В отличие от any. Это ограничение параметра. Строки компилятор запретит.",
"TypeScript:14": "Коротко о главном: В ветке TypeScript знает точный тип. Например, Dog | Cat. Пользовательская защита типа. as any ничего не проверяет, а отключает проверки.",
"TypeScript:15": "Коротко о главном: Файл создаётся с набором настроек по умолчанию. strictNullChecks делает null отдельным типом. Исходники указывают через rootDir и include.",
"TypeScript:16": "Коротко о главном: Именованные экспорты — в фигурных скобках. Именованных экспортов можно сколько угодно. Рантайм-кода не остаётся.",
"TypeScript:17": "Коротко о главном: Удобно для объектов-патчей. Pick, наоборот, выбирает поля. Словарь. typeof — оператор, а не утилитарный тип. Например, \"id\" | \"name\".",
"TypeScript:18": "Коротко о главном: async всегда оборачивает результат. Вы получите сам Promise. Типы результатов сохраняются в кортеже.",
"TypeScript:19": "Коротко о главном: Хранилище использует item.id. Omit убирает id, Partial делает остальные необязательными. Компилятор принимает только эти значения.",
"SQL:0": "Коротко о главном: Примеры: SQLite, PostgreSQL, MySQL. Он позволяет читать и изменять данные в таблицах. SELECT — основная команда выборки.",
"SQL:1": "Коротко о главном: Это стандартная команда SQL. Строку без значения вставить не удастся. Оно подставляется, если значение не указано.",
"SQL:2": "Коротко о главном: DECIMAL хранит точные значения. Порядок символов совпадает с хронологическим. VARCHAR(n) ограничивает длину.",
"SQL:3": "Коротко о главном: INSERT INTO таблица (столбцы) VALUES (значения). Код не сломается при изменении таблицы. В стандарте SQL апостроф удваивают.",
"SQL:4": "Коротко о главном: WHERE стоит после FROM. % — любое число символов. Это эквивалент >= 18 AND <= 30. Без FROM таблица не определена. Поэтому используйте скобки.",
"SQL:5": "Коротко о главном: DESC ставится после столбца. Порядок не определён. OFFSET пропускает строки. Нужно указать хотя бы один критерий.",
"SQL:6": "Коротко о главном: Сравнение через = с NULL всегда неизвестно. Любое действие с NULL даёт NULL. Удобно для значений по умолчанию.",
"SQL:7": "Коротко о главном: COUNT(столбец) считает не-NULL значения. Среднее считается по известным значениям. WHERE выполняется до агрегации.",
"SQL:8": "Коротко о главном: Агрегаты считаются по каждой группе. WHERE работает до группировки. В WHERE агрегаты запрещены. name не входит в группировку.",
"SQL:9": "Коротко о главном: Условие отсутствует. Таблица остаётся, удаляются только строки; структуру удаляет DROP TABLE. В практической задаче проверьте: SELECT с тем же WHERE; UPDATE и DELETE с WHERE.",
"SQL:10": "Коротко о главном: Каждая строка однозначно определяется. Иначе будет ошибка FOREIGN KEY constraint failed. Каскадное удаление.",
"SQL:11": "Коротко о главном: Без пары строка исчезает. Отсутствующие значения справа — NULL. После LEFT JOIN у «одиноких» строк справа NULL.",
"SQL:12": "Коротко о главном: Он записывается в скобках. Иначе будет ошибка. Возвращает истину, если строка найдена. Подзапрос применяют почти везде.",
"SQL:13": "Коротко о главном: В MySQL используют CONCAT(). Начало с позиции 1, длина 4. Так работают date() и strftime(). CURRENT_DATE работает в SQLite, PostgreSQL и MySQL.",
"SQL:14": "Коротко о главном: Он помогает не просматривать всю таблицу. При записи индекс тоже нужно обновлять. CREATE INDEX имя ON таблица (столбцы).",
"SQL:15": "Коротко о главном: После COMMIT изменения сохранены. Данные возвращаются к исходному состоянию. Транзакция неделима.",
"SQL:16": "Коротко о главном: Каждый факт хранится в одном месте. Одно значение на ячейку. Например, order_items связывает заказы и товары.",
"SQL:17": "Коротко о главном: Данные берутся из исходных таблиц при обращении. VIEW же хранится в базе. WITH имя AS (SELECT ...). Данные не дублируются.",
"SQL:18": "Коротко о главном: Каждая исходная строка остаётся. Функция считается отдельно для каждой группы. В практической задаче проверьте: ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...); Фильтрация rn = 1 во внешнем запросе.",
"SQL:19": "Коротко о главном: История заказов не должна «плыть» при смене цен. Это связь «многие ко многим». В практической задаче проверьте: AVG по сумме заказов (через подзапрос или VIEW order_totals); CREATE INDEX по created.",
"HTML и CSS:0": "Коротко о главном: HTML размечает содержимое, оформлением занимается CSS. Цвета, шрифты и расположение задаются стилями.",
"HTML и CSS:1": "Коротко о главном: <head> хранит служебные данные. Он просто переносит строку. Формат: имя=\"значение\". <br> — перенос строки, <h1> — заголовок.",
"HTML и CSS:2": "Коротко о главном: Для переноса используют <br> или новые абзацы. Его читают скринридеры. Решётка ведёт к элементу с таким id.",
"HTML и CSS:3": "Коротко о главном: <ul> — маркированный. Так сохраняется корректная структура. <td> — обычная ячейка. Строки объединяет rowspan.",
"HTML и CSS:4": "Коротко о главном: Без name значение не отправляется. Клик по подписи ставит фокус на поле. Браузер покажет сообщение. action — адрес отправки формы.",
"HTML и CSS:5": "Коротко о главном: На странице он один. Кнопка доступна с клавиатуры из коробки. Скринридер пропустит такую картинку. Семантика помогает всем.",
"HTML и CSS:6": "Коротко о главном: Находится в <head>. Пишут color: teal; Он указывает, к чему применить стили. Тега <css> в HTML нет. Фон — background.",
"HTML и CSS:7": "Коротко о главном: Точка — класс, решётка — id. Классы же можно повторять. Для любой глубины используют пробел. Тег — самый слабый.",
"HTML и CSS:8": "Коротко о главном: Каждая цифра удваивается. Это размер шрифта корневого элемента по умолчанию. vh — процент от высоты окна.",
"HTML и CSS:9": "Коротко о главном: Четыре слоя вокруг содержимого. Размеры считать проще. auto делит свободное место поровну. Порядок: верх, право, низ, лево.",
"HTML и CSS:10": "Коротко о главном: visibility: hidden оставляет место. Для размеров нужен inline-block или block. Если такого нет — относительно окна. floating — не значение.",
"HTML и CSS:11": "Коротко о главном: Дети становятся flex-элементами. align-items работает по поперечной оси. Это сокращение flex-grow: 1. text-align: flex — несуществующее значение.",
"HTML и CSS:12": "Коротко о главном: fr — fraction. Короткая запись одинаковых колонок. Объединяет ячейки сетки. Один ряд проще сделать flex.",
"HTML и CSS:13": "Коротко о главном: Псевдокласс — одно двоеточие. Без него псевдоэлемент не создаётся. Удобно для «зебры». ::before — псевдоэлемент.",
"HTML и CSS:14": "Коротко о главном: У animation есть @keyframes. Оно не вызывает пересчёта раскладки. Анимация повторяется постоянно. Без animation кадры не применяются.",
"HTML и CSS:15": "Коротко о главном: Без него мобильный браузер масштабирует страницу. Так проще и легче по объёму. Значение гибко растёт, но в границах.",
"HTML и CSS:16": "Коротко о главном: Читается через var(--brand). Это глобальная область. Второй аргумент — запасное значение. Переменные делают это просто.",
"HTML и CSS:17": "Коротко о главном: Заголовок у каждой страницы свой. Ускоряет первую загрузку. Поисковики не добавят её в выдачу.",
"HTML и CSS:18": "Коротко о главном: Например, card__title. Задаёт вариант внешнего вида. Например, .card:has(img). Вложенные элементы называют card__icon. Например, 16 / 9.",
"HTML и CSS:19": "Коротко о главном: Без него мобильный браузер уменьшит десктопную версию. Достаточно переопределить значения в :root. Mobile-first с min-width.",
"Bash:0": "Коротко о главном: echo — стандартная команда вывода. Она указывает интерпретатор скрипта. chmod меняет права доступа. show в Bash такой команды нет.",
"Bash:1": "Коротко о главном: pwd — print working directory. Две точки — родительский каталог. Скрытые файлы начинаются с точки; -la даёт подробный список.",
"Bash:2": "Коротко о главном: Флаг -p создаёт промежуточные каталоги. mv old new переименовывает. Флаг -r копирует рекурсивно. Корзины в терминале нет.",
"Bash:3": "Коротко о главном: head показывает начало. Именно поэтому > опасен. Клавиша q закрывает просмотр. По умолчанию tail показывает 10 строк.",
"Bash:4": "Коротко о главном: 7 = rwx, 5 = r-x. Без него будет Permission denied. Применяется ко всем группам. Выполнение не разрешено никому. Доступ только владельцу.",
"Bash:5": "Коротко о главном: Вокруг = пробелов быть не должно. Текст выводится как есть. Двойные скобки — арифметика. Скорость не меняется.",
"Bash:6": "Коротко о главном: Номер 2 — поток ошибок. Так собирают цепочки команд. Иначе одинаковые строки далеко друг от друга сохранятся.",
"Bash:7": "Коротко о главном: Инверсия фильтра. Удобно для поиска по проекту. ^ — начало строки, $ — конец. -type d — для каталогов.",
"Bash:8": "Коротко о главном: Нужны пробелы и оператор -gt. Код 0 — истина. -d проверяет каталог. -gt — для чисел. && и || работают по кодам возврата.",
"Bash:9": "Коротко о главном: Диапазон раскрывается в 1 2 3. Так же, как в других языках. Сохраняет пробелы в строках. В практической задаче проверьте: for по шаблону; wc -l < файл.",
"Bash:10": "Коротко о главном: $0 — имя скрипта, $# — число аргументов. Поэтому его берут в кавычки. Это значение по умолчанию. Успех — всегда 0.",
"Bash:11": "Коротко о главном: Скобки при вызове не пишут. Без local переменная глобальная. Через вывод и подстановку команды. Данные передают через stdout.",
"Bash:12": "Коротко о главном: Как в большинстве языков. Без # вы получите сами элементы. Скобки обязательны. В POSIX sh их нет. Для всех нужно ${arr[@]}.",
"Bash:13": "Коротко о главном: Без g — только первое вхождение в строке. Лучше сделать резервную копию -i.bak. $1 — первое поле. В практической задаче проверьте: awk -F, с NR > 1; sed s/;/,/g.",
"Bash:14": "Коротко о главном: Например, sleep 100 &. -9 не даёт процессу шанса корректно завершиться. $! — PID последнего фонового процесса.",
"Bash:15": "Коротко о главном: c — create, z — gzip, f — file. t — list. Можно и curl URL > file. ping проверяет доступность. Скрипт выполнится без проверки.",
"Bash:16": "Коротко о главном: Минута 0, час 3, остальное — любое. Нужны абсолютные пути. Шаг 15. PATH в cron отличается от терминального. Удаляет все задания.",
"Bash:17": "Коротко о главном: Прерывание на первой ошибке. Защищает от опечаток в именах. Подходит для удаления временных файлов.",
"Bash:18": "Коротко о главном: Значение попадает в OPTARG. Чтобы $1 был первым позиционным аргументом. OPTIND — номер следующего аргумента.",
"Bash:19": "Коротко о главном: Готовый файл появляется атомарно через mv. Если архив повреждён, команда вернёт ошибку. Список сортируется по времени (ls -t)."

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const KW=/^(def|if|else|elif|for|while|in|return|import|from|class|True|False|None|and|or|not|int|float|double|char|void|bool|string|let|const|var|val|fun|func|fn|function|struct|enum|public|private|static|new|null|true|false|do|switch|case|break|continue|try|catch|except|finally|throw|using|namespace|package|use|mod|impl|trait|type|interface|extends|implements|match|where|select|from|insert|update|delete|create|table|mov|add|sub|jmp|call|ret|push|pop|section|global|let|then|end|local|begin|var|unit|procedure|program)$/i;
function hl(code){ // минимальная подсветка
 return esc(code).replace(/(#.*$|\/\/.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(\d+\.?\d*)\b|\b([A-Za-z_]\w*)(?=\()|\b([A-Za-z_]\w*)\b/gm,
 (m,c,s,n,f,w)=>c?`<span class="cmt">${c}</span>`:s?`<span class="str">${s}</span>`:n?`<span class="num">${n}</span>`:f?`<span class="fn">${f}</span>`:(w&&KW.test(w))?`<span class="kw">${w}</span>`:m);
}
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let done=new Set(store.get('done',[]));
const total=LANGS.length*20;

/* ===== ТЕМА ===== */
document.documentElement.dataset.theme=store.get('theme','dark');
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;store.set('theme',t)};

/* ===== САЙДБАР ===== */
function buildNav(){
 $('#nav').innerHTML=LANGS.map((l,li)=>`<details data-li="${li}" style="--c:${l.c}"><summary>${l.n}<small></small></summary>${l.t.map((t,ti)=>`<button class="sec" data-go="${li}-${ti}" data-li="${li}" data-ti="${ti}" style="--c:${l.c}">${ti+1}. ${t}${DB[l.n+':'+ti]?' ●':''}</button>`).join('')}</details>`).join('');
 updProg();
}
function updProg(){
 const p=Math.round(done.size/total*100);
 $('#bar').style.width=p+'%';$('#prog').setAttribute('aria-valuenow',p);
 $('#ptxt').textContent=`Пройдено: ${done.size} из ${total} (${p}%)`;
 document.querySelectorAll('.sec').forEach(b=>b.classList.toggle('done',done.has(b.dataset.li+':'+b.dataset.ti)));
 document.querySelectorAll('#nav details').forEach(d=>d.querySelector('small').textContent=[...Array(20).keys()].filter(i=>done.has(d.dataset.li+':'+i)).length+'/20');
}
let tm;$('#q').addEventListener('input',e=>{clearTimeout(tm);tm=setTimeout(()=>{ // debounce
 const v=e.target.value.trim().toLowerCase();
 document.querySelectorAll('#nav details').forEach(d=>{
  const li=+d.dataset.li,ln=LANGS[li].n.toLowerCase().includes(v);let any=ln;
  d.querySelectorAll('.sec').forEach(b=>{const m=!v||ln||b.textContent.toLowerCase().includes(v);b.hidden=!m;any=any||m});
  d.hidden=!any;if(v&&any)d.open=true});
},200)});
$('#menu').onclick=()=>{const o=$('#side').classList.toggle('open');$('#menu').setAttribute('aria-expanded',o)};

/* ===== РЕНДЕР РАЗДЕЛА ===== */
function theoryHTML(bl){return bl.map(([t,x])=>t==='h'?`<h3>${esc(x)}</h3>`:t==='p'?`<p>${esc(x)}</p>`:`<pre><code>${hl(x)}</code></pre>`).join('')}
function quizHTML(qs){return qs.map((q,i)=>`<div class="qz" data-i="${i}"><b>${i+1}. ${esc(q.q)}</b> <small>(${q.k==='m'?'несколько ответов':q.k==='t'?'верно/неверно':'один ответ'})</small>
 ${q.o.map((o,j)=>`<label><input type="${q.k==='m'?'checkbox':'radio'}" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('')}
 <button class="btn chk">Проверить</button><div class="fb" aria-live="polite"></div></div>`).join('')}
function taskHTML(t){return `<p>${esc(t.d)}</p><b>Требования:</b><ul>${t.req.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><b>Пример:</b><pre><code>${esc(t.io)}</code></pre>
 <details><summary style="border:0">💡 Эталонное решение</summary><pre><code>${hl(t.sol)}</code></pre></details>`}
function render(li,ti){
 const l=LANGS[li],c=DB[l.n+':'+ti],key=li+':'+ti;
 const m=$('#main');m.style.setProperty('--c',l.c);
 document.querySelectorAll('.sec.on').forEach(b=>b.classList.remove('on'));
 const btn=document.querySelector(`.sec[data-li="${li}"][data-ti="${ti}"]`);
 if(btn){btn.classList.add('on');btn.closest('details').open=true}
 let h=`<a class="btn" href="#" data-go="">🏠 На главную</a><div class="card"><small>${l.n} · раздел ${ti+1} из 20</small><h2>${l.t[ti]}</h2></div>`;
 if(!c){h+=`<p class="empty">Для раздела «${l.n}: ${l.t[ti]}» материал пока не написан. Материал добавляется по мере готовности; разделы с материалом отмечены в меню значком ●.</p>`}
 else h+=`<div class="tabs" role="tablist">${['📖 Теория','✅ Тест','💻 Задача'].map((t,i)=>`<button class="btn" role="tab" aria-selected="${i==0}" data-tab="${i}">${t}</button>`).join('')}</div>
 <section class="panel" data-p="0">${theoryHTML(c.theory)}</section>
 <section class="panel" data-p="1" hidden>${quizHTML(c.quiz)}</section>
 <section class="panel" data-p="2" hidden>${taskHTML(c.task)}</section>
 <p><button class="btn" id="mark">${done.has(key)?'↩ Снять отметку':'✔ Отметить как пройденный'}</button></p>`;
 m.innerHTML=h;m.dataset.key=key;store.set('last',li+'-'+ti);scrollTo({top:0});
}
$('#main').addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');
 if(t){const m=$('#main');m.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===t));m.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!==t.dataset.tab)}
 if(e.target.classList.contains('chk')){
  const box=e.target.closest('.qz'),[li,ti]=$('#main').dataset.key.split(':'),q=DB[LANGS[li].n+':'+ti].quiz[box.dataset.i];
  const sel=[...box.querySelectorAll('input:checked')].map(i=>+i.value).sort(),ok=JSON.stringify(sel)===JSON.stringify(q.a);
  box.querySelector('.fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'✔ Верно!':'✘ Неверно.'} ${esc(q.e)}</p>`}
 if(e.target.id==='mark'){const k=$('#main').dataset.key;done.has(k)?done.delete(k):done.add(k);store.set('done',[...done]);updProg();e.target.textContent=done.has(k)?'↩ Снять отметку':'✔ Отметить как пройденный'}
});

/* ===== ГЛАВНАЯ ===== */
function home(){
 document.querySelectorAll('.sec.on').forEach(b=>b.classList.remove('on'));
 const m=$('#main');m.style.setProperty('--c','var(--ac)');m.dataset.key='';
 const last=store.get('last',null),ready=Object.keys(DB).length;
 const cnt=li=>[...Array(20).keys()].filter(i=>done.has(li+':'+i)).length;
 m.innerHTML=`<section class="hero"><h2>Путь программиста: от нуля до Junior</h2>
 <p class="lead">Справочник по 15 языкам программирования. В каждом языке 20 разделов с прогрессией от установки до итогового проекта: теория, тест из 5 вопросов и практическая задача.</p>
 <div class="stats"><div><b>${LANGS.length}</b>языков</div><div><b>${LANGS.length*20}</b>разделов в программе</div><div><b>${ready}</b>разделов с материалом</div><div><b>${done.size}</b>пройдено вами</div></div>
 <a class="btn" href="#${last||'0-0'}" data-go="${last||'0-0'}">${last?'▶ Продолжить обучение':'▶ Начать с Python'}</a></section>
 <div class="grid">${LANGS.map((l,li)=>`<a class="lc" href="#${li}-0" data-go="${li}-0" style="--c:${l.c}"><b>${l.n}</b><small>${cnt(li)}/20</small><i style="width:${cnt(li)*5}%"></i></a>`).join('')}</div>`;
 scrollTo({top:0});
}
/* ===== РОУТИНГ ===== */
function show(g){const m=/^(\d+)-(\d+)$/.exec(g||'');
 if(m&&LANGS[+m[1]]&&LANGS[+m[1]].t[+m[2]])render(+m[1],+m[2]);else home()}
function navigate(g){   // переход напрямую, без зависимости от адресной строки: работает и во встроенных окнах
 try{history.replaceState(null,'',g?'#'+g:location.pathname+location.search)}catch(e){}
 $('#side').classList.remove('open');show(g)}
function route(){show(location.hash.slice(1))}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go]');if(t){e.preventDefault();navigate(t.dataset.go)}});
addEventListener('hashchange',route);
const topBtn=$('#top');addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>400),{passive:true});
topBtn.onclick=()=>scrollTo({top:0});
$('#home').addEventListener('click',()=>$('#side').classList.remove('open'));
buildNav();route();
</script>
</body>
</html>
