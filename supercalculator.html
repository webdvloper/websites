<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SuperCalc 10 — суперкалькулятор с 10 режимами</title>
<meta name="description" content="SuperCalc 10 — суперкалькулятор в одном файле: простой, инженерный, бухгалтерский, финансовый, программируемый, графический, математический, географический, физический и информатический режимы.">
<meta name="theme-color" content="#07081a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0b1a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='url(%23g)'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('sc10_theme'));if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --bg:#f2f4fc;--bg2:#e7eaf8;--surface:rgba(255,255,255,.80);--surface2:#ffffff;--field:rgba(30,40,110,.045);
  --text:#151934;--muted:#5a6288;--border:rgba(40,50,130,.16);--grid:rgba(40,50,130,.12);--plotbg:#ffffff;
  --shadow:0 10px 30px rgba(40,50,130,.12);
  --neon1:#06b6d4;--neon2:#7c3aed;--neon3:#e11d8f;--ok:#059669;--bad:#dc2626;
  --accent:#06b6d4;--accent-ink:color-mix(in srgb,var(--accent) 55%,#10143a);
  --radius:16px;color-scheme:light;
}
[data-theme=dark]{
  --bg:#07081a;--bg2:#0d0f26;--surface:rgba(17,19,46,.74);--surface2:#141735;--field:rgba(150,160,255,.07);
  --text:#e9ecff;--muted:#9aa3d6;--border:rgba(130,140,255,.24);--grid:rgba(150,160,255,.14);--plotbg:#0b0d24;
  --shadow:0 12px 40px rgba(0,0,0,.55);
  --neon1:#22e4ff;--neon2:#a66bff;--neon3:#ff4fae;--ok:#34d399;--bad:#fb7185;
  --accent-ink:color-mix(in srgb,var(--accent) 88%,#fff);color-scheme:dark;
}
body[data-mode=simple]{--accent:#22d3ee}
body[data-mode=engineering]{--accent:#fbbf24}
body[data-mode=accounting]{--accent:#34d399}
body[data-mode=finance]{--accent:#60a5fa}
body[data-mode=programmable]{--accent:#a78bfa}
body[data-mode=graphic]{--accent:#f472b6}
body[data-mode=math]{--accent:#e879f9}
body[data-mode=geo]{--accent:#2dd4bf}
body[data-mode=physics]{--accent:#fb7185}
body[data-mode=informatics]{--accent:#a3e635}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.5 var(--font);color:var(--text);background:var(--bg);overflow-x:hidden;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 560px at 8% -8%,color-mix(in srgb,var(--neon2) 18%,transparent),transparent 60%),radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--neon1) 16%,transparent),transparent 60%),var(--bg)}
.bg i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:float 24s ease-in-out infinite alternate}
[data-theme=light] .bg i{opacity:.13}
.bg i:nth-child(1){background:var(--neon1);left:-12vmax;top:22vh}
.bg i:nth-child(2){background:var(--neon3);right:-14vmax;top:-8vh;animation-delay:-8s}
.bg i:nth-child(3){background:var(--neon2);left:32vw;bottom:-24vmax;animation-delay:-14s}
@keyframes float{to{transform:translate3d(6vw,-5vh,0) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hue{to{background-position:200% 0}}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
/* ---- Полосы прокрутки в стиле сайта ---- */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:color-mix(in srgb,var(--bg2) 70%,transparent);border-radius:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon1),var(--neon2),var(--neon3));border-radius:10px;border:3px solid transparent;background-clip:padding-box;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
::-webkit-scrollbar-thumb:hover{border-width:2px}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--neon2) transparent}}
/* ---- Шапка и навигация ---- */
.sticky{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 28px/1 var(--font);color:#06101c;background:linear-gradient(135deg,var(--neon1),var(--neon2),var(--neon3));box-shadow:0 0 22px color-mix(in srgb,var(--neon2) 55%,transparent)}
.brand h1{margin:0;font-size:1.3rem;line-height:1.1;letter-spacing:.2px}
.brand h1 b{background:linear-gradient(90deg,var(--neon1),var(--neon3),var(--neon2),var(--neon1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.mini select{width:auto;padding:6px 8px;border-radius:10px;font-size:.85rem}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1.2rem;cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{box-shadow:0 0 16px color-mix(in srgb,var(--neon1) 60%,transparent);border-color:var(--neon1)}
[data-theme=dark] .sun,[data-theme=light] .moon{display:none}
.modes{display:flex;gap:8px;padding:4px 18px 12px;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-gutter:stable}
.mode{--c:#22d3ee;flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--border));background:color-mix(in srgb,var(--c) 8%,var(--surface2));color:var(--text);font:600 .86rem var(--font);cursor:pointer;transition:.18s;white-space:nowrap}
.mode:hover{transform:translateY(-1px);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.mode .ic{font-size:1.1rem}
.mode kbd{font:600 .66rem var(--mono);opacity:.55;border:1px solid currentColor;border-radius:5px;padding:0 4px}
.mode.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--neon2)));color:#05101c;border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--c) 65%,transparent)}
@media(min-width:1000px){.modes{flex-wrap:wrap;justify-content:center;overflow:visible}}
/* ---- Основа ---- */
main{max-width:1280px;margin:0 auto;padding:18px 18px 40px}
.panel{display:none}
.panel.on{display:block;animation:rise .35s ease}
.phead{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.pic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--accent) 18%,var(--surface2));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.phead h2{margin:0;font-size:1.5rem;line-height:1.15}
.phead p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.card h3{margin:0 0 10px;font-size:1.02rem}
.card h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tool{transition:box-shadow .25s,border-color .25s}
.tool:hover,.tool:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:var(--shadow),0 0 26px color-mix(in srgb,var(--accent) 22%,transparent)}
.note{margin:-4px 0 10px;color:var(--muted);font-size:.84rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.grid2>.wide,.wide.card{grid-column:1/-1}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:600 .86rem var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.on{color:#05101c;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));border-color:transparent;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.pane[hidden]{display:none!important}
/* ---- Элементы форм ---- */
input,select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{resize:vertical;font-family:var(--mono);font-size:.9rem;line-height:1.45}
option{background:var(--surface2);color:var(--text)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);height:28px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.field.wide{grid-column:1/-1}
.field.check{flex-direction:row;align-items:center;gap:8px;font-size:.88rem;color:var(--text)}
.hint{color:var(--muted);font-size:.72rem}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 14px;font:600 .88rem var(--font);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.78rem;border-radius:9px}
.out{margin-top:12px}
.out:empty{display:none}
.err{color:var(--bad);font-weight:600;padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0}
.kv>div{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--field);min-width:0}
.kv dt{font-size:.74rem;color:var(--muted);margin:0}
.kv dd{margin:2px 0 0;font:600 1.02rem var(--mono);color:var(--accent-ink);word-break:break-word;cursor:copy}
.kv dd small{color:var(--muted);font-weight:400}
.kv .big{grid-column:1/-1}.kv .big dd{font-size:1.5rem}
.scroll{overflow:auto;max-height:380px;border:1px solid var(--border);border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:600;font-size:.76rem;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--field)}
.mx td{text-align:center;font-family:var(--mono)}
canvas{display:block;width:100%;height:320px;border-radius:12px;background:var(--plotbg);border:1px solid var(--border)}
canvas.map{height:auto;aspect-ratio:2/1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:var(--field);color:var(--text);font:500 .78rem var(--mono);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
/* ---- Калькулятор ---- */
.display{padding:6px 4px 2px}
.badges{display:flex;gap:6px;min-height:22px;align-items:center}
.badge{font:700 .68rem var(--mono);padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.badge.off{display:none}
button.badge{cursor:pointer}
.expr{background:transparent!important;border:0!important;box-shadow:none!important;text-align:right;font:500 1.3rem var(--mono);padding:8px 4px;color:var(--text)}
.result{display:block;width:100%;appearance:none;background:none;border:0;color:var(--accent-ink);text-align:right;font:700 2.5rem/1.15 var(--mono);padding:2px 4px;overflow-x:auto;white-space:nowrap;cursor:copy;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.result.stale{opacity:.55}
.sub{min-height:1.4em;text-align:right;color:var(--muted);font:.78rem var(--mono);padding:0 4px;display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.sub.err{color:var(--bad)}
.keys{display:grid;gap:8px;margin-top:12px}
.k4{grid-template-columns:repeat(4,1fr)}.k6{grid-template-columns:repeat(6,1fr)}
.key{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;height:54px;font:600 1.08rem var(--font);cursor:pointer;transition:transform .08s,box-shadow .15s,border-color .15s;padding:0;-webkit-tap-highlight-color:transparent}
.key:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.key:active{transform:scale(.94)}
.key.fn{font-size:.9rem;color:var(--muted)}
.key.op{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.key.danger{color:var(--bad)}
.key.on{background:color-mix(in srgb,var(--accent) 30%,var(--surface2));color:var(--text);border-color:var(--accent)}
.key.eq{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent;font-size:1.3rem}
.span4{grid-column:1/-1}
.sci .key{height:48px;font-size:.95rem}
.hist .hlist{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.hitem{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:0;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--text);font-family:var(--mono)}
.hitem:hover{border-color:var(--accent)}
.hitem small{color:var(--muted);font-size:.78rem;word-break:break-all}
.hitem b{color:var(--accent-ink);font-size:1.05rem}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 0}
/* ---- Лента ---- */
.paper{background:var(--field);border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--border));border-radius:12px;padding:10px 12px;font:.95rem var(--mono);max-height:420px;overflow:auto;min-height:160px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.ln.total{border-top:1px solid var(--text);margin-top:4px;padding-top:6px;font-weight:700;color:var(--accent-ink)}
.ln.info{color:var(--muted);font-size:.85rem}
.ln span:last-child{color:var(--muted)}
.ln.total span:last-child{color:inherit}
.acc{font:700 1.9rem var(--mono);text-align:right;color:var(--accent-ink);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent);padding:2px 4px}
/* ---- Редактор ---- */
.code{font-family:var(--mono);min-height:300px;tab-size:2;white-space:pre}
.console .ln{justify-content:flex-start;gap:12px}
.console .n{color:var(--muted);min-width:2ch;text-align:right}
.console .e{color:var(--bad)}.console .a{color:var(--accent-ink)}.console .d{color:var(--muted)}
/* ---- График ---- */
.gl{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.gl{grid-template-columns:1fr}}
.grow{display:grid;grid-template-columns:auto auto 74px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.grow select{padding:6px 4px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.gcv{height:min(66vh,560px);min-height:320px;cursor:crosshair;touch-action:none}
.sl{display:grid;grid-template-columns:22px 1fr 44px;gap:8px;align-items:center;font:.82rem var(--mono)}
/* ---- Биты ---- */
.bits{display:grid;gap:6px;margin:10px 0}
.byte{display:flex;gap:4px;align-items:center}
.byte i{font:normal .66rem var(--mono);color:var(--muted);width:3ch;text-align:right;margin-right:4px}
.bit{flex:1;max-width:46px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--field);color:var(--muted);font:700 .95rem var(--mono);cursor:pointer;padding:0;transition:.12s}
.bit.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.s1{color:var(--bad)}.s2{color:var(--ok)}.s3{color:var(--neon1)}
.mono{font-family:var(--mono);word-break:break-all}
.big-eq{font:700 1.35rem var(--mono);text-align:center;padding:10px;border-radius:12px;background:var(--field);border:1px solid var(--border);margin:6px 0 12px;color:var(--accent-ink)}
.res-big{font:700 1.7rem var(--mono);color:var(--accent-ink);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent);word-break:break-all}
/* ---- Подвал, подсказки ---- */
details.learn{margin-top:18px;padding:0}
details.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none}
details.learn summary::-webkit-details-marker{display:none}
details.learn summary::before{content:"📚 "}
details.learn[open] summary{border-bottom:1px solid var(--border)}
details.learn>ul,details.learn .short{margin:0;padding:12px 18px 8px 36px;display:grid;gap:7px;color:var(--muted)}
details.learn .lb{padding:0 14px 16px}
.lbar{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap;align-items:center}
.lbar span{color:var(--muted);font-size:.8rem;margin-right:auto}
details.sec{border:1px solid var(--border);border-radius:12px;margin-top:8px;background:var(--field);transition:border-color .2s}
details.sec[open]{border-color:color-mix(in srgb,var(--accent) 50%,var(--border))}
details.sec>summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--accent);transition:transform .2s;flex:none}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary i{font:normal 700 .72rem var(--mono);color:#05101c;background:var(--accent);border-radius:8px;padding:1px 7px;flex:none}
.sb{padding:0 16px 14px;line-height:1.6}
.sb p,.sb li,.sb .tip{overflow-wrap:anywhere}
.sb p{margin:.6em 0}
.sb ul,.sb ol{margin:.6em 0;padding-left:22px;display:block;color:var(--text)}
.sb li{margin:.3em 0}

    if(ln==='if'&&args.length===3)return N(e=>args[0].f(e)?args[1].f(e):args[2].f(e));
    if((ln==='integral'||ln==='int')&&args.length===4&&named){
      const [ex,iv,a,b]=args,nm=iv.name;
      return N(e=>{const lo=a.f(e),hi=b.f(e),n=2000,hh=(hi-lo)/n,ev=sub(e,nm,0);let s=0;for(let k=0;k<=n;k++){ev.v[nm]=lo+k*hh;const y=ex.f(ev);s+=(k===0||k===n?1:k%2?4:2)*y}return s*hh/3});
    }
    if((ln==='deriv'||ln==='diff'||ln==='d')&&args.length===3&&named){
      const [ex,iv,x0]=args,nm=iv.name;
      return N(e=>{const x=x0.f(e),st=1e-3*Math.max(1,Math.abs(x)),ev=sub(e,nm,0),f=z=>{ev.v[nm]=z;return ex.f(ev)};return(-f(x+2*st)+8*f(x+st)-8*f(x-st)+f(x-2*st))/(12*st)});
    }
    if(ln==='root'&&args.length===4&&named){
      const [ex,iv,a,b]=args,nm=iv.name;
      return N(e=>{let lo=a.f(e),hi=b.f(e);const ev=sub(e,nm,0),f=z=>{ev.v[nm]=z;return ex.f(ev)};let fl=f(lo),fh=f(hi);if(fl*fh>0)throw new Error('На отрезке нет смены знака');for(let i=0;i<200;i++){const m=(lo+hi)/2,fm=f(m);if(fl*fm<=0){hi=m;fh=fm}else{lo=m;fl=fm}}return(lo+hi)/2});
    }
    return N(e=>{
      const vals=args.map(a=>a.f(e)),uf=e.fn&&e.fn[name];
      if(uf)return uf(...vals);
      const f=FUNCS[ln];if(f)return f(...vals);
      if(vals.length===1){let c;try{c=lookup(e,name)}catch(x){c=undefined}if(c!==undefined)return c*vals[0]}
      throw new Error('Неизвестная функция «'+name+'»');
    });
  }
  const root=parseOr();
  if(p<T.length)fail('Неожиданный символ «'+T[p].v+'»');
  const fn=env=>root.f(env||ENV);
  if(CC.size>400)CC.clear();
  CC.set(s,fn);return fn;
}

const CANV=new Set();
const RO=new ResizeObserver(es=>es.forEach(e=>e.target._draw&&e.target._draw()));
function fit(c){
  const d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,H=c.clientHeight;
  if(c.width!==Math.round(w*d))c.width=Math.round(w*d);
  if(c.height!==Math.round(H*d))c.height=Math.round(H*d);
  const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,H);g.shadowBlur=0;g.globalAlpha=1;g.setLineDash([]);

}
function reg(c,fn){c._draw=()=>{if(!c.clientWidth||!c.clientHeight)return;fn(fit(c))};CANV.add(c);RO.observe(c);c._draw()}
function ticks(a,b,n=5){const r=(b-a)||1,raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<1.5?1:m<3?2:m<7?5:10)*p,out=[];for(let v=Math.ceil(a/st)*st;v<=b+st*1e-9;v+=st)out.push(+v.toFixed(12));return out}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return(m<=1?1:m<=2?2:m<=5?5:10)*p}
function chartLine(c,series,o={}){
  reg(c,({g,w,h:H})=>{
    const P={l:62,r:16,t:28,b:30},all=series.flatMap(s=>s.pts);
    if(!all.length)return;
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    for(const p of all){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
    if(o.y0!==undefined)y0=o.y0;
    if(x0===x1)x1=x0+1;if(y0===y1)y1=y0+1;
    const pd=(y1-y0)*.05;y1+=pd;if(o.y0===undefined)y0-=pd;
    const X=x=>P.l+(x-x0)/(x1-x0)*(w-P.l-P.r),Y=y=>H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);
    const grid=cvar('--grid'),txt=cvar('--muted');
    g.font='11px system-ui,sans-serif';g.fillStyle=txt;g.strokeStyle=grid;g.lineWidth=1;g.textAlign='right';g.textBaseline='middle';
    for(const t of ticks(y0,y1,5)){const y=Y(t);g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillText(CF.format(t),P.l-6,y)}
    g.textAlign='center';g.textBaseline='top';
    for(const t of ticks(x0,x1,6)){const x=X(t);g.beginPath();g.moveTo(x,P.t);g.lineTo(x,H-P.b);g.stroke();g.fillText(o.xfmt?o.xfmt(t):CF.format(t),x,H-P.b+6)}
    series.forEach((s,i)=>{
      const col=s.color||PAL[i%PAL.length];
      g.beginPath();if(!s.noline)s.pts.forEach((p,k)=>k?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));
      g.shadowColor=col;g.shadowBlur=8;g.strokeStyle=col;g.lineWidth=2.2;g.stroke();g.shadowBlur=0;
      if(i===0&&o.fill!==false&&!s.noline&&s.pts.length>1){
        g.lineTo(X(s.pts[s.pts.length-1][0]),Y(Math.max(y0,Math.min(0,y1))));g.lineTo(X(s.pts[0][0]),Y(Math.max(y0,Math.min(0,y1))));g.closePath();
        const gr=g.createLinearGradient(0,P.t,0,H-P.b);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fill();
      }
      if(o.dots||s.dots){g.fillStyle=col;s.pts.forEach(p=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),3.5,0,7);g.fill()})}
    });
    g.textAlign='left';g.textBaseline='middle';let lx=P.l;
    series.forEach((s,i)=>{if(!s.name)return;const col=s.color||PAL[i%PAL.length];g.fillStyle=col;g.fillRect(lx,8,10,10);g.fillStyle=txt;g.fillText(s.name,lx+14,13);lx+=g.measureText(s.name).width+34});
  });
}
function chartBars(c,items,o={}){
  reg(c,({g,w,h:H})=>{
    if(!items.length)return;
    const P={l:56,r:12,t:20,b:o.rot?60:34},vals=items.map(i=>i.value);
    let y1=Math.max(...vals,0),y0=Math.min(...vals,0);if(y1===y0)y1=y0+1;
    const X0=P.l,W=w-P.l-P.r,bw=W/items.length,Y=y=>H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);
    g.font='11px system-ui,sans-serif';g.strokeStyle=cvar('--grid');g.fillStyle=cvar('--muted');g.textAlign='right';g.textBaseline='middle';
    for(const t of ticks(y0,y1,5)){const y=Y(t);g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillText(CF.format(t),P.l-6,y)}
    items.forEach((it,i)=>{
      const col=PAL[i%PAL.length],x=X0+i*bw+bw*.14,ww=bw*.72,yt=Y(Math.max(it.value,0)),yb=Y(Math.min(it.value,0));
      const gr=g.createLinearGradient(0,yt,0,yb);gr.addColorStop(0,col);gr.addColorStop(1,col+'55');
      g.shadowColor=col;g.shadowBlur=10;g.fillStyle=gr;
      g.beginPath();if(g.roundRect)g.roundRect(x,yt,ww,Math.max(1,yb-yt),5);else g.rect(x,yt,ww,Math.max(1,yb-yt));g.fill();g.shadowBlur=0;
      g.fillStyle=cvar('--muted');g.textAlign='center';g.textBaseline='top';
      if(o.rot){g.save();g.translate(x+ww/2,H-P.b+6);g.rotate(Math.PI/5);g.textAlign='left';g.fillText(String(it.label).slice(0,14),0,0);g.restore()}
      else if(items.length<=24)g.fillText(String(it.label).slice(0,10),x+ww/2,H-P.b+8);
      if(items.length<=16){g.textBaseline='bottom';g.fillStyle=cvar('--text');g.fillText(CF.format(it.value),x+ww/2,yt-3)}
    });
  });
}
function chartPie(c,items){
  reg(c,({g,w,h:H})=>{
    const tot=items.reduce((s,i)=>s+Math.max(0,i.value),0);if(!tot)return;
    const R=Math.min(H/2-16,w/3),cx=Math.min(w/2,R+24+ (w>600?w*.12:0)),cy=H/2;let a=-Math.PI/2;
    items.forEach((it,i)=>{
      const v=Math.max(0,it.value),da=v/tot*Math.PI*2,col=PAL[i%PAL.length];
      g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a,a+da);g.closePath();g.shadowColor=col;g.shadowBlur=12;g.fillStyle=col;g.fill();g.shadowBlur=0;
      g.strokeStyle=cvar('--plotbg');g.lineWidth=2;g.stroke();a+=da;
    });
    g.fillStyle=cvar('--plotbg');g.beginPath();g.arc(cx,cy,R*.52,0,7);g.fill();
    g.font='12px system-ui,sans-serif';g.textBaseline='middle';g.textAlign='left';
    const lx=cx+R+30,ly=Math.max(14,cy-items.length*11);
    items.slice(0,16).forEach((it,i)=>{g.fillStyle=PAL[i%PAL.length];g.fillRect(lx,ly+i*22-6,12,12);g.fillStyle=cvar('--text');g.fillText(String(it.label).slice(0,18)+' — '+(Math.max(0,it.value)/tot*100).toFixed(1)+'%',lx+18,ly+i*22)});
  });
}

function Tool(parent,cfg){
  const card=h('section','card tool'+(cfg.wide?' wide':''));
  if(cfg.title)card.append(h('h3','',cfg.title));
  if(cfg.note)card.append(h('p','note',cfg.note));
  const form=h('div','form'),ctl={},L={};
  for(const f of cfg.fields){
    const lab=h('label','field'+(f.wide?' wide':''));
    let c;
    if(f.type==='check'){lab.classList.add('check');c=h('input');c.type='checkbox';lab.append(c,h('span','',esc(f.label)))}
    else{
      lab.append(h('span','',esc(f.label)));
      if(f.type==='select'){c=h('select');for(const o of f.options){const [v,t]=Array.isArray(o)?o:[o,o];c.append(new Option(t,v))}}
      else if(f.type==='textarea'){c=h('textarea');c.rows=f.rows||4;c.spellcheck=false}
      else{c=h('input');c.type=f.type==='date'?'date':'text';c.autocomplete='off';c.spellcheck=false}
      lab.append(c);
    }
    if(f.ph)c.placeholder=f.ph;
    if(f.hint)lab.append(h('small','hint',esc(f.hint)));
    ctl[f.id]=c;L[f.id]=f.label;form.append(lab);
  }
  const setDefaults=()=>{for(const f of cfg.fields){const c=ctl[f.id];if(f.type==='check')c.checked=!!f.value;else if(f.value!=null)c.value=f.value;else c.value=''}};
  setDefaults();
  const bar=h('div','row');bar.style.marginTop='10px';
  const out=h('div','out');
  const get=()=>{const v={};for(const f of cfg.fields){const c=ctl[f.id];v[f.id]=f.type==='check'?c.checked:(f.type==='select'||f.type==='text'||f.type==='textarea'||f.type==='date')?c.value:parseNum(c.value)}Object.defineProperty(v,'L',{value:L});return v};
  const showErr=e=>{out.innerHTML=`<div class="err">⚠ ${esc(e&&e.message?e.message:e)}</div>`};
  const go=()=>{
    try{
      const r=cfg.run(get(),out,card);
      if(r&&typeof r.then==='function')r.then(x=>{if(typeof x==='string')out.innerHTML=x}).catch(showErr);
      else if(typeof r==='string')out.innerHTML=r;
    }catch(e){showErr(e)}
  };
  let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(go,70)};
  form.addEventListener('input',later);form.addEventListener('change',later);
  const rb=h('button','btn sm','Сбросить');rb.type='button';rb.onclick=()=>{setDefaults();go()};
  bar.append(rb);
  (cfg.btns||[]).forEach(b=>{const x=h('button','btn sm',b.t);x.type='button';x.onclick=()=>{try{b.fn(get(),out,card)}catch(e){showErr(e)}};bar.append(x)});
  card.append(form,bar,out);
  if(cfg.visual){const vs=Array.isArray(cfg.visual)?cfg.visual:[cfg.visual];vs.forEach(v=>{v.style.marginTop='12px';card.append(v)})}
  parent.append(card);
  go();
  return{card,ctl,out,go,set:(id,val)=>{ctl[id].value=val}};
}
function Tabs(root,items,key){
  const bar=h('div','tabs');bar.setAttribute('role','tablist');

  items.forEach((it,i)=>{
    const b=h('button','tab',it.t);b.type='button';b.setAttribute('role','tab');b.onclick=()=>show(i);

      if(on&&!built[j]){built[j]=1;try{it.b(panes[j])}catch(e){panes[j].innerHTML='<div class="err">Ошибка построения вкладки: '+esc(e.message)+'</div>';console.error(e)}}});

}
function learn(root,items,secs){

/* =====================================================================
   РЕЖИМЫ 1–2: КАЛЬКУЛЯТОР (простой и инженерный)

function Calc(root,cfg){
  const wrap=h('div','split'),box=h('div','card calc'+(cfg.sci?' sci':'')),disp=h('div','display'),bar=h('div','badges');
  const inp=h('input','expr');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='Введите выражение';inp.setAttribute('aria-label','Выражение');inp.enterKeyHint='go';
  if(matchMedia('(pointer:coarse)').matches)inp.inputMode='none';
  const res=h('button','result','0');res.type='button';res.title='Копировать результат';
  const sub=h('div','sub','&nbsp;');
  const bM=h('span','badge off','M'),bA=h('button','badge','');bA.type='button';bA.title='Сменить единицы углов';
  bar.append(bM);if(cfg.sci)bar.append(bA);
  disp.append(bar,inp,res,sub);
  const pad=h('div','keys k'+cfg.cols);box.append(disp,pad);
  const side=h('div','card hist');
  side.innerHTML='<div class="row between"><h3>История</h3><button type="button" class="btn sm">Очистить</button></div><div class="hlist"></div>';
  wrap.append(box,side);root.append(wrap);
  const hl=$('.hlist',side);
  let fmode='auto',shift=false,mem=0,done=false;
  const hist=store.get('hist_'+cfg.id,[]);
  const view=n=>{
    if(typeof n!=='number'||Number.isNaN(n))return 'Ошибка';
    if(!isFinite(n))return n>0?'∞':'-∞';
    if(fmode==='sci'&&n!==0)return n.toExponential(Math.min(Math.max(S.digits-1,0),14)).replace(/\.?0+e/,'e').replace('e+','e');
    if(fmode==='eng')return engFmt(n);
    return fmt(n);
  };
  const compute=()=>{const r=compile(inp.value,{dec:cfg.dec})(ENV);return isFinite(r)?+r.toPrecision(14):r};
  const extra=r=>{
    if(!isFinite(r)||r===0)return '&nbsp;';
    const e=Math.floor(Math.log10(Math.abs(r))/3)*3,m=r/Math.pow(10,e),p=SI[e];
    return `<span>${esc(r.toExponential(4))}</span><span>${esc(engFmt(r))}</span>${e!==0&&p!==undefined?`<span>${+m.toPrecision(6)} ${p}</span>`:''}`;
  };
  function preview(){
    sub.classList.remove('err');
    const s=inp.value.trim();
    if(!s){res.textContent='0';res.classList.remove('stale');sub.innerHTML='&nbsp;';return}
    try{const r=compute();res.textContent=view(r);res.classList.remove('stale');sub.innerHTML=cfg.sci?extra(r):'&nbsp;'}
    catch(e){res.classList.add('stale');sub.innerHTML='&nbsp;'}
  }
  function renderHist(){
    hl.innerHTML='';
    if(!hist.length){hl.append(h('div','empty','Здесь появятся ваши вычисления'));return}
    hist.slice().reverse().forEach(it=>{
      const b=h('button','hitem');b.type='button';b.innerHTML=`<small>${esc(it.e)}</small><b>= ${esc(it.r)}</b>`;
      b.onclick=()=>{inp.value=it.e;done=false;preview();inp.focus()};hl.append(b);
    });
  }
  function eq(){
    const s=inp.value.trim();if(!s)return;
    try{
      const r=compute();
      if(Number.isNaN(r))throw new Error('Результат не определён');
      ENV.v.ans=r;res.textContent=view(r);res.classList.remove('stale');sub.innerHTML=cfg.sci?extra(r):'&nbsp;';
      const last=hist[hist.length-1];
      if(!last||last.e!==s||last.r!==view(r)){hist.push({e:s,r:view(r)});if(hist.length>60)hist.shift();store.set('hist_'+cfg.id,hist);renderHist()}
      done=true;
    }catch(e){res.textContent='Ошибка';res.classList.remove('stale');sub.textContent=e.message;sub.classList.add('err')}
  }
  function ins(t){
    if(done){inp.value=/^\s*([+\-*\/^%!]|mod\b)/.test(t)?'ans':'';done=false}
    const a=inp.selectionStart==null?inp.value.length:inp.selectionStart,b=inp.selectionEnd==null?a:inp.selectionEnd;
    inp.setRangeText(t,a,b,'end');inp.focus({preventScroll:true});preview();
  }
  const curVal=()=>{try{return inp.value.trim()?compute():ENV.v.ans}catch(e){return ENV.v.ans}};
  const memBadge=()=>bM.classList.toggle('off',mem===0);
  const CMD={
    eq,
    clear(){inp.value='';done=false;preview();inp.focus({preventScroll:true})},
    back(){if(done){CMD.clear();return}const a=inp.selectionStart,b=inp.selectionEnd;if(a!==b)inp.setRangeText('',a,b,'end');else if(a>0)inp.setRangeText('',a-1,a,'end');preview();inp.focus({preventScroll:true})},
    neg(){
      if(done){inp.value='ans';done=false}
      let v=inp.value,m;
      if((m=v.match(/\(-([\w.π]+)\)$/)))v=v.slice(0,m.index)+m[1];
      else if((m=v.match(/[\w.π]+$/)))v=v.slice(0,m.index)+'(-'+m[0]+')';
      else v+='-';
      inp.value=v;preview();
    },
    inv(){if(!inp.value.trim())return;inp.value='1/('+inp.value+')';done=false;preview()},
    mc(){mem=0;memBadge()},mr(){ins(fmt(mem))},
    mp(){const v=curVal();if(isFinite(v)){mem+=v;memBadge();toast('M = '+fmt(mem))}},
    mm(){const v=curVal();if(isFinite(v)){mem-=v;memBadge();toast('M = '+fmt(mem))}},
    shift(){shift=!shift;refresh()},
    fmt(){fmode=fmode==='auto'?'sci':fmode==='sci'?'eng':'auto';refresh();preview()},
    ang(){setAngle(S.angle==='deg'?'rad':S.angle==='rad'?'grad':'deg')}
  };
  const keyEls=[];
  cfg.keys.forEach(k=>{
    const [l,kind,val,cls,l2,v2]=k,b=h('button','key '+(cls||''),esc(l));b.type='button';
    b.addEventListener('click',()=>{
      if(kind==='c'){CMD[val]();return}
      ins(shift&&v2!==undefined?v2:val);if(shift){shift=false;refresh()}
    });
    pad.append(b);keyEls.push([b,k]);
  });
  function refresh(){
    keyEls.forEach(([b,k])=>{
      let l=shift&&k[4]?k[4]:k[0];
      if(k[2]==='ang')l=({deg:'DEG',rad:'RAD',grad:'GRAD'})[S.angle];
      if(k[2]==='fmt')l=({auto:'Авто',sci:'Sci',eng:'Eng'})[fmode];
      b.textContent=l;if(k[2]==='shift')b.classList.toggle('on',shift);
    });
    bA.textContent=({deg:'DEG',rad:'RAD',grad:'GRAD'})[S.angle];
  }

function converter(el){
  const card=h('section','card tool wide');card.innerHTML='<h3>Конвертер единиц</h3>';
  const f=h('div','form');
  const mk=(l,c)=>{const lab=h('label','field');lab.append(h('span','',l),c);f.append(lab);return c};
  const cat=mk('Величина',h('select')),val=mk('Значение',h('input')),from=mk('Из',h('select')),to=mk('В',h('select'));
  val.value='1';val.autocomplete='off';
  Object.keys(UNITS).forEach(k=>cat.append(new Option(UNITS[k].n,k)));
  const out=h('div','out'),sw=h('button','btn sm','⇄ Поменять');sw.type='button';
  card.append(f,sw,out);el.append(card);
  const fill=()=>{const u=Object.keys(UNITS[cat.value].u);from.innerHTML=to.innerHTML='';u.forEach(x=>{from.append(new Option(x,x));to.append(new Option(x,x))});from.value=u[0];to.value=u[1]||u[0];calc()};
  const conv=(v,a,b)=>{const C=UNITS[cat.value],r=C.temp?FK[b](TK[a](v)):v*C.u[a]/C.u[b];return isFinite(r)?+r.toPrecision(13):r};
  function calc(){
    const v=parseNum(val.value);
    if(!isFinite(v)){out.innerHTML='<div class="err">Введите число</div>';return}
    const r=conv(v,from.value,to.value);
    out.innerHTML=kv([[esc(from.value)+' → '+esc(to.value),nf(r,10),esc(to.value),'big']])+tbl(['Единица','Значение'],Object.keys(UNITS[cat.value].u).map(u=>[esc(u),nf(conv(v,from.value,u),10)]));
  }
  cat.onchange=fill;[val,from,to].forEach(x=>x.addEventListener('input',calc));
  sw.onclick=()=>{const t=from.value;from.value=to.value;to.value=t;calc()};

}

function numWords(n,fem){
  if(n===0)return 'ноль';
  const U=['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const UF=['','одна','две'],T=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const H=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  const SC=[null,['тысяча','тысячи','тысяч',true],['миллион','миллиона','миллионов'],['миллиард','миллиарда','миллиардов'],['триллион','триллиона','триллионов']];
  const pl=(x,f)=>{const a=x%100,b=x%10;return a>10&&a<15?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2]};
  const tri=(x,f)=>{const w=[H[Math.floor(x/100)]],r=x%100;if(r<20)w.push(f&&r<3?UF[r]:U[r]);else{w.push(T[Math.floor(r/10)]);const o=r%10;w.push(f&&o<3?UF[o]:U[o])}return w.filter(Boolean).join(' ')};
  const parts=[];let i=0,x=n;
  while(x>0){const t=x%1000;x=Math.floor(x/1000);if(t){const sc=SC[i];const w=tri(t,i===0?fem:!!(sc&&sc[3]));parts.unshift(sc?w+' '+pl(t,sc):w)}i++}
  return parts.join(' ');
}

    ['1',()=>app('1')],['2',()=>app('2')],['3',()=>app('3')],['−',()=>op('-'),'op'],

function npvTab(el){
  const g=grid(el);
  Tool(g,{title:'NPV, IRR и срок окупаемости',wide:true,note:'Денежные потоки по периодам, начиная с периода 0 (инвестиция — отрицательная).',fields:[{id:'rate',label:'Ставка дисконтирования, %',value:'12'},{id:'cf',label:'Потоки (через пробел, запятую или с новой строки)',type:'textarea',rows:3,value:'-1000000 300000 350000 400000 450000',wide:true}],
    run(v){need(v,'rate');const cf=splitNums(v.cf);if(cf.length<2||cf.some(x=>!isFinite(x)))throw new Error('Нужно минимум 2 числовых потока');
      const r=v.rate/100,npv=(q)=>cf.reduce((s,x,t)=>s+x/Math.pow(1+q,t),0),N=npv(r);
      let irr=NaN,lo=-0.99,hi=10;if(npv(lo)*npv(hi)<0){for(let i=0;i<200;i++){const m=(lo+hi)/2;if(npv(lo)*npv(m)<=0)hi=m;else lo=m}irr=(lo+hi)/2}
      const pb=(disc)=>{let c=0;for(let t=0;t<cf.length;t++){const x=disc?cf[t]/Math.pow(1+r,t):cf[t];if(c+x>=0&&t>0&&c<0)return t-1+(-c)/x;c+=x}return NaN};
      const inflow=cf.slice(1).reduce((s,x,i)=>s+Math.max(x,0)/Math.pow(1+r,i+1),0);
      return kv([['NPV',money(N),'₽','big'],['IRR',isNaN(irr)?'—':nf(irr*100,4),'%'],['Окупаемость',isNaN(pb(false))?'не окупается':nf(pb(false),2),'периодов'],['Дисконт. окупаемость',isNaN(pb(true))?'не окупается':nf(pb(true),2),'периодов'],['Индекс прибыльности PI',cf[0]?nf(inflow/Math.abs(cf[0]),3):'—'],['Решение',N>0?'✅ проект выгоден':'⚠ невыгоден при этой ставке']])}});
}

const NAME='[A-Za-z_\\u0370-\\u03ff\\u0400-\\u04ff][A-Za-z_0-9\\u0370-\\u03ff\\u0400-\\u04ff]*';
function runScript(src){
  const env={v:Object.create(null),fn:Object.create(null)},out=[];let steps=0;const LIM=3e6;
  const reFn=new RegExp('^('+NAME+')\\s*\\(([^)]*)\\)\\s*=(?!=)\\s*(.+)$','i');
  const reAs=new RegExp('^('+NAME+')\\s*([-+*/^])?=(?!=)\\s*(.+)$','i');
  const reFor=new RegExp('^for\\s+('+NAME+')\\s*=\\s*(.+?)\\s*\\.\\.\\s*(.+?)(?:\\s+step\\s+(.+?))?\\s*:\\s*(.+)$','i');
  const reWhile=/^while\s+(.+?)\s*:\s*(.+)$/i,reIf=/^if\s+(.+?)\s*:\s*(.+)$/i,rePrint=/^print\s+(.+)$/i;
  const splitTop=s=>{const r=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;else if(ch===')')d--;if(ch===';'&&d===0){r.push(cur);cur=''}else cur+=ch}r.push(cur);return r.map(x=>x.trim()).filter(Boolean)};
  const ev=s=>compile(s)(env);
  function exec(line,silent,ln){
    line=line.trim();if(!line)return;
    if(++steps>LIM)throw new Error('Превышен лимит операций (возможен бесконечный цикл)');
    let m;
    if((m=reFor.exec(line))){
      const nm=m[1],a=ev(m[2]),b=ev(m[3]),st=m[4]?ev(m[4]):1;if(!st)throw new Error('Шаг цикла не может быть 0');
      const body=splitTop(m[5]);
      for(let i=a;st>0?i<=b+1e-12:i>=b-1e-12;i+=st){env.v[nm]=i;body.forEach(x=>exec(x,true,ln))}
      return;
    }
    if((m=reWhile.exec(line))){const body=splitTop(m[2]);while(ev(m[1])){body.forEach(x=>exec(x,true,ln));if(++steps>LIM)throw new Error('Превышен лимит операций (возможен бесконечный цикл)')}return}
    if((m=reIf.exec(line))){if(ev(m[1]))splitTop(m[2]).forEach(x=>exec(x,true,ln));return}
    if((m=rePrint.exec(line))){const r=ev(m[1]);env.v.ans=r;out.push({ln,t:'a',text:fmt(r)});return}
    if((m=reFn.exec(line))){
      const name=m[1],ps=m[2].split(',').map(s=>s.trim()).filter(Boolean),body=compile(m[3]);
      env.fn[name]=(...a)=>{const lv={v:Object.create(env.v),fn:env.fn};ps.forEach((p,i)=>{lv.v[p]=a[i]});return body(lv)};
      if(!silent)out.push({ln,t:'d',text:'ƒ '+name+'('+ps.join(', ')+') определена'});return;
    }
    if((m=reAs.exec(line))){
      let val=ev(m[3]);const o=m[2];
      if(o){const cur=env.v[m[1]];if(cur===undefined)throw new Error('Переменная «'+m[1]+'» не определена');val=o==='+'?cur+val:o==='-'?cur-val:o==='*'?cur*val:o==='/'?cur/val:Math.pow(cur,val)}
      env.v[m[1]]=val;if(!silent)out.push({ln,t:'a',text:m[1]+' = '+fmt(val)});return;
    }
    const r=ev(line);env.v.ans=r;if(!silent)out.push({ln,t:'a',text:fmt(r)});
  }
  const lines=src.split('\n');
  for(let i=0;i<lines.length;i++){
    const raw=lines[i].replace(/(#|\/\/).*$/,'').trim();if(!raw)continue;
    try{if(/^(for|while|if)\s/i.test(raw))exec(raw,false,i+1);else splitTop(raw).forEach(x=>exec(x,false,i+1))}
    catch(e){out.push({ln:i+1,t:'e',text:e instanceof RangeError?'Слишком глубокая рекурсия':e.message});break}
  }
  return{out,env};
}

function geoSun(el){

      const elev=90-Math.abs(v.lat-dc/r),rows=[['Склонение Солнца',nf(dc/r,3),'°'],['Максимальная высота',nf(elev,2),'°'],['Солнечный полдень',T(noon)]];

function geoClock(el){

  card.append(q,box);el.append(card);

  const loc=-new Date().getTimezoneOffset();

    const now=new Date(),rows=CITIES.filter(c=>c[0].toLowerCase().includes(q.value.trim().toLowerCase())).map(c=>{
      const p={};F(c[3]).formatToParts(now).forEach(x=>p[x.type]=x.value);
      const m=(p.timeZoneName||'').match(/GMT([+\-−])(\d{2}):(\d{2})/),off=m?(m[1]==='+'?1:-1)*(+m[2]*60+ +m[3]):0,diff=(off-loc)/60;
      return[esc(c[0]),`<b>${p.hour}:${p.minute}:${p.second}</b>`,esc(p.weekday+', '+p.day+' '+p.month),(p.timeZoneName||'UTC').replace('GMT','UTC'),diff===0?'—':(diff>0?'+':'−')+Math.abs(diff).toLocaleString('ru-RU')+' ч']});
    box.innerHTML=tbl(['Город','Время','Дата','Пояс','Разница с вами'],rows);

function physFormulas(el){
  const card=h('section','card tool');card.innerHTML='<h3>Решатель формул: оставьте пустым искомое поле</h3><p class="note">Все величины в единицах СИ. Допустимы выражения, например <code>2*pi*0.5</code>.</p>';
  const sel=h('select');FORM.forEach((f,i)=>sel.append(new Option(f.n,i)));
  const eq=h('div','big-eq'),form=h('div','form'),out=h('div','out');
  card.append(sel,eq,form,out);el.append(card);
  let F,inputs={};
  function build(){
    F=FORM[+sel.value];eq.textContent=F.eq;form.innerHTML='';inputs={};
    F.v.forEach(([k,l,u],i)=>{const lab=h('label','field');lab.append(h('span','',esc(l)+', '+esc(u)));const inp=h('input');inp.autocomplete='off';inp.spellcheck=false;inp.value=k===(F.def||F.v[0][0])?'':(F.ex[k]!=null?F.ex[k]:'');inp.oninput=calc;lab.append(inp);form.append(lab);inputs[k]=inp});calc();
  }
  function calc(){
    const empty=F.v.filter(([k])=>!inputs[k].value.trim());
    if(empty.length!==1){out.innerHTML='<div class="err">Оставьте пустым ровно одно поле — его мы и вычислим.</div>';return}
    const a={};for(const [k,l] of F.v){if(empty[0][0]===k)continue;a[k]=parseNum(inputs[k].value);if(!isFinite(a[k])){out.innerHTML='<div class="err">Некорректное значение: «'+esc(l)+'»</div>';return}}
    const [k,l,u]=empty[0],r=F.s[k](a);
    if(!isFinite(r)||Number.isNaN(r)){out.innerHTML='<div class="err">Решения нет при этих значениях'+(F.n.includes('Снеллиуса')?' (возможно, полное внутреннее отражение)':'')+'.</div>';return}
    out.innerHTML=kv([[esc(l),nf(r,10),esc(u),'big'],['В научной записи',fmt(r,8)],['Подставлено',F.v.filter(([x])=>x!==k).map(([x])=>x+' = '+nf(a[x],6)).join('; ')]]);
  }
  sel.onchange=build;build();
}
function physProj(el){
  const cv=h('canvas');let anim=null;
  const G={'9.80665':'Земля 9,81','1.62':'Луна 1,62','3.71':'Марс 3,71','24.79':'Юпитер 24,79','8.87':'Венера 8,87','3.7':'Меркурий 3,70'};
  Tool(el,{title:'Движение тела, брошенного под углом',wide:true,visual:cv,
    fields:[{id:'v0',label:'Начальная скорость, м/с',value:'30'},{id:'al',label:'Угол к горизонту, °',value:'45'},{id:'h0',label:'Начальная высота, м',value:'0'},{id:'g',label:'Ускорение g',type:'select',options:Object.entries(G),value:'9.80665'}],
    btns:[{t:'▶ Анимация',fn:(v)=>{need(v,'v0','al');const g=+v.g,vy=v.v0*Math.sin(v.al*Math.PI/180),T=(vy+Math.sqrt(vy*vy+2*g*(v.h0||0)))/g;anim={t0:performance.now(),T,dur:Math.min(6,Math.max(1.5,T/2))*1000,k:0};const step=now=>{if(!anim)return;anim.k=Math.min(1,(now-anim.t0)/anim.dur);cv._draw();if(anim.k<1)requestAnimationFrame(step);else setTimeout(()=>{anim=null;cv._draw()},800)};requestAnimationFrame(step)}}],
    run(v){
      need(v,'v0','al');if(v.al<-90||v.al>90)throw new Error('Угол от −90° до 90°');const g=+v.g,h0=isFinite(v.h0)?Math.max(0,v.h0):0,a=v.al*Math.PI/180,vx=v.v0*Math.cos(a),vy=v.v0*Math.sin(a);
      const T=(vy+Math.sqrt(vy*vy+2*g*h0))/g,R=vx*T,Hm=h0+(vy>0?vy*vy/(2*g):0),vi=Math.hypot(vx,vy-g*T),ia=Math.atan2(g*T-vy,vx)*180/Math.PI;
      const pos=t=>[vx*t,h0+vy*t-g*t*t/2];
      reg(cv,({g:c,w,h:H})=>{
        const P=36,xm=Math.max(R,1)*1.05,ym=Math.max(Hm,1)*1.15,sc=Math.min((w-2*P)/xm,(H-2*P)/ym),X=x=>P+x*sc,Y=y=>H-P-y*sc;
        c.strokeStyle=cvar('--grid');c.fillStyle=cvar('--muted');c.font='11px system-ui';c.lineWidth=1;c.textAlign='center';c.textBaseline='top';
        for(const t of ticks(0,xm,6)){c.beginPath();c.moveTo(X(t),P/2);c.lineTo(X(t),H-P);c.stroke();c.fillText(nf(t,2),X(t),H-P+6)}
        c.textAlign='right';c.textBaseline='middle';for(const t of ticks(0,ym,5)){c.beginPath();c.moveTo(P,Y(t));c.lineTo(w-P/2,Y(t));c.stroke();c.fillText(nf(t,2),P-6,Y(t))}
        c.strokeStyle=cvar('--muted');c.lineWidth=2;c.beginPath();c.moveTo(P,Y(0));c.lineTo(w-P/2,Y(0));c.stroke();
        if(h0===0&&Math.abs(v.al-45)>0.5){const R45=v.v0*v.v0/g;c.setLineDash([5,5]);c.strokeStyle='#fbbf24';c.lineWidth=1.5;c.beginPath();for(let i=0;i<=100;i++){const t=2*v.v0*Math.SQRT1_2/g*i/100,x=v.v0*Math.SQRT1_2*t,y=v.v0*Math.SQRT1_2*t-g*t*t/2;i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y))}c.stroke();c.setLineDash([])}
        c.strokeStyle='#22d3ee';c.lineWidth=2.6;c.shadowColor='#22d3ee';c.shadowBlur=10;c.beginPath();for(let i=0;i<=120;i++){const [x,y]=pos(T*i/120);i?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y))}c.stroke();c.shadowBlur=0;
        if(vy>0){const ta=vy/g,[xa,ya]=pos(ta);c.fillStyle='#f472b6';c.beginPath();c.arc(X(xa),Y(ya),5,0,7);c.fill()}
        c.fillStyle='#a3e635';c.beginPath();c.arc(X(R),Y(0),5,0,7);c.fill();
        const k=anim?anim.k:1,[bx,by]=pos(T*k);c.fillStyle='#fff';c.shadowColor='#fff';c.shadowBlur=12;c.beginPath();c.arc(X(bx),Y(by),7,0,7);c.fill();c.shadowBlur=0;
      });
      return kv([['Дальность',nf(R,4),'м','big'],['Время полёта',nf(T,4),'с'],['Макс. высота',nf(Hm,4),'м'],['Скорость у земли',nf(vi,4),'м/с'],['Угол падения',nf(ia,3),'°'],['Начальные vₓ / v_y',nf(vx,3)+' / '+nf(vy,3),'м/с']])+'<p class="note">Жёлтый пунктир — траектория под 45° (макс. дальность на ровной земле) при той же скорости.</p>';
    }});
}
function physModern(el){
  const g=grid(el);
  Tool(g,{title:'Специальная теория относительности',fields:[{id:'b',label:'Скорость как доля c (β)',value:'0.8'},{id:'m',label:'Масса покоя, кг (необяз.)',value:'1'},{id:'t',label:'Время в покое, с',value:'1'},{id:'l',label:'Длина в покое, м',value:'1'}],
    run(v){need(v,'b');if(v.b<0||v.b>=1)throw new Error('β должна быть от 0 до 1 (не включая 1)');const gm=1/Math.sqrt(1-v.b*v.b),rows=[['Лоренц-фактор γ',nf(gm,8),'','big'],['Скорость',nf(v.b*299792458,6),'м/с']];
      if(isFinite(v.t))rows.push(['Замедление времени',nf(v.t*gm,6),'с']);if(isFinite(v.l))rows.push(['Сокращение длины',nf(v.l/gm,6),'м']);
      if(isFinite(v.m)){const c2=299792458**2;rows.push(['Энергия покоя mc²',fmt(v.m*c2,8),'Дж'],['Полная энергия γmc²',fmt(gm*v.m*c2,8),'Дж'],['Кинетическая энергия',fmt((gm-1)*v.m*c2,8),'Дж'],['Импульс γmv',fmt(gm*v.m*v.b*299792458,8),'кг·м/с'])}return kv(rows)}});
  Tool(g,{title:'Радиоактивный распад',fields:[{id:'n0',label:'Начальное количество N₀',value:'1000'},{id:'t12',label:'Период полураспада T½',value:'5730'},{id:'t',label:'Прошедшее время t (те же единицы)',value:'10000'}],
    run(v){need(v,'n0','t12','t');if(v.t12<=0)throw new Error('T½ > 0');const lam=Math.LN2/v.t12,N=v.n0*Math.pow(.5,v.t/v.t12);return kv([['Осталось N(t)',nf(N,6),'','big'],['Доля осталась',nf(N/v.n0*100,5),'%'],['Периодов полураспада',nf(v.t/v.t12,5)],['Постоянная распада λ',fmt(lam,6)],['Среднее время жизни τ',nf(1/lam,6)]])}});
  Tool(g,{title:'Фотон и волны',fields:[{id:'lam',label:'Длина волны λ, нм',value:'550'}],
    run(v){need(v,'lam');const l=v.lam*1e-9,f=299792458/l,E=6.62607015e-34*f;return kv([['Частота',fmt(f,6),'Гц','big'],['Энергия фотона',fmt(E,6),'Дж'],['Энергия',nf(E/1.602176634e-19,5),'эВ'],['Диапазон',v.lam<10?'рентген/γ':v.lam<400?'ультрафиолет':v.lam<=700?'видимый свет':v.lam<1e6?'инфракрасный':'радиоволны']])}});
}

    '<b>НДФЛ с 2025 года</b> для резидентов — прогрессивная шкала: 13% до 2,4 млн ₽ годового дохода, 15% — до 5 млн, 18% — до 20 млн, 20% — до 50 млн, 22% — свыше. Ставка применяется только к части дохода внутри своей ступени.',

  {id:'finance',name:'Финансовый',icon:'💰',color:'#60a5fa',title:'Финансовый калькулятор',desc:'Кредиты, вклады, NPV/IRR, доходность, инфляция',build:buildFinance,learn:[

  {id:'graphic',name:'Графический',icon:'📈',color:'#f472b6',title:'Графический калькулятор',desc:'Графики функций, диаграммы, фракталы',build:buildGraphic,learn:[

const LEARN={"simple":[["Как калькулятор читает выражение","<p>Когда вы нажимаете «=», строка превращается в последовательность <b>токенов<\/b> — чисел, знаков операций, скобок и имён. Затем выражение разбирается по правилам приоритета и вычисляется. Именно поэтому можно набирать длинную формулу целиком, а не по одному действию, как на старых счётных машинах.<\/p>\n<p>Приоритет операций от высокого к низкому:<\/p>\n<ol>\n<li><b>Скобки<\/b> — всё внутри считается первым, вложенность не ограничена.<\/li>\n<li><b>Постфиксные операции<\/b> — факториал <code>!<\/code> и процент <code>%<\/code>.<\/li>\n<li><b>Степень<\/b> <code>^<\/code> — выполняется справа налево: <code>2^3^2 = 2^9 = 512<\/code>, а не 64.<\/li>\n<li><b>Унарный минус<\/b> — <code>-2^2 = -4<\/code>, потому что степень «сильнее» минуса; чтобы получить 4, пишите <code>(-2)^2<\/code>.<\/li>\n<li><b>Умножение, деление, остаток<\/b> — слева направо: <code>8/2*4 = 16<\/code>.<\/li>\n<li><b>Сложение и вычитание<\/b> — слева направо.<\/li>\n<\/ol>\n<div class=\"tip\">Неявное умножение работает как в школьной записи: <code>2(3+4)<\/code> даёт 14, <code>3π<\/code> даёт 9,42477796, <code>2√9<\/code> даёт 6. Если сомневаетесь в порядке действий, добавьте скобки — это бесплатно и всегда безопасно.<\/div>"],["Проценты: все случаи на примерах","<p>Слово «процент» означает «сотая доля», поэтому <code>p% = p/100<\/code>. Но в повседневных расчётах встречаются разные задачи, и калькулятор умеет их все:<\/p>\n<table class=\"lt\"><thead><tr><th>Задача<\/th><th>Что набрать<\/th><th>Результат<\/th><\/tr><\/thead><tbody>\n<tr><td>12% от 2500<\/td><td><code>2500*12%<\/code><\/td><td>300<\/td><\/tr>\n<tr><td>Прибавить 20% к 450<\/td><td><code>450+20%<\/code><\/td><td>540<\/td><\/tr>\n<tr><td>Вычесть скидку 15% из 3200<\/td><td><code>3200-15%<\/code><\/td><td>2720<\/td><\/tr>\n<tr><td>Сколько процентов 45 от 180<\/td><td><code>45/180*100<\/code><\/td><td>25<\/td><\/tr>\n<tr><td>Рост с 80 до 100, %<\/td><td><code>(100-80)/80*100<\/code><\/td><td>25<\/td><\/tr>\n<tr><td>Исходная цена, если 800 — это 80%<\/td><td><code>800/80*100<\/code><\/td><td>1000<\/td><\/tr>\n<\/tbody><\/table>\n<p>Важное правило: <b>«+%» и «−%» применяются к левой части выражения<\/b>. Запись <code>200+10%<\/code> означает «200 плюс 10% от 200», то есть 220, а не 200,1. Это совпадает с поведением обычных карманных калькуляторов и ожиданиями пользователей.<\/p>\n<p>Частая ловушка — последовательные изменения. Если цена выросла на 20%, а затем упала на 20%, итог не равен исходной: <code>100+20%-20% = 96<\/code>. Проценты нельзя просто складывать, потому что каждый следующий считается от нового значения.<\/p>"],["Память: M+, M−, MR, MC","<p>Память — это одна ячейка, в которой хранится число между вычислениями. Она удобна, когда нужно сложить результаты нескольких независимых расчётов, не записывая их на бумагу.<\/p>\n<ul>\n<li><b>M+<\/b> прибавляет текущее значение (результат или набранное выражение) к ячейке памяти.<\/li>\n<li><b>M−<\/b> вычитает его из ячейки.<\/li>\n<li><b>MR<\/b> вставляет содержимое памяти в выражение в позицию курсора.<\/li>\n<li><b>MC<\/b> обнуляет память; индикатор «M» над экраном гаснет.<\/li>\n<\/ul>\n<p><b>Пример: чек из магазина.<\/b> Посчитайте <code>3*49.9<\/code> и нажмите M+, затем <code>2*120<\/code> и M+, затем <code>0.5*310<\/code> и M+. Нажмите MR — получите общую сумму 544,7. Возврат товара — выражение со знаком «M−». Память не очищается при смене режима внутри калькулятора, поэтому её можно использовать как буфер, но после перезагрузки страницы она сбрасывается.<\/p>"],["Точность и «странные» результаты","<p>Компьютеры хранят числа в двоичном виде, и многие десятичные дроби в нём бесконечны — так же, как 1/3 бесконечна в десятичной записи. Поэтому «сырое» вычисление <code>0.1+0.2<\/code> в большинстве языков программирования даёт 0,30000000000000004.<\/p>\n<p>Простой режим показывает результат, округлённый до <b>14 значащих цифр<\/b>, и вы видите привычное 0,3. Количество показываемых знаков можно менять в шапке сайта (от 6 до 15). Что важно помнить:<\/p>\n<ul>\n<li>Целые числа точны до 9 007 199 254 740 991 (2<sup>53<\/sup> − 1). Дальше последние цифры могут «плыть» — для сверхбольших целых используйте режимы «Математический» и «Информатический», где применяется BigInt.<\/li>\n<li>Очень большие и очень малые числа показываются в научной записи: <code>1.5e-10<\/code> означает 1,5·10<sup>−10<\/sup>.<\/li>\n<li><code>1/0<\/code> даёт <b>∞<\/b>, а <code>0/0<\/code> и <code>√(−1)<\/code> — «Ошибка», потому что результат не определён среди вещественных чисел.<\/li>\n<li>Результат на экране — округлённая «витрина»; внутри хранится значение с полной точностью, и оно используется в следующем действии через <code>ans<\/code>.<\/li>\n<\/ul>"],["Клавиатура и скорость работы","<p>Калькулятором удобно пользоваться, не отрываясь от клавиатуры. Поле ввода всегда активно на компьютере; на телефоне системная клавиатура не выезжает, чтобы не закрывать кнопки.<\/p>\n<table class=\"lt\"><thead><tr><th>Клавиша<\/th><th>Действие<\/th><\/tr><\/thead><tbody>\n<tr><td><code>Enter<\/code><\/td><td>вычислить и записать в историю<\/td><\/tr>\n<tr><td><code>Esc<\/code><\/td><td>очистить выражение<\/td><\/tr>\n<tr><td><code>Backspace<\/code><\/td><td>удалить символ; после «=» очищает всё<\/td><\/tr>\n<tr><td><code>ans<\/code><\/td><td>вставить последний результат<\/td><\/tr>\n<tr><td><code>Alt+1 … Alt+0<\/code><\/td><td>переключение режимов<\/td><\/tr>\n<\/tbody><\/table>\n<p>Запятая принимается как десятичный разделитель: <code>0,5+0,25<\/code> даст 0,75. Клик по результату копирует его в буфер обмена, клик по записи истории возвращает выражение в поле ввода, чтобы его можно было доработать. История хранится в браузере и сохраняется между визитами (до 60 записей).<\/p>"],["Приёмы быстрого счёта в уме","<p>Калькулятор не всегда под рукой, а оценка результата помогает заметить опечатку. Несколько проверенных приёмов:<\/p>\n<ul>\n<li><b>Умножение на 5:<\/b> умножьте на 10 и разделите пополам. 46·5 = 460/2 = 230.<\/li>\n<li><b>Умножение на 9:<\/b> умножьте на 10 и вычтите само число. 37·9 = 370 − 37 = 333.<\/li>\n<li><b>Умножение на 11 двузначного числа:<\/b> цифры «раздвигаются», между ними ставится их сумма. 34·11: 3, (3+4)=7, 4 → 374. Если сумма больше 9, единица переносится: 78·11 = 858.<\/li>\n<li><b>Квадрат числа, оканчивающегося на 5:<\/b> цифру десятков умножьте на следующую и допишите 25. 35² → 3·4=12 → 1225; 85² → 8·9=72 → 7225.<\/li>\n<li><b>10%<\/b> — сдвиньте запятую влево на один знак; <b>15%<\/b> — это 10% плюс половина от 10%; <b>5%<\/b> — половина от 10%.<\/li>\n<li><b>Деление на 5:<\/b> умножьте на 2 и сдвиньте запятую. 360/5 = 720/10 = 72.<\/li>\n<li><b>Проверка девяткой:<\/b> сумма цифр результата (по модулю 9) должна совпадать с результатом тех же действий над суммами цифр исходных чисел. Это быстро ловит ошибки в умножении.<\/li>\n<\/ul>\n<div class=\"tip\">Оценивайте порядок величины заранее: 4 872 · 19,6 — это примерно 5 000 · 20 = 100 000. Если калькулятор выдал 9 549 или 954 912, вы сразу видите, что нужно перепроверить ввод.<\/div>"],["Краткая история счётных устройств","<ul>\n<li><b>Абак и счёты<\/b> — первые инструменты для арифметики; русские счёты с десятичной системой используются с XVI–XVII веков.<\/li>\n<li><b>1642 год<\/b> — Блез Паскаль строит «Паскалину», механическую машину для сложения и вычитания; позже Лейбниц (около 1673 г.) создаёт ступенчатый вычислитель, умеющий умножать и делить.<\/li>\n<li><b>XIX век<\/b> — арифмометры Томаса, а затем конструкция Вильгодта Однера (1870-е) на колесе с переменным числом зубцов; на её основе выпускались отечественные арифмометры «Феликс» (1929–1970-е).<\/li>\n<li><b>1948 год<\/b> — швейцарский Curta, механический «карманный» калькулятор, помещавшийся в ладони.<\/li>\n<li><b>1960-е<\/b> — первые электронные настольные калькуляторы на транзисторах и микросхемах; <b>1971–72 гг.<\/b> — появляются карманные модели, а Hewlett-Packard HP-35 (1972) становится первым карманным научным калькулятором.<\/li>\n<li><b>1980-е<\/b> — в СССР популярны «Электроника МК-61» и «МК-52» с программируемой памятью и обратной польской записью.<\/li>\n<\/ul>"],["Частые вопросы","<ul>\n<li><b>Почему 2+3×4 = 14, а не 20?<\/b> Умножение имеет приоритет над сложением. Чтобы получить 20, напишите <code>(2+3)×4<\/code>.<\/li>\n<li><b>Как вычислить корень n-й степени?<\/b> Через дробную степень: корень пятой степени из 32 — <code>32^(1/5)<\/code> = 2. Для корней из отрицательных чисел вещественного результата нет.<\/li>\n<li><b>Что значит «Ошибка»?<\/b> Выражение записано неверно (например, не закрыта скобка) или результат не определён. Сообщение под экраном называет причину.<\/li>\n<li><b>Можно ли вводить числа с пробелами?<\/b> Лучше без них: в выражении <code>1 000<\/code> пробел будет воспринят как неявное умножение.<\/li>\n<li><b>Почему кнопка «%» ведёт себя необычно?<\/b> Она делит число на 100, а после «+» и «−» считает долю от левой части выражения — так привыкли пользователи обычных калькуляторов.<\/li>\n<li><b>Где нужны более мощные функции?<\/b> Откройте «Инженерный» режим — тригонометрия, логарифмы, степени и инженерная запись.<\/li>\n<\/ul>"],["Скобки и вложенность","<p>Скобки задают порядок вычислений и могут вкладываться друг в друга на любую глубину. Калькулятор считает самые внутренние скобки первыми. В выражении <code>2*(3+(4-1)*5)<\/code> сначала вычисляется <code>(4-1) = 3<\/code>, затем <code>3*5 = 15<\/code>, потом <code>3+15 = 18<\/code> и в конце <code>2*18 = 36<\/code>.<\/p>\n<p>Самая частая ошибка — несбалансированные скобки: калькулятор сообщит «Не закрыта скобка». Простой способ проверки: двигаясь слева направо, прибавляйте 1 за каждую «(» и вычитайте 1 за каждую «)». В конце должен получиться ноль, а в середине число никогда не должно стать отрицательным.<\/p>\n<ul>\n<li><b>Дробь в знаменателе:<\/b> пишите <code>1/(2*3)<\/code>, а не <code>1/2*3<\/code> — второе означает (1/2)·3 = 1,5, а не 1/6.<\/li>\n<li><b>Отрицательные числа в степени:<\/b> <code>(-3)^2 = 9<\/code>, но <code>-3^2 = -9<\/code>.<\/li>\n<li><b>Числитель и знаменатель с суммой:<\/b> <code>(a+b)/(c+d)<\/code> — скобки обязательны, иначе деление выполнится раньше сложения.<\/li>\n<\/ul>\n<div class=\"tip\">Если выражение получилось длинным, разбейте его на части: вычислите одну часть, а затем используйте <code>ans<\/code> — результат предыдущего вычисления — в следующем шаге.<\/div>"],["Степени и корни","<p>Степень <code>a^n<\/code> — это произведение n одинаковых множителей. Для целых отрицательных показателей действует правило <code>a^(−n) = 1/a^n<\/code>, для нулевого — <code>a^0 = 1<\/code> при a ≠ 0. Корень — это дробная степень: квадратный корень равен <code>^(1/2)<\/code>, кубический — <code>^(1/3)<\/code>, корень n-й степени — <code>^(1/n)<\/code>.<\/p>\n<table class=\"lt\"><thead><tr><th>Запись<\/th><th>Выражение<\/th><th>Результат<\/th><\/tr><\/thead><tbody>\n<tr><td>2 в десятой степени<\/td><td><code>2^10<\/code><\/td><td>1024<\/td><\/tr>\n<tr><td>Квадратный корень из 144<\/td><td><code>√144<\/code> или <code>144^0.5<\/code><\/td><td>12<\/td><\/tr>\n<tr><td>Кубический корень из 125<\/td><td><code>125^(1/3)<\/code><\/td><td>5<\/td><\/tr>\n<tr><td>Степень отрицательная<\/td><td><code>10^-3<\/code><\/td><td>0,001<\/td><\/tr>\n<tr><td>Корень 5-й степени из 32<\/td><td><code>32^(1/5)<\/code><\/td><td>2<\/td><\/tr>\n<\/tbody><\/table>\n<p>Свойства степеней: a^m · a^n = a^(m+n); a^m / a^n = a^(m−n); (a^m)^n = a^(m·n); (ab)^n = a^n · b^n. Они помогают упрощать вычисления вручную и проверять результат калькулятора. Помните, что возведение в степень выполняется справа налево: <code>2^3^2 = 2^9 = 512<\/code>.<\/p>"],["Факториал и быстрый рост","<p>Факториал n! — произведение всех натуральных чисел от 1 до n; по определению 0! = 1. Он показывает, сколькими способами можно упорядочить n предметов. Рост факториала стремительный:<\/p>\n<table class=\"lt\"><thead><tr><th>n<\/th><th>n!<\/th><th>Что это значит<\/th><\/tr><\/thead><tbody>\n<tr><td>5<\/td><td>120<\/td><td>рассадка 5 человек<\/td><\/tr>\n<tr><td>10<\/td><td>3 628 800<\/td><td>больше, чем секунд в 42 сутках<\/td><\/tr>\n<tr><td>20<\/td><td>2 432 902 008 176 640 000<\/td><td>≈ 2,4·10¹⁸<\/td><\/tr>\n<tr><td>52<\/td><td>≈ 8,07·10⁶⁷<\/td><td>перестановок колоды карт<\/td><\/tr>\n<tr><td>170<\/td><td>≈ 7,26·10³⁰⁶<\/td><td>наибольший факториал в обычной арифметике<\/td><\/tr>\n<\/tbody><\/table>\n<p>Для n больше 170 результат превышает диапазон чисел двойной точности и показывается как «∞». Для больших n удобна формула Стирлинга: n! ≈ √(2πn)·(n/e)ⁿ — для n = 10 она даёт 3 598 696 против точных 3 628 800 (ошибка около 0,8%). Для нецелых чисел калькулятор использует гамма-функцию: <code>2.5!<\/code> = Γ(3,5) ≈ 3,3234.<\/p>"],["Округление и значащие цифры","<p>Результат на экране — округлённое представление числа. Количество значащих цифр выбирается в шапке сайта («Знаков»). Для округления внутри формулы в инженерном режиме есть функции <code>round(x, знаков)<\/code>, <code>floor<\/code> (вниз), <code>ceil<\/code> (вверх), <code>trunc<\/code> (отбрасывание дробной части).<\/p>\n<table class=\"lt\"><thead><tr><th>Число<\/th><th>round<\/th><th>floor<\/th><th>ceil<\/th><th>trunc<\/th><\/tr><\/thead><tbody>\n<tr><td>2,5<\/td><td>3<\/td><td>2<\/td><td>3<\/td><td>2<\/td><\/tr>\n<tr><td>−2,5<\/td><td>−2<\/td><td>−3<\/td><td>−2<\/td><td>−2<\/td><\/tr>\n<tr><td>7,49<\/td><td>7<\/td><td>7<\/td><td>8<\/td><td>7<\/td><\/tr>\n<\/tbody><\/table>\n<p>Обратите внимание на отрицательные числа: <code>floor(−2,5) = −3<\/code>, а <code>trunc(−2,5) = −2<\/code>. Правило «половина — вверх» удобно, но накапливает смещение; в статистике и банковских системах иногда используют округление «к ближайшему чётному» (2,5 → 2; 3,5 → 4). Чтобы округлить до сотых, сделайте <code>round(x, 2)<\/code>; чтобы округлить до сотен, — <code>round(x/100)*100<\/code>.<\/p>"],["Как проверить результат и что такое ans","<p>Доверять калькулятору можно, а вот вводу — не всегда. Простые приёмы контроля:<\/p>\n<ul>\n<li><b>Прикидка порядка величины.<\/b> 48,7 × 21,3 — это примерно 50 × 20 = 1000; если получилось 10 373,31 или 103,7, значит, запятая сместилась.<\/li>\n<li><b>Обратное действие.<\/b> Если 1 764 / 42 = 42, то проверьте 42 × 42 = 1764.<\/li>\n<li><b>Двойной ввод.<\/b> Выполните расчёт другим способом, например через проценты и через умножение на коэффициент.<\/li>\n<li><b>Крайние случаи.<\/b> Подставьте 0 или 1: известно ли вам заранее, что должно получиться?<\/li>\n<\/ul>\n<p>Кнопка и слово <code>ans<\/code> подставляют результат последнего вычисления. Цепочки пишутся так: вычислили <code>12.5*8 = 100<\/code>, затем набираете <code>ans*1.2<\/code> — получаете 120. Если после «=» сразу нажать операцию (например, «+»), калькулятор сам добавит <code>ans<\/code> в начало выражения, и можно продолжать, как на обычном калькуляторе.<\/p>"],["Десятичные и обыкновенные дроби","<p>Любое рациональное число записывается дробью. Десятичная запись конечна, если знаменатель несократимой дроби содержит только простые множители 2 и 5, иначе — периодическая: 1/8 = 0,125; 1/3 = 0,(3); 1/7 = 0,(142857). В режиме «Математический» есть вкладка «Дроби», где обыкновенные дроби складываются и сокращаются точно, без округления.<\/p>\n<table class=\"lt\"><thead><tr><th>Дробь<\/th><th>Десятичная<\/th><th>Процент<\/th><\/tr><\/thead><tbody>\n<tr><td>1/2<\/td><td>0,5<\/td><td>50%<\/td><\/tr>\n<tr><td>1/4<\/td><td>0,25<\/td><td>25%<\/td><\/tr>\n<tr><td>1/5<\/td><td>0,2<\/td><td>20%<\/td><\/tr>\n<tr><td>1/8<\/td><td>0,125<\/td><td>12,5%<\/td><\/tr>\n<tr><td>1/3<\/td><td>0,333…<\/td><td>33,33…%<\/td><\/tr>\n<tr><td>2/3<\/td><td>0,666…<\/td><td>66,66…%<\/td><\/tr>\n<\/tbody><\/table>\n<p>Смешанное число 2 3/4 вводится как <code>2+3/4<\/code> = 2,75. Чтобы получить дробь из десятичной, умножьте на степень десяти и сократите: 0,375 = 375/1000 = 3/8. Не забывайте, что в выражении <code>1/2/2<\/code> деление выполняется слева направо: (1/2)/2 = 0,25, а не 1.<\/p>"],["Повседневные расчёты: скидки, чаевые, налоги","<p>Типовые задачи удобно сводить к шаблонам выражений:<\/p>\n\n<div class=\"tip\">Если вы покупаете что-то за 3 200 ₽ со скидкой 15%, наберите <code>3200-15%<\/code>: калькулятор вычтет 15% от 3 200 и покажет 2 720.<\/div>\n<ul>\n<li><b>Цена со скидкой:<\/b> <code>цена - 25%<\/code>; цена до скидки при известной итоговой: <code>итог / 0.75<\/code>.<\/li>\n<li><b>Чаевые 10%:<\/b> сдвиньте запятую на один знак влево.<\/li>\n<li><b>Цена за единицу:<\/b> разделите цену упаковки на количество и сравнивайте по этому числу.<\/li>\n<\/ul>"],["Деление, остаток и делимость","<p>Целочисленное деление и остаток связаны формулой <code>a = b·q + r<\/code>, где 0 ≤ r &lt; b. Остаток от деления вычисляется оператором <code>mod<\/code> (например, <code>17 mod 5 = 2<\/code>), целая часть — оператором <code>div<\/code> (<code>17 div 5 = 3<\/code>). Это удобно для времени и календаря: 130 минут = <code>130 div 60<\/code> ч <code>130 mod 60<\/code> мин = 2 ч 10 мин.<\/p>\n<p>Признаки делимости помогают быстро проверить числа:<\/p>\n<table class=\"lt\"><thead><tr><th>Делитель<\/th><th>Признак<\/th><\/tr><\/thead><tbody>\n<tr><td>2<\/td><td>последняя цифра чётная<\/td><\/tr>\n<tr><td>3, 9<\/td><td>сумма цифр кратна 3 (9)<\/td><\/tr>\n<tr><td>4<\/td><td>две последние цифры образуют число, кратное 4<\/td><\/tr>\n<tr><td>5<\/td><td>оканчивается на 0 или 5<\/td><\/tr>\n<tr><td>6<\/td><td>чётное и сумма цифр кратна 3<\/td><\/tr>\n<tr><td>11<\/td><td>разность сумм цифр на чётных и нечётных местах кратна 11<\/td><\/tr>\n<\/tbody><\/table>\n<p>Остаток всегда неотрицателен: калькулятор считает <code>-7 mod 3 = 2<\/code> (а не −1), как принято в математике.<\/p>"],["Время, скорость и работа","<p>Три величины связаны формулой «путь = скорость × время» и её следствиями. Главная проблема — единицы: километры в час нужно переводить в метры в секунды делением на 3,6 (и обратно умножением), минуты — в часы делением на 60.<\/p>\n<ul>\n<li><b>Средняя скорость<\/b> — это весь путь, делённый на всё время, а не среднее арифметическое скоростей. Если полпути вы ехали со скоростью 60 км/ч, а вторую половину — 40 км/ч, то средняя равна не 50, а <code>2/(1/60+1/40) = 48<\/code> км/ч.<\/li>\n<li><b>Совместная работа:<\/b> если один мастер выполняет задание за 6 часов, а другой за 3, вместе они справятся за <code>1/(1/6+1/3) = 2<\/code> часа.<\/li>\n<li><b>Встречное движение:<\/b> скорости складываются; <b>вдогонку<\/b> — вычитаются.<\/li>\n<li><b>Время в часах и минутах:<\/b> 2,75 ч = 2 ч и <code>0.75*60 = 45<\/code> мин.<\/li>\n<\/ul>\n<p>Пример: поезд проходит 342 км за 3 ч 24 мин. Время в часах: <code>3+24/60 = 3,4<\/code>; скорость <code>342/3.4 ≈ 100,59<\/code> км/ч.<\/p>"],["Большие числа и запись чисел","<p>Числа удобно группировать по три цифры: 1 234 567. Калькулятор принимает ввод без пробелов; если число слишком велико, оно показывается в научной записи — <code>1.5e12<\/code> означает 1,5·10¹². Правила чтения: показатель — это число сдвигов запятой вправо (при плюсе) или влево (при минусе).<\/p>\n<table class=\"lt\"><thead><tr><th>Название<\/th><th>Число<\/th><th>Запись<\/th><\/tr><\/thead><tbody>\n<tr><td>Тысяча<\/td><td>1 000<\/td><td>10³<\/td><\/tr>\n<tr><td>Миллион<\/td><td>1 000 000<\/td><td>10⁶<\/td><\/tr>\n<tr><td>Миллиард<\/td><td>1 000 000 000<\/td><td>10⁹<\/td><\/tr>\n<tr><td>Триллион<\/td><td>1 000 000 000 000<\/td><td>10¹²<\/td><\/tr>\n<tr><td>Квадриллион<\/td><td>10¹⁵<\/td><td>1e15<\/td><\/tr>\n<\/tbody><\/table>"],["Проценты в уме","<p>Большинство процентных задач решается без калькулятора, если опираться на 10% и 1%. Десять процентов — это деление на 10, один процент — деление на 100, пять процентов — половина от десяти.<\/p>\n<table class=\"lt\"><thead><tr><th>Задача<\/th><th>Ход рассуждения<\/th><th>Результат<\/th><\/tr><\/thead><tbody>\n<tr><td>15% от 2 400<\/td><td>10% = 240, 5% = 120<\/td><td>360<\/td><\/tr>\n<tr><td>Скидка 30% с 5 000<\/td><td>умножить на 0,7<\/td><td>3 500<\/td><\/tr>\n<tr><td>Рост на 20%, затем падение на 20%<\/td><td>1,2 × 0,8<\/td><td>0,96 — итог −4%<\/td><\/tr>\n<\/tbody><\/table>\n<p>Последний пример показывает, что проценты нельзя «отменять» обратными: падение считается от нового, уже большего значения. Проверяйте себя в калькуляторе: <code>2400*15%<\/code>, <code>5000-30%<\/code>.<\/p>"],["Типичные ошибки ввода","<ul>\n<li><b>Деление и умножение подряд:<\/b> <code>1/2*3<\/code> равно 1,5, а не 1/6 — действия выполняются слева направо.<\/li>\n<li><b>Минус и степень:<\/b> <code>-3^2<\/code> даёт −9, а <code>(-3)^2<\/code> — 9.<\/li>\n<li><b>Проценты:<\/b> запись <code>200+10%<\/code> означает «200 плюс 10% от 200», то есть 220, а не 200,1.<\/li>\n<li><b>Неявное умножение:<\/b> <code>2(3+4)<\/code> равно 14, но <code>2 3<\/code> с пробелом лучше записывать как <code>2*3<\/code>.<\/li>\n<li><b>Запятая и точка:<\/b> калькулятор принимает обе, но в списках используйте точку с запятой или пробел.<\/li>\n<\/ul>\n<p>Если результат кажется странным, прикиньте порядок величины и вычислите выражение по частям.<\/p>"]],"engineering":[["Единицы углов: градусы, радианы, грады","<p>Угол можно измерять разными способами, и от выбранной единицы зависит результат тригонометрических функций. Переключатель «Углы» находится в шапке сайта и на клавише DEG/RAD/GRAD калькулятора.<\/p>\n<table class=\"lt\"><thead><tr><th>Единица<\/th><th>Полный оборот<\/th><th>Прямой угол<\/th><th>Где применяется<\/th><\/tr><\/thead><tbody>\n<tr><td>Градус (°)<\/td><td>360<\/td><td>90<\/td><td>геодезия, строительство, повседневность<\/td><\/tr>\n<tr><td>Радиан (rad)<\/td><td>2π ≈ 6,2832<\/td><td>π/2 ≈ 1,5708<\/td><td>математика, физика, программирование<\/td><\/tr>\n<tr><td>Град (gon)<\/td><td>400<\/td><td>100<\/td><td>топография и геодезия в ряде стран<\/td><\/tr>\n<\/tbody><\/table>\n<p>Перевод: <code>рад = градусы·π/180<\/code>, <code>градусы = рад·180/π<\/code>. Радиан — это угол, у которого длина дуги равна радиусу; именно поэтому в формулах анализа (например, производная sin x равна cos x) всегда подразумеваются радианы. В режиме DEG выражение <code>sin(30)<\/code> даст 0,5, в режиме RAD то же выражение даст −0,988.<\/p>\n<div class=\"tip\">Самая частая ошибка в инженерных расчётах — неверный режим углов. Если sin(90) выдаёт 0,894 вместо 1, калькулятор стоит в радианах.<\/div>"],["Инженерная запись и приставки СИ","<p>Научная запись представляет число как <code>m·10^n<\/code> с любым целым n. <b>Инженерная<\/b> запись требует, чтобы показатель был кратен трём — тогда он совпадает с приставкой СИ и числа легче читать и сравнивать. Под результатом калькулятор показывает научную запись, инженерную и значение с приставкой.<\/p>\n<table class=\"lt\"><thead><tr><th>Приставка<\/th><th>Обозначение<\/th><th>Множитель<\/th><\/tr><\/thead><tbody>\n<tr><td>тера<\/td><td>Т<\/td><td>10<sup>12<\/sup><\/td><\/tr>\n<tr><td>гига<\/td><td>Г<\/td><td>10<sup>9<\/sup><\/td><\/tr>\n<tr><td>мега<\/td><td>М<\/td><td>10<sup>6<\/sup><\/td><\/tr>\n<tr><td>кило<\/td><td>к<\/td><td>10<sup>3<\/sup><\/td><\/tr>\n<tr><td>милли<\/td><td>м<\/td><td>10<sup>−3<\/sup><\/td><\/tr>\n<tr><td>микро<\/td><td>мк<\/td><td>10<sup>−6<\/sup><\/td><\/tr>\n<tr><td>нано<\/td><td>н<\/td><td>10<sup>−9<\/sup><\/td><\/tr>\n<tr><td>пико<\/td><td>п<\/td><td>10<sup>−12<\/sup><\/td><\/tr>\n<\/tbody><\/table>\n<p>Пример: сопротивление 4,7 кОм = 4,7·10<sup>3<\/sup> Ом, ёмкость 100 нФ = 100·10<sup>−9<\/sup> Ф = 1·10<sup>−7<\/sup> Ф. Клавиша «Авто/Sci/Eng» переключает формат основного результата между обычным, научным и инженерным.<\/p>"],["Значащие цифры и погрешность","<p>Результат не может быть точнее исходных данных. Если длина измерена как 12,3 см (три значащие цифры), а ширина как 4,56 см, то площадь 56,088 см² следует округлять до трёх значащих цифр — 56,1 см². Базовые правила:<\/p>\n<ul>\n<li>При <b>умножении и делении<\/b> в ответе столько значащих цифр, сколько их в наименее точном множителе.<\/li>\n<li>При <b>сложении и вычитании<\/b> в ответе столько знаков после запятой, сколько их в наименее точном слагаемом.<\/li>\n<li>Промежуточные результаты держите с запасом в одну-две цифры и округляйте только итог.<\/li>\n<\/ul>\n<p><b>Относительная погрешность<\/b> δ = Δx / x. При умножении относительные погрешности складываются: если R измерено с точностью 1%, а I — 2%, то мощность P = I²R имеет погрешность порядка 2·2% + 1% = 5%. Число значащих цифр на экране выбирается в шапке сайта («Знаков»).<\/p>"],["Закон Ома, правила Кирхгофа и мощность","<p>Основа электротехники — три связанные величины: напряжение U (В), ток I (А) и сопротивление R (Ом).<\/p>\n<div class=\"fx\">U = I·R &nbsp; · &nbsp; P = U·I = I²·R = U²/R &nbsp; · &nbsp; Q = I²·R·t<\/div>\n<ul>\n<li><b>Первое правило Кирхгофа:<\/b> сумма токов, входящих в узел, равна сумме токов, выходящих из него.<\/li>\n<li><b>Второе правило Кирхгофа:<\/b> алгебраическая сумма напряжений в замкнутом контуре равна нулю.<\/li>\n<li><b>Последовательное соединение:<\/b> ток одинаков, сопротивления складываются, R = R₁ + R₂ + … Для конденсаторов — наоборот: 1/C = 1/C₁ + 1/C₂ + …<\/li>\n<li><b>Параллельное соединение:<\/b> напряжение одинаково, проводимости складываются, 1/R = 1/R₁ + 1/R₂ + … Для двух резисторов R = R₁R₂/(R₁+R₂); для конденсаторов C = C₁ + C₂.<\/li>\n<\/ul>\n<p><b>Делитель напряжения<\/b> из двух резисторов даёт U<sub>вых<\/sub> = U<sub>вх<\/sub>·R₂/(R₁+R₂). Но подключённая нагрузка включается параллельно R₂ и снижает выходное напряжение — вкладка «Электротехника» учитывает это, если указать сопротивление нагрузки.<\/p>"],["Переменный ток, реактивные сопротивления, резонанс","<p>Катушка и конденсатор оказывают переменному току реактивное сопротивление, зависящее от частоты f (ω = 2πf):<\/p>\n<div class=\"fx\">X<sub>L<\/sub> = ω·L &nbsp; · &nbsp; X<sub>C<\/sub> = 1 / (ω·C) &nbsp; · &nbsp; Z = √(R² + (X<sub>L<\/sub> − X<sub>C<\/sub>)²)<\/div>\n<p>В последовательном контуре RLC реактивности вычитаются, и на частоте <b>резонанса<\/b> f₀ = 1 / (2π√(LC)) они взаимно уничтожаются: полное сопротивление равно R, а ток максимален. <b>Добротность<\/b> контура Q = √(L/C) / R показывает, насколько резкий резонанс — чем выше Q, тем уже полоса пропускания (приблизительно Δf ≈ f₀/Q).<\/p>\n<p><b>Постоянная времени<\/b> RC-цепи τ = R·C — время, за которое конденсатор заряжается до 63,2% питающего напряжения; за 5τ заряд достигает 99,3%. Для RL-цепи τ = L/R. Эти величины определяют частоту среза фильтров: f<sub>c<\/sub> = 1/(2πRC).<\/p>\n<p><b>Мощность в цепях переменного тока:<\/b> активная P = U·I·cos φ (Вт), реактивная Q = U·I·sin φ (вар), полная S = U·I (В·А). Коэффициент мощности cos φ = P/S; чем он ближе к единице, тем эффективнее используется сеть.<\/p>"],["Децибелы: логарифмическая шкала отношений","<p>Децибел выражает отношение двух величин в логарифмическом масштабе — это удобно, когда числа различаются на много порядков (усиление, затухание, уровень сигнала и шума).<\/p>\n<div class=\"fx\">дБ = 10·lg(P₂/P₁) &nbsp; · &nbsp; дБ = 20·lg(U₂/U₁)<\/div>\n<p>Для мощности коэффициент 10, для напряжения и тока — 20, потому что мощность пропорциональна квадрату напряжения. Запомните несколько опорных значений:<\/p>\n<table class=\"lt\"><thead><tr><th>дБ<\/th><th>По мощности, раз<\/th><th>По напряжению, раз<\/th><\/tr><\/thead><tbody>\n<tr><td>+3<\/td><td>≈ 2<\/td><td>≈ 1,41<\/td><\/tr>\n<tr><td>+6<\/td><td>≈ 4<\/td><td>≈ 2<\/td><\/tr>\n<tr><td>+10<\/td><td>10<\/td><td>≈ 3,16<\/td><\/tr>\n<tr><td>+20<\/td><td>100<\/td><td>10<\/td><\/tr>\n<tr><td>−3<\/td><td>≈ 0,5<\/td><td>≈ 0,71<\/td><\/tr>\n<tr><td>−20<\/td><td>0,01<\/td><td>0,1<\/td><\/tr>\n<\/tbody><\/table>\n<p>Абсолютные уровни: <b>дБм<\/b> — относительно 1 мВт (0 дБм = 1 мВт, 30 дБм = 1 Вт), <b>дБВ<\/b> — относительно 1 В. Частота среза фильтра определяется по уровню −3 дБ, когда мощность падает вдвое.<\/p>"],["Трёхфазные цепи","<p>В промышленных сетях применяются три фазы, сдвинутые на 120°. В схеме «звезда» линейное напряжение больше фазного в √3 раз: при фазном 230 В линейное составляет примерно 400 В.<\/p>\n<div clas
