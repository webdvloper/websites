ый бит добавляет около 6 дБ, поэтому 16 бит дают ≈ 96 дБ, а 24 бита — ≈ 144 дБ. Если скачиваете файл, помните о различии мегабит и мегабайт: канал 100 Мбит/с передаёт не более 12,5 МБ/с.<\/p>"],["Сети: деление на подсети и IPv6","<p>Большую сеть можно разделить на несколько меньших, увеличив префикс. Сеть 192.168.1.0/24 (254 хоста) делится на четыре подсети /26 по 62 хоста: 192.168.1.0/26, 192.168.1.64/26, 192.168.1.128/26 и 192.168.1.192/26. Каждый заимствованный бит удваивает число подсетей и вдвое уменьшает размер каждой.<\/p>\n<table class=\"lt\"><thead><tr><th>Задача<\/th><th>Решение<\/th><\/tr><\/thead><tbody>\n<tr><td>Нужно 50 устройств<\/td><td>/26 (62 хоста) — запас достаточный; /27 (30) мало<\/td><\/tr>\n<tr><td>Нужно 2 адреса для линка<\/td><td>/30 (2 хоста) или /31 для точка-точка<\/td><\/tr>\n<tr><td>Нужно 500 устройств<\/td><td>/23 (510 хостов)<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>IPv6<\/b> использует 128-битные адреса, записываемые восемью группами по четыре HEX-цифры: 2001:0db8:0000:0000:0000:0000:0000:0001 сокращается до 2001:db8::1. Всего адресов 2¹²⁸ ≈ 3,4·10³⁸ — это примерно 4·10²⁸ на каждого жителя Земли, поэтому подсети в IPv6 стандартно имеют длину /64, а проблема нехватки адресов исчезает. Исчерпание 32-битных IPv4-адресов (всего около 4,3 млрд) и стало причиной появления IPv6 и трансляции адресов (NAT).<\/p>"],["Хэши, пароли и защита от ошибок","<p>Хэш-функции имеют лавинный эффект: SHA-256 от «abc» начинается с ba7816bf…, а от «abd» — с a52d159f…, хотя строки отличаются одним символом. Для хэша длиной n бит найти случайную коллизию можно примерно за 2<sup>n/2<\/sup> попыток (парадокс дней рождения): для 32 бит это всего 65 536, для 128 бит — 1,8·10¹⁹, для 256 бит — 3,4·10³⁸ (недостижимо).<\/p>\n<ul>\n<li><b>Кодирование не шифрование.<\/b> Base64 и URL-кодирование легко обращаются: строка «Man» превращается в TWFu, но защиты не даёт.<\/li>\n<li><b>Пароли:<\/b> стойкость измеряют энтропией в битах: 8 строчных букв — ≈ 37,6 бит; 8 символов из 94 печатных — ≈ 52,4; 12 символов из 94 — ≈ 78,7; четыре случайных слова из словаря в 2048 слов — 44 бита, но запоминаются легче. Длина важнее «хитрых» замен букв цифрами.<\/li>\n<li><b>Контрольные суммы:<\/b> CRC-32 строки «123456789» равна CBF43926 — стандартное тестовое значение; быстрый способ убедиться, что реализация верна.<\/li>\n<li><b>Алгоритм Луна<\/b> проверяет номера банковских карт: цифры через одну справа удваивают (если результат больше 9, вычитают 9), складывают, и сумма должна делиться на 10. Он ловит почти все одиночные опечатки и большинство перестановок соседних цифр.<\/li>\n<\/ul>\n<div class=\"tip\">Хэш файла помогает убедиться, что он не повреждён и совпадает с оригиналом, но для защиты от подделки хэш нужно получать из надёжного источника отдельно от самого файла.<\/div>"],["Сложность алгоритмов","<p>Сложность описывает, как растёт время работы с ростом размера данных n. Константы не важны — важна форма роста: O(1) — постоянное время, O(log n) — бинарный поиск, O(n) — один проход, O(n log n) — хорошая сортировка, O(n²) — вложенные циклы, O(2ⁿ) — полный перебор.<\/p>\n<table class=\"lt\"><thead><tr><th>n = 10⁶<\/th><th>Операций<\/th><th>При 10⁹ оп/с<\/th><\/tr><\/thead><tbody>\n<tr><td>log₂ n<\/td><td>≈ 20<\/td><td>мгновенно<\/td><\/tr>\n<tr><td>n<\/td><td>10⁶<\/td><td>1 мс<\/td><\/tr>\n<tr><td>n log n<\/td><td>≈ 2·10⁷<\/td><td>20 мс<\/td><\/tr>\n<tr><td>n²<\/td><td>10¹²<\/td><td>≈ 17 минут<\/td><\/tr>\n<\/tbody><\/table>\n<p>Именно поэтому для большого n выбирают алгоритм с лучшим ростом, даже если он сложнее. Лимит программируемого режима (3 млн операций) — практическое напоминание об этом.<\/p>"],["Контрольные цифры штрих-кодов","<p>Штрих-код EAN-13 защищён контрольной цифрой. Цифры без последней нумеруют слева направо: нечётные позиции берут с весом 1, чётные — с весом 3. Контрольная цифра дополняет сумму до кратной 10: (10 − S mod 10) mod 10.<\/p>\n<p>Пример: для 400638133393 сумма равна 89, остаток 9, контрольная цифра 1 — получается 4006381333931. Для ISBN-13 книги 978030640615 контрольная цифра равна 7. Такая схема обнаруживает любую одиночную ошибку и большинство перестановок соседних цифр, кроме тех, где разность цифр равна 5. Проверить арифметику удобно в программируемом режиме через <code>mod<\/code>.<\/p>"]]};
const nav=$('#nav'),main=$('#main');
MODES.forEach((m,i)=>{
  const b=h('button','mode');b.type='button';b.style.setProperty('--c',m.color);b.dataset.id=m.id;b.title=m.desc+'  (Alt+'+((i+1)%10)+')';
  b.innerHTML=`<span class="ic">${m.icon}</span><span class="nm">${m.name}</span><kbd>${(i+1)%10}</kbd>`;
  b.onclick=()=>go(m.id);nav.append(b);
  const p=h('section','panel');p.id='p-'+m.id;p.setAttribute('aria-label',m.title);main.append(p);
});
function go(id,quiet){
  const m=MODES.find(x=>x.id===id)||MODES[0],p=$('#p-'+m.id);
  $$('.panel').forEach(x=>x.classList.toggle('on',x===p));
  $$('.mode',nav).forEach(b=>{const on=b.dataset.id===m.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  document.body.dataset.mode=m.id;store.set('mode',m.id);
  if(!p.dataset.built){
    p.dataset.built=1;
    p.innerHTML=`<div class="phead"><span class="pic" aria-hidden="true">${m.icon}</span><div><h2>${m.title}</h2><p>${m.desc}</p></div></div>`;
    const body=h('div','pbody');p.append(body);
    try{m.build(body)}catch(e){body.innerHTML='<div class="err">Ошибка построения режима: '+esc(e.message)+'</div>';console.error(e)}
    learn(p,m.learn,LEARN[m.id]);
  }
  if(!quiet){try{history.replaceState(null,'','#'+m.id)}catch(e){}}
  const act=$$('.nav .mode.on',document)[0]||$('.mode.on',nav);if(act&&act.scrollIntoView&&nav.scrollWidth>nav.clientWidth)act.scrollIntoView({inline:'center',block:'nearest'});
  requestAnimationFrame(()=>{CANV.forEach(c=>c._draw&&c._draw());if(!matchMedia('(pointer:coarse)').matches){const i=$('.expr',p);if(i&&i.offsetParent)i.focus({preventScroll:true})}});
}
function setTheme(t){
  document.documentElement.dataset.theme=t;store.set('theme',t);
  const mt=$('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#07081a':'#f2f4fc';
  CANV.forEach(c=>c._draw&&c._draw());
}
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme||'dark');
$('#angle').value=S.angle;$('#angle').onchange=e=>setAngle(e.target.value);
$('#digits').value=String(S.digits);$('#digits').onchange=e=>{S.digits=+e.target.value;store.set('digits',S.digits);window.dispatchEvent(new Event('settings'))};
document.addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^Digit[0-9]$/.test(e.code)){const n=+e.code.slice(5);go(MODES[(n+9)%10].id);e.preventDefault()}
});
$('#year').textContent=new Date().getFullYear();
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(MODES.some(m=>m.id===id))go(id,true)});
const first=MODES.some(m=>m.id===location.hash.slice(1))?location.hash.slice(1):store.get('mode','simple');
go(first,true);
})();
</script>
</body>
</html>
