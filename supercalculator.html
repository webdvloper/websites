s=\"fx\">S = √3·U<sub>лин<\/sub>·I &nbsp; · &nbsp; P = √3·U<sub>лин<\/sub>·I·cos φ &nbsp; · &nbsp; Q = √3·U<sub>лин<\/sub>·I·sin φ<\/div>\n<p><b>Пример:<\/b> двигатель потребляет 16 А от сети 400 В при cos φ = 0,85. Полная мощность S = 1,732·400·16 ≈ 11,1 кВ·А, активная P ≈ 9,4 кВт. Для подбора автомата защиты и сечения кабеля нужен именно ток, а оплачивается активная энергия; низкий cos φ увеличивает ток и потери, поэтому предприятия применяют компенсацию реактивной мощности.<\/p>"],["Сопротивление материалов: сечения и напряжения","<p>Прочность балки определяется геометрией сечения. Для прямоугольника b × h:<\/p>\n<div class=\"fx\">A = b·h &nbsp; · &nbsp; I<sub>x<\/sub> = b·h³/12 &nbsp; · &nbsp; W<sub>x<\/sub> = b·h²/6 &nbsp; · &nbsp; σ = M / W<sub>x<\/sub><\/div>\n<p>Момент сопротивления W определяет изгибное напряжение σ при моменте M. Поскольку высота входит в W в квадрате, <b>балка, поставленная на ребро, жёстче и прочнее<\/b>: доска 50×200 мм на ребре выдерживает вдоль большей стороны в 4 раза больший момент, чем «плашмя». Для круга: I = πd⁴/64, для трубы — разность моментов инерции наружного и внутреннего кругов. Единицы: если M в Н·м, а W в мм³, умножайте M на 1000, чтобы получить напряжение в МПа (Н/мм²).<\/p>\n<p>Допускаемое напряжение обычно берут как предел текучести материала, делённый на коэффициент запаса (1,5–3 в зависимости от ответственности). Для стали Ст3 предел текучести порядка 240 МПа, для алюминиевых сплавов — 100–300 МПа. Расчёт калькулятора — учебный: для реальных конструкций применяют нормативные методики и проверку специалистом.<\/p>"],["Передаточное число, допуски и посадки","<p>Передаточное число зубчатой передачи u = z₂/z₁, где z — числа зубьев ведомого и ведущего колёс. Частота вращения ведомого вала n₂ = n₁/u, а крутящий момент (без потерь) возрастает в u раз: редуктор уменьшает скорость и увеличивает момент. КПД одной зубчатой ступени — около 0,96–0,98, поэтому в многоступенчатых редукторах потери нужно умножать.<\/p>\n<p>Допуск — разность между наибольшим и наименьшим допустимыми размерами. Если номинал 25 мм, верхнее отклонение +21 мкм, нижнее 0, то детали годны в диапазоне 25,000–25,021 мм, допуск 21 мкм. Посадка с зазором обеспечивает свободное вращение, с натягом — неподвижное соединение, переходная — зависит от фактических размеров. Чем точнее квалитет (IT6, IT7…), тем дороже обработка.<\/p>"],["Размерности как способ проверки формул","<p>Каждая физическая формула должна быть однородной по размерностям. Прежде чем доверять результату, проверьте единицы:<\/p>\n<ul>\n<li>Мощность P = U·I: [В·А] = [Вт] — верно. А «P = U/I» дало бы Ом, значит, формула неверна.<\/li>\n<li>Энергия E = P·t: [Вт·с] = [Дж]; для счётчиков используют кВт·ч (1 кВт·ч = 3,6 МДж).<\/li>\n<li>Постоянная времени τ = R·C: [Ом·Ф] = [с].<\/li>\n<\/ul>\n<p>Типичные ошибки: путаница мм и м (в квадрате и кубе ошибка становится в миллион и миллиард раз), мкФ и нФ, градусов и радианов, линейной и угловой частоты (f и ω = 2πf), мощности в ваттах и в лошадиных силах (1 метрическая л. с. ≈ 735,5 Вт). Конвертер единиц на соседней вкладке снимает часть этих проблем.<\/p>"],["Логарифмы и показательные функции","<p>Логарифм — это показатель степени: если <code>b^x = y<\/code>, то <code>x = log_b(y)<\/code>. В калькуляторе три основные функции: <code>ln<\/code> (натуральный, основание e ≈ 2,71828), <code>log<\/code>/<code>lg<\/code> (десятичный) и <code>log2<\/code> (двоичный); для любого основания есть <code>logb(x, основание)<\/code>.<\/p>\n<div class=\"fx\">log_b(x) = ln x / ln b &nbsp; · &nbsp; log(xy) = log x + log y &nbsp; · &nbsp; log(xⁿ) = n·log x<\/div>\n<ul>\n<li><b>Сколько цифр в числе:<\/b> <code>floor(log(N)) + 1<\/code>. Для 2¹⁰⁰ это <code>floor(100·log(2)) + 1 = 31<\/code>.<\/li>\n<li><b>pH раствора:<\/b> pH = −lg[H⁺]; при концентрации 10⁻⁷ моль/л pH = 7.<\/li>\n<li><b>Время удвоения:<\/b> t = ln 2 / ln(1 + r); для r = 7% это 10,24 года.<\/li>\n<li><b>Магнитуда землетрясения и громкость<\/b> — логарифмические шкалы: рост на единицу означает рост амплитуды в 10 раз (магнитуда) или мощности в 10 раз (бел).<\/li>\n<li><b>Количество бит:<\/b> чтобы закодировать N вариантов, нужно <code>ceil(log2(N))<\/code> бит.<\/li>\n<\/ul>\n<p>Показательная функция <code>exp(x) = e^x<\/code> описывает рост и спад: зарядка и разрядка конденсатора, охлаждение чайника, радиоактивный распад. Если величина убывает как <code>e^(−t/τ)<\/code>, то за время τ она уменьшается в e ≈ 2,718 раза (до 36,8%).<\/p>"],["Тригонометрия: основные соотношения","<p>В прямоугольном треугольнике: синус — отношение противолежащего катета к гипотенузе, косинус — прилежащего катета к гипотенузе, тангенс — противолежащего к прилежащему. Значения для основных углов стоит помнить наизусть:<\/p>\n<table class=\"lt\"><thead><tr><th>Угол<\/th><th>sin<\/th><th>cos<\/th><th>tan<\/th><\/tr><\/thead><tbody>\n<tr><td>0°<\/td><td>0<\/td><td>1<\/td><td>0<\/td><\/tr>\n<tr><td>30°<\/td><td>0,5<\/td><td>√3/2 ≈ 0,866<\/td><td>1/√3 ≈ 0,577<\/td><\/tr>\n<tr><td>45°<\/td><td>√2/2 ≈ 0,707<\/td><td>√2/2 ≈ 0,707<\/td><td>1<\/td><\/tr>\n<tr><td>60°<\/td><td>√3/2 ≈ 0,866<\/td><td>0,5<\/td><td>√3 ≈ 1,732<\/td><\/tr>\n<tr><td>90°<\/td><td>1<\/td><td>0<\/td><td>не определён<\/td><\/tr>\n<\/tbody><\/table>\n<div class=\"fx\">sin²x + cos²x = 1 &nbsp; · &nbsp; tan x = sin x / cos x &nbsp; · &nbsp; sin 2x = 2 sin x cos x<\/div>\n<p>Для произвольного треугольника: <b>теорема синусов<\/b> a/sin A = b/sin B = c/sin C = 2R; <b>теорема косинусов<\/b> c² = a² + b² − 2ab·cos C. Для угла 90° последняя превращается в теорему Пифагора. Функция <code>tan(90)<\/code> в режиме градусов выдаёт «Ошибка» — тангенс там не определён.<\/p>"],["Гиперболические функции","<p>Гиперболические функции определяются через экспоненту: <code>sinh x = (eˣ − e⁻ˣ)/2<\/code>, <code>cosh x = (eˣ + e⁻ˣ)/2<\/code>, <code>tanh x = sinh x / cosh x<\/code>. Они удовлетворяют тождеству cosh²x − sinh²x = 1 (отсюда название — точки (cosh t, sinh t) лежат на гиперболе).<\/p>\n\n<p>Для малых x справедливо sinh x ≈ x и tanh x ≈ x, а для больших x функция tanh x → 1, cosh x ≈ sinh x ≈ eˣ/2.<\/p>"],["Решение треугольников и уклоны","<p>Типичная инженерная задача — найти высоту, длину или угол по двум известным величинам. Если известны катеты a и b, то гипотенуза равна <code>hypot(a,b)<\/code>, а угол — <code>atan(a/b)<\/code> (в режиме DEG результат сразу в градусах).<\/p>\n\n<p>Уклон выражают в процентах (<code>tan α·100%<\/code>), промилле и градусах: 100% — это 45°, а 10% — 5,71°. Для малых уклонов (до 10%) проценты и градусы связаны приблизительно: 1° ≈ 1,75%.<\/p>"],["Ряды номиналов E12 и E24","<p>Резисторы и конденсаторы выпускают не с произвольными, а со стандартными номиналами. Ряд E12 имеет 12 значений на декаду с допуском 10%: 1,0; 1,2; 1,5; 1,8; 2,2; 2,7; 3,3; 3,9; 4,7; 5,6; 6,8; 8,2. Ряд E24 (допуск 5%) содержит по 24 значения, E96 (1%) — 96. Номиналы подобраны так, чтобы соседние значения отличались на постоянный множитель ≈ 10^(1/N): для E12 это 1,212, для E24 — 1,101.<\/p>\n<p>Как подобрать резистор: получив расчётное значение, найдите ближайший стандартный. Например, для светодиода при питании 12 В, токе 15 мА и падении 2 В нужен R = (12 − 2)/0,015 = 667 Ом. Ближайшие значения E12: 680 Ом (ток 14,7 мА) или 560 Ом (17,9 мА). Берите большее при сомнениях — яркость снизится незначительно, а срок службы вырастет. Мощность резистора: P = I²R = 0,0147² · 680 ≈ 0,15 Вт, поэтому достаточно 0,25 Вт.<\/p>\n<p>Нужное значение можно получить комбинацией. Два одинаковых резистора параллельно дают половину номинала, последовательно — удвоенный. Вкладка «Электротехника» считает такие соединения.<\/p>"],["Тепловые расчёты и теплоотвод","<p>Электрические потери превращаются в тепло: P = I²R. Чтобы деталь не перегрелась, тепло нужно отвести. Для оценки используют <b>тепловое сопротивление<\/b> R<sub>θ<\/sub> (К/Вт): повышение температуры ΔT = P·R<sub>θ<\/sub>.<\/p>\n<div class=\"fx\">T<sub>кристалла<\/sub> = T<sub>среды<\/sub> + P · (R<sub>θ,кор<\/sub> + R<sub>θ,радиатор<\/sub>)<\/div>\n<p><b>Пример.<\/b> Стабилизатор рассеивает 3 Вт, тепловое сопротивление корпус — радиатор 1,5 К/Вт, радиатор — среда 8 К/Вт, температура в корпусе устройства 40 °C. Нагрев составит 3·(1,5 + 8) = 28,5 К, то есть около 68,5 °C — безопасно для кремния (предел 125–150 °C).<\/p>\n<ul>\n<li><b>КПД<\/b> η = P<sub>полезная<\/sub> / P<sub>потреб<\/sub>. Потери P<sub>пот<\/sub> = P<sub>потреб<\/sub>·(1 − η). Линейный стабилизатор с 12 до 5 В имеет КПД всего 42%.<\/li>\n<li><b>Нагрев проводника:<\/b> Q = c·m·ΔT; для нагрева 1 кг меди (c = 385 Дж/(кг·К)) на 50 К нужно 19,3 кДж.<\/li>\n<li><b>Теплопроводность:<\/b> Q/t = λ·S·ΔT/d; у меди λ ≈ 400 Вт/(м·К), у алюминия ≈ 235, у воздуха ≈ 0,026.<\/li>\n<\/ul>"],["Жидкости и газы: расход, давление, число Рейнольдса","<p>Для инженера-гидравлика важны три характеристики потока. <b>Расход<\/b> Q = v·S (м³/с): при диаметре трубы 50 мм (S = 0,00196 м²) и скорости 2 м/с он составляет 3,93 л/с (14,1 м³/ч). Скорость воды в трубопроводах обычно выбирают 0,5–3 м/с.<\/p>\n<p><b>Уравнение Бернулли<\/b> для идеальной жидкости: p + ρv²/2 + ρgh = const. Оно показывает, что при сужении трубы скорость растёт, а давление падает (принцип работы пульверизатора и трубки Вентури). <b>Давление столба жидкости<\/b>: p = ρgh; каждые 10,3 м воды создают около 1 атм (≈ 101 кПа).<\/p>\n<p><b>Число Рейнольдса<\/b> Re = ρvd/μ определяет режим течения: при Re &lt; 2300 — ламинарный, при Re &gt; 4000 — турбулентный. Для воды (ρ = 1000 кг/м³, μ ≈ 10⁻³ Па·с) в трубе 50 мм при 2 м/с Re = 10⁵ — течение турбулентное. Потери давления в трубе пропорциональны квадрату скорости: Δp = λ·(L/d)·ρv²/2.<\/p>\n<p>Для газов важен закон идеального газа pV = nRT; в расчётах пневматики давление всегда учитывается абсолютное (избыточное + 101,3 кПа). Подробный решатель находится в режиме «Физический».<\/p>"],["Растяжение, сжатие и запас прочности","<p>Нормальное напряжение при растяжении σ = F/A (Па, МПа = Н/мм²). Закон Гука для упругой деформации: σ = E·ε, где ε = ΔL/L — относительное удлинение, E — модуль Юнга.<\/p>\n<table class=\"lt\"><thead><tr><th>Материал<\/th><th>E, ГПа<\/th><th>Предел текучести, МПа<\/th><th>Плотность, кг/м³<\/th><\/tr><\/thead><tbody>\n<tr><td>Сталь Ст3<\/td><td>≈ 200<\/td><td>≈ 240<\/td><td>7850<\/td><\/tr>\n<tr><td>Алюминий (Д16Т)<\/td><td>≈ 70<\/td><td>≈ 330<\/td><td>2780<\/td><\/tr>\n<tr><td>Медь<\/td><td>≈ 120<\/td><td>≈ 70<\/td><td>8960<\/td><\/tr>\n<tr><td>Титан ВТ6<\/td><td>≈ 110<\/td><td>≈ 900<\/td><td>4430<\/td><\/tr>\n<tr><td>Дерево (сосна вдоль волокон)<\/td><td>≈ 10<\/td><td>≈ 40 (прочность на сжатие вдоль волокон)<\/td><td>≈ 500<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Пример.<\/b> Стальной стержень диаметром 10 мм (A = 78,5 мм²) нагружен силой 12 кН: σ = 12000/78,5 ≈ 153 МПа. Запас прочности по текучести n = 240/153 ≈ 1,57. Удлинение стержня длиной 1 м: ΔL = σL/E = 153·1000/200000 ≈ 0,77 мм. Допускаемые значения запаса — от 1,3–1,5 для хорошо изученных нагрузок до 3 и выше для ответственных узлов. Данные в таблице — ориентировочные: для расчётов используйте справочники и сертификаты на материал.<\/p>"],["Аккумуляторы, энергия и время работы","<p>Ёмкость аккумулятора указывают в ампер-часах (А·ч) или ватт-часах (Вт·ч); связь: <code>Вт·ч = А·ч × В<\/code>. Ёмкость 3000 мА·ч при 3,7 В — это 11,1 Вт·ч. Время работы: <code>t = энергия / мощность<\/code>; смартфон с батареей 15 Вт·ч при средней нагрузке 1,5 Вт проработает около 10 часов. КПД преобразователей, старение и холод уменьшают реальную ёмкость на 10–30%.<\/p>\n\n<p><b>Пример.<\/b> Питание лампы 12 В / 24 Вт (ток 2 А) от аккумулятора 7 А·ч: время работы ≈ 7/2 = 3,5 ч в идеале, с запасом на 50% глубины разряда и потери — около 1,5–2 ч.<\/p>"],["Цифровые измерения: АЦП и теорема Котельникова","<p>Аналого-цифровой преобразователь (АЦП) превращает напряжение в число. При разрядности n бит шкала делится на 2ⁿ ступеней, а шаг квантования равен <code>Uпред / 2ⁿ<\/code>. У 10-битного АЦП с опорой 5 В шаг = 5/1024 ≈ 4,88 мВ; у 12-битного — 1,22 мВ; у 16-битного — 76 мкВ. Динамический диапазон идеального n-битного АЦП ≈ 6,02·n + 1,76 дБ: для 16 бит это 98 дБ.<\/p>\n<p><b>Теорема Котельникова (Найквиста — Шеннона):<\/b> чтобы сигнал можно было восстановить без искажений, частота дискретизации должна быть минимум вдвое выше его наивысшей частоты: f<sub>д<\/sub> &gt; 2·f<sub>max<\/sub>. Звуковой диапазон 20 кГц требует более 40 кГц — отсюда стандартные 44,1 и 48 кГц. Если выбрать меньшую частоту, возникнет «алиасинг» — ложные низкие частоты. Перед АЦП ставят аналоговый фильтр низких частот.<\/p>\n<ul>\n<li><b>Пример:<\/b> датчик с частотой до 500 Гц измеряют с частотой 2 кГц — запас 2 раза над минимумом, это разумно.<\/li>\n<li><b>Объём данных:<\/b> 12 бит × 1000 отсчётов/с × 4 канала = 48 кбит/с = 6 КБ/с — около 21,6 МБ в час.<\/li>\n<\/ul>"]],"accounting":[["Как работает лента, как у счётной машины","<p>Бухгалтерский калькулятор копирует поведение настольных машин с печатающим механизмом. Вы вводите число и нажимаете операцию — оно сразу «печатается» на ленте, а накопитель (крупное число сверху) обновляется. Так видна вся цепочка вычислений, её можно сверить с первичными документами и при необходимости скопировать.<\/p>\n<ul>\n<li><b>«+» и «−»<\/b> добавляют или вычитают введённое число из накопителя.<\/li>\n<li><b>«×» и «÷»<\/b> применяются ко всему накопленному итогу, а не к последнему слагаемому — как на машинах.<\/li>\n<li><b>«=» (ИТОГО)<\/b> печатает итоговую строку, не обнуляя накопитель.<\/li>\n<li><b>«↶ Отмена»<\/b> возвращает состояние до последней операции; <b>«🗑 Сброс»<\/b> обнуляет всё (его тоже можно отменить).<\/li>\n<li><b>Enter<\/b> в поле ввода — «+», а на пустом поле — печать итога.<\/li>\n<\/ul>\n<div class=\"tip\">Привычка опытных бухгалтеров — считать любую колонку дважды: сначала сверху вниз, затем снизу вверх. Лента позволяет проверить сумму глазами и убедиться, что ни одно число не пропущено и не продублировано.<\/div>"],["Округление до копеек и накопление ошибок","<p>В учёте итог должен быть кратен копейке, поэтому калькулятор округляет каждое промежуточное действие до сотых (отключить можно переключателем «Округлять до копеек»). Применяется <b>арифметическое округление<\/b> — «половина вверх»: 0,005 → 0,01; 0,004 → 0,00.<\/p>\n<p>Сложность в том, что округление каждой строки и округление итога могут давать разные результаты. Пример: три позиции по 33,333 ₽ при суммировании без округления дают 99,999, то есть 100,00 ₽, а при округлении каждой позиции — три раза по 33,33, то есть 99,99 ₽. Правило практики: <b>округляйте на том шаге, на котором округляет первичный документ<\/b> (счёт-фактура, накладная), и считайте итог от округлённых строк, если документ устроен так же.<\/p>\n<p>Для налоговых сумм действует общее правило: суммы исчисляются в рублях и копейках; для налогов, платимых в бюджет, отдельные нормы могут предусматривать округление до полного рубля. Всегда сверяйтесь с актуальной редакцией налогового законодательства.<\/p>"],["НДС: формулы и ставки","<p>Налог на добавленную стоимость начисляется на стоимость товара без налога. Две базовые операции:<\/p>\n<div class=\"fx\">НДС сверху: НДС = сумма × ставка / 100; итого = сумма + НДС<br>НДС из суммы: НДС = сумма × ставка / (100 + ставка); без НДС = сумма − НДС<\/div>\n<table class=\"lt\"><thead><tr><th>Ставка<\/th><th>Доля НДС в цене с налогом<\/th><th>Расчётная ставка<\/th><\/tr><\/thead><tbody>\n<tr><td>22%<\/td><td>22/122 ≈ 18,03%<\/td><td>22/122<\/td><\/tr>\n<tr><td>20%<\/td><td>20/120 ≈ 16,67%<\/td><td>20/120<\/td><\/tr>\n<tr><td>10%<\/td><td>10/110 ≈ 9,09%<\/td><td>10/110<\/td><\/tr>\n<tr><td>5%, 7%<\/td><td>5/105 ≈ 4,76%; 7/107 ≈ 6,54%<\/td><td>для упрощённой системы<\/td><\/tr>\n<tr><td>0%<\/td><td>0<\/td><td>экспорт и ряд операций<\/td><\/tr>\n<\/tbody><\/table>\n<p>С 1 января 2026 года основная ставка НДС в России составляет 22% (до этого — 20%). Ставка 10% применяется к отдельным категориям товаров (продовольствие, детские товары, лекарства, периодические издания и др.), ставка 0% — к экспорту и некоторым другим операциям. Для организаций и предпринимателей на упрощённой системе введены пониженные ставки 5% и 7% при определённом уровне дохода; пороги и условия меняются, поэтому уточняйте их в Налоговом кодексе и у специалиста.<\/p>\n<p><b>Пример.<\/b> Поставщик выставил счёт на 122 000 ₽ «в том числе НДС 22%». НДС = 122 000 × 22/122 = 22 000 ₽, сумма без НДС 100 000 ₽. А если цена без налога 100 000 ₽, то с налогом: 100 000 + 22 000 = 122 000 ₽. Распространённая ошибка — считать НДС из суммы по формуле «сумма × 22%», что даёт 26 840 ₽ вместо 22 000 ₽.<\/p>"],["НДФЛ с прогрессивной шкалой","<p>С 2025 года для налоговых резидентов РФ ставки налога на доходы физических лиц зависят от годового совокупного дохода. Ставка применяется только к той части дохода, которая попадает в соответствующую ступень:<\/p>\n<table class=\"lt\"><thead><tr><th>Годовой доход, ₽<\/th><th>Ставка<\/th><\/tr><\/thead><tbody>\n<tr><td>до 2 400 000<\/td><td>13%<\/td><\/tr>\n<tr><td>от 2 400 000 до 5 000 000<\/td><td>15%<\/td><\/tr>\n<tr><td>от 5 000 000 до 20 000 000<\/td><td>18%<\/td><\/tr>\n<tr><td>от 20 000 000 до 50 000 000<\/td><td>20%<\/td><\/tr>\n<tr><td>свыше 50 000 000<\/td><td>22%<\/td><\/tr>\n<\/tbody><\/table>\n<p><b>Пример для дохода 3 600 000 ₽:<\/b> 2 400 000 × 13% = 312 000 ₽; оставшиеся 1 200 000 × 15% = 180 000 ₽; итого налог 492 000 ₽ (эффективная ставка 13,67%). Повышенная ставка не «перескакивает» на весь доход, поэтому переход в следующую ступень никогда не уменьшает сумму «на руки».<\/p>\n<p>Вкладка «Зарплата» считает упрощённо: 13% с месячного оклада без вычетов и прогрессии — для быстрой оценки соотношения «до вычета» и «на руки». Для точного расчёта учитывайте вычеты, нарастающий итог по году, льготы и особенности налогообложения отдельных видов доходов.<\/p>"],["Сумма прописью: правила русского языка","<p>В платёжных документах сумму указывают словами, и здесь важны грамматические правила, которые реализует калькулятор:<\/p>\n<ul>\n<li><b>Род числительных:<\/b> «один рубль», но «одна тысяча», «одна копейка»; «два рубля», но «две тысячи», «две копейки».<\/li>\n<li><b>Согласование существительных:<\/b> 1 → «рубль», 2–4 → «рубля», 5–20 → «рублей»; для чисел, оканчивающихся на 11–14, всегда «рублей» («одиннадцать рублей», «сто двенадцать рублей»).<\/li>\n<li><b>Разряды:<\/b> тысяча (ж.), миллион, миллиард, триллион (м.) — склоняются по тем же правилам: «две тысячи», «пять миллионов».<\/li>\n<li><b>Копейки<\/b> обычно записывают цифрами и словом: «15 копеек».<\/li>\n<li>Первая буква суммы прописью — заглавная.<\/li>\n<\/ul>\n<p>Пример: 1 234 567,89 ₽ — «Один миллион двести тридцать четыре тысячи пятьсот шестьдесят семь рублей 89 копеек». Нажмите на результат, чтобы скопировать его в договор или счёт.<\/p>"],["Амортизация основных средств","<p>Амортизация — постепенный перенос стоимости основного средства на расходы за срок его полезного использования. Калькулятор поддерживает три метода:<\/p>\n<ul>\n<li><b>Линейный:<\/b> A = (С − Л) / n в год, где С — первоначальная стоимость, Л — ликвидационная, n — срок в годах. Ежегодные суммы равны.<\/li>\n<li><b>Уменьшаемого остатка:<\/b> A<sub>t<\/sub> = Остаточная стоимость × (k / n). Коэффициент ускорения k (чаще всего 2) смещает расходы на первые годы; в последний год остаток списывается до ликвидационной стоимости.<\/li>\n<li><b>По сумме чисел лет:<\/b> A<sub>t<\/sub> = (С − Л) × (n − t + 1) / (n(n+1)/2). Знаменатель — сумма чисел от 1 до n, поэтому списание убывает линейно.<\/li>\n<\/ul>\n<p><b>Пример.<\/b> Оборудование за 1 200 000 ₽, срок 5 лет, без ликвидационной стоимости. Линейно: 240 000 ₽ в год, 20 000 ₽ в месяц. Метод уменьшаемого остатка при k = 2: первый год 480 000 ₽, второй 288 000 ₽, третий 172 800 ₽ и так далее. Выбор метода закрепляется в учётной политике организации, а для налогового учёта действуют собственные группы и нормы.<\/p>"],["Проценты в бухгалтерии: наценка и маржа","<p>Две величины часто путают, хотя считаются от разных баз:<\/p>\n<div class=\"fx\">наценка = (цена − себестоимость) / себестоимость<br>маржа = (цена − себестоимость) / цена<\/div>\n<p>Наценка 25% означает маржу 20%: товар за 80 ₽ продаётся за 100 ₽, прибыль 20 ₽ составляет 25% от себестоимости, но 20% от цены. Наценка 100% — это маржа 50%. Маржа всегда меньше наценки и никогда не превышает 100%. Формула перевода: маржа = наценка / (100% + наценка).<\/p>\n<p>Аналогично различаются скидка и наценка: если цену повысили на 25%, то чтобы вернуть её назад, нужна скидка не 25%, а 20%. Это тот же эффект, что и в «Простом» режиме: проценты нельзя складывать и вычитать зеркально.<\/p>"],["Контрольные приёмы и типичные ошибки","<ul>\n<li><b>Проверка на 9:<\/b> если разность между итогом, посчитанным двумя способами, делится на 9, вероятна ошибка перестановки соседних цифр (например, 5 419 вместо 5 491).<\/li>\n<li><b>Перенос сумм:<\/b> при переносе итога со страницы на страницу переписывайте его с ленты, а не набирайте по памяти.<\/li>\n<li><b>Знак вычитания:<\/b> «−» печатается на ленте со знаком минус, а ячейка накопителя может быть отрицательной — это нормально, например, при превышении расходов над доходами.<\/li>\n<li><b>Валюта и единицы:<\/b> не смешивайте рубли, тысячи рублей и миллионы в одной колонке.<\/li>\n<li><b>Отмена:<\/b> любое число последних действий можно откатить кнопкой «↶ Отмена».<\/li>\n<\/ul>\n<p>Расчёты на странице носят справочный характер и не заменяют консультацию профессионального бухгалтера или налогового консультанта. Нормы налогового права изменяются, особенно в части ставок и порогов, — проверяйте актуальную редакцию.<\/p>"],["Двойная запись и проводки","<p>Основа бухгалтерского учёта — <b>двойная запись<\/b>: каждая хозяйственная операция отражается дважды, по дебету одного счёта и по кредиту другого, на одну и ту же сумму. Поэтому сумма всех дебетовых оборотов за период всегда равна сумме всех кредитовых. Если в оборотной ведомости эти итоги расходятся, значит, где-то допущена ошибка — это самый простой и надёжный способ контроля.<\/p>\n<table class=\"lt\"><thead><tr><th>Операция<\/th><th>Дебет<\/th><th>Кредит<\/th><th>Сумма, ₽<\/th><\/tr><\/thead><tbody>\n<tr><td>Получены деньги от покупателя на расчётный счёт<\/td><td>51<\/td><td>62<\/td><td>120 000<\/td><\/tr>\n<tr><td>Оплачен счёт поставщика<\/td><td>60<\/td><td>51<\/td><td>60 000<\/td><\/tr>\n<tr><td>Начислена зарплата<\/td><td>20<\/td><td>70<\/td><td>100 000<\/td><\/tr>\n<tr><td>Удержан НДФЛ 13%<\/td><td>70<\/td><td>68<\/td><td>13 000<\/td><\/tr>\n<\/tbody><\/table>\n<p>Активные счета (деньги, материалы, дебиторы) увеличиваются по дебету, пассивные (кредиторы, капитал) — по кредиту. Калькулятор ленты помогает сверять итоги: сложите все дебетовые суммы, затем все кредитовые и сравните результаты.<\/p>\n<div class=\"tip\">Простое правило проверки: если разность дебетовых и кредитовых итогов делится на 9, часто причина — перестановка соседних цифр (например, 1 230 вместо 1 320 даёт разность 90).<\/div>"],["Бухгалтерский баланс","<p>Баланс — это моментальный снимок имущества и источников его финансирования на определённую дату. Его главное равенство: <b>Активы = Капитал + Обязательства<\/b>. Слева перечисляют, чем располагает организация (основные средства, запасы, дебиторская задолженность, деньги), справа — за счёт чего это получено (уставный капитал, нераспределённая прибыль, кредиты, кредиторская задолженность).<\/p>\n<ul>\n<li><b>Внеоборотные активы:<\/b> основные средства, нематериальные активы, долгосрочные вложения — используются дольше 12 месяцев.<\/li>\n<li><b>Оборотные активы:<\/b> запасы, дебиторка, деньги — превращаются в деньги в течение года.<\/li>\n<li><b>Краткосрочные обязательства:<\/b> долги сроком до года — поставщикам, персоналу, бюджету.<\/li>\n<\/ul>\n<p>Пример: активы 5 000 000 ₽, обязательства 3 200 000 ₽, значит собственный капитал равен 5 000 000 − 3 200 000 = 1 800 000 ₽. Если вычисленный капитал отрицателен, организация формально неплатёжеспособна: долги превышают имущество.<\/p>"],["Страховые взносы и расходы работодателя","<p>Кроме НДФЛ, удерживаемого из зарплаты сотрудника, работодатель платит <b>страховые взносы<\/b> сверх неё. Сотрудник получает «на руки» оклад за вычетом налога, а полная стоимость работника для компании выше оклада. Общий тариф взносов в России в 2025 г. — 30% с части годовой выплаты до предельной базы и 15,1% свыше неё (точные параметры проверяйте в актуальных документах ФНС). К этому добавляются взносы «на травматизм» (от 0,2%).<\/p>\n<table class=\"lt\"><thead><tr><th>Показатель<\/th><th>Формула<\/th><th>Пример для оклада 100 000 ₽<\/th><\/tr><\/thead><tbody>\n<tr><td>НДФЛ 13%<\/td><td>оклад × 0,13<\/td><td>13 000 ₽<\/td><\/tr>\n<tr><td>На руки<\/td><td>оклад − НДФЛ<\/td><td>87 000 ₽<\/td><\/tr>\n<tr><td>Взносы 30%<\/td><td>оклад × 0,30<\/td><td>30 000 ₽<\/td><\/tr>\n<tr><td>Стоимость сотрудника<\/td><td>оклад + взносы<\/td><td>130 000 ₽<\/td><\/tr>\n<\/tbody><\/table>\n<p>Отсюда видно, что человек, получающий на руки 87 000 ₽, обходится компании в 130 000 ₽, то есть примерно в 1,49 раза дороже. Вкладка «Зарплата: на руки ↔ до вычета» считает упрощённую обратную задачу: оклад = сумма на руки / 0,87.<\/p>"],["Отпускные и больничные: средний дневной заработок","<p>Отпускные считают из <b>среднего дневного заработка<\/b>. Для отпуска в календарных днях его берут за последние 12 месяцев и делят на 12 и на среднемесячное число календарных дней — <b>29,3<\/b>. Затем умножают на количество дней отпуска.<\/p>\n<div class=\"fx\">Отпускные = (Заработок за 12 мес. / 12 / 29,3) × Дни отпуска<\/div>\n<p>Пример: годовой заработок 1 200 000 ₽, отпуск 28 календарных дней. Средний дневной заработок = 1 200 000 / 12 / 29,3 ≈ 3 412,97 ₽, отпускные ≈ 3 412,97 × 28 ≈ 95 563 ₽. С этой суммы удерживается НДФЛ.<\/p>"],["Курсовые разницы и пересчёт валюты","<p>Операции в иностранной валюте учитывают в рублях по официальному курсу ЦБ на дату операции, а остатки валютных статей пересчитывают на отчётную дату. Разница между курсами на дату расчёта и на дату возникновения требования или долга — <b>курсовая разница<\/b>, она включается в прочие доходы или расходы.<\/p>\n<p>Пример: поставка на 1 000 долларов отгружена при курсе 90 ₽, учтена в выручке на 90 000 ₽. На дату оплаты курс равен 94 ₽, поступило 94 000 ₽. Положительная курсовая разница составила 94 000 − 90 000 = 4 000 ₽. Если бы курс упал до 88, возникла бы отрицательная разница −2 000 ₽.<\/p>\n<div class=\"tip\">Для проверки используйте процентный режим: изменение курса в процентах = (94 − 90) / 90 × 100 ≈ 4,44%. Тот же процент применяется к сумме сделки.<\/div>"],["Оценка запасов: FIFO и средняя себестоимость","<p>При списании материалов или товаров нужно определить, по какой цене их взять, если партии закупались по разным ценам. Российские стандарты допускают три способа: по себестоимости каждой единицы, <b>средней себестоимости<\/b> и <b>ФИФО<\/b> («первым пришёл — первым ушёл»).<\/p>\n<table class=\"lt\"><thead><tr><th>Партия<\/th><th>Количество<\/th><th>Цена, ₽<\/th><th>Сумма, ₽<\/th><\/tr><\/thead><tbody>\n<tr><td>Остаток на начало<\/td><td>100<\/td><td>50<\/td><td>5 000<\/td><\/tr>\n<tr><td>Закупка<\/td><td>200<\/td><td>60<\/td><td>12 000<\/td><\/tr>\n<tr><td>Списано<\/td><td>150<\/td><td>?<\/td><td>?<\/td><\/tr>\n<\/tbody><\/table>\n<ul>\n<li><b>ФИФО:<\/b> сначала 100 шт. по 50 = 5 000, затем 50 шт. по 60 = 3 000. Списано 8 000 ₽.<\/li>\n<li><b>Средняя:<\/b> (5 000 + 12 000) / 300 ≈ 56,67 ₽ за штуку, 150 × 56,67 = 8 500 ₽.<\/li>\n<\/ul>\n<p>При растущих ценах ФИФО даёт меньшую себестоимость и большую прибыль, при падающих — наоборот. Выбранный способ закрепляют в учётной политике и применяют последовательно.<\/p>"],["Пени, неустойка и проценты за просрочку","<p>За просрочку платежа начисляют пени или проценты. Для налогов пеня за каждый день равна доле ставки рефинансирования (ключевой ставки) от суммы долга: для организаций 1/300 за первые 30 дней просрочки и 1/150 начиная с 31-го дня. Для физических лиц 1/300 действует на весь период.<\/p>\n<div class=\"fx\">Пеня = Долг × Ставка × Дни / 300<\/div>\n<p>Пример: недоимка 100 000 ₽, ставка 16%, 20 дней. Пеня за день = 100 000 × 0,16 / 300 ≈ 53,33 ₽, за 20 дней ≈ 1 066,67 ₽. В договорах неустойку часто задают иначе — например, 0,1% в день: на тот же долг это 100 ₽ в день, или 36,5% годовых.<\/p>\n<p>Количество дней считают календарными. День оплаты обычно в просрочку не входит, а день, следующий за последним сроком платежа, — первый день просрочки.<\/p>"],["Рентабельность и ликвидность","<p>Бухгалтерские данные превращают в показатели, которые сравнимы между компаниями. <b>Рентабельность<\/b> показывает долю прибыли в выручке или капитале, <b>ликвидность<\/b> — способность вовремя расплачиваться по долгам.<\/p>\n<table class=\"lt\"><thead><tr><th>Показатель<\/th><th>Формула<\/th><th>Ориентир<\/th><\/tr><\/thead><tbody>\n<tr><td>Рентабельность продаж<\/td><td>Чистая прибыль / Выручка<\/td><td>зависит от отрасли<\/td><\/tr>\n<tr><td>Рентабельность капитала (ROE)<\/td><td>Чистая прибыль / Собственный капитал<\/td><td>выше ставки по депозитам<\/td><\/tr>\n<tr><td>Текущая ликвидность<\/td><td>Оборотные активы / Краткосрочные обязательства<\/td><td>1,5–2<\/td><\/tr>\n<tr><td>Быстрая ликвидность<\/td><td>(Деньги + Дебиторка) / Краткосрочные обязательства<\/td><td>0,7–1<\/td><\/tr>\n<\/tbody><\/table>\n<p>Пример: выручка 10 000 000 ₽, чистая прибыль 800 000 ₽ — рентабельность продаж 8%. Оборотные активы 3 000 000 ₽ при краткосрочных долгах 2 000 000 ₽ — текущая ликвидность 1,5.<\/p>"],["Контрольные цифры: ИНН, СНИЛС и счёт","<p>Идентификаторы содержат <b>контрольные разряды<\/b>, позволяющие ловить опечатки до обращения в базу. У ИНН юридического лица (10 цифр) последняя цифра вычисляется так: первые девять цифр умножают на веса 2, 4, 10, 3, 5, 9, 4, 6, 8, складывают, берут остаток от деления на 11, а если он больше 9 — остаток от деления на 10.<\/p>\n<p>Пример для первых цифр 7 7 0 7 0 8 3 8 9: 7·2 + 7·4 + 0·10 + 7·3 + 0·5 + 8·9 + 3·4 + 8·6 + 9·8 = 14 + 28 + 0 + 21 + 0 + 72 + 12 + 48 + 72 = 267. Остаток 267 mod 11 = 3, так что десятая цифра — 3, номер 7707083893 корректен.<\/p>\n<p>Для СНИЛС контрольное число — остаток суммы произведений девяти цифр на веса от 9 до 1, делённый на 101 (при остатке 100 или 101 используется 00). Подобные проверки не доказывают, что организация существует, но отсекают случайные ошибки ввода.<\/p>"],["Календарь, сроки и «360/365»","<p>Многие расчёты зависят от способа подсчёта дней. Банковские расчёты используют разные базы: <b>Actual/365<\/b> (фактические дни, год 365), <b>Actual/360<\/b> (фактические дни, год 360) и <b>30/360<\/b> (все месяцы по 30 дней, год 360). Один и тот же процентный платёж при разных базах различается.<\/p>\n<p>Пример: 1 000 000 ₽ под 12% годовых на 45 дней. При базе 365 проценты равны 1 000 000 × 0,12 × 45 / 365 ≈ 14 794,52 ₽, при базе 360 — ровно 15 000 ₽. Разница около 1,4% — база «360» выгодна кредитору.<\/p>\n\n<div class=\"tip\">Всегда уточняйте в договоре, какая база применяется, и сохраняйте одинаковую логику в расчётах и в проверке — иначе копейки будут расходиться с банком.<\/div>"],["Инвентаризация и акты сверки","<p>Инвентаризация сопоставляет данные учёта с фактическим наличием имущества и обязательств. Расхождения оформляют: излишки приходуют, недостачи относят на виновных лиц или на расходы по установленным правилам. С контрагентами проводят <b>сверку расчётов<\/b>: каждая сторона сравнивает свои обороты и сальдо, а подписанный акт сверки подтверждает долг.<\/p>\n<p>Сальдо по счёту — разность дебетовых и кредитовых оборотов с учётом начального остатка. Пример: начальное сальдо 10 000 ₽ (дебет), оборот по дебету 50 000, по кредиту 35 000 — конечное сальдо 10 000 + 50 000 − 35 000 = 25 000 ₽ по дебету. Если у контрагента получилось 22 000, разницу в 3 000 ищут по документам: часто это платёж «в пути» или неучтённая накладная.<\/p>"],["Первичные документы и хранение","<p>Каждая операция подтверждается первичным документом с обязательными реквизитами: наименование и дата, содержание операции, измерители (количество, сумма), должности и подписи ответственных лиц. Ошибки в бумажных документах исправляют аккуратным зачёркиванием с датой и подписью, а не затиранием.<\/p>\n<ul>\n<li>Бухгалтерские документы хранят не менее 5 лет, документы для расчёта налогов — не менее 4 лет; кадровые и по зарплате — дольше (сроки уточняйте в действующих перечнях).<\/li>\n<li>Для проверки итогов используйте ленту калькулятора: распечатайте или скопируйте её и приложите к документу.<\/li>\n<\/ul>"]],"finance":[["Аннуитетный и дифференцированный платежи","<p>Кредит можно погашать двумя основными способами, и от выбора зависит и ежемесячная нагрузка, и переплата.<\/p>\n<div class=\"fx\">Аннуитет: A = S · r / (1 − (1 + r)<sup>−n<\/sup>), где r = ставка/12, n — число месяцев<br>Дифференцированный: платёж<sub>t<\/sub> = S/n + остаток<sub>t−1<\/sub> · r<\/div>\n<ul>\n<li><b>Аннуитет<\/b> — равные платежи каждый месяц. В начале большая часть платежа уходит на проценты, основной долг убывает медленно.<\/li>\n<li><b>Дифференцированный<\/b> — основной долг гасится равными долями, а проценты начисляются на уменьшающийся остаток. Первый платёж самый большой, последний — самый маленький; общая переплата ниже.<\/li>\n<\/ul>\n<p><b>Пример:<\/b> 3 000 000 ₽ на 15 лет под 14,5% годовых. Аннуитетный платёж около 41 000 ₽ в месяц, общая переплата превышает сумму кредита. При дифференцированных платежах первый платёж выше (около 52 900 ₽), но сумма выплат меньше. Выбирайте по тому, что для вас важнее: низкая нагрузка в начале (аннуитет) или меньшая переплата (дифференцированный).<\/p>"],["Досрочное погашение: что выгоднее","<p>Любая сумма, внесённая сверх платежа, уменьшает остаток долга, на который начисляются проценты. Есть два варианта: <b>сократить срок<\/b> (платёж остаётся прежним) или <b>уменьшить платёж<\/b> (срок остаётся прежним). Экономия на процентах почти всегда больше при сокращении срока, потому что вы быстрее избавляетесь от основного долга. Уменьшение платежа снижает ежемесячную нагрузку, но проценты платятся дольше.<\/p>\n<p>Эффект раннего досрочного погашения гораздо сильнее позднего: в аннуитетной схеме в первые годы платёж почти целиком состоит из процентов, и каждый внесённый рубль экономит процентов больше всего. В калькуляторе поле «Досрочно в месяц» показывает, как сокращается срок и сколько процентов вы экономите. Перед досрочным погашением проверьте условия договора: наличие комиссий, ограничения по срокам уведомления.<\/p>"],["Эффективная ставка и капитализация","<p>Номинальная годовая ставка не показывает реальную доходность, если проценты начисляются несколько раз в год и добавляются к телу вклада (капитализируются). Эффективная годовая ставка:<\/p>\n<div class=\"fx\">i<sub>эфф<\/sub> = (1 + i/m)<sup>m<\/sup> − 1<\/div>\n<p>Здесь i — номинальная ставка, m — число капитализаций в год. Для 16% годовых: при годовой капитализации — 16%, при квартальной — 16,99%, при ежемесячной — 17,23%, при ежедневной — около 17,35%. Предел, к которому стремится эффективная ставка при непрерывной капитализации, равен e<sup>i<\/sup> − 1 (для 16% это 17,35%).<\/p>\n<p>Разница растёт с увеличением ставки и срока. Поэтому вклады с одинаковой номинальной ставкой, но разной капитализацией, нельзя сравнивать «в лоб» — сравнивайте эффективные ставки. Для кредитов аналогичный показатель называется полной стоимостью кредита (ПСК): он учитывает не только проценты, но и обязательные комиссии и платежи.<\/p>"],["Правило 72 и сложный процент","<p>Сложный процент — начисление процентов на проценты. Рост капитала описывает формула: <code>S = P·(1 + r)^t<\/code>. Быстрая оценка срока удвоения даёт <b>правило 72<\/b>: нужно разделить 72 на ставку в процентах. При 8% годовых капитал удвоится примерно за 9 лет, при 12% — за 6, при 4% — за 18. Точная формула: t = ln 2 / ln(1 + r); правило хорошо работает для ставок от 4% до 20%.<\/p>\n<table class=\"lt\"><thead><tr><th>Ставка<\/th><th>Удвоение (лет)<\/th><th>×10 за (лет)<\/th><\/tr><\/thead><tbody>\n<tr><td>4%<\/td><td>17,7<\/td><td>58,7<\/td><\/tr>\n<tr><td>8%<\/td><td>9,0<\/td><td>29,9<\/td><\/tr>\n<tr><td>12%<\/td><td>6,1<\/td><td>20,3<\/td><\/tr>\n<tr><td>16%<\/td><td>4,7<\/td><td>15,5<\/td><\/tr>\n<\/tbody><\/table>\n<p>Регулярные пополнения многократно усиливают эффект. Вклад 10 000 ₽ в месяц под 12% годовых с ежемесячной капитализацией через 20 лет даёт около 9,9 млн ₽ при внесённых 2,4 млн ₽ — основная часть итога создана процентами. Главные факторы успеха — время и регулярность, а не размер первого взноса.<\/p>"],["Стоимость денег во времени (TVM)","<p>Рубль сегодня стоит больше, чем рубль через год: его можно вложить и получить процент, а ещё его покупательная способность падает из-за инфляции. Это основа финансовой математики.<\/p>\n<div class=\"fx\">FV = PV·(1 + r)<sup>n<\/sup> &nbsp; · &nbsp; PV = FV / (1 + r)<sup>n<\/sup><br>Аннуитет (конец периода): FV = PMT·((1 + r)<sup>n<\/sup> − 1)/r; PV = PMT·(1 − (1 + r)<sup>−n<\/sup>)/r<\/div>\n<p>Для платежей <b>в начале периода<\/b> (аннуитет «пренумерандо») результат умножается на (1 + r). Ставка r и число периодов n должны быть в одних единицах: ежемесячные платежи — ежемесячная ставка и число месяцев. <b>Пример:<\/b> сколько нужно положить сегодня, чтобы 5 лет получать по 5 000 ₽ в месяц при ставке 1% в месяц? PV = 5 000 · (1 − 1,01<sup>−60<\/sup>)/0,01 ≈ 224 775 ₽.<\/p>"],["NPV, IRR, срок окупаемости","<p>Эти показатели оценивают инвестиционные проекты по потокам денег: инвестиция — отрицательная, поступления — положительные.<\/p>\n<div class=\"fx\">NPV = Σ CF<sub>t<\/sub> / (1 + r)<sup>t<\/sup> &nbsp; · &nbsp; IRR: такая ставка, при которой NPV = 0<br>PI = (Σ дисконтированных притоков) / инвестиции<\/div>\n<ul>\n<li><b>NPV &gt; 0<\/b> — проект создаёт стоимость сверх требуемой доходности r, его стоит принять; <b>NPV &lt; 0<\/b> — доходность ниже требуемой.<\/li>\n<li><b>IRR<\/b> — внутренняя норма доходности; проект приемлем, если IRR выше ставки дисконтирования (стоимости капитала).<\/li>\n<li><b>PI &gt; 1<\/b> — на рубль вложений приходится больше рубля дисконтированных поступлений.<\/li>\n<li><b>Срок окупаемости<\/b> — момент, когда накопленный поток становится положительным; <b>дисконтированный<\/b> учитывает стоимость денег во времени и всегда длиннее простого.<\/li>\n<\/ul>\n<p>Ограничения: IRR может быть неоднозначной при чередовании знаков потоков, а при сравнении проектов разного масштаба надёжнее ориентироваться на NPV. Калькулятор находит IRR методом бисекции на интервале от −99% до 1000%.<\/p>"],["ROI, CAGR, безубыточность","<ul>\n<li><b>ROI<\/b> = (результат − вложения) / вложения — простая доходность без учёта срока. Вложили 1 000 000 ₽, получили 1 750 000 ₽ → ROI = 75%.<\/li>\n<li><b>CAGR<\/b> = (конечная / начальная)<sup>1/t<\/sup> − 1 — среднегодовая сложная доходность. Те же 75% за 4 года — это CAGR около 15,0% в год, а не 18,75% (75/4).<\/li>\n<li><b>Точка безубыточности:<\/b> Q = постоянные затраты / (цена − переменные затраты на единицу). Знаменатель называется маржинальным доходом на единицу.<\/li>\n<li><b>Запас финансовой прочности<\/b> = (фактический объём − безубыточный) / фактический объём; показывает, насколько можно просесть без убытка.<\/li>\n<\/ul>\n<p><b>Пример безубыточности:<\/b> цена 1 500 ₽, переменные затраты 900 ₽, постоянные 600 000 ₽ в месяц. Маржинальный доход 600 ₽, точка безубыточности 1 000 шт. Чтобы заработать 300 000 ₽ прибыли, нужно продать (600 000 + 300 000)/600 = 1 500 шт.<\/p>"],["Инфляция и реальная доходность","<p>Инфляция снижает покупательную способность: при 8% в год сумма через 10 лет «весит» в 2,16 раза меньше, а 1 000 000 ₽ по реальной стоимости превратятся примерно в 463 000 ₽. Номинальная доходность 12% при инфляции 8% — это не 4% реальных. Точная связь задаётся <b>формулой Фишера<\/b>:<\/p>\n<div class=\"fx\">1 + реальная = (1 + номинальная) / (1 + инфляция)<\/div>\n<p>Для 12% и 8% реальная доходность составит 1,12/1,08 − 1 ≈ 3,70%. Для долгосрочного планирования учитывайте инфляцию: цель накоплений в 5 млн ₽ сегодня через 10 лет при 8% инфляции потребует около 10,8 млн ₽. Калькулятор показывает обе величины — реальную стоимость и номинальную сумму, необходимую для сохранения покупательной способности.<\/p>"],["Практические советы","<ul>\n<li>Сравнивайте предложения по <b>полной стоимости<\/b>: эффективной ставке вкладов и ПСК кредитов, а не по рекламной номинальной ставке.<\/li>\n<li>Платёж по кредитам обычно не должен превышать 30–40% дохода семьи — это ориентир, а не норма закона.<\/li>\n<li>Подушка безопасности — расходы на 3–6 месяцев — создаётся до рискованных вложений.<\/li>\n<li>Диверсификация снижает риск: не вкладывайте всё в один инструмент.<\/li>\n<li>Результаты калькулятора — оценка по упрощённой модели без учёта налогов, комиссий и изменения ставок. Это не инвестиционная рекомендация.<\/li>\n<\/ul>"],["Ипотека: как ставка меняет переплату","<p>Платёж по ипотеке — это аннуитет: доля процентов в нём в начале срока велика, а в конце мала. Чем выше ставка и дольше срок, тем сильнее переплата. Возьмём кредит 6 400 000 ₽ на 20 лет (240 месяцев) при разных ставках:<\/p>\n<table class=\"lt\"><thead><tr><th>Ставка<\/th><th>Платёж в месяц<\/th><th>Всего выплат<\/th><th>Переплата<\/th><\/tr><\/thead><tbody>\n<tr><td>6%<\/td><td>≈ 45 852 ₽<\/td><td>≈ 11,0 млн ₽<\/td><td>≈ 4,60 млн ₽<\/td><\/tr>\n<tr><td>12%<\/td><td>≈ 70 470 ₽<\/td><td>≈ 16,9 млн ₽<\/td><td>≈ 10,51 млн ₽<\/td><\/tr>\n<tr><td>16%<\/td><td>≈ 89 040 ₽<\/td><td>≈ 21,4 млн ₽<\/td><td>≈ 14,97 млн ₽<\/td><\/tr>\n<\/tbody><\/table>\n<p>При ставке 16% переплата больше самой суммы кредита более чем вдвое. Практический вывод: даже снижение ставки на 1 п.п. за счёт рефинансирования заметно экономит деньги в первые годы, когда основная часть платежа — проценты. Введите те же числа во вкладке «Кредит» и сравните с таблицей.<\/p>\n<div class=\"tip\">Банк обязан показывать полную стоимость кредита (ПСК). Сравнивайте предложения именно по ПСК, а не по номинальной ставке: в неё входят комиссии и обязательные платежи.<\/div>"],["Полная стоимость кредита и скрытые комиссии","<p>Номинальная ставка часто выглядит привлекательнее, чем реальная цена займа. Если банк берёт комиссию за выдачу, вы получаете на руки меньше, а платите по всей сумме. Пример: кредит 100 000 ₽ на 12 месяцев под 18% годовых, ежемесячный платёж ≈ 9 168 ₽, но комиссия 3% удерживается сразу, поэтому на руки выдают 97 000 ₽.<\/p>\n<p>Найдём ставку, при которой дисконтированные платежи равны полученным 97 000 ₽. Она составляет ≈ 1,99% в месяц, то есть ≈ 23,9% годовых при простом умножении на 12 и ≈ 26,7% при учёте капитализации. Комиссия 3% превратила «18%» в «почти 24–27%».<\/p>\n<ul>\n<li><b>Ищите:<\/b> страховку, комиссию за выдачу, плату за обслуживание счёта.<\/li>\n<li><b>Проверяйте:<\/b> можно ли отказаться от страховки без повышения ставки.<\/li>\n<li><b>Считайте:<\/b> денежный поток во вкладке NPV / IRR — IRR по потоку и есть эффективная ставка займа.<\/li>\n<\/ul>"],["Рассрочка «без процентов»: сколько она стоит на самом деле","<p>Если товар стоит 100 000 ₽ при оплате сразу, а рассрочка — 12 × 9 000 ₽ = 108 000 ₽, то «скрытая» переплата — 8 000 ₽ (8%). Но эффективная ставка выше, потому что долг убывает: вы пользуетесь не всей суммой весь год, а в среднем примерно половиной.<\/p>\n<p>Решая уравнение 100 000 = 9 000 × [1 − (1 + i)<sup>−12<\/sup>] / i, получаем i ≈ 1,204% в месяц — это ≈ 14,45% годовых номинально и ≈ 15,45% эффективных. Если «рассрочка» без наценки, но взамен вы теряете скидку за оплату сразу, эта скидка и есть проценты.<\/p>\n<div class=\"tip\">Правило: переплата в процентах от цены, делённая примерно на половину срока в годах, даёт приблизительную годовую ставку: 8% / 0,5 года ≈ 16% — близко к точному значению 15,45%.<\/div>"],["Облигации: цена и доходность","<p>Облигация обещает купонные выплаты и возврат номинала в конце срока. Её цена — сумма дисконтированных платежей. <b>Текущая доходность<\/b> = годовой купон / цена. <b>Доходность к погашению<\/b> (YTM) учитывает ещё и разницу между ценой покупки и номиналом: это ставка, при которой NPV потока равен нулю.<\/p>\n<p>Пример: номинал 1 000 ₽, купон 10% (100 ₽ в год), срок 3 года, цена 950 ₽. Поток: −950, +100, +100, +1 100. Текущая доходность = 100 / 950 ≈ 10,53%, YTM ≈ 12,08% — вычисляется во вкладке «NPV / IRR» как IRR этого потока. Покупка ниже номинала увеличивает доходность, покупка выше — уменьшает.<\/p>\n<ul>\n<li>Если рыночные ставки растут, цены облигаций падают, и наоборот.<\/li>\n<li><b>Дюрация<\/b> — средневзвешенный срок платежей: в примере ≈ 2,73 года. Она показывает, насколько чувствительна цена к изменению ставки.<\/li>\n<\/ul>"],["Дисконтирование и оценка бизнеса","<p>Стоимость компании — это приведённая к сегодняшнему дню сумма будущих свободных денежных потоков (FCF). Для прогнозного периода считают дисконтирование каждого года, а для «вечного» периода после него добавляют <b>терминальную стоимость<\/b> по формуле Гордона: TV = FCF<sub>n<\/sub> × (1 + g) / (r − g), где g — долгосрочный рост, r — ставка дисконтирования.<\/p>\n<p>Пример: денежный поток 100 растёт на 5% в год в течение 5 лет, далее на 2%, ставка 12%. Сумма приведённых потоков за 5 лет ≈ 413,7. Терминальная стоимость на конец 5-го года ≈ 1 301,8, а в сегодняшних деньгах ≈ 738,7. Итого стоимость ≈ 1 152,4. Видно, что более 60% стоимости приходится на период после прогноза — оценка очень чувствительна к g и r.<\/p>\n<div class=\"tip\">Условие r &gt; g обязательно: иначе формула Гордона даёт бессмысленный результат. Проверьте чувствительность: измените r на 1 п.п. в большую и меньшую сторону.<\/div>"],["Риск и доходность портфеля","<p>Доходность портфеля — взвешенная сумма доходностей активов, а риск (стандартное отклонение) — нет: он зависит ещё от корреляции между активами. Для двух активов: σ² = w₁²σ₁² + w₂²σ₂² + 2·w₁w₂·ρ·σ₁σ₂.<\/p>\n<table class=\"lt\"><thead><tr><th>Корреляция ρ<\/th><th>Риск портфеля 60% / 40% при σ₁ = 20%, σ₂ = 10%<\/th><\/tr><\/thead><tbody>\n<tr><td>+1<\/td><td>16,0% (простое среднее: 0,6·20 + 0,4·10)<\/td><\/tr>\n<tr><td>+0,3<\/td><td>≈ 13,74%<\/td><\/tr>\n<tr><td>0<\/td><td>≈ 12,6%<\/td><\/tr>\n<\/tbody><\/table>\n<p>Именно в этом суть диверсификации: при неполной корреляции риск портфеля меньше среднего риска его частей. Бесплатный обед в финансах — комбинирование активов, которые ведут себя по-разному. При корреляции +1 выигрыша нет.<\/p>"],["Накопления на пенсию и регулярные взносы","<p>Регулярные взносы с капитализацией растут по формуле будущей стоимости аннуитета: FV = PMT × [(1 + r)<sup>n<\/sup> − 1] / r. Главный ресурс — время: проценты начисляются на проценты.<\/p>\n<p>Пример: 15 000 ₽ в месяц, 10% годовых, капитализация ежемесячно, 25 лет (300 месяцев). Внесено 15 000 × 300 = 4 500 000 ₽, а итоговая сумма ≈ 19,90 млн ₽: около 77% капитала дали проценты. Если начать на 10 лет позже (15 лет), результат будет более чем в 3 раза меньше (≈ 6,2 млн ₽).<\/p>\n<ul>\n<li>Ранний старт важнее размера взноса: первые годы «работают» дольше всех.<\/li>\n<li>Для цели «сколько откладывать» используйте вкладку «Цель накоплений».<\/li>\n<li>Номинальные суммы нужно сопоставлять с инфляцией — смотрите раздел «Инфляция».<\/li>\n<\/ul>"],["Налоги и льготы на доходы от вложений","<p>Доход от вложений обычно облагается налогом, поэтому важна доходность после налогов. Проценты по вкладам облагаются НДФЛ только в части, превышающей необлагаемый лимит (он привязан к ключевой ставке и меняется), а доход по облигациям и акциям облагается по общим правилам, с возможностью льгот при долгосрочном владении и инвестиционных вычетов.<\/p>\n<div class=\"fx\">Доходность после налога ≈ Доходность × (1 − Ставка налога)<\/div>\n<p>Пример: 16% до налога при 13% налоге дают 16 × 0,87 = 13,92% после налога. Если инфляция 9%, реальная доходность составит (1,1392 / 1,09) − 1 ≈ 4,5%, а не 7% (как при простом вычитании 16 − 9).<\/p>\n<p>Ставки, лимиты и льготы регулярно пересматриваются — перед решением проверьте действующие нормы на сайте ФНС или у налогового консультанта. Калькулятор показывает арифметику, но не заменяет юридическую консультацию.<\/p>"],["Чувствительность и сценарии","<p>Результат финансовой модели зависит от допущений. Хорошая практика — считать не одно число, а <b>три сценария<\/b>: пессимистичный, базовый, оптимистичный. Меняйте один параметр за раз и смотрите на реакцию результата.<\/p>\n<table class=\"lt\"><thead><tr><th>Параметр<\/th><th>Пессимистичный<\/th><th>Базовый<\/th><th>Оптимистичный<\/th><\/tr><\/thead><tbody>\n<tr><td>Ставка вклада<\/td><td>10%<\/td><td>14%<\/td><td>18%<\/td><\/tr>\n<tr><td>Инфляция<\/td><td>12%<\/td><td>9%<\/td><td>6%<\/td><\/tr>\n<tr><td>Срок накоплений<\/td><td>7 лет<\/td><td>8 лет<\/td><td>9 лет<\/td><\/tr>\n<\/tbody><\/table>\n<p>Если цель достигается только в оптимистичном варианте — план слишком хрупок. Увеличьте взнос или срок, чтобы выжить и при пессимистичном сценарии. Такой подход применяют и банки при стресс-тестировании портфелей, и домохозяйства при планировании крупных покупок.<\/p>"],["Финансовая безопасность и здравый смысл","<p>Калькулятор не заменит осторожности. Несколько правил, которые экономят деньги и нервы:<\/p>\n\n<div class=\"tip\">Расчёты на сайте носят информационный характер и не являются индивидуальной инвестиционной рекомендацией. Перед заключением договора внимательно читайте график платежей и условия досрочного погашения.<\/div>"],["Аннуитет или дифференцированный платёж","<p>Для кредита 1 000 000 ₽ на 12 месяцев под 12% годовых аннуитетный платёж постоянен — ≈ 88 848,79 ₽, переплата ≈ 66 185 ₽. При дифференцированных платежах основной долг гасится равными долями (83 333,33 ₽), проценты начисляются на остаток: первый платёж ≈ 93 333 ₽, последний ≈ 84 167 ₽, переплата ровно 65 000 ₽.<\/p>\n<ul>\n<li><b>Дифференцированный<\/b> дешевле по процентам, но начальная нагрузка выше — для одобрения нужен больший доход.<\/li>\n<li><b>Аннуитетный<\/b> удобен предсказуемостью и позволяет взять большую сумму при том же доходе.<\/li>\n<li>Разница в переплате растёт со сроком: на ипотеке в 20 лет она измеряется сотнями тысяч рублей.<\/li>\n<\/ul>"]],"programmable":[["Быстрый старт: первая программа","<p>Программируемый режим — небольшой интерпретатор для расчётов. Программа состоит из строк; каждая строка — присваивание, определение функции, оператор или просто выражение. Результат выражения выводится автоматически, а слово <code>print<\/code> выводит значение явно. Комментарии начинаются с <code>#<\/code> или <code>//<\/code>.<\/p>\n<pre class=\"pre\"># площадь и периметр круга\nr = 2.5\nprint pi * r^2\nprint 2 * pi * r\n<\/pre>\n<p>Запускайте программу кнопкой «▶» или сочетанием <b>Ctrl+Enter<\/b>. Рядом с результатом показывается таблица всех переменных и время выполнения. Код автоматически сохраняется в браузере, а готовые примеры доступны в выпадающем списке «Примеры…».<\/p>"],["Переменные и присваивание","<p>Имя переменной начинается с буквы (латинской, русской или греческой) или знака подчёркивания и может содержать цифры. Регистр имеет значение: <code>Rate<\/code> и <code>rate<\/code> — разные переменные.<\/p>\n<ul>\n<li><code>x = 5<\/code> — создаёт или перезаписывает переменную.<\/li>\n<li><code>s += 2<\/code>, <code>s -= 2<\/code>, <code>s *= 2<\/code>, <code>s /= 2<\/code>, <code>s ^= 2<\/code> — составные присваивания; переменная должна быть определена заранее.<\/li>\n<li>Несколько операторов в одной строке разделяются точкой с запятой: <code>a = 1; b = 2; print a + b<\/code>.<\/li>\n<li><code>ans<\/code> хранит результат последнего выражения или <code>print<\/code>.<\/li>\n<li>Встроенные константы: <code>pi<\/code> (π), <code>e<\/code>, <code>tau<\/code> (2π), <code>phi<\/code> (золотое сечение), <code>c<\/code> (скорость света), <code>g<\/code> (9,80665), <code>inf<\/code>. Их можно «затенить» собственной переменной с тем же именем.<\/li>\n<\/ul>"],["Операции и приоритеты","<table class=\"lt\"><thead><tr><th>Приоритет<\/th><th>Операции<\/th><th>Примечание<\/th><\/tr><\/thead><tbody>\n<tr><td>1 (высший)<\/td><td><code>( )<\/code>, вызов функции<\/td><td>скобки и аргументы<\/td><\/tr>\n<tr><td>2<\/td><td><code>!<\/code>, <code>%<\/code><\/td><td>факториал, процент<\/td><\/tr>\n<tr><td>3<\/td><td><code>^<\/code> (или <code>**<\/code>)<\/td><td>справа налево<\/td><\/tr>\n<tr><td>4<\/td><td>унарные <code>-<\/code>, <code>+<\/code>, <code>~<\/code>, <code>√<\/code><\/td><td>унарные операции<\/td><\/tr>\n<tr><td>5<\/td><td><code>*<\/code>, <code>/<\/code>, <code>mod<\/code>, <code>div<\/code><\/td><td>слева направо<\/td><\/tr>\n<tr><td>6<\/td><td><code>+<\/code>, <code>-<\/code><\/td><td><\/td><\/tr>\n<tr><td>7<\/td><td><code>&lt;&lt;<\/code>, <code>&gt;&gt;<\/code><\/td><td>битовые сдвиги<\/td><\/tr>\n<tr><td>8<\/td><td><code>&lt;<\/code>, <code>&gt;<\/code>, <code>&lt;=<\/code>, <code>&gt;=<\/code>, <code>==<\/code>, <code>!=<\/code><\/td><td>возвращают 1 или 0<\/td><\/tr>\n<tr><td>9<\/td><td><code>&amp;<\/code><\/td><td>побитовое И<\/td><\/tr>\n<tr><td>10<\/td><td><code>|<\/code><\/td><td>побитовое ИЛИ<\/td><\/tr>\n<tr><td>11<\/td><td><code>&amp;&amp;<\/code><\/td><td>логическое И<\/td><\/tr>\n<tr><td>12 (низший)<\/td><td><code>||<\/code><\/td><td>логическое ИЛИ<\/td><\/tr>\n<\/tbody><\/table>\n<p>Истина — любое число, отличное от нуля; результат сравнения — 1 (истина) или 0 (ложь). Сравнение выполняется с небольшим допуском (относительная погрешность 10<sup>−12<\/sup>), поэтому <code>0.1 + 0.2 == 0.3<\/code> даёт 1.<\/p>"],["Функции пользователя и рекурсия","<p>Функция определяется записью <code>имя(параметры) = выражение<\/code>. Внутри тела видны её параметры и глобальные переменные. Допустима рекурсия — функция вызывает саму себя; условие выхода задаётся через <code>if(условие, если_истина, если_ложь)<\/code>.<\/p>\n<pre class=\"pre\">fact2(n) = if(n &lt;= 1, 1, n * fact2(n - 1))\nfib2(n)  = if(n &lt; 2, n, fib2(n - 1) + fib2(n - 2))\nhyp(a, b) = sqrt(a^2 + b^2)\nprint fact2(10)    # 3628800\nprint fib2(20)     # 6765\nprint hyp(3, 4)    # 5\n<\/pre>\n<p>Функция <code>if<\/code> вычисляет только нужную ветку, поэтому рекурсия завершается корректно. Слишком глубокая рекурсия останавливается с сообщением, а не «вешает» страницу. Двойная рекурсия (как у <code>fib2<\/code>) растёт экспоненциально: <code>fib2(30)<\/code> уже требует более миллиона вызовов — для больших n используйте встроенную <code>fib(n)<\/code> или цикл.<\/p>"],["Циклы и условия","<pre class=\"pre\">for i = 1..100: s += i            # сумма от 1 до 100\nfor x = 0..1 step 0.25: print x^2   # шаг можно менять\nwhile n != 1: n = if(mod(n, 2) == 0, n / 2, 3 * n + 1); steps += 1\nif x &gt; 0: print x\n<\/pre>\n<ul>\n<li><code>for i = a..b<\/code> перебирает значения от a до b <b>включительно<\/b>; <code>step<\/code> задаёт шаг (может быть отрицательным, нулевой запрещён).<\/li>\n<li><code>while условие: тело<\/code> повторяется, пока условие истинно.<\/li>\n<li>Тело цикла в одной строке: несколько операторов разделяйте точкой с запятой.<\/li>\n<li><b>Защита:<\/b> общее число операций ограничено (3 миллиона), поэтому бесконечный цикл останавливается сообщением «Превышен лимит операций».<\/li>\n<\/ul>\n<p>Переменная цикла сохраняет последнее значение после завершения. Если цикл не должен менять другие переменные, используйте отдельные имена.<\/p>"],["Суммы, произведения, интегралы, производные, корни","<p>Для типичных задач анализа есть встроенные конструкции, где вторым аргументом указывается имя переменной:<\/p>\n<table class=\"lt\"><thead><tr><th>Запись<\/th><th>Смысл<\/th><th>Метод<\/th><\/tr><\/thead><tbody>\n<tr><td><code>sum(1/k^2, k, 1, 1000)<\/code><\/td><td>Σ выражения по k от 1 до 1000<\/td><td>прямое суммирование<\/td><\/tr>\n<tr><td><code>prod(k, k, 1, 10)<\/code><\/td><td>Π — произведение (10!)<\/td><td>прямое<\/td><\/tr>\n<tr><td><code>integral(x^2, x, 0, 3)<\/code><\/td><td>определённый интеграл (результат 9)<\/td><td>формула Симпсона, 2000 интервалов<\/td><\/tr>\n<tr><td><code>deriv(x^3, x, 2)<\/code><\/td><td>производная в точке (результат 12)<\/td><td>центральная 5-точечная разность<\/td><\/tr>\n<tr><td><code>root(x^2-2, x, 0, 2)<\/code><\/td><td>корень на отрезке (√2)<\/td><td>бисекция, требуется смена знака<\/td><\/tr>\n<\/tbody><\/table>\n<p>Тригонометрические функции внутри программ учитывают режим углов из шапки сайта (по умолчанию градусы): для <code>integral(sin(x), x, 0, pi)<\/code> переключите «Углы» на радианы или используйте <code>sin(rad(x))<\/code>. Функции пользователя можно использовать внутри этих конструкций: <code>f(x) = x^3 - 6*x^2 + 9*x + 1<\/code>, затем <code>integral(f(x), x, 0, 4)<\/code>. Обратите внимание на ограничения: интеграл не определён при бесконечных разрывах внутри отрезка, а <code>root<\/code> требует, чтобы на концах функция имела разные знаки.<\/p>"],["Встроенные функции","<ul>\n<li><b>Тригонометрия<\/b> (учитывает режим углов): <code>sin cos tan asin acos atan atan2 sec csc cot<\/code>; гиперболические <code>sinh cosh tanh asinh acosh atanh<\/code>.<\/li>\n<li><b>Степени и логарифмы:<\/b> <code>sqrt cbrt exp ln log(=lg, десятичный) log2 logb(x, основание) pow hypot sq cube inv<\/code>.<\/li>\n<li><b>Округление:<\/b> <code>floor ceil trunc round(x, знаков) sign abs mod rem clamp lerp<\/code>.<\/li>\n<li><b>Агрегаты:<\/b> <code>min max sum prod avg<\/code> с любым числом аргументов.<\/li>\n<li><b>Теория чисел:<\/b> <code>gcd lcm fact gamma npr ncr isprime fib bits<\/code>.<\/li>\n<li><b>Битовые:<\/b> <code>and or xor not shl shr<\/code> (также операторы <code>&amp; | ~ &lt;&lt; &gt;&gt;<\/code>).<\/li>\n<li><b>Случайные:<\/b> <code>rand()<\/code> — число от 0 до 1, <code>randint(a, b)<\/code> — целое.<\/li>\n<\/ul>\n<p>Числа можно записывать как <code>0xFF<\/code> (шестнадцатеричные), <code>0b1010<\/code> (двоичные), <code>1e-3<\/code> (экспоненциальная форма). Побитовые операции работают с целыми числами: дробная часть отбрасывается, а вычисления идут через BigInt.<\/p>"],["Готовые рецепты","<pre class=\"pre\"># квадратное уравнение\na = 1; b = -3; c = -4\nD = b^2 - 4*a*c\nprint (-b + sqrt(D)) / (2*a)\nprint (-b - sqrt(D)) / (2*a)\n\n# сложный процент по месяцам\ncap = 100000\nfor m = 1..36: cap *= 1 + 0.12/12\nprint cap\n\n# метод Ньютона для sqrt(2)\nx = 1\nfor i = 1..8: x = x - (x^2 - 2) / (2*x)\nprint x\n\n# ряд Лейбница для числа π\nprint 4 * sum((-1)^k / (2*k + 1), k, 0, 200000)\n<\/pre>\n<p>Метод Ньютона удваивает число верных цифр на каждой итерации (квадратичная сходимость), а ряд Лейбница сходится очень медленно: 200 000 слагаемых дают лишь 5 верных знаков π — хороший пример того, что не все формулы одинаково полезны для вычислений.<\/p>"],["Численные методы под капотом","<ul>\n<li><b>Метод Симпсона<\/b> приближает функцию параболами на каждой паре интервалов: ∫f ≈ (h/3)·[f₀ + 4f₁ + 2f₂ + … + f<sub>n<\/sub>]. Погрешность убывает как h⁴, поэтому 2000 интервалов обычно дают 10–12 верных цифр для гладких функций.<\/li>\n<li><b>Производная<\/b> считается по формуле f′(x) ≈ [−f(x+2h) + 8f(x+h) − 8f(x−h) + f(x−2h)] / (12h) с шагом h ≈ 10<sup>−3<\/sup>; это даёт 8–10 верных цифр без глубоких потерь на вычитание близких чисел.<\/li>\n<li><b>Бисекция<\/b> делит отрезок пополам, сохраняя ту половину, где функция меняет знак; 200 шагов дают предельную точность машинного числа. Метод надёжен, но не находит корни чётной кратности (например, x² в нуле).<\/li>\n<\/ul>\n<p>Все вычисления идут в формате double (около 15–16 значащих цифр). Вычитание близких чисел теряет точность («катастрофическое сокращение»): если нужен результат вида <code>(1 − cos x)/x²<\/code> при малых x, используйте эквивалентное преобразование <code>2·sin²(x/2)/x²<\/code>.<\/p>"],["Отладка и сообщения об ошибках","<p>При ошибке выполнение останавливается, а в консоли выводится номер строки и причина:<\/p>\n<ul>\n<li><b>«Неизвестная переменная»<\/b> — опечатка в имени или обращение к переменной до её присваивания.<\/li>\n<li><b>«Неизвестная функция»<\/b> — функция не определена выше по программе.<\/li>\n<li><b>«Не закрыта скобка»<\/b> — подсчитайте скобки; ошибка часто возникает в длинных формулах.<\/li>\n<li><b>«Превышен лимит операций»<\/b> — бесконечный цикл или слишком большое число итераций.<\/li>\n<li><b>«Слишком глубокая рекурсия»<\/b> — у рекурсивной функции нет условия выхода или оно недостижимо.<\/li>\n<\/ul>\n<p>Совет: разбивайте длинные формулы на промежуточные переменные и выводите их через <code>print<\/code> — так легко локализовать ошибку. Интерпретатор изолирован от страницы: у программы нет доступа к файлам, сети и интерфейсу, поэтому запускать чужие примеры безопасно.<\/p>"],["Алгоритм Евклида и наибольший общий делитель","<p>Классический алгоритм Евклида находит НОД двух чисел многократной заменой пары (a, b) на (b, a mod b), пока остаток не станет нулевым. Это один из старейших известных алгоритмов, и он отлично ложится на цикл <code>while<\/code>:<\/p>\n<pre class=\"pre\">a = 252; b = 105\nwhile b != 0: t = mod(a, b); a = b; b = t\nprint a            # 21\n<\/pre>\n<p>Шаги: (252, 105) → (105, 42) → (42, 21) → (21, 0), ответ 21. Число шагов растёт логарифмически — для чисел порядка 10¹⁸ хватает около сотни итераций. НОД нужен для сокращения дробей: <code>a/gcd(a, b)<\/code> и <code>b/gcd(a, b)<\/code> дают несократимую пару; наименьшее общее кратное — <code>a*b/gcd(a, b)<\/code>. Для проверки используйте встроенные <code>gcd(252, 105)<\/code> и <code>lcm(252, 105)<\/code>.<\/p>\n<div class=\"tip\">Каждая переменная перезаписывается в цикле, поэтому временная переменная <code>t<\/code> нужна, чтобы не потерять старое значение <code>b<\/code> до присваивания.<\/div>"],["Простые числа: перебор делителей","<p>Число n простое, если у него нет делителей, кроме 1 и n. Достаточно проверить делители только до √n: если у n есть делитель больше корня, то есть и парный ему меньший. Программа с условием внутри цикла:<\/p>\n<pre class=\"pre\">n = 97; d = 2; ok = 1\nwhile d*d &lt;= n: if mod(n, d) == 0: ok = 0; d += 1\nprint ok           # 1 — число простое\n<\/pre>\n<p>Оператор <code>if условие: действие<\/code> можно вкладывать в тело цикла; точка с запятой отделяет следующее действие уже от цикла, а не от условия. Для подсчёта простых чисел используйте встроенную проверку:<\/p>\n<pre class=\"pre\">cnt = 0\nfor n = 2..1000: cnt += isprime(n)\nprint cnt          # 168\n<\/pre>\n<p>Известные значения: простых чисел до 100 — 25, до 1000 — 168, до 10 000 — 1229. Закон распределения: количество простых до n приблизительно равно n / ln n (для 1000 это ≈ 145 — оценка занижена, но порядок верный).<\/p>"],["Накопление статистики без массивов","<p>В языке нет списков, но многие статистики считаются «на лету» в одном цикле. Для среднего достаточно хранить количество и сумму; для дисперсии — ещё и сумму квадратов: D = E[X²] − (E[X])².<\/p>\n<pre class=\"pre\">n = 0; s = 0; q = 0\nfor i = 1..10: n += 1; s += i; q += i^2\nmean = s / n\nvar = q / n - mean^2\nprint mean         # 5.5\nprint var          # 8.25\nprint sqrt(var)    # 2.872281323\n<\/pre>\n<p>Для данных, заданных формулой, подходит конструкция <code>sum<\/code>: <code>sum(i^2, i, 1, 10)<\/code> равна 385.<\/p>"],["Метод Ньютона для любых функций","<p>Метод Ньютона уточняет корень уравнения f(x) = 0 итерацией x ← x − f(x) / f′(x). Поскольку производную можно получать численно через <code>deriv<\/code>, метод работает для любых функций, которые вы определили:<\/p>\n<pre class=\"pre\">f(x) = x^3 - 2*x - 5\nx = 2\nfor i = 1..6: x = x - f(x) / deriv(f(x), x, x)\nprint x            # 2.094551482\n<\/pre>\n<ul>\n<li><b>Метод подводит,<\/b> когда производная близка к нулю или старт слишком далёк от корня.<\/li>\n<li><b>Проверка:<\/b> <code>print root(f(x), x, 2, 3)<\/code> даёт тот же корень бисекцией.<\/li>\n<\/ul>"],["Моделирование: падение с сопротивлением воздуха","<p>Дифференциальные уравнения без аналитического решения решают пошагово. Метод Эйлера заменяет непрерывное время малыми шагами dt: скорость обновляется как v ← v + a·dt, а путь — как h ← h + v·dt. Для тела массой m с квадратичным сопротивлением ускорение равно a = g − (k/m)·v·|v|.<\/p>\n<pre class=\"pre\">v = 0; h = 0; dt = 0.001; k = 0.1; m = 1\nfor i = 1..10000: a = g - k/m*v*abs(v); v += a*dt; h += v*dt\nprint v            # ≈ 9.9029 (скорость через 10 с)\nprint h            # ≈ 92.105 (пройденный путь)\nprint sqrt(m*g/k)  # ≈ 9.9029 (предельная скорость)\n<\/pre>\n<p>Через 10 секунд скорость практически равна предельной, при которой сила сопротивления уравновешивает вес: v = √(m·g/k). Без сопротивления тело за те же 10 с прошло бы около 490 м (g·t²/2) и набрало бы скорость около 98 м/с — разница наглядно показывает роль воздуха.<\/p>\n<div class=\"tip\">Точность метода Эйлера пропорциональна шагу: уменьшение dt в 10 раз приближает результат к точному, но требует в 10 раз больше итераций. Лимит программы — 3 миллиона операций.<\/div>"],["Метод Монте-Карло: вероятность вместо формул","<p>Метод Монте-Карло оценивает величину по случайным испытаниям. Классический пример — число π: точка (x, y) со случайными координатами в единичном квадрате попадает в четверть круга радиуса 1 с вероятностью π/4.<\/p>\n<pre class=\"pre\">hits = 0; N = 20000\nfor i = 1..N: x = rand(); y = rand(); hits += (x^2 + y^2 &lt;= 1)\nprint 4 * hits / N     # около 3.14\n<\/pre>\n\n<ul>\n<li><code>rand()<\/code> возвращает число от 0 до 1, <code>randint(a, b)<\/code> — целое от a до b.<\/li>\n<li>Для проверки оценок запустите программу несколько раз: если разброс велик, увеличьте N.<\/li>\n<\/ul>"],["Финансовые программы: ипотека и вклад в цикле","<p>Формулы можно записать прямо в программе. Аннуитетный платёж: A = P·r / (1 − (1 + r)<sup>−n<\/sup>), где r — ставка за месяц.<\/p>\n<pre class=\"pre\">P = 3000000; r = 0.145/12; n = 180\nA = P*r / (1 - (1+r)^-n)\nprint A            # ≈ 40965.03\nprint A*n - P      # ≈ 4373704.65 — переплата\n<\/pre>\n<p>Показатель степени <code>-n<\/code> после оператора <code>^<\/code> допустим: унарный минус относится к показателю. Тот же расчёт можно сделать циклом, проверив остаток долга:<\/p>\n<pre class=\"pre\">bal = P\nfor m = 1..n: bal = bal*(1+r) - A\nprint bal          # ≈ 0 (с точностью до погрешности)\n<\/pre>\n<p>Такой приём — проверка одной формулы другим способом — один из лучших способов найти ошибку. Остаток около нуля подтверждает, что платёж рассчитан верно. Для досрочных платежей достаточно вычесть добавку внутри цикла.<\/p>"],["Системы счисления и биты в программе","<p>Поддерживаются литералы <code>0x…<\/code> и <code>0b…<\/code>, а также операторы <code>&amp;<\/code>, <code>|<\/code>, <code>~<\/code>, <code>&lt;&lt;<\/code>, <code>&gt;&gt;<\/code> и функции <code>and, or, xor, not, shl, shr, bits<\/code>.<\/p>\n<pre class=\"pre\">x = 0b101101       # 45\nprint x &amp; 1         # 1 — нечётное\nprint x &amp; (x-1)     # 44 — сброс младшей единицы\nprint x &gt;&gt; 2        # 11\nprint x &lt;&lt; 3        # 360\nprint xor(x, 0xFF) # 210\nprint bits(255)    # 8\n<\/pre>\n<p>Подсчёт единичных битов (вес Хэмминга) циклом: <code>c = 0; t = 0xF0F0<\/code>, затем <code>while t &gt; 0: c += t &amp; 1; t = t &gt;&gt; 1<\/code> даёт 8. Сумма цифр десятичного числа считается аналогично через остаток и целое деление:<\/p>\n<pre class=\"pre\">n = 98765; s = 0\nwhile n &gt; 0: s += mod(n, 10); n = floor(n/10)\nprint s            # 35\n<\/pre>\n<p>Для чисел, которые превышают 2⁵³, обычная арифметика теряет точность, а битовые операции выполняются через BigInt и остаются точными.<\/p>"],["Последовательности и сходимость","<p>Многие числа определяются как пределы. Программа позволяет наблюдать сходимость и сравнивать скорость разных способов.<\/p>\n<pre class=\"pre\">a = 1; b = 1\nfor i = 3..30: t = a + b; a = b; b = t\nprint b            # 832040 — тридцатое число Фибоначчи\nprint b/a          # 1.618033989 — отношение соседних чисел\nprint phi          # 1.618033989 — золотое сечение\n<\/pre>\n<p>Отношение соседних чисел Фибоначчи быстро сходится к золотому сечению. Другой пример — число e тремя способами:<\/p>\n<pre class=\"pre\">print (1+1/1000000)^1000000   # 2.718280469 — 6 знаков при n = 10⁶\nprint sum(1/fact(k), k, 0, 15) # 2.718281828 — все 10 знаков за 16 членов\nprint e\n<\/pre>\n<p>Ряд по факториалам сходится несравнимо быстрее, чем предел (1 + 1/n)<sup>n<\/sup>: факториал в знаменателе убивает члены ряда очень быстро. Среднее арифметико-геометрическое чисел 1 и 2 даёт 1,4567910310… после нескольких итераций — это пример сходимости с удвоением числа верных цифр на каждом шаге.<\/p>"],["Структура и стиль программы","<p>Даже короткие скрипты проще понимать и проверять, если следовать нескольким правилам.<\/p>\n<ul>\n<li><b>Сначала данные, потом вычисления.<\/b> Вынесите все числа в начало: <code>rate = 0.12<\/code>, <code>years = 5<\/code>. Менять параметры тогда удобно, а в формулах нет «магических» чисел.<\/li>\n<li><b>Говорящие имена.<\/b> <code>monthly_rate<\/code> понятнее, чем <code>r2<\/code>. Разрешены и русские имена: <code>ставка = 0.12<\/code>.<\/li>\n<li><b>Комментарии.<\/b> Объясняйте, <i>почему<\/i>, а не <i>что<\/i>: <code># ставка в месяц, а не в год<\/code>.<\/li>\n<li><b>Функции вместо копирования.<\/b> Если формула используется дважды, определите <code>f(x) = …<\/code>.<\/li>\n<li><b>Промежуточные print.<\/b> Выводите шаги и сверяйте с ручным расчётом хотя бы для простого случая.<\/li>\n<li><b>Проверка границ.<\/b> Подставьте 0, 1, отрицательное значение — результат должен быть осмысленным.<\/li>\n<\/ul>\n<p>Программа сохраняется в браузере автоматически, поэтому можно закрыть вкладку и вернуться позже. Для переноса кода копируйте текст из редактора: сайт не отправляет программы на сервер.<\/p>"]],"graphic":[["Управление графиком","<ul>\n<li><b>Колесо мыши<\/b> — масштаб относительно положения курсора; <b>перетаскивание<\/b> — сдвиг; <b>двойной щелчок<\/b> — возврат к начальному виду.<\/li>\n<li><b>На телефоне:<\/b> движение одним пальцем сдвигает график, щипок двумя пальцами меняет масштаб.<\/li>\n<li>При наведении курсора показывается вертикальная линия со значениями всех функций в этой точке.<\/li>\n<li>Кнопки «＋», «−» и «⌂» дублируют жесты, «⬇ PNG» сохраняет текущую картинку.<\/li>\n<li>Одновременно можно строить до шести функций; каждую можно скрыть флажком, не удаляя.<\/li>\n<\/ul>\n<p>Сетка и подписи подстраиваются под масштаб: шаг выбирается из «красивого» ряда 1–2–5 × 10<sup>n<\/sup>, поэтому подписи остаются читаемыми и при огромном приближении, и при сильном отдалении.<\/p>"],["Как записывать функции","<p>В поле ввода используйте переменную <code>x<\/code> и любые функции, известные калькулятору. Умножение между числом и переменной можно опускать: <code>2x<\/code>, <code>3sin(x)<\/code> эквивалентны <code>2*x<\/code> и <code>3*sin(x)<\/code>. Углы в графиках всегда измеряются в радианах — независимо от настройки в шапке сайта, как принято в математике.<\/p>\n<table class=\"lt\"><thead><tr><th>Что нужно<\/th><th>Как записать<\/th><\/tr><\/thead><tbody>\n<tr><td>Парабола<\/td><td><code>x^2 - 2*x - 3<\/code><\/td><\/tr>\n<tr><td>Гипербола<\/td><td><code>1/x<\/code><\/td><\/tr>\n<tr><td>Модуль<\/td><td><code>abs(x)<\/code><\/td><\/tr>\n<tr><td>Корень<\/td><td><code>sqrt(x)<\/code> (при x &lt; 0 не определён)<\/td><\/tr>\n<tr><td>Кубический корень<\/td><td><code>cbrt(x)<\/code> (определён для всех x)<\/td><\/tr>\n<tr><td>Экспонента, логарифм<\/td><td><code>exp(x)<\/code>, <code>ln(x)<\/code><\/td><\/tr>\n<tr><td>Затухающие колебания<\/td><td><code>exp(-x/4)*sin(3*x)<\/code><\/td><\/tr>\n<tr><td>Ступенька<\/td><td><code>floor(x)<\/code><\/td><\/tr>\n<tr><td>Кусочная функция<\/td><td><code>if(x &lt; 0, -x, x^2)<\/code><\/td><\/tr>\n<tr><td>Гауссиана<\/td><td><code>exp(-x^2/2)<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Если функция записана с ошибкой, под строкой появляется красное пояснение; остальные функции продолжают отображаться.<\/p>"],["Параметры a, b, c и «живые» графики","<p>В формулах доступны три параметра <code>a<\/code>, <code>b<\/code>, <code>c<\/code> с ползунками от −10 до 10. Они позволяют увидеть, как каждый коэффициент влияет на форму кривой. Попробуйте выражение <code>a*sin(b*x)+c<\/code>:<\/p>\n<ul>\n<li><b>a<\/b> — амплитуда: растягивает график по вертикали, отрицательное значение отражает его;<\/li>\n<li><b>b<\/b> — частота: период синусоиды равен 2π/|b|;<\/li>\n<li><b>c<\/b> — вертикальный сдвиг.<\/li>\n<\/ul>\n<p>Аналогично для параболы <code>a*(x-b)^2+c<\/code> параметры задают ширину, положение вершины по горизонтали и по вертикали: вершина находится в точке (b; c), а при a &gt; 0 ветви направлены вверх. Двигая ползунки, вы заметите закономерности преобразований графиков: замена x на x − b сдвигает график вправо на b; умножение аргумента на k сжимает график по горизонтали в k раз.<\/p>"],["Полярные координаты","<p>В полярной системе точка задаётся расстоянием r от начала и углом θ. Переключите тип строки на <b>r(θ)<\/b> и используйте переменную <code>t<\/code> (или <code>θ<\/code>) для угла. Переход к декартовым координатам: x = r·cos θ, y = r·sin θ. Поле «θ от 0 до … π» задаёт, сколько оборотов рисовать.<\/p>\n<table class=\"lt\"><thead><tr><th>Кривая<\/th><th>Формула r(θ)<\/th><th>θ до<\/th><\/tr><\/thead><tbody>\n<tr><td>Окружность<\/td><td><code>3<\/code><\/td><td>2π<\/td><\/tr>\n<tr><td>Кардиоида<\/td><td><code>1+cos(t)<\/code><\/td><td>2π<\/td><\/tr>\n<tr><td>Роза с 3 лепестками<\/td><td><code>3*sin(3*t)<\/code><\/td><td>π (3 лепестка при нечётном k)<\/td><\/tr>\n<tr><td>Роза с 8 лепестками<\/td><td><code>3*sin(4*t)<\/code><\/td><td>2π (чётное k даёт 2k лепестков)<\/td><\/tr>\n<tr><td>Спираль Архимеда<\/td><td><code>t/3<\/code><\/td><td>6π и более<\/td><\/tr>\n<tr><td>Лемниската<\/td><td><code>sqrt(abs(cos(2*t)))<\/code><\/td><td>2π<\/td><\/tr>\n<\/tbody><\/table>\n<p>Роза r = a·sin(kθ): при нечётном k получается k лепестков, при чётном — 2k.<\/p>"],["Анализ функции: корни, производная, интеграл","<p>Блок «Анализ выбранной функции» работает с функцией y(x). Выберите номер строки, отрезок и точку x₀:<\/p>\n<ul>\n<li><b>f(x₀)<\/b> — значение функции в точке.<\/li>\n<li><b>f′(x₀)<\/b> — производная: угловой коэффициент касательной. Положительная — функция растёт, отрицательная — убывает, равна нулю — возможна точка экстремума.<\/li>\n<li><b>∫ f dx<\/b> — определённый интеграл на отрезке [a; b]: площадь под кривой, где области ниже оси считаются со знаком «минус». Площадь между кривой и осью — это интеграл от |f|.<\/li>\n<li><b>Корни<\/b> — нули функции, найденные сканированием отрезка с последующим уточнением бисекцией; отмечаются розовыми точками на графике.<\/li>\n<\/ul>\n<p><b>Пример:<\/b> для sin(x) на [−5; 5] найдены корни −3,1416; 0 и 3,1416 (то есть −π, 0 и π). Интеграл по симметричному отрезку равен нулю, потому что синус — нечётная функция. Корни чётной кратности (как у x² в нуле) метод не видит, потому что функция не меняет знак.<\/p>"],["Диаграммы: какую выбрать","<ul>\n<li><b>Столбчатая<\/b> — сравнение категорий (продажи по месяцам, затраты по статьям). Столбцы всегда начинаются от нуля, иначе различия выглядят искажёнными.<\/li>\n<li><b>Круговая<\/b> — доли целого (структура бюджета). Подходит при 3–6 категориях; больше — читается плохо, лучше столбцы.<\/li>\n<li><b>Линейная<\/b> — динамика во времени. Точки на линии подчёркивают, что данные дискретны.<\/li>\n<li><b>Точечная с регрессией<\/b> — связь двух величин; на графике проводится прямая наименьших квадратов.<\/li>\n<li><b>Гистограмма<\/b> — распределение одной величины: данные группируются по интервалам, высота столбца — число значений в интервале.<\/li>\n<\/ul>\n<p>Формат данных: для столбчатой, круговой и линейной диаграмм — строки вида <code>Название: значение<\/code>; для точечной — пары <code>x y<\/code>; для гистограммы — просто набор чисел. После смены типа поле данных подставляет подходящий образец.<\/p>"],["Регрессия и гистограмма: формулы","<p>Линейная регрессия подбирает прямую <code>y = a + b·x<\/code>, минимизирующую сумму квадратов отклонений:<\/p>\n<div class=\"fx\">b = (n·Σxy − Σx·Σy) / (n·Σx² − (Σx)²) &nbsp; · &nbsp; a = (Σy − b·Σx) / n<\/div>\n<p><b>Коэффициент корреляции r<\/b> лежит в диапазоне от −1 до 1: близость к ±1 означает почти линейную связь, около 0 — связи нет. <b>R² = r²<\/b> показывает долю изменчивости y, объяснённую линейной моделью: R² = 0,92 означает, что прямая объясняет 92% разброса. Осторожно: корреляция не доказывает причинно-следственную связь, а единичный выброс способен сильно исказить прямую.<\/p>\n<p>Число интервалов гистограммы по правилу Стёрджеса: k = 1 + log₂(n). Для 20 наблюдений получается 6 интервалов, для 1000 — 11. Ширина интервала h = (max − min)/k. Слишком мало интервалов скрывает детали, слишком много — даёт «шум».<\/p>"],["Фракталы: множества Мандельброта и Жюлиа","<p>Фрактал — структура, повторяющая себя в любом масштабе. Оба множества задаются итерацией на комплексной плоскости <code>z → z² + c<\/code>:<\/p>\n<ul>\n<li><b>Множество Мандельброта:<\/b> z₀ = 0, а c — координата точки. Точка принадлежит множеству, если итерации не уходят в бесконечность. Чёрная область — точки множества; цвет остальных точек зависит от скорости «убегания».<\/li>\n<li><b>Множество Жюлиа:<\/b> константа c фиксирована, а начальным значением z₀ служит координата точки. Меняя c, вы получаете бесконечное семейство форм: от связных «островов» до «пыли» Фату.<\/li>\n<\/ul>\n<p>Точка считается «убежавшей», когда |z| превышает порог (здесь 16). Число итераций определяет детализацию: при сильном приближении увеличивайте его до 800–1500. Для плавных цветов применяется нормированный счётчик итераций с логарифмической поправкой, избавляющий от резких «ступенек». Щелчок по картинке приближает выбранную точку (в 2,5 раза), Shift+щелчок или правая кнопка — отдаляет. На первом шаге изображение строится в разрешении 640×400 пикселей, расчёт происходит в вашем браузере.<\/p>"],["Типичные проблемы и их решение","<ul>\n<li><b>График «пустой»:<\/b> масштаб слишком велик или мал — нажмите «⌂» или дважды щёлкните по полотну.<\/li>\n<li><b>Разрывы на tan(x), 1/x:<\/b> вертикальные асимптоты — калькулятор разрывает линию, а не соединяет ветви.<\/li>\n<li><b>Ступеньки у floor(x) и других разрывных функций<\/b> — это нормально, функция действительно прерывается.<\/li>\n<li><b>Нет графика у ln(x), sqrt(x) слева:<\/b> функции определены только при x &gt; 0 и x ≥ 0 соответственно.<\/li>\n<li><b>Ошибка «Неизвестная переменная»:<\/b> в графиках доступны <code>x<\/code>, <code>a<\/code>, <code>b<\/code>, <code>c<\/code> (для полярных — <code>t<\/code>/<code>θ<\/code>); другие имена не определены.<\/li>\n<li><b>Фрактал считается долго:<\/b> уменьшите число итераций или нажмите «Сброс» — на слабых устройствах 1500 итераций могут занять несколько секунд.<\/li>\n<\/ul>"],["Преобразования графиков: сдвиг, растяжение, отражение","<p>Зная график базовой функции y = f(x), легко представить график её «родственников». Небольшие изменения формулы дают предсказуемые геометрические преобразования:<\/p>\n<table class=\"lt\"><thead><tr><th>Формула<\/th><th>Что происходит с графиком<\/th><th>Пример<\/th><\/tr><\/thead><tbody>\n<tr><td><code>f(x) + c<\/code><\/td><td>сдвиг вверх на c<\/td><td><code>x^2 + 3<\/code><\/td><\/tr>\n<tr><td><code>f(x − c)<\/code><\/td><td>сдвиг вправо на c (не влево!)<\/td><td><code>(x-2)^2<\/code><\/td><\/tr>\n<tr><td><code>a·f(x)<\/code><\/td><td>растяжение по вертикали в a раз<\/td><td><code>3*sin(x)<\/code><\/td><\/tr>\n<tr><td><code>f(b·x)<\/code><\/td><td>сжатие по горизонтали в b раз<\/td><td><code>sin(2*x)<\/code><\/td><\/tr>\n<tr><td><code>−f(x)<\/code><\/td><td>отражение относительно оси x<\/td><td><code>-x^2<\/code><\/td><\/tr>\n<tr><td><code>f(−x)<\/code><\/td><td>отражение относительно оси y<\/td><td><code>exp(-x)<\/code><\/td><\/tr>\n<tr><td><code>|f(x)|<\/code><\/td><td>отрицательная часть «переворачивается» вверх<\/td><td><code>abs(sin(x))<\/code><\/td><\/tr>\n<\/tbody><\/table>\n<p>Попробуйте записать <code>a*sin(b*x + c)<\/code> и менять ползунки a, b, c: амплитуда определяется a, период равен 2π/b, а фазовый сдвиг равен −c/b. Это универсальная форма любого гармонического колебания.<\/p>\n<div class=
