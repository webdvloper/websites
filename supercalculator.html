<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SuperCalc 10 — суперкалькулятор с 10 режимами</title>
<meta name="description" content="SuperCalc 10 — суперкалькулятор в одном файле: простой, инженерный, бухгалтерский, финансовый, программируемый, графический, математический, географический, физический и информатический режимы.">
<meta name="theme-color" content="#07081a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230a0b1a'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' font-family='sans-serif' font-weight='700' fill='url(%23g)'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<script>
(function(){try{var t=JSON.parse(localStorage.getItem('sc10_theme'));if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --bg:#f2f4fc;--bg2:#e7eaf8;--surface:rgba(255,255,255,.80);--surface2:#ffffff;--field:rgba(30,40,110,.045);
  --text:#151934;--muted:#5a6288;--border:rgba(40,50,130,.16);--grid:rgba(40,50,130,.12);--plotbg:#ffffff;
  --shadow:0 10px 30px rgba(40,50,130,.12);
  --neon1:#06b6d4;--neon2:#7c3aed;--neon3:#e11d8f;--ok:#059669;--bad:#dc2626;
  --accent:#06b6d4;--accent-ink:color-mix(in srgb,var(--accent) 55%,#10143a);
  --radius:16px;color-scheme:light;
}
[data-theme=dark]{
  --bg:#07081a;--bg2:#0d0f26;--surface:rgba(17,19,46,.74);--surface2:#141735;--field:rgba(150,160,255,.07);
  --text:#e9ecff;--muted:#9aa3d6;--border:rgba(130,140,255,.24);--grid:rgba(150,160,255,.14);--plotbg:#0b0d24;
  --shadow:0 12px 40px rgba(0,0,0,.55);
  --neon1:#22e4ff;--neon2:#a66bff;--neon3:#ff4fae;--ok:#34d399;--bad:#fb7185;
  --accent-ink:color-mix(in srgb,var(--accent) 88%,#fff);color-scheme:dark;
}
body[data-mode=simple]{--accent:#22d3ee}
body[data-mode=engineering]{--accent:#fbbf24}
body[data-mode=accounting]{--accent:#34d399}
body[data-mode=finance]{--accent:#60a5fa}
body[data-mode=programmable]{--accent:#a78bfa}
body[data-mode=graphic]{--accent:#f472b6}
body[data-mode=math]{--accent:#e879f9}
body[data-mode=geo]{--accent:#2dd4bf}
body[data-mode=physics]{--accent:#fb7185}
body[data-mode=informatics]{--accent:#a3e635}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:15px/1.5 var(--font);color:var(--text);background:var(--bg);overflow-x:hidden;transition:background .4s,color .4s}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1100px 560px at 8% -8%,color-mix(in srgb,var(--neon2) 18%,transparent),transparent 60%),radial-gradient(900px 500px at 100% 0,color-mix(in srgb,var(--neon1) 16%,transparent),transparent 60%),var(--bg)}
.bg i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;filter:blur(90px);opacity:.26;animation:float 24s ease-in-out infinite alternate}
[data-theme=light] .bg i{opacity:.13}
.bg i:nth-child(1){background:var(--neon1);left:-12vmax;top:22vh}
.bg i:nth-child(2){background:var(--neon3);right:-14vmax;top:-8vh;animation-delay:-8s}
.bg i:nth-child(3){background:var(--neon2);left:32vw;bottom:-24vmax;animation-delay:-14s}
@keyframes float{to{transform:translate3d(6vw,-5vh,0) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hue{to{background-position:200% 0}}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
/* ---- Полосы прокрутки в стиле сайта ---- */
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:color-mix(in srgb,var(--bg2) 70%,transparent);border-radius:10px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--neon1),var(--neon2),var(--neon3));border-radius:10px;border:3px solid transparent;background-clip:padding-box;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
::-webkit-scrollbar-thumb:hover{border-width:2px}
::-webkit-scrollbar-corner{background:transparent}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--neon2) transparent}}
/* ---- Шапка и навигация ---- */
.sticky{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--border)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 28px/1 var(--font);color:#06101c;background:linear-gradient(135deg,var(--neon1),var(--neon2),var(--neon3));box-shadow:0 0 22px color-mix(in srgb,var(--neon2) 55%,transparent)}
.brand h1{margin:0;font-size:1.3rem;line-height:1.1;letter-spacing:.2px}
.brand h1 b{background:linear-gradient(90deg,var(--neon1),var(--neon3),var(--neon2),var(--neon1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.brand p{margin:2px 0 0;font-size:.78rem;color:var(--muted)}
.ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mini{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.mini select{width:auto;padding:6px 8px;border-radius:10px;font-size:.85rem}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1.2rem;cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{box-shadow:0 0 16px color-mix(in srgb,var(--neon1) 60%,transparent);border-color:var(--neon1)}
[data-theme=dark] .sun,[data-theme=light] .moon{display:none}
.modes{display:flex;gap:8px;padding:4px 18px 12px;max-width:1280px;margin:0 auto;overflow-x:auto;scrollbar-gutter:stable}
.mode{--c:#22d3ee;flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--border));background:color-mix(in srgb,var(--c) 8%,var(--surface2));color:var(--text);font:600 .86rem var(--font);cursor:pointer;transition:.18s;white-space:nowrap}
.mode:hover{transform:translateY(-1px);box-shadow:0 0 16px color-mix(in srgb,var(--c) 55%,transparent)}
.mode .ic{font-size:1.1rem}
.mode kbd{font:600 .66rem var(--mono);opacity:.55;border:1px solid currentColor;border-radius:5px;padding:0 4px}
.mode.on{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--neon2)));color:#05101c;border-color:transparent;box-shadow:0 0 22px color-mix(in srgb,var(--c) 65%,transparent)}
@media(min-width:1000px){.modes{flex-wrap:wrap;justify-content:center;overflow:visible}}
/* ---- Основа ---- */
main{max-width:1280px;margin:0 auto;padding:18px 18px 40px}
.panel{display:none}
.panel.on{display:block;animation:rise .35s ease}
.phead{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.pic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--accent) 18%,var(--surface2));border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 40%,transparent)}
.phead h2{margin:0;font-size:1.5rem;line-height:1.15}
.phead p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.card h3{margin:0 0 10px;font-size:1.02rem}
.card h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.tool{transition:box-shadow .25s,border-color .25s}
.tool:hover,.tool:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,var(--border));box-shadow:var(--shadow),0 0 26px color-mix(in srgb,var(--accent) 22%,transparent)}
.note{margin:-4px 0 10px;color:var(--muted);font-size:.84rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px;align-items:start}
.grid2>.wide,.wide.card{grid-column:1/-1}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font:600 .86rem var(--font);cursor:pointer;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--text);border-color:var(--accent)}
.tab.on{color:#05101c;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));border-color:transparent;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 50%,transparent)}
.pane[hidden]{display:none!important}
/* ---- Элементы форм ---- */
input,select,textarea{width:100%;background:var(--field);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
textarea{resize:vertical;font-family:var(--mono);font-size:.9rem;line-height:1.45}
option{background:var(--surface2);color:var(--text)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent);height:28px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
.field.wide{grid-column:1/-1}
.field.check{flex-direction:row;align-items:center;gap:8px;font-size:.88rem;color:var(--text)}
.hint{color:var(--muted);font-size:.72rem}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 14px;font:600 .88rem var(--font);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:.78rem;border-radius:9px}
.out{margin-top:12px}
.out:empty{display:none}
.err{color:var(--bad);font-weight:600;padding:10px 12px;border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:12px;background:color-mix(in srgb,var(--bad) 10%,transparent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:0}
.kv>div{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--field);min-width:0}
.kv dt{font-size:.74rem;color:var(--muted);margin:0}
.kv dd{margin:2px 0 0;font:600 1.02rem var(--mono);color:var(--accent-ink);word-break:break-word;cursor:copy}
.kv dd small{color:var(--muted);font-weight:400}
.kv .big{grid-column:1/-1}.kv .big dd{font-size:1.5rem}
.scroll{overflow:auto;max-height:380px;border:1px solid var(--border);border-radius:12px;margin-top:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);color:var(--muted);font-weight:600;font-size:.76rem;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:hover{background:var(--field)}
.mx td{text-align:center;font-family:var(--mono)}
canvas{display:block;width:100%;height:320px;border-radius:12px;background:var(--plotbg);border:1px solid var(--border)}
canvas.map{height:auto;aspect-ratio:2/1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:var(--field);color:var(--text);font:500 .78rem var(--mono);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent-ink)}
/* ---- Калькулятор ---- */
.display{padding:6px 4px 2px}
.badges{display:flex;gap:6px;min-height:22px;align-items:center}
.badge{font:700 .68rem var(--mono);padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent-ink);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.badge.off{display:none}
button.badge{cursor:pointer}
.expr{background:transparent!important;border:0!important;box-shadow:none!important;text-align:right;font:500 1.3rem var(--mono);padding:8px 4px;color:var(--text)}
.result{display:block;width:100%;appearance:none;background:none;border:0;color:var(--accent-ink);text-align:right;font:700 2.5rem/1.15 var(--mono);padding:2px 4px;overflow-x:auto;white-space:nowrap;cursor:copy;text-shadow:0 0 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.result.stale{opacity:.55}
.sub{min-height:1.4em;text-align:right;color:var(--muted);font:.78rem var(--mono);padding:0 4px;display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap}
.sub.err{color:var(--bad)}
.keys{display:grid;gap:8px;margin-top:12px}
.k4{grid-template-columns:repeat(4,1fr)}.k6{grid-template-columns:repeat(6,1fr)}
.key{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:14px;height:54px;font:600 1.08rem var(--font);cursor:pointer;transition:transform .08s,box-shadow .15s,border-color .15s;padding:0;-webkit-tap-highlight-color:transparent}
.key:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 40%,transparent)}
.key:active{transform:scale(.94)}
.key.fn{font-size:.9rem;color:var(--muted)}
.key.op{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.key.danger{color:var(--bad)}
.key.on{background:color-mix(in srgb,var(--accent) 30%,var(--surface2));color:var(--text);border-color:var(--accent)}
.key.eq{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent;font-size:1.3rem}
.span4{grid-column:1/-1}
.sci .key{height:48px;font-size:.95rem}
.hist .hlist{display:flex;flex-direction:column;gap:6px;max-height:430px;overflow:auto}
.hitem{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:0;background:var(--field);border:1px solid var(--border);border-radius:10px;padding:6px 10px;cursor:pointer;color:var(--text);font-family:var(--mono)}
.hitem:hover{border-color:var(--accent)}
.hitem small{color:var(--muted);font-size:.78rem;word-break:break-all}
.hitem b{color:var(--accent-ink);font-size:1.05rem}
.empty{color:var(--muted);font-size:.85rem;text-align:center;padding:18px 0}
/* ---- Лента ---- */
.paper{background:var(--field);border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--border));border-radius:12px;padding:10px 12px;font:.95rem var(--mono);max-height:420px;overflow:auto;min-height:160px}
.ln{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.ln.total{border-top:1px solid var(--text);margin-top:4px;padding-top:6px;font-weight:700;color:var(--accent-ink)}
.ln.info{color:var(--muted);font-size:.85rem}
.ln span:last-child{color:var(--muted)}
.ln.total span:last-child{color:inherit}
.acc{font:700 1.9rem var(--mono);text-align:right;color:var(--accent-ink);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent);padding:2px 4px}
/* ---- Редактор ---- */
.code{font-family:var(--mono);min-height:300px;tab-size:2;white-space:pre}
.console .ln{justify-content:flex-start;gap:12px}
.console .n{color:var(--muted);min-width:2ch;text-align:right}
.console .e{color:var(--bad)}.console .a{color:var(--accent-ink)}.console .d{color:var(--muted)}
/* ---- График ---- */
.gl{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:900px){.gl{grid-template-columns:1fr}}
.grow{display:grid;grid-template-columns:auto auto 74px 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.grow select{padding:6px 4px}
.dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 10px currentColor;background:currentColor}
.gcv{height:min(66vh,560px);min-height:320px;cursor:crosshair;touch-action:none}
.sl{display:grid;grid-template-columns:22px 1fr 44px;gap:8px;align-items:center;font:.82rem var(--mono)}
/* ---- Биты ---- */
.bits{display:grid;gap:6px;margin:10px 0}
.byte{display:flex;gap:4px;align-items:center}
.byte i{font:normal .66rem var(--mono);color:var(--muted);width:3ch;text-align:right;margin-right:4px}
.bit{flex:1;max-width:46px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--field);color:var(--muted);font:700 .95rem var(--mono);cursor:pointer;padding:0;transition:.12s}
.bit.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--neon2)));color:#05101c;border-color:transparent;box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.s1{color:var(--bad)}.s2{color:var(--ok)}.s3{color:var(--neon1)}
.mono{font-family:var(--mono);word-break:break-all}
.big-eq{font:700 1.35rem var(--mono);text-align:center;padding:10px;border-radius:12px;background:var(--field);border:1px solid var(--border);margin:6px 0 12px;color:var(--accent-ink)}
.res-big{font:700 1.7rem var(--mono);color:var(--accent-ink);text-shadow:0 0 16px color-mix(in srgb,var(--accent) 45%,transparent);word-break:break-all}
/* ---- Подвал, подсказки ---- */
details.learn{margin-top:18px;padding:0}
details.learn summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none}
details.learn summary::-webkit-details-marker{display:none}
details.learn summary::before{content:"📚 "}
details.learn[open] summary{border-bottom:1px solid var(--border)}
details.learn ul{margin:0;padding:12px 18px 14px 36px;display:grid;gap:7px;color:var(--muted)}
details.learn li b{color:var(--text)}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:10px 18px 28px}
footer b{color:var(--text)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:var(--surface2);color:var(--text);border:1px solid var(--accent);padding:10px 16px;border-radius:12px;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 45%,transparent);transition:.25s;z-index:100;max-width:90vw;font-size:.9rem}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){
  main{padding:12px 10px 30px}.top{padding:8px 12px}.modes{padding:2px 12px 10px}
  .brand p{display:none}.result{font-size:2rem}.key{height:50px}.sci .key{height:42px;font-size:.82rem}.keys{gap:6px}
  .card{padding:12px}.phead h2{font-size:1.2rem}.pic{width:46px;height:46px}
  .grow{grid-template-columns:auto auto 1fr auto}.grow select{grid-column:1/-1;order:5}

function reg(c,fn){c._draw=()=>{if(!c.clientWidth||!c.clientHeight)return;fn(fit(c))};CANV.add(c);RO.observe(c);c._draw()}
function ticks(a,b,n=5){const r=(b-a)||1,raw=r/n,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p,st=(m<1.5?1:m<3?2:m<7?5:10)*p,out=[];for(let v=Math.ceil(a/st)*st;v<=b+st*1e-9;v+=st)out.push(+v.toFixed(12));return out}

function chartLine(c,series,o={}){
  reg(c,({g,w,h:H})=>{
    const P={l:62,r:16,t:28,b:30},all=series.flatMap(s=>s.pts);
    if(!all.length)return;
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    for(const p of all){if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
    if(o.y0!==undefined)y0=o.y0;
    if(x0===x1)x1=x0+1;if(y0===y1)y1=y0+1;
    const pd=(y1-y0)*.05;y1+=pd;if(o.y0===undefined)y0-=pd;
    const X=x=>P.l+(x-x0)/(x1-x0)*(w-P.l-P.r),Y=y=>H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);

    for(const t of ticks(y0,y1,5)){const y=Y(t);g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillText(CF.format(t),P.l-6,y)}
    g.textAlign='center';g.textBaseline='top';
    for(const t of ticks(x0,x1,6)){const x=X(t);g.beginPath();g.moveTo(x,P.t);g.lineTo(x,H-P.b);g.stroke();g.fillText(o.xfmt?o.xfmt(t):CF.format(t),x,H-P.b+6)}
    series.forEach((s,i)=>{
      const col=s.color||PAL[i%PAL.length];
      g.beginPath();s.pts.forEach((p,k)=>k?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1])));
      g.shadowColor=col;g.shadowBlur=8;g.strokeStyle=col;g.lineWidth=2.2;g.stroke();g.shadowBlur=0;
      if(i===0&&o.fill!==false&&s.pts.length>1){
        g.lineTo(X(s.pts[s.pts.length-1][0]),Y(Math.max(y0,Math.min(0,y1))));g.lineTo(X(s.pts[0][0]),Y(Math.max(y0,Math.min(0,y1))));g.closePath();
        const gr=g.createLinearGradient(0,P.t,0,H-P.b);gr.addColorStop(0,col+'55');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.fill();
      }
      if(o.dots){g.fillStyle=col;s.pts.forEach(p=>{g.beginPath();g.arc(X(p[0]),Y(p[1]),3.5,0,7);g.fill()})}
    });

    series.forEach((s,i)=>{if(!s.name)return;const col=s.color||PAL[i%PAL.length];g.fillStyle=col;g.fillRect(lx,8,10,10);g.fillStyle=txt;g.fillText(s.name,lx+14,13);lx+=g.measureText(s.name).width+34});
  });
}
function chartBars(c,items,o={}){
  reg(c,({g,w,h:H})=>{
    if(!items.length)return;
    const P={l:56,r:12,t:20,b:o.rot?60:34},vals=items.map(i=>i.value);
    let y1=Math.max(...vals,0),y0=Math.min(...vals,0);if(y1===y0)y1=y0+1;
    const X0=P.l,W=w-P.l-P.r,bw=W/items.length,Y=y=>H-P.b-(y-y0)/(y1-y0)*(H-P.t-P.b);
    g.font='11px system-ui,sans-serif';g.strokeStyle=cvar('--grid');g.fillStyle=cvar('--muted');g.textAlign='right';g.textBaseline='middle';
    for(const t of ticks(y0,y1,5)){const y=Y(t);g.beginPath();g.moveTo(P.l,y);g.lineTo(w-P.r,y);g.stroke();g.fillText(CF.format(t),P.l-6,y)}
    items.forEach((it,i)=>{
      const col=PAL[i%PAL.length],x=X0+i*bw+bw*.14,ww=bw*.72,yt=Y(Math.max(it.value,0)),yb=Y(Math.min(it.value,0));
      const gr=g.createLinearGradient(0,yt,0,yb);gr.addColorStop(0,col);gr.addColorStop(1,col+'55');
      g.shadowColor=col;g.shadowBlur=10;g.fillStyle=gr;
      g.beginPath();if(g.roundRect)g.roundRect(x,yt,ww,Math.max(1,yb-yt),5);else g.rect(x,yt,ww,Math.max(1,yb-yt));g.fill();g.shadowBlur=0;
      g.fillStyle=cvar('--muted');g.textAlign='center';g.textBaseline='top';
      if(o.rot){g.save();g.translate(x+ww/2,H-P.b+6);g.rotate(Math.PI/5);g.textAlign='left';g.fillText(String(it.label).slice(0,14),0,0);g.restore()}
      else if(items.length<=24)g.fillText(String(it.label).slice(0,10),x+ww/2,H-P.b+8);
      if(items.length<=16){g.textBaseline='bottom';g.fillStyle=cvar('--text');g.fillText(CF.format(it.value),x+ww/2,yt-3)}
    });
  });
}
function chartPie(c,items){
  reg(c,({g,w,h:H})=>{
    const tot=items.reduce((s,i)=>s+Math.max(0,i.value),0);if(!tot)return;
    const R=Math.min(H/2-16,w/3),cx=Math.min(w/2,R+24+ (w>600?w*.12:0)),cy=H/2;let a=-Math.PI/2;
    items.forEach((it,i)=>{
      const v=Math.max(0,it.value),da=v/tot*Math.PI*2,col=PAL[i%PAL.length];
      g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,a,a+da);g.closePath();g.shadowColor=col;g.shadowBlur=12;g.fillStyle=col;g.fill();g.shadowBlur=0;
      g.strokeStyle=cvar('--plotbg');g.lineWidth=2;g.stroke();a+=da;
    });
    g.fillStyle=cvar('--plotbg');g.beginPath();g.arc(cx,cy,R*.52,0,7);g.fill();
    g.font='12px system-ui,sans-serif';g.textBaseline='middle';g.textAlign='left';
    const lx=cx+R+30,ly=Math.max(14,cy-items.length*11);
    items.slice(0,16).forEach((it,i)=>{g.fillStyle=PAL[i%PAL.length];g.fillRect(lx,ly+i*22-6,12,12);g.fillStyle=cvar('--text');g.fillText(String(it.label).slice(0,18)+' — '+(Math.max(0,it.value)/tot*100).toFixed(1)+'%',lx+18,ly+i*22)});
  });
}

function Tool(parent,cfg){
  const card=h('section','card tool'+(cfg.wide?' wide':''));
  if(cfg.title)card.append(h('h3','',cfg.title));
  if(cfg.note)card.append(h('p','note',cfg.note));
  const form=h('div','form'),ctl={},L={};
  for(const f of cfg.fields){
    const lab=h('label','field'+(f.wide?' wide':''));
    let c;
    if(f.type==='check'){lab.classList.add('check');c=h('input');c.type='checkbox';lab.append(c,h('span','',esc(f.label)))}
    else{
      lab.append(h('span','',esc(f.label)));
      if(f.type==='select'){c=h('select');for(const o of f.options){const [v,t]=Array.isArray(o)?o:[o,o];c.append(new Option(t,v))}}
      else if(f.type==='textarea'){c=h('textarea');c.rows=f.rows||4;c.spellcheck=false}
      else{c=h('input');c.type=f.type==='date'?'date':'text';c.autocomplete='off';c.spellcheck=false}
      lab.append(c);
    }
    if(f.ph)c.placeholder=f.ph;
    if(f.hint)lab.append(h('small','hint',esc(f.hint)));
    ctl[f.id]=c;L[f.id]=f.label;form.append(lab);
  }
  const setDefaults=()=>{for(const f of cfg.fields){const c=ctl[f.id];if(f.type==='check')c.checked=!!f.value;else if(f.value!=null)c.value=f.value;else c.value=''}};
  setDefaults();
  const bar=h('div','row');bar.style.marginTop='10px';
  const out=h('div','out');
  const get=()=>{const v={};for(const f of cfg.fields){const c=ctl[f.id];v[f.id]=f.type==='check'?c.checked:(f.type==='select'||f.type==='text'||f.type==='textarea'||f.type==='date')?c.value:parseNum(c.value)}Object.defineProperty(v,'L',{value:L});return v};
  const showErr=e=>{out.innerHTML=`<div class="err">⚠ ${esc(e&&e.message?e.message:e)}</div>`};
  const go=()=>{
    try{
      const r=cfg.run(get(),out,card);
      if(r&&typeof r.then==='function')r.then(x=>{if(typeof x==='string')out.innerHTML=x}).catch(showErr);
      else if(typeof r==='string')out.innerHTML=r;
    }catch(e){showErr(e)}
  };
  let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(go,70)};
  form.addEventListener('input',later);form.addEventListener('change',later);
  const rb=h('button','btn sm','Сбросить');rb.type='button';rb.onclick=()=>{setDefaults();go()};
  bar.append(rb);
  (cfg.btns||[]).forEach(b=>{const x=h('button','btn sm',b.t);x.type='button';x.onclick=()=>{try{b.fn(get(),out,card)}catch(e){showErr(e)}};bar.append(x)});
  card.append(form,bar,out);
  if(cfg.visual){const vs=Array.isArray(cfg.visual)?cfg.visual:[cfg.visual];vs.forEach(v=>{v.style.marginTop='12px';card.append(v)})}
  parent.append(card);
  go();
  return{card,ctl,out,go,set:(id,val)=>{ctl[id].value=val}};
}
function Tabs(root,items,key){
  const bar=h('div','tabs');bar.setAttribute('role','tablist');

function Calc(root,cfg){
  const wrap=h('div','split'),box=h('div','card calc'+(cfg.sci?' sci':'')),disp=h('div','display'),bar=h('div','badges');
  const inp=h('input','expr');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder='Введите выражение';inp.setAttribute('aria-label','Выражение');inp.enterKeyHint='go';
  if(matchMedia('(pointer:coarse)').matches)inp.inputMode='none';
  const res=h('button','result','0');res.type='button';res.title='Копировать результат';
  const sub=h('div','sub','&nbsp;');
  const bM=h('span','badge off','M'),bA=h('button','badge','');bA.type='button';bA.title='Сменить единицы углов';
  bar.append(bM);if(cfg.sci)bar.append(bA);
  disp.append(bar,inp,res,sub);
  const pad=h('div','keys k'+cfg.cols);box.append(disp,pad);
  const side=h('div','card hist');
  side.innerHTML='<div class="row between"><h3>История</h3><button type="button" class="btn sm">Очистить</button></div><div class="hlist"></div>';
  wrap.append(box,side);root.append(wrap);
  const hl=$('.hlist',side);
  let fmode='auto',shift=false,mem=0,done=false;
  const hist=store.get('hist_'+cfg.id,[]);
  const view=n=>{
    if(typeof n!=='number'||Number.isNaN(n))return 'Ошибка';
    if(!isFinite(n))return n>0?'∞':'-∞';
    if(fmode==='sci'&&n!==0)return n.toExponential(Math.min(Math.max(S.digits-1,0),14)).replace(/\.?0+e/,'e').replace('e+','e');
    if(fmode==='eng')return engFmt(n);
    return fmt(n);
  };
  const compute=()=>{const r=compile(inp.value,{dec:cfg.dec})(ENV);return isFinite(r)?+r.toPrecision(14):r};
  const extra=r=>{
    if(!isFinite(r)||r===0)return '&nbsp;';
    const e=Math.floor(Math.log10(Math.abs(r))/3)*3,m=r/Math.pow(10,e),p=SI[e];
    return `<span>${esc(r.toExponential(4))}</span><span>${esc(engFmt(r))}</span>${e!==0&&p!==undefined?`<span>${+m.toPrecision(6)} ${p}</span>`:''}`;
  };
  function preview(){
    sub.classList.remove('err');
    const s=inp.value.trim();
    if(!s){res.textContent='0';res.classList.remove('stale');sub.innerHTML='&nbsp;';return}
    try{const r=compute();res.textContent=view(r);res.classList.remove('stale');sub.innerHTML=cfg.sci?extra(r):'&nbsp;'}
    catch(e){res.classList.add('stale');sub.innerHTML='&nbsp;'}
  }
  function renderHist(){
    hl.innerHTML='';
    if(!hist.length){hl.append(h('div','empty','Здесь появятся ваши вычисления'));return}
    hist.slice().reverse().forEach(it=>{
      const b=h('button','hitem');b.type='button';b.innerHTML=`<small>${esc(it.e)}</small><b>= ${esc(it.r)}</b>`;
      b.onclick=()=>{inp.value=it.e;done=false;preview();inp.focus()};hl.append(b);
    });
  }
  function eq(){
    const s=inp.value.trim();if(!s)return;
    try{
      const r=compute();
      if(Number.isNaN(r))throw new Error('Результат не определён');
      ENV.v.ans=r;res.textContent=view(r);res.classList.remove('stale');sub.innerHTML=cfg.sci?extra(r):'&nbsp;';
      const last=hist[hist.length-1];
      if(!last||last.e!==s||last.r!==view(r)){hist.push({e:s,r:view(r)});if(hist.length>60)hist.shift();store.set('hist_'+cfg.id,hist);renderHist()}
      done=true;
    }catch(e){res.textContent='Ошибка';res.classList.remove('stale');sub.textContent=e.message;sub.classList.add('err')}
  }
  function ins(t){
    if(done){inp.value=/^[+\-*\/^%]/.test(t)?'ans':'';done=false}
    const a=inp.selectionStart==null?inp.value.length:inp.selectionStart,b=inp.selectionEnd==null?a:inp.selectionEnd;
    inp.setRangeText(t,a,b,'end');inp.focus({preventScroll:true});preview();
  }
  const curVal=()=>{try{return inp.value.trim()?compute():ENV.v.ans}catch(e){return ENV.v.ans}};
  const memBadge=()=>bM.classList.toggle('off',mem===0);
  const CMD={
    eq,
    clear(){inp.value='';done=false;preview();inp.focus({preventScroll:true})},
    back(){if(done){CMD.clear();return}const a=inp.selectionStart,b=inp.selectionEnd;if(a!==b)inp.setRangeText('',a,b,'end');else if(a>0)inp.setRangeText('',a-1,a,'end');preview();inp.focus({preventScroll:true})},
    neg(){
      if(done){inp.value='ans';done=false}
      let v=inp.value,m;
      if((m=v.match(/\(-([\w.π]+)\)$/)))v=v.slice(0,m.index)+m[1];
      else if((m=v.match(/[\w.π]+$/)))v=v.slice(0,m.index)+'(-'+m[0]+')';
      else v+='-';
      inp.value=v;preview();
    },
    inv(){if(!inp.value.trim())return;inp.value='1/('+inp.value+')';done=false;preview()},
    mc(){mem=0;memBadge()},mr(){ins(fmt(mem))},
    mp(){const v=curVal();if(isFinite(v)){mem+=v;memBadge();toast('M = '+fmt(mem))}},
    mm(){const v=curVal();if(isFinite(v)){mem-=v;memBadge();toast('M = '+fmt(mem))}},
    shift(){shift=!shift;refresh()},
    fmt(){fmode=fmode==='auto'?'sci':fmode==='sci'?'eng':'auto';refresh();preview()},
    ang(){setAngle(S.angle==='deg'?'rad':S.angle==='rad'?'grad':'deg')}
  };
  const keyEls=[];
  cfg.keys.forEach(k=>{
    const [l,kind,val,cls,l2,v2]=k,b=h('button','key '+(cls||''),esc(l));b.type='button';
    b.addEventListener('click',()=>{
      if(kind==='c'){CMD[val]();return}
      ins(shift&&v2!==undefined?v2:val);if(shift){shift=false;refresh()}
    });
    pad.append(b);keyEls.push([b,k]);
  });
  function refresh(){
    keyEls.forEach(([b,k])=>{
      let l=shift&&k[4]?k[4]:k[0];
      if(k[2]==='ang')l=({deg:'DEG',rad:'RAD',grad:'GRAD'})[S.angle];
      if(k[2]==='fmt')l=({auto:'Авто',sci:'Sci',eng:'Eng'})[fmode];
      b.textContent=l;if(k[2]==='shift')b.classList.toggle('on',shift);
    });
    bA.textContent=({deg:'DEG',rad:'RAD',grad:'GRAD'})[S.angle];
  }
  bA.onclick=CMD.ang;
  inp.addEventListener('input',()=>{done=false;preview()});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();eq()}else if(e.key==='Escape')CMD.clear()});
  res.onclick=()=>copy(res.textContent);
  $('.btn',side).onclick=()=>{hist.length=0;store.set('hist_'+cfg.id,hist);renderHist()};
  window.addEventListener('settings',()=>{refresh();preview()});
  refresh();renderHist();
  return{inp,ins};
}

function converter(el){
  const card=h('section','card tool wide');card.innerHTML='<h3>Конвертер единиц</h3>';
  const f=h('div','form');
  const mk=(l,c)=>{const lab=h('label','field');lab.append(h('span','',l),c);f.append(lab);return c};
  const cat=mk('Величина',h('select')),val=mk('Значение',h('input')),from=mk('Из',h('select')),to=mk('В',h('select'));
  val.value='1';val.autocomplete='off';
  Object.keys(UNITS).forEach(k=>cat.append(new Option(UNITS[k].n,k)));
  const out=h('div','out'),sw=h('button','btn sm','⇄ Поменять');sw.type='button';
  card.append(f,sw,out);el.append(card);
  const fill=()=>{const u=Object.keys(UNITS[cat.value].u);from.innerHTML=to.innerHTML='';u.forEach(x=>{from.append(new Option(x,x));to.append(new Option(x,x))});from.value=u[0];to.value=u[1]||u[0];calc()};
  const conv=(v,a,b)=>{const C=UNITS[cat.value];return C.temp?FK[b](TK[a](v)):v*C.u[a]/C.u[b]};
  function calc(){
    const v=parseNum(val.value);
    if(!isFinite(v)){out.innerHTML='<div class="err">Введите число</div>';return}
    const r=conv(v,from.value,to.value);
    out.innerHTML=kv([[esc(from.value)+' → '+esc(to.value),nf(r,10),esc(to.value),'big']])+tbl(['Единица','Значение'],Object.keys(UNITS[cat.value].u).map(u=>[esc(u),nf(conv(v,from.value,u),10)]));
  }
  cat.onchange=fill;[val,from,to].forEach(x=>x.addEventListener('input',calc));
  sw.onclick=()=>{const t=from.value;from.value=to.value;to.value=t;calc()};
  fill();
}

function numWords(n,fem){
  if(n===0)return 'ноль';
  const U=['','один','два','три','четыре','пять','шесть','семь','восемь','девять','десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
  const UF=['','одна','две'],T=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const H=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];
  const SC=[null,['тысяча','тысячи','тысяч',true],['миллион','миллиона','миллионов'],['миллиард','миллиарда','миллиардов'],['триллион','триллиона','триллионов']];
  const pl=(x,f)=>{const a=x%100,b=x%10;return a>10&&a<15?f[2]:b===1?f[0]:b>1&&b<5?f[1]:f[2]};
  const tri=(x,f)=>{const w=[H[Math.floor(x/100)]],r=x%100;if(r<20)w.push(f&&r<3?UF[r]:U[r]);else{w.push(T[Math.floor(r/10)]);const o=r%10;w.push(f&&o<3?UF[o]:U[o])}return w.filter(Boolean).join(' ')};
  const parts=[];let i=0,x=n;
  while(x>0){const t=x%1000;x=Math.floor(x/1000);if(t){const sc=SC[i];const w=tri(t,i===0?fem:!!(sc&&sc[3]));parts.unshift(sc?w+' '+pl(t,sc):w)}i++}
  return parts.join(' ');
}

    render();
  }

    ['4',()=>app('4')],['5',()=>app('5')],['6',()=>app('6')],['×',()=>op('*'),'op'],
    ['1',()=>app('1')],['2',()=>app('2')],['3',()=>app('3')],['−',()=>op('-'),'op'],
    ['0',()=>app('0')],['00',()=>app('00')],[',',()=>app('.')],['+',()=>op('+'),'op'],
    ['±',()=>{const s=entry.value.trim();entry.value=s.startsWith('-')?s.slice(1):'-'+s},'fn'],['CE',()=>{entry.value=''},'danger'],['⌫',()=>{entry.value=entry.value.slice(0,-1)},'fn'],['=',total,'eq'],

   РЕЖИМ 5: ПРОГРАММИРУЕМЫЙ
   ===================================================================== */
const NAME='[A-Za-z_\\u0370-\\u03ff\\u0400-\\u04ff][A-Za-z_0-9\\u0370-\\u03ff\\u0400-\\u04ff]*';
function runScript(src){
  const env={v:Object.create(null),fn:Object.create(null)},out=[];let steps=0;const LIM=3e6;
  const reFn=new RegExp('^('+NAME+')\\s*\\(([^)]*)\\)\\s*=(?!=)\\s*(.+)$','i');
  const reAs=new RegExp('^('+NAME+')\\s*([-+*/^])?=(?!=)\\s*(.+)$','i');
  const reFor=new RegExp('^for\\s+('+NAME+')\\s*=\\s*(.+?)\\s*\\.\\.\\s*(.+?)(?:\\s+step\\s+(.+?))?\\s*:\\s*(.+)$','i');
  const reWhile=/^while\s+(.+?)\s*:\s*(.+)$/i,reIf=/^if\s+(.+?)\s*:\s*(.+)$/i,rePrint=/^print\s+(.+)$/i;
  const splitTop=s=>{const r=[];let d=0,cur='';for(const ch of s){if(ch==='(')d++;else if(ch===')')d--;if(ch===';'&&d===0){r.push(cur);cur=''}else cur+=ch}r.push(cur);return r.map(x=>x.trim()).filter(Boolean)};
  const ev=s=>compile(s)(env);
  function exec(line,silent,ln){
    line=line.trim();if(!line)return;
    if(++steps>LIM)throw new Error('Превышен лимит операций (возможен бесконечный цикл)');
    let m;
    if((m=reFor.exec(line))){
      const nm=m[1],a=ev(m[2]),b=ev(m[3]),st=m[4]?ev(m[4]):1;if(!st)throw new Error('Шаг цикла не может быть 0');
      const body=splitTop(m[5]);
      for(let i=a;st>0?i<=b+1e-12:i>=b-1e-12;i+=st){env.v[nm]=i;body.forEach(x=>exec(x,true,ln))}
      return;
    }
    if((m=reWhile.exec(line))){const body=splitTop(m[2]);while(ev(m[1])){body.forEach(x=>exec(x,true,ln));if(++steps>LIM)throw new Error('Превышен лимит операций (возможен бесконечный цикл)')}return}
    if((m=reIf.exec(line))){if(ev(m[1]))splitTop(m[2]).forEach(x=>exec(x,true,ln));return}
    if((m=rePrint.exec(line))){const r=ev(m[1]);env.v.ans=r;out.push({ln,t:'a',text:fmt(r)});return}
    if((m=reFn.exec(line))){
      const name=m[1],ps=m[2].split(',').map(s=>s.trim()).filter(Boolean),body=compile(m[3]);
      env.fn[name]=(...a)=>{const lv={v:Object.create(env.v),fn:env.fn};ps.forEach((p,i)=>{lv.v[p]=a[i]});return body(lv)};
      if(!silent)out.push({ln,t:'d',text:'ƒ '+name+'('+ps.join(', ')+') определена'});return;
    }
    if((m=reAs.exec(line))){
      let val=ev(m[3]);const o=m[2];
      if(o){const cur=env.v[m[1]];if(cur===undefined)throw new Error('Переменная «'+m[1]+'» не определена');val=o==='+'?cur+val:o==='-'?cur-val:o==='*'?cur*val:o==='/'?cur/val:Math.pow(cur,val)}

function parseBig(s,base){
  s=String(s).trim().replace(/[\s_]/g,'').toLowerCase();let neg=false;
  if(s[0]==='-'){neg=true;s=s.slice(1)}else if(s[0]==='+')s=s.slice(1);
  if(base===16&&s.startsWith('0x'))s=s.slice(2);if(base===2&&s.startsWith('0b'))s=s.slice(2);if(base===8&&s.startsWith('0o'))s=s.slice(2);
  if(!s)throw new Error('Введите число');
  let r=0n;const B=BigInt(base);
  for(const ch of s){const d=parseInt(ch,36);if(Number.isNaN(d)||d>=base)throw new Error('Недопустимая цифра «'+ch+'» для основания '+base);r=r*B+BigInt(d)}
  return neg?-r:r;
}
const ipn=s=>{const p=s.trim().split('.');if(p.length!==4||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))throw new Error('Неверный IPv4-адрес');return((+p[0]<<24)|(+p[1]<<16)|(+p[2]<<8)|+p[3])>>>0};
const ips=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const bin32=n=>(n>>>0).toString(2).padStart(32,'0').replace(/(.{8})(?=.)/g,'$1.');
const CRCT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(const x of b)c=CRCT[(c^x)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
const hex2=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');

const nav=$('#nav'),main=$('#main');
MODES.forEach((m,i)=>{
  const b=h('button','mode');b.type='button';b.style.setProperty('--c',m.color);b.dataset.id=m.id;b.title=m.desc+'  (Alt+'+((i+1)%10)+')';
  b.innerHTML=`<span class="ic">${m.icon}</span><span class="nm">${m.name}</span><kbd>${(i+1)%10}</kbd>`;
  b.onclick=()=>go(m.id);nav.append(b);
  const p=h('section','panel');p.id='p-'+m.id;p.setAttribute('aria-label',m.title);main.append(p);
});
function go(id,quiet){
  const m=MODES.find(x=>x.id===id)||MODES[0],p=$('#p-'+m.id);
  $$('.panel').forEach(x=>x.classList.toggle('on',x===p));
  $$('.mode',nav).forEach(b=>{const on=b.dataset.id===m.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  document.body.dataset.mode=m.id;store.set('mode',m.id);
  if(!p.dataset.built){
    p.dataset.built=1;
    p.innerHTML=`<div class="phead"><span class="pic" aria-hidden="true">${m.icon}</span><div><h2>${m.title}</h2><p>${m.desc}</p></div></div>`;
    const body=h('div','pbody');p.append(body);
    try{m.build(body)}catch(e){body.innerHTML='<div class="err">Ошибка построения режима: '+esc(e.message)+'</div>';console.error(e)}
    learn(p,m.learn);
  }
  if(!quiet){try{history.replaceState(null,'','#'+m.id)}catch(e){}}
  const act=$$('.nav .mode.on',document)[0]||$('.mode.on',nav);if(act&&act.scrollIntoView&&nav.scrollWidth>nav.clientWidth)act.scrollIntoView({inline:'center',block:'nearest'});
  requestAnimationFrame(()=>{CANV.forEach(c=>c._draw&&c._draw());if(!matchMedia('(pointer:coarse)').matches){const i=$('.expr',p);if(i&&i.offsetParent)i.focus({preventScroll:true})}});
}
function setTheme(t){
  document.documentElement.dataset.theme=t;store.set('theme',t);
  const mt=$('meta[name=theme-color]');if(mt)mt.content=t==='dark'?'#07081a':'#f2f4fc';
  CANV.forEach(c=>c._draw&&c._draw());
}
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(document.documentElement.dataset.theme||'dark');
$('#angle').value=S.angle;$('#angle').onchange=e=>setAngle(e.target.value);
$('#digits').value=String(S.digits);$('#digits').onchange=e=>{S.digits=+e.target.value;store.set('digits',S.digits);window.dispatchEvent(new Event('settings'))};
document.addEventListener('keydown',e=>{
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^Digit[0-9]$/.test(e.code)){const n=+e.code.slice(5);go(MODES[(n+9)%10].id);e.preventDefault()}
});
$('#year').textContent=new Date().getFullYear();
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(MODES.some(m=>m.id===id))go(id,true)});
const first=MODES.some(m=>m.id===location.hash.slice(1))?location.hash.slice(1):store.get('mode','simple');
go(first,true);
})();
</script>
</body>
