ть с любым уровнем сложности. Сегодня игра «Реверси» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Будущее","Нейросетевые движки используются для обучения; появляются варианты на больших досках. Сильные программы давно обыграли людей, но анализ их игры помогает обучать новичков. Развитие технологий приносит в «Реверси» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Поле","8×8, 64 клетки; в начальной позиции 4 фишки в центре. Угловые клетки, а также соседние с ними X- и C-клетки имеют особое значение в оценке позиций. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Время","Партия длится не более 60 ходов — 10–30 минут; турнирный контроль около 30 минут на игрока. Блиц-партия по реверси занимает до пяти минут, а турнирная — до получаса на игрока. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Счёт","Побеждает тот, у кого больше фишек по окончании партии; при равенстве — ничья. При равном числе фишек ничья; если доска не заполнена, пустые клетки достаются победителю. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Стратегия и тактика","Занимайте углы, избегайте клеток рядом с ними, ограничивайте мобильность соперника. Старайтесь иметь меньше фишек в середине игры: это сохраняет вам свободу ходов. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере."],["Известные игроки","Такэси Мураками, Хидэси Таменори, Брайан Роуз. Мировые чемпионы часто родом из Японии, где игра имеет сильную школу. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Разновидности","Отелло, реверси на больших досках, анти-реверси (выигрывает тот, у кого меньше фишек). Существуют версии на досках 6×6 и 10×10, а также варианты с запретом углов. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно. Неон можно ослабить."],["Дебютные принципы","В начале игры стремитесь к малому числу фишек и высокой мобильности: чем меньше ходов у соперника, тем лучше. Ходите так, чтобы переворачивать как можно меньше фишек, и избегайте выходов на край. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Музыка включается отдельно."],["Углы и края","Угловые клетки нельзя перевернуть; клетки рядом с углом (X- и C-клетки) опасны, пока угол свободен. Занятый угол позволяет безопасно занимать соседние края и закреплять фишки. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Мобильность","Мобильность — число доступных ходов. Ограничивайте ходы соперника и сохраняйте свои. Каждый лишний ход соперника — это возможная угроза, поэтому цель — оставить ему только плохие ходы. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Чётность","В эндшпиле важна чётность свободных зон: стремитесь сделать последний ход в каждой области. Старайтесь сделать последний ход в каждой изолированной области, пока пустых клеток в ней нечётное число. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Анти-реверси (меньше фишек — победа) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Типичные ошибки","Жадный захват фишек в дебюте, ранняя игра на краях и ходы рядом со свободным углом. Игроки слишком рано занимают край и открывают сопернику доступ к угловым клеткам. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Звуки включаются отдельно."],["Анти-реверси","В режиме «Анти-реверси» побеждает тот, у кого меньше фишек; тактика обратная. В этом режиме выгодно отдавать углы и переворачивать меньше фишек соперника. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Анти-реверси» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Подсказки","Режим «Тренировка» и настройка «Подсказки» показывают допустимые ходы точками. Точки показывают все допустимые ходы, но не подсказывают, какой из них лучше. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Подсказки» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Ценность углов","Настройка «Ценность углов для ИИ» меняет стиль ИИ: от осторожного до агрессивного захвата углов. Низкая ценность делает ИИ более жадным, высокая — более осторожным у краёв. В настройках игры доступно до двадцати параметров, среди которых: Глубина поиска ИИ (реверси), Вес мобильности для ИИ (реверси), Ценность углов для ИИ (реверси); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Тренировка с ИИ","Начинайте с очень лёгкого ИИ и постепенно повышайте сложность, отслеживая, сколько фишек вы теряете в конце. Следите за числом ходов, которые остаются у вас и у ИИ после каждого вашего хода. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Анти-реверси (меньше фишек — победа) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Музыка включается отдельно."]],"shogi":[["История","Сёги — японские шахматы; современная форма сложилась в 16 веке, а ввод взятых фигур обратно на доску появился около 1500 года. Чтобы лучше почувствовать эту историю, сыграйте партию в «Сёги» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Правила","Поле 9×9, у каждого по 20 фигур. Ходят по очереди; фигуры бьют, как и ходят. Взятую фигуру можно выставить на любую пустую клетку как свою (сброс). Пешка, копьё, конь и серебро, дойдя до трёх дальних рядов, становятся «золотом», слон и ладья усиливаются. Побеждает тот, кто поставил мат королю. В этой версии превращение происходит автоматически, нет запрета на мат пешкой при сбросе. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Режимы выбираются на странице игры. Музыка включается отдельно."],["Интересные факты","Сброс фигур делает сёги единственными шахматоподобными играми без ничьих. Лучшие профессионалы Японии — настоящие знаменитости. Фуджи Сота стал самым молодым профессионалом в 2016 году. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Сёги» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Современность","В Японии есть профессиональные лиги с крупными призами и телетрансляциями; титулы Мэйдзин, Рюо и другие. Сегодня игра «Сёги» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Будущее","ИИ-движки (Бонанза, Елмо, Йанеураоу) превосходят людей; игра растёт за пределами Японии. Развитие технологий приносит в «Сёги» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Поле","Доска 9×9; у каждого по 20 фигур; зона превращения — три дальних ряда. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры."],["Время","Классическая партия — 1–2 часа; в блице — секунды на ход. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Счёт","Победа — мат королю; ничьи редки. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Стратегия и тактика","Постройка крепости вокруг короля, активное использование сброса фигур, атака на слабые клетки. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Известные игроки","Ёсихару Хабу и Сота Фудзии — одни из величайших профессионалов. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Разновидности","Мини-сёги (5×5), тю-сёги, дай-сёги, сёги с гандикапом. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Фигуры","Король, ладья, слон, золото, серебро, конь, копьё и пешка; у каждой свой ход. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Фигуры» остаётся прежним. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Превращение","В зоне превращения фигуры усиливаются; в портале превращение автоматическое, но его можно отключить настройкой. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Сброс","Взятую фигуру можно сбросить на любую свободную клетку как свою — главная особенность сёги. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Режим «Без сброса»","В этом режиме взятые фигуры не возвращаются, игра ближе к шахматам. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Режим «Без сброса»» остаётся прежним. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Крепости","Строя крепость вокруг короля (например, Мино или Ягура), вы защищаетесь от атак. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Ловушки","Часто игроки забывают о возможности сброса фигур и попадают в мат. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Настройки","Настройки «Сброс фигур» и «Автопревращение» меняют правила партии. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Поведение ИИ","ИИ оценивает материал, включая фигуры в резерве, и ищет мат на несколько ходов вперёд. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (сёги), Сброс фигур (сёги), Автопревращение (сёги); изменения применяются сразу. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Типичные ошибки","Забвение сброса, ранний обмен ладей и слабая защита короля. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без сброса (взятые фигуры не возвращаются); Фора: у ИИ нет ладьи — используют ту же основу, а различаются условиями партии. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."]],"backgammon":[["История","Нарды — одна из древнейших настольных игр: близкие к ним игры найдены в Месопотамии и Египте (ИИИ тыс. до н. э.). Здесь — длинные нарды. Чтобы лучше почувствовать эту историю, сыграйте партию в «Нарды» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Правила","У каждого 15 шашек в «голове». Бросаются две кости, ходы равны очкам на них (при дубле — четыре хода). Шашки идут по кругу против часовой стрелки до своего «дома» (последняя четверть), затем снимаются с доски. На пункт с шашками соперника вставать нельзя. Побеждает тот, кто первым снял все 15. В этой версии нет ограничения «одна шашка с головы за ход» и запрета блока из шести пунктов подряд. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","Короткие нарды (триктрак) отличаются тем, что шашки соперника можно бить. Кубики придают игре случайность, но стратегия решает больше. В странах Ближнего Востока нарды — национальная игра, проводятся турниры. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Нарды» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Современность","Нарды популярны на Ближнем Востоке и на Кавказе; существуют чемпионаты и онлайн-площадки. Сегодня игра «Нарды» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается."],["Будущее","Нейросеть Тд-гаммон показала уровень выше человеческого; развиваются онлайн-платформы с рейтингами. Развитие технологий приносит в «Нарды» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Поле","Доска из 24 пунктов; в портале — длинные нарды. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Музыка включается отдельно."],["Время","Партия длится 15–40 минут; в турнирах играют серии матчей. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Счёт","Побеждает тот, кто первым снял все 15 шашек. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Стратегия и тактика","Не дробите шашки, занимайте пункты подряд, блокируйте движение соперника. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Раздел «Стратегия и тактика» относится к игре «Нарды» и дополняет её описание: читайте его перед партией или во время обучения. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Известные игроки","В международных турнирах сильнейшие — игроки из Европы, США и Ближнего Востока. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Разновидности","Длинные, короткие, гусарские, Плакото, Февга. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Правила движения","Шашки движутся против часовой стрелки до последней четверти, затем снимаются с доски. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Правила движения» остаётся прежним. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Блокировка","Нельзя вставать на пункт, занятый шашками соперника; цепочки пунктов мешают его ходу. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Дубль","При выпадении одинаковых костей игрок делает четыре хода по этому числу. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Снятие шашек","Снимать можно только когда все шашки в «доме»; при большем числе можно снимать самую дальнюю шашку. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Режим «Только дубли»","Каждый бросок даёт четыре хода по выпавшему числу — партия идёт быстрее. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Число шашек","Настройка «Шашек у каждого» (5, 10, 15) меняет длину партии. Раздел «Число шашек» относится к игре «Нарды» и дополняет её описание: читайте его перед партией или во время обучения. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Грани кости","Кости с 4, 6 или 8 гранями меняют ритм и риск игры. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Грани кости» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Стратегия блокировки","Стройте плотные цепочки подряд идущих пунктов, чтобы перекрыть путь сопернику. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только дубли (4 хода каждый раз); Турбо (три кости) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (нарды), Шашек у каждого (нарды), Граней на кости (нарды); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Типичные ошибки","Раскидывание шашек по всей доске, затягивание снятия и игнорирование блокирующих цепочек соперника. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."]],"billiards":[["История","Бильярд возник в Европе в КСИВ–15 веках как «настольный крокет»; современные правила сложились в 19 веке, когда на кий стали наклеивать кожаную наклейку. Чтобы лучше почувствовать эту историю, сыграйте партию в «Бильярд» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Правила","Оттяните курсор от битка и отпустите — чем дальше, тем сильнее удар. Забивайте шары в лузы. Забил — бьёте снова, не забил — ход переходит. Если забит биток (штраф), он возвращается на стол, а ход переходит. Побеждает тот, кто забил больше шаров, когда стол очищен. Это упрощённый вариант без номеров и цветов. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения."],["Интересные факты","Современные столы для снукера имеют длину 3,57 м. Слово «кий» имеет французское происхождение. Рекордный брейк в снукере — 147 очков (максимум). Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Бильярд» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Современность","Пул, снукер и русская пирамида — профессиональные дисциплины с телетрансляциями и чемпионатами мира. Сегодня игра «Бильярд» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Режимы выбираются на странице игры. Музыка включается отдельно."],["Будущее","Умные столы с камерами, АР-подсказки траекторий и тренировочные ИИ. Развитие технологий приносит в «Бильярд» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Музыка включается отдельно. Звуки включаются отдельно."],["Поле","Прямоугольный стол с шестью лузами; в портале — поле 640×340 и десять шаров. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Время","Партия длится от 10 минут до нескольких часов; кадр в снукере может быть очень долгим. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры."],["Счёт","В портале забитый шар — одно очко; побеждает тот, у кого их больше, когда стол очищен. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Стратегия и тактика","Планируйте положение биткa после удара, играйте на безопасность, используйте отыгрыши от бортов. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Известные игроки","Ронни О’Салливан и Стивен Хендри (снукер), Эфрен Рейс (пул), Ральф Соке. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Разновидности","Пул (8, 9, 10 шаров), снукер, русская пирамида, карамболь. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Соло: забить всё. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Удар","Оттяните курсор от битка и отпустите: направление противоположно оттягиванию, сила пропорциональна длине. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Выбор шара","Выбирайте шар, который можно забить в ближайшую лузу, и цельтесь в точку «призрачного шара». В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Положение битка","Планируйте положение битка после удара, чтобы следующий шар был удобным. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Защита (сэйф)","Если забить нельзя, оставьте биток в положении, неудобном для соперника. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Защита (сэйф)» остаётся прежним. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Режим «Соло»","Забивайте все шары в одиночку: удобно для тренировки точности и силы удара. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Скользкое сукно","В этом режиме шары почти не тормозят, поэтому нужны осторожность и контроль силы. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Рядов в пирамиде","Настройка «Рядов в пирамиде» (2–5) меняет число шаров на столе. В настройках игры доступно до двадцати параметров, среди которых: Сила удара (бильярд), Трение сукна (бильярд), Рядов в пирамиде (бильярд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Трение сукна","Чем выше трение, тем быстрее шары останавливаются и тем важнее сила удара. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Трение сукна» остаётся прежним. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Соло: забить всё; Скользкое сукно (соло, шары почти не тормозят) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Типичные ошибки","Слишком сильные удары, игнорирование положения битка и попытки забить без точного прицела. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Типичные ошибки» остаётся прежним. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."]],"uno":[["История","Уно придумал в 1971 году американский парикмахер Мерл Роббинс; в 1992 году права купила Маттел. Создатель игры Мерл Роббинс сначала продавал колоды из багажника автомобиля. Чтобы лучше почувствовать эту историю, сыграйте партию в «Уно» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Правила","У каждого по 7 карт. Играйте карту того же цвета или значения, что и верхняя. Пропуск, разворот, +2 и дикие карты (выбор цвета, +4) меняют ход игры. Нет подходящей — берите карту. Побеждает тот, кто первым избавился от всех карт. В этой версии нет объявления «Уно!». Карту можно сыграть, если она совпадает с верхней по цвету или по значению, либо это дикая карта. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Интересные факты","Колода содержит 108 карт; здесь она упрощена. Игра продаётся более чем в 80 странах. Рекордное число сыгранных подряд партий измеряется сутками. В полной колоде 108 карт, среди них числовые, действия и дикие. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Уно» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Современность","Существуют турниры, мобильные версии и множество тематических колод. Существуют мобильные версии, турниры и множество тематических колод. Сегодня игра «Уно» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Будущее","Онлайн-мультиплеер, ИИ-соперники разного уровня и АР-версии. Онлайн-режимы позволяют играть с друзьями на расстоянии, а ИИ подстраивается под уровень. Развитие технологий приносит в «Уно» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Поле","Игровой стол: колода, стопка сброса и рука каждого игрока. Центр стола занимают колода и стопка сброса с верхней картой. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Время","Партия длится 10–20 минут. Партия вдвоём заканчивается за 5–10 минут, а вчетвером — дольше. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Звуки включаются отдельно."],["Счёт","Победа — когда у игрока не осталось карт; в классических правилах очки считают по картам соперников. В версии портала побеждает тот, кто первым избавился от карт. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Стратегия и тактика","Копите разные цвета, придерживайте дикие карты, меняйте цвет на тот, которого у вас больше. Избавляйтесь от карт цвета, которого меньше всего, пока не получите нужную дикую карту. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Известные игроки","Сильные игроки — любители; система турниров развивается, мировых звёзд пока нет. Профессионального спорта по Уно нет, но любительские турниры проходят регулярно. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Разновидности","Уно Флип, Уно Аттак, командное Уно, Уно без карт «+4». В Уно Флип колода двусторонняя, и после специальной карты меняется весь набор правил. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Музыка включается отдельно."],["Раздача","Каждому раздают 7 карт; в портале размер руки настраивается от 5 до 12, а в режиме «Горка» — 14. Если на старте выпадает дикая или действующая карта, применяется обычный порядок игры. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Действующие карты","Пропуск, разворот, +2 и дикие карты меняют ход игры; при двух игроках разворот работает как пропуск. Пропуск лишает следующего игрока хода, а разворот меняет направление игры. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Действующие карты» на практике. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Дикие карты","Дикая карта позволяет выбрать цвет, «+4» заставляет соперника взять 4 карты и пропустить ход. Дикая карта позволяет выбрать любой цвет, что даёт контроль над ходом игры. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уно), Карт в начальной руке (уно), Цветов в колоде (уно); изменения применяются сразу. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Взять карту","Если подходящей карты нет, берите из колоды; сыграйте её, если подходит, иначе пасуйте. После добора можно сыграть эту же карту, если она подходит. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уно), Карт в начальной руке (уно), Цветов в колоде (уно); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Стратегия цвета","Меняйте цвет на тот, которого у вас больше, и придерживайте дикие карты до решающего момента. Запоминайте, какие цвета выбирают соперники, чтобы предугадывать их ходы. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уно), Карт в начальной руке (уно), Цветов в колоде (уно); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Музыка включается отдельно."],["Против нескольких ИИ","В режиме «1 против 3 ИИ» разворот меняет направление хода, а карты +2 и +4 бьют по следующему игроку. Разворот меняет порядок ходов, а штрафные карты бьют по следующему игроку. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Против нескольких ИИ» остаётся прежним. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры."],["Типичные ошибки","Ранний расход диких карт, слишком много цветов в руке и игнорирование карт соперников. Игроки бросают дикие карты слишком рано и теряют контроль над игрой. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере."],["Настройка диких карт","Настройка «Диких карт каждого вида» (2, 4 или 8) меняет колоду: чем больше диких, тем больше хаоса. Большее число диких карт повышает случайность и снижает роль планирования. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уно), Карт в начальной руке (уно), Цветов в колоде (уно); изменения применяются сразу. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Настройка диких карт» остаётся прежним. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается."],["Объявление «Уно!»","В этой версии нет объявления «Уно!» при одной карте, поэтому штрафа за забывчивость нет. В оригинале нужно объявлять «Уно!» при одной карте, иначе штраф — две карты. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Горка (старт по 14 карт); Только цифры (без действий и диких) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уно), Карт в начальной руке (уно), Цветов в колоде (уно); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."]],"battleship":[["История","Бумажная игра начала 20 века; в 1967 году Милтон Брадлей выпустил настольную версию, позже появились компьютерные. Версии игры с бумагой и карандашом появились ещё в начале 20 века. Чтобы лучше почувствовать эту историю, сыграйте партию в «Морской бой» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Правила","У каждого флот: корабли на 5, 4, 3, 3 и 2 клетки на поле 10×10. Игроки по очереди стреляют по клеткам соперника. Побеждает тот, кто первым потопит весь флот. В режиме «Залп» после попадания стреляете снова. Выстрел по клетке сообщает «мимо», «ранил» или «потопил», в зависимости от попадания. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Интересные факты","Стрелять по шахматной диагонали — эффективная стратегия поиска. Корабли в этой версии могут стоять рядом. Во время Первой мировой игра ходила в виде листков бумаги. Даже на поле 10×10 полный перебор всех позиций флота невозможен без компьютера. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Морской бой» и сравнить свои наблюдения. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Современность","Цифровые версии с онлайн-мультиплеером и школьные турниры. Онлайн-версии позволяют играть с друзьями и случайными соперниками по всему миру. Сегодня игра «Морской бой» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Будущее","Адаптивные ИИ, подстраивающиеся под стиль игрока, и АР-версии. Адаптивные боты анализируют ваши выстрелы и выбирают расстановку, которая вам неудобна. Развитие технологий приносит в «Морской бой» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Поле","Два поля 10×10; флот из кораблей на 5, 4, 3, 3 и 2 клетки. Два поля 10×10 показывают ваш флот и неизвестные клетки соперника. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Время","Партия длится 10–20 минут. Партия занимает 10–20 минут, в зависимости от размера флота и поля. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (морской бой), Флот (морской бой), Размер поля (морской бой); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Счёт","Побеждает тот, кто первым потопил весь флот соперника; по очкам — число потопленных кораблей. Результат определяет число оставшихся кораблей у победителя. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Стратегия и тактика","Стреляйте «шахматкой», после попадания обстреливайте соседние клетки, расставляйте корабли не рядом. Меняйте расстановку от партии к партии, чтобы соперник не угадывал ваши привычки. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Известные игроки","Профессиональных чемпионов мало; игру анализировали математики по оптимальному поиску. Математики изучали оптимальные стратегии поиска, используя вероятностные карты. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Разновидности","Классика 10×10, «Залп» (стреляете снова после попадания), поле 12×12, с минными полями. Существуют версии с «минами», воздушными ударами и подводными лодками. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Звуки включаются отдельно."],["Расстановка флота","Расставляйте корабли неравномерно: не прижимайте все к краям и не ставьте их в предсказуемых местах. Корабли у края поля легче найти, поэтому распределяйте их по всему полю. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Поиск кораблей","Стреляйте «шахматкой» по каждой второй клетке: так любой корабль длиной от двух клеток будет найден быстрее. Шахматный порядок выстрелов находит любой корабль длиной от двух клеток. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Добивание","После попадания обстреливайте четыре соседние клетки, пока не определите направление корабля. После попадания проверьте четыре соседние клетки и затем идите вдоль линии корабля. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Режим «Залп»","Попали — стреляйте снова: серия попаданий может быстро решить исход партии. Серия попаданий подряд позволяет быстро потопить корабль и перейти к поиску следующего. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Двойной выстрел ИИ","В этом режиме соперник делает второй выстрел после промаха — расставляйте корабли осторожнее. Второй выстрел даёт ИИ преимущество, поэтому осторожнее прячьте длинные корабли. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Размер флота","Настройка «Флот» задаёт малый (3), обычный (5) или большой (7) набор кораблей. Большой флот ускоряет игру, а малый требует точности при каждом выстреле. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (морской бой), Флот (морской бой), Размер поля (морской бой); изменения применяются сразу. Режимы выбираются на странице игры. Музыка включается отдельно."],["Размер поля","Поле 8×8, 10×10 или 12×12: чем оно больше, тем дольше поиск. Поле 12×12 увеличивает время поиска и делает позиции менее предсказуемыми. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (морской бой), Флот (морской бой), Размер поля (морской бой); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Залп (попал — стреляй снова); Двойной выстрел ИИ (при промахе); Туман (промахи не отмечаются) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры."],["Поведение ИИ","На высоких уровнях ИИ ищет корабли «шахматкой» и добивает по соседним клеткам; на низких стреляет случайно. ИИ добивает раненые корабли по соседним клеткам и на высоких уровнях ищет шахматным порядком. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Типичные ошибки","Хаотичный поиск, пропуск соседних клеток после попадания и корабли, стоящие рядом друг с другом. Начинающие стреляют наугад и пропускают клетки, соседние с попаданием. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере. Музыка включается отдельно."]],"ttt":[["История","Игра известна с Древнего Египта и Рима (Терни Лапилли); современное название закрепилось в 19 веке. Похожие игры находят на стенах древнеримских построек, где игроки чертили доски для «трёх в ряд». Чтобы лучше почувствовать эту историю, сыграйте партию в «Крестики-нолики» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Правила","Игроки по очереди ставят X и O. Побеждает тот, кто первым выстроит линию (3 на 3×3, 4 на полях 4×4 и 5×5). Метки ставятся только на свободные клетки, а выигрыш засчитывается сразу после замыкания линии. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Интересные факты","Партия 3×3 при идеальной игре всегда заканчивается ничьей. В 1952 году на ЭДСАК появилась одна из первых компьютерных игр — ОХО. Число возможных партий 3×3 — 255 168. Всего возможно 255 168 различных партий на поле 3×3 с учётом всех порядков ходов. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Крестики-нолики» и сравнить свои наблюдения. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Современность","Используется как учебная модель для ИИ и теории игр; распространены усложнённые варианты вроде гомоку. Игру используют как первую задачу для учеников, изучающих перебор и деревья решений. Сегодня игра «Крестики-нолики» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Будущее","АР-версии и новые правила; игра остаётся первой задачей для обучения алгоритмам. На больших полях и с новыми правилами игра остаётся полигоном для проверки алгоритмов ИИ. Развитие технологий приносит в «Крестики-нолики» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Поле","3×3 клетки (в портале также 4×4 и 5×5). На полях 4×4 и 5×5 выигрышная линия короче стороны, поэтому ничьи случаются реже. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Время","Партия длится 1–2 минуты. Одна партия на поле 3×3 занимает меньше минуты, на 5×5 — до пяти минут. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Счёт","Победа — 1 очко, ничья — 0. Серии партий можно вести до трёх побед, чередуя право первого хода. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Сложность ИИ меняется в настройках игры."],["Стратегия и тактика","Занять центр, затем угол; создавать двойную угрозу; блокировать линию соперника. Захват центра даёт максимальное число линий, поэтому с него начинают сильные игроки. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Известные игроки","Официальных чемпионатов нет; игра известна как одна из первых задач для компьютеров. Самые известные «игроки» — программы-демонстрации, которые никогда не проигрывают на 3×3. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Разновидности","Гомоку, Ултимате Тик-так-тое, Коннект Фоур, 3D-крестики-нолики, мизер. В «Ультимативных» крестиках-ноликах девять малых досок образуют одну большую. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Мизер (кто собрал линию — проиграл). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Математика","На поле 3×3 всего 765 принципиально разных позиций; при идеальной игре обеих сторон партия заканчивается ничьей. С учётом поворотов и отражений различных позиций остаётся 765, из них закончено 138. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Идеальная стратегия","Если вы ходите первым, занимайте угол; на ответ в центр отвечайте противоположным углом, на ответ в угол — занимайте центр. Ответ на угловой ход в центр — единственный, что не проигрывает второму игроку. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Двойная угроза","Поставьте метку так, чтобы создать две незакрытые линии одновременно — соперник сможет закрыть только одну. Типичная вилка возникает, когда ваша метка стоит на пересечении строки и диагонали. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Расширенные поля","На полях 4×4 и 5×5 с линией 4 важнее блокирование: преимущество первого игрока заметно выше. Чем больше поле, тем важнее блокировать соперника заранее, а не только строить свои линии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Мизер","В режиме «Мизер» проигрывает тот, кто собрал линию, поэтому тактика обратная — не создавайте собственных угроз. В мизере стоит занимать клетки так, чтобы вынудить соперника замкнуть линию первым. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Исчезающие метки","В режиме «Исчезающие метки» у каждого не более трёх меток: самые старые пропадают, и ничьи случаются реже. Исчезновение старой метки возвращает клетку в игру, поэтому позиции постоянно меняются. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и муз
