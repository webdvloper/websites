hive:{'История':'Игра вышла в 2001 году и сразу получила награды; её фишки изготавливают из бакелита, а отсутствие доски делает партию удобной для путешествий.','Правила':'Игрок обязан выложить королеву до четвёртого хода и лишь затем может двигать фишки; если ни один ход невозможен, ход переходит к сопернику.','Интересные факты':'В оригинальной игре у каждого игрока по 11 фишек, а в версии портала их восемь: королева, два жука, два кузнечика и три муравья.','Современность':'Существуют онлайн-платформы и официальные чемпионаты по улью; игру любят за короткие правила и глубокую стратегию.','Будущее':'Боты уровня сильных игроков уже играют на платформах, а разработчики расширяют игру новыми фишками, меняющими баланс.','Поле':'Поле строится из шестиугольников; координаты удобно описывать осями q и r, при этом у каждой клетки ровно шесть соседей.','Время':'Партия длится 10–30 минут; на турнирах используют таймер на ход, чтобы игроки не затягивали выбор.','Счёт':'Ничья возможна, если обе королевы окружены одновременно или если ни у кого нет допустимых ходов.','Стратегия и тактика':'Не спешите выкладывать королеву на край улья: подвижные фишки соперника легко её окружат.','Известные игроки':'Сильнейшие игроки сообщества проводят анализ дебютов и публикуют разборы, поэтому теория игры развивается быстро.','Разновидности':'Существуют карманная версия с магнитными фишками и версии с дополнительными насекомыми, которые усложняют тактику.','Фишки':'Каждый тип фишки двигается по-своему, и именно сочетание способов движения делает игру богатой при очень простых правилах.','Выкладывание':'Выкладывать фишку нужно так, чтобы она касалась хотя бы одной своей и не касалась чужих, кроме второго хода игры.','Королева':'Королева — самая слабая по движению, но её защита определяет исход: потеря подвижности королевы почти всегда проигрывает.','Движение королевы и жука':'Скольжение на одну клетку не позволяет разрывать улей, поэтому каждое такое движение нужно проверять на связность.','Кузнечик':'Кузнечик перепрыгивает по прямой над непрерывным рядом фишек и приземляется на первую пустую клетку за ним.','Муравей':'Муравей — самая подвижная фишка: он обходит улей по периметру и быстро перекрывает королеву соперника.','Правило одного улья':'Если после удаления фишки остаются отдельные группы, ход запрещён, поэтому центральные фишки часто неподвижны.','Поведение ИИ':'ИИ оценивает расстояние до вашей королевы и предпочитает ходы, приближающие фишки к ней, добавляя шум на низких уровнях.','Типичные ошибки':'Начинающие забывают, что их фишки тоже могут быть заблокированы, и теряют инициативу, потому что слишком рано выложили все подвижные фишки.'},
munchkin:{'История':'Игру придумал Стив Джексон; она высмеивает ролевые игры и подземелья и породила десятки продолжений с разными сеттингами.','Правила':'Побеждает первый игрок, достигший целевого уровня; в оригинале финальный уровень нужно получить только победой над монстром.','Интересные факты':'Название пришло из ролевых игр, где «манчкин» — игрок, стремящийся получить максимум уровней и предметов.','Современность':'Существуют цифровые версии и множество дополнений; игра популярна на вечеринках благодаря юмору и интригам между игроками.','Будущее':'Цифровые варианты позволяют автоматически считать бонусы и добавляют режимы с разными правилами для нескольких игроков.','Поле':'В настольной версии игроки раскладывают перед собой экипировку, а общий стол служит для боя и торговли.','Время':'Настольная партия занимает час и дольше; в упрощённой версии портала она длится 10–20 минут.','Счёт':'Уровень растёт на единицу за победу над обычным монстром и на два — за победу над самыми сильными, а при проигрыше падает.','Стратегия и тактика':'Накапливайте бонусы заранее и вступайте в бой, когда ваша сила явно превосходит силу монстра хотя бы на одно очко.','Известные игроки':'Автор игры Стив Джексон известен и другими настольными проектами; турниры проходят на конвентах.','Разновидности':'Кроме космической, ковбойской и зомби-версий, выпущены версии по мотивам сказок и мультфильмов.','Уровень':'Уровень — единственная постоянная характеристика; бонусы вещей временные и теряются вместе с экипировкой.','Вещи':'Вещи нужно активировать до боя; ИИ сразу экипирует всё, что у него есть.','Монстры':'Монстры бывают от слизней до драконов; чем выше уровень, тем реже выпадает монстр, который вам по силам.','Бой':'Ничья считается победой монстра, поэтому для победы нужна сила, строго большая силы монстра.','Побег':'Бросок кубика d6 решает судьбу: значения 5 и 6 позволяют убежать без последствий, остальные — теряют уровень.','Сокровища':'Случайные вещи дают бонусы от +1 до +3; сильные монстры приносят две вещи.','Целевой уровень':'Меньшая цель делает партию короче и стремительнее, а большая даёт больше времени на развитие.','Поведение ИИ':'ИИ сражается, если его сила выше силы монстра, иначе в 70% случаев пытается убежать.','Типичные ошибки':'Игроки часто вступают в бой без бонусов, надеясь на удачу, и теряют уровни, которые сложно вернуть.'},
guess:{'История':'Игра известна с детства: ведущий загадывает число, а остальные ищут его по подсказкам; в информатике это классический пример алгоритма.','Правила':'Каждая попытка уменьшает неопределённость: подсказка исключает половину или более вариантов, а на ввод принимаются только числа в диапазоне.','Интересные факты':'Для диапазона 1–1000 двоичный поиск требует не более 10 попыток, а для 1–10000 — не более 14.','Современность':'Игра используется в школьных задачах по программированию и в экзаменационных заданиях по алгоритмам.','Будущее':'Цифровые версии могут подстраивать диапазон под результаты игрока и хранить рейтинг по числу попыток.','Поле':'Вместо поля — строка ввода и список ваших предыдущих попыток с подсказками.','Время':'Партия занимает 1–3 минуты, а в дуэли чуть дольше из-за ходов соперника.','Счёт':'Чем меньше попыток вы потратили, тем лучше результат; при исчерпании лимита партия проиграна.','Стратегия и тактика':'Называйте число посередине известного диапазона — так вы сокращаете его вдвое при любом ответе.','Известные игроки':'Лучшие результаты у тех, кто строго придерживается метода деления пополам и не отвлекается на «интуитивные» числа.','Разновидности':'«Быки и коровы» требует угадывать многозначное число по числу совпадений, а «Горячо-холодно» работает с расстоянием.','Подсказки':'Если подсказки «больше» и «меньше» всегда верны, диапазон можно сужать с абсолютной уверенностью.','Двоичный поиск':'Метод гарантирует найти число за логарифм числа вариантов, поэтому он оптимален при честных подсказках.','Диапазон':'С ростом диапазона количество попыток растёт медленно, поэтому большие диапазоны не сильно сложнее маленьких.','Попытки':'Лимит «Авто» включает небольшой запас, поэтому оптимальная стратегия не проиграет.','Режим «Дуэль»':'Соперник использует тот же диапазон, поэтому чем быстрее вы сужаете его, тем меньше у ИИ шансов угадать число раньше вас.','Режим «Горячо-холодно»':'Расстояние оценивается долей от всего диапазона: «очень горячо» — меньше двух процентов, «ледяной» — дальше сорока.','Режим «Лжец»':'Вероятность лжи около одной пятой, поэтому полезно перепроверять подозрительные подсказки близкими числами.','Поведение ИИ':'На высоких уровнях ИИ называет почти ровную середину диапазона, а на низких отклоняется от неё случайно.','Типичные ошибки':'Игроки часто повторяют уже названные числа или называют число вне уже суженного диапазона.'},
dots:{'История':'Игру описал в 1889 году математик Эдуар Люка; в англоязычном мире она известна как Dots and Boxes.','Правила':'Отрезок ставится только между соседними точками; закрыв клетку, вы получаете очко и ходите снова, даже если закрыли несколько клеток подряд.','Интересные факты':'На доске 5×5 клеток существует множество позиций, но теория длинных цепочек позволяет эксперту выиграть у новичка почти всегда.','Современность':'Игра остаётся популярной в школе и в мобильных версиях, а математики используют её для изучения комбинаторных игр.','Будущее':'Алгоритмы находят выигрышные стратегии на малых полях и объясняют, когда выгодно жертвовать клетки.','Поле':'Размер определяется числом клеток по стороне; чем больше поле, тем длиннее цепочки и тем важнее контроль над ними.','Время':'Партия занимает от трёх минут на малом поле до десяти на большом.','Счёт':'Побеждает набравший больше клеток; при чётном их числе возможна ничья.','Стратегия и тактика':'В конце игры часто выгодно отдать две клетки, чтобы сохранить право хода и забрать длинную цепочку целиком.','Известные игроки':'Теорию игры в книгах разбирали Элвин Берлекэмп и другие математики, поэтому её правила хорошо изучены.','Разновидности':'Существуют игры на треугольной и шестиугольной сетках, а также версии с цветными точками.','Цепочки и петли':'Длинная цепочка закрывается одним ходом; петля отдаёт на две клетки меньше, поэтому выгоднее.','Жертва':'Жертва двух клеток лишает соперника хода и вынуждает его открыть следующую цепочку.','Безопасные ходы':'Пока безопасные ходы есть, никто не открывает цепочки; когда они кончаются, начинается борьба за контроль.','Лишний ход':'Каждый закрытый квадрат — это дополнительный ход, поэтому серия закрытий может перевернуть партию.','Размер поля':'Увеличение поля повышает роль длинных цепочек и делает партию менее предсказуемой.','Режим «1 vs 1»':'Два игрока играют по очереди на одном экране, а цвета отрезков берутся из настроек игроков.','Поведение ИИ':'ИИ забирает клетки, если может, и избегает открытия цепочек, пока есть безопасные ходы.','Длинные цепочки':'Число точек определяет, кому выгоднее начинать, — это известное правило длинных цепочек.','Типичные ошибки':'Начинающие закрывают клетки слишком рано и открывают соперникам длинные цепочки.'}});

const INFO4A={
ttt:['Похожие игры находят на стенах древнеримских построек, где игроки чертили доски для «трёх в ряд».','Метки ставятся только на свободные клетки, а выигрыш засчитывается сразу после замыкания линии.','Всего возможно 255 168 различных партий на поле 3×3 с учётом всех порядков ходов.','Игру используют как первую задачу для учеников, изучающих перебор и деревья решений.','На больших полях и с новыми правилами игра остаётся полигоном для проверки алгоритмов ИИ.','На полях 4×4 и 5×5 выигрышная линия короче стороны, поэтому ничьи случаются реже.','Одна партия на поле 3×3 занимает меньше минуты, на 5×5 — до пяти минут.','Серии партий можно вести до трёх побед, чередуя право первого хода.','Захват центра даёт максимальное число линий, поэтому с него начинают сильные игроки.','Самые известные «игроки» — программы-демонстрации, которые никогда не проигрывают на 3×3.','В «Ультимативных» крестиках-ноликах девять малых досок образуют одну большую.','С учётом поворотов и отражений различных позиций остаётся 765, из них закончено 138.','Ответ на угловой ход в центр — единственный, что не проигрывает второму игроку.','Типичная вилка возникает, когда ваша метка стоит на пересечении строки и диагонали.','Чем больше поле, тем важнее блокировать соперника заранее, а не только строить свои линии.','В мизере стоит занимать клетки так, чтобы вынудить соперника замкнуть линию первым.','Исчезновение старой метки возвращает клетку в игру, поэтому позиции постоянно меняются.','Игра учит ждать ход соперника и просчитывать на один-два шага вперёд.','На средних уровнях ИИ блокирует очевидные угрозы, но иногда пропускает двойные.','Версия на машине EDSAC считается одной из первых игр, где человек играл против программы.'],
reversi:['Современное название «Отелло» связано с трагедией Шекспира: чёрные и белые фишки намекают на противостояние героев.','Если у игрока нет допустимых ходов, он пасует, а если нет ходов у обоих — игра заканчивается.','На доске 8×8 максимальная партия занимает 60 ходов, потому что четыре клетки заняты сразу.','Мировые чемпионаты проводятся ежегодно, а онлайн-серверы позволяют играть с любым уровнем сложности.','Сильные программы давно обыграли людей, но анализ их игры помогает обучать новичков.','Угловые клетки, а также соседние с ними X- и C-клетки имеют особое значение в оценке позиций.','Блиц-партия по реверси занимает до пяти минут, а турнирная — до получаса на игрока.','При равном числе фишек ничья; если доска не заполнена, пустые клетки достаются победителю.','Старайтесь иметь меньше фишек в середине игры: это сохраняет вам свободу ходов.','Мировые чемпионы часто родом из Японии, где игра имеет сильную школу.','Существуют версии на досках 6×6 и 10×10, а также варианты с запретом углов.','Ходите так, чтобы переворачивать как можно меньше фишек, и избегайте выходов на край.','Занятый угол позволяет безопасно занимать соседние края и закреплять фишки.','Каждый лишний ход соперника — это возможная угроза, поэтому цель — оставить ему только плохие ходы.','Старайтесь сделать последний ход в каждой изолированной области, пока пустых клеток в ней нечётное число.','Игроки слишком рано занимают край и открывают сопернику доступ к угловым клеткам.','В этом режиме выгодно отдавать углы и переворачивать меньше фишек соперника.','Точки показывают все допустимые ходы, но не подсказывают, какой из них лучше.','Низкая ценность делает ИИ более жадным, высокая — более осторожным у краёв.','Следите за числом ходов, которые остаются у вас и у ИИ после каждого вашего хода.'],
pong:['Pong создал инженер Аллан Алькорн по заданию Нолана Бушнелла, а первый прототип был собран в 1972 году.','Мяч отбивается от верхней и нижней границ, а за боковыми границами засчитывается очко.','Игра была одной из первых, которая принесла видеоиграм массовый коммерческий успех.','Pong остаётся популярной основой для учебных проектов по программированию игр.','Сильные ИИ-ракетки учатся предсказывать траекторию мяча заранее, а не реагировать на неё.','Центральная пунктирная линия служит ориентиром и не влияет на физику мяча.','Матч до пяти очков занимает несколько минут, а на восьми или десяти — заметно дольше.','Серия до заданного счёта позволяет выравнивать шансы после неудачной подачи.','Старайтесь отбивать мяч краем ракетки, чтобы менять угол и ставить соперника в сложное положение.','Соревновательных чемпионатов по Pong нет, зато много любительских турниров на скорость реакции.','Существуют версии с четырьмя ракетками, с препятствиями и с несколькими мячами.','Скорость по горизонтали сохраняется, а вертикальная составляющая зависит от точки удара.','Небольшое ускорение делает розыгрыши напряжённее, а большое быстро решает исход.','Длинная ракетка помогает новичкам, а короткая повышает ставки для опытных игроков.','Задача — отбить как можно больше мячей подряд, не пропустив ни одного.','В центре поля мяч исчезает, поэтому нужно держать в голове его скорость и угол.','Возвращайтесь в центр после каждого удара, чтобы быстрее дотянуться до следующего мяча.','Игроки слишком рано двигают ракетку и промахиваются после отскока от стены.','Каждый игрок управляет своей ракеткой своей парой клавиш на одном экране.','Бесконечный режим подходит для тренировки реакции без давления результата.'],
checkers:['В России игра развивалась параллельно с шашками других стран, а первые турниры появились в XIX веке.','Ход всегда делается по диагонали по тёмным клеткам, а побеждает тот, кто лишил соперника ходов.','Шашечная доска 8×8 — это та же доска, что и шахматная, но используются только тёмные клетки.','Международные турниры собирают игроков из десятков стран, а онлайн-шашки доступны круглосуточно.','Движки на основе обучения с подкреплением анализируют партии и подсказывают лучшие продолжения.','У каждого игрока по 12 шашек, занимающих три нижних ряда.','Блиц-партия занимает пять минут, а классическая — до часа и более.','Победа — 1 очко, ничья — по половине, поэтому в турнирах ничьи важны.','Держите шашки связанными в группы, чтобы соперник не мог вклиниться между ними.','Мариан Тинсли за свою карьеру проиграл всего несколько партий.','В бразильских шашках на доске 8×8 действуют правила международных шашек.','Простая шашка ходит вперёд на одну клетку и не может отступать, но бьёт во все стороны.','Дамка сильнее обычной, но в портале ходит всего на одну клетку.','Если можно бить несколькими способами, игрок выбирает любой, но обязан бить.','Классический удар «трёх шашек» заставляет соперника отдать несколько фигур за одну.','Не торопитесь с выходом на центр, сохраняйте шашки на задней линии как можно дольше.','Три дамки против одной нередко ведут к победе, но нужно загнать дамку в «большак».','В поддавках нужно вынуждать соперника бить, чтобы быстрее избавиться от своих шашек.','С самого начала доступны сильные фигуры, поэтому ошибки наказываются быстрее.','Подсветка показывает шашки, которыми можно ходить, и помогает не пропустить обязательное взятие.'],
battleship:['Версии игры с бумагой и карандашом появились ещё в начале XX века.','Выстрел по клетке сообщает «мимо», «ранил» или «потопил», в зависимости от попадания.','Даже на поле 10×10 полный перебор всех позиций флота невозможен без компьютера.','Онлайн-версии позволяют играть с друзьями и случайными соперниками по всему миру.','Адаптивные боты анализируют ваши выстрелы и выбирают расстановку, которая вам неудобна.','Два поля 10×10 показывают ваш флот и неизвестные клетки соперника.','Партия занимает 10–20 минут, в зависимости от размера флота и поля.','Результат определяет число оставшихся кораблей у победителя.','Меняйте расстановку от партии к партии, чтобы соперник не угадывал ваши привычки.','Математики изучали оптимальные стратегии поиска, используя вероятностные карты.','Существуют версии с «минами», воздушными ударами и подводными лодками.','Корабли у края поля легче найти, поэтому распределяйте их по всему полю.','Шахматный порядок выстрелов находит любой корабль длиной от двух клеток.','После попадания проверьте четыре соседние клетки и затем идите вдоль линии корабля.','Серия попаданий подряд позволяет быстро потопить корабль и перейти к поиску следующего.','Второй выстрел даёт ИИ преимущество, поэтому осторожнее прячьте длинные корабли.','Большой флот ускоряет игру, а малый требует точности при каждом выстреле.','Поле 12×12 увеличивает время поиска и делает позиции менее предсказуемыми.','ИИ добивает раненые корабли по соседним клеткам и на высоких уровнях ищет шахматным порядком.','Начинающие стреляют наугад и пропускают клетки, соседние с попаданием.']};

const NEWTXT={"pong":[["История","Понг выпустила Атари в 1972 году; это одна из первых коммерчески успешных видеоигр. Понг создал инженер Аллан Алькорн по заданию Нолана Бушнелла, а первый прототип был собран в 1972 году. Чтобы лучше почувствовать эту историю, сыграйте партию в «Пинг-понг» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Правила","Отбивайте мяч ракеткой. Если соперник пропустил — вы получаете очко. До целевого счёта (в настройках). Мяч отбивается от верхней и нижней границ, а за боковыми границами засчитывается очко. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Интересные факты","Автор — Аллан Алькорн. Первый автомат работал в баре Андй Капп'с. Мяч ускоряется после каждого отскока в этой версии. Игра была одной из первых, которая принесла видеоиграм массовый коммерческий успех. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Пинг-понг» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Современность","Классический Понг живёт в ремейках и клонах, а его реальный прототип — настольный теннис — разыгрывается на олимпийском уровне. Понг остаётся популярной основой для учебных проектов по программированию игр. Сегодня игра «Пинг-понг» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Будущее","ВР-версии и соперники с ИИ, подстраивающие сложность под игрока. Сильные ИИ-ракетки учатся предсказывать траекторию мяча заранее, а не реагировать на неё. Развитие технологий приносит в «Пинг-понг» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Поле","Прямоугольник с центральной линией; ракетки у боковых сторон, мяч отскакивает от верхней и нижней границ. Центральная пунктирная линия служит ориентиром и не влияет на физику мяча. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Время","Партия идёт до целевого счёта (по умолчанию 5) и занимает 2–5 минут. Матч до пяти очков занимает несколько минут, а на восьми или десяти — заметно дольше. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать ["Разновидности","Понг с препятствиями, Бреакоут, Понг на четверых, аэрохоккей. Существуют версии с четырьмя ракетками, с препятствиями и с несколькими мячами. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Выживание (стена). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Физика отскока","Угол отскока зависит от точки касания ракетки: край отправляет мяч круче, центр — прямее. Скорость по горизонтали сохраняется, а вертикальная составляющая зависит от точки удара. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Ускорение","Настройка «Ускорение мяча при ударе» делает розыгрыши быстрее с каждым отбитием. Небольшое ускорение делает розыгрыши напряжённее, а большое быстро решает исход. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Размер ракетки","Короткая ракетка сложнее для обороны, но точнее при ударе; длинная упрощает игру. Длинная ракетка помогает новичкам, а короткая повышает ставки для опытных игроков. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Размер ракетки» остаётся прежним. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Режим выживания","Справа стена, а счёт — число отбитых мячей; игра заканчивается, когда вы пропускаете мяч. Задача — отбить как можно больше мячей подряд, не пропустив ни одного. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Невидимый мяч","В режиме «Невидимый мяч» он пропадает в центре поля — нужно предугадывать траекторию. В центре поля мяч исчезает, поэтому нужно держать в голове его скорость и угол. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Подготовка","Следите за мячом, а не за ракеткой; возвращайтесь к центру после каждого удара. Возвращайтесь в центр после каждого удара, чтобы быстрее дотянуться до следующего мяча. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Типичные ошибки","Преследование мяча вместо предугадывания, удары центром ракетки и паника при ускорении. Игроки слишком рано двигают ракетку и промахиваются после отскока от стены. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Мультиплеер","В режиме «1 против 1» один игрок управляет клавишами W/S, второй — стрелками. Каждый игрок управляет своей ракеткой своей парой клавиш на одном экране. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Выживание (стена); Невидимый мяч (в центре поля) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Целевой счёт","Режим «Бесконечный» отключает целевой счёт: играйте, пока не надоест. Бесконечный режим подходит для тренировки реакции без давления результата. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Выживание (стена); Невидимый мяч (в центре поля) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Скорость реакции ИИ (пинг-понг), Размер ракетки (пинг-понг), Начальная скорость мяча (пинг-понг); изменения применяются сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."]],"airhockey":[["История","Аэрохоккей изобрели в 1972 году в США инженеры Брансвик; быстро стал классикой залов игровых автоматов. Чтобы лучше почувствовать эту историю, сыграйте партию в «Аэрохоккей» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Правила","Бейте шайбу рукояткой (мышь или палец) и забивайте в ворота соперника. Шайба скользит почти без трения и отскакивает от бортов. Игра идёт до целевого счёта (в настройках). Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","Шайба парит на воздушной подушке из отверстий в столе. Скорость шайбы в профессиональных играх превышает 100 км/ч. Существует международная федерация и чемпионаты мира. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Аэрохоккей» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Современность","Проводятся профессиональные турниры и чемпионаты мира; популярны аркадные автоматы и цифровые версии. Сегодня игра «Аэрохоккей» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Будущее","Роботизированные соперники с компьютерным зрением и АР-версии с проекцией на стол. Развитие технологий приносит в «Аэрохоккей» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Поле","Прямоугольный стол с воротами по центру коротких сторон и линией посередине; в портале — вертикальное поле 360×560. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Время","В портале партия идёт до целевого счёта из настроек или по лимиту партии. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Счёт","Гол в ворота соперника — одно очко. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Стратегия и тактика","Отбивайте от бортов под углом, обороняйте центр, чередуйте быстрые и медленные броски. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Известные игроки","Профессионалы выступают в национальных лигах и на мировых чемпионатах. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры."],["Разновидности","Классический, с несколькими шайбами, роботизированный, настольный мини-аэрохоккей. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Неон можно ослабить."],["Управление колотушкой","Колотушка следует за мышью или пальцем; быстрый рывок передаёт шайбе больше скорости. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Отбивание от бортов","Бейте по шайбе под углом: отскок от бортов часто обманывает защиту. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Защита ворот","Держите колотушку между шайбой и воротами, не уходите далеко от центра линии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Защита ворот» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Атакующие приёмы","Короткий удар в центр, затем быстрый добивающий — типичная схема для голов. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Атакующие приёмы» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Режим «Лёд»","Шайба почти не тормозит: игра становится быстрой, а отскоки — непредсказуемыми. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Трение шайбы","Настройка «Трение шайбы» задаёт, как быстро шайба замедляется. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Ширина ворот","Узкие ворота усложняют гол, широкие — упрощают. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Режим «1 vs 1»","Нижний игрок использует мышь, верхний — клавиши WASD. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (мышь + WASD); Лёд (шайба почти не тормозит); Препятствие в центре — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Типичные ошибки","Погоня за шайбой в чужой половине, слишком сильные удары без прицела и оставленные без защиты ворота. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Макс. скорость шайбы (аэрохоккей), Трение шайбы (аэрохоккей), Ширина ворот (аэрохоккей); изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."]],"chess":[["История","Шахматы возникли в Индии (чатуранга) около 6 века, через Персию и арабский мир пришли в Европу; современные правила сложились в 15 веке. Первые чёткие правила европейских шахмат оформились в Испании и Италии около 1475 года, когда ферзь и слон получили современную силу; в 19 веке появились первые турниры и шахматные часы. Чтобы лучше почувствовать эту историю, сыграйте партию в «Шахматы» и подумайте, как менялись правила от первых версий до портальной. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Правила","Белые ходят первыми. Каждая фигура ходит по-своему: ладья по прямой, слон по диагонали, ферзь как оба, конь буквой Г, король на 1 клетку, пешка вперёд (бьёт по диагонали). Цель — поставить королю соперника мат. В этой версии нет рокировки и взятия на проходе, пешка автоматически превращается в ферзя, ничья — только пат. Фигуры не могут перепрыгивать через другие, кроме коня; пешка ходит вперёд, но бьёт по диагонали. Король не может ходить под шах, а игрок, чей король под шахом, обязан его устранить. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Интересные факты","В 1997 году Дип Блуе обыграл Гарри Каспарова. Число возможных партий оценивается больше числа атомов во Вселенной. Самый быстрый мат в партии — 2 хода (детский мат за чёрных). Мировой чемпионат проводится с 1886 года. Современные движки типа Стокфиш сильнее любого человека. Самая длинная официальная партия — Николич–Арсович (1989) — длилась 269 ходов и более 20 часов. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Звуки и музыку можно отключить в настройках. Музыка включается отдельно."],["Современность","Онлайн-платформы (Личесс, Чесс.ком) собирают миллионы партий в день; проводятся чемпионаты мира, командные лиги, блиц и рапид. Онлайн-платформы проводят блиц-арены и командные матчи, а профессиональный тур включает Гранд Чесс Тоур и командные чемпионаты стран. Сегодня игра «Шахматы» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Будущее","Нейросетевые движки (АльфаЗеро, Лила) изменили теорию дебютов; развиваются обучение с ИИ, ВР-доски и анализ в реальном времени. Нейросети оценивают позиции лучше традиционных эвристик, а тренировочные сервисы разбирают партии игрока и подсказывают типичные ошибки. Развитие технологий приносит в «Шахматы» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Поле","8×8 клеток, чередование светлых и тёмных; вертикали a–h, горизонтали 1–8. Клетка а1 в левом нижнем углу у белых всегда тёмная; вертикали обозначают буквами, горизонтали — цифрами, что позволяет записать любой ход двумя символами. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Время","Классика — 90–120 минут, рапид — 10–60, блиц — 3–5, пуля — 1 минута; в турнирах добавляют секунды за ход. В турнирах по классике на партию отводят 90 минут на 40 ходов плюс 30 минут и прибавку 30 секунд за ход; в блице — 3 минуты на партию. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Счёт","Победа — 1 очко, ничья — ½, поражение — 0. Оценка материала: пешка 1, конь и слон 3, ладья 5, ферзь 9. В турнирах очки суммируются; при равенстве применяют дополнительные показатели (коэффициент Бухгольца, личные встречи). Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Стратегия и тактика","Контроль центра, развитие фигур, безопасность короля, пешечная структура, активность ладей и реализация материального перевеса. Ладьи лучше ставить на открытые вертикали, коней — на форпосты, которые нельзя атаковать пешкой, а слон хорош в позициях с открытыми диагоналями. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Известные игроки","Капабланка, Ботвинник, Фишер, Карпов, Каспаров, Магнус Карлсен. Эмануил Ласкер удерживал звание чемпиона мира 27 лет (1894–1921) — дольше всех; Магнус Карлсен достиг рейтинга Эло 2882 в 2014 году. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Разновидности","Шахматы Фишера (Шахматы Фишера), блиц, антишахматы, шахматы на троих. В Шахматы Фишера расстановка фигур выбирается случайно из 960 вариантов, что снижает значение домашней подготовки дебютов. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Дебюты","Классические начала — итальянская партия, испанская партия, сицилианская защита, ферзевый гамбит. Главные принципы: занять центр, развить фигуры, увести короля в безопасность. Сицилианская защита (1.е4 к5) — самый популярный ответ чёрных на 1.е4; в ферзевом гамбите (1.д4 д5 2.к4) белые предлагают пешку ради центра. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Миттельшпиль","Здесь решают планы: атака на короля, игра на слабых пешках, захват открытых линий ладьями и борьба за лучшие поля для коней. Типичные планы — меньшинственная атака на ферзевом фланге, атака на короля при рокировках на разные фланги и создание проходной пешки. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Эндшпиль","Король становится активной фигурой. Важны оппозиция, проходная пешка и активность ладьи, стоящей за пешкой. Король и пешка против короля выигрывают, если король защищает пешку и занимает поле перед ней в нужный момент (правило оппозиции); ладейные эндшпили часто ничейные. В настройках игры доступно до двадцати параметров, среди которых: Случайность ходов ИИ (шахматы), Глубина поиска ИИ (шахматы), Превращение пешки (шахматы); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Тактические приёмы","Вилка, связка, двойной удар, отвлечение, завлечение и вскрытый шах — основа большинства комбинаций. Вилка конём одновременно атакует две фигуры; связка не позволяет фигуре ходить, потому что за ней стоит более ценная. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Типичные ошибки","Лишние ходы одной фигурой в дебюте, ранний выход ферзя, игнорирование угроз соперника и поспешные размены. Многие начинающие не проверяют ответные угрозы соперника перед ходом и теряют фигуры «на ровном месте». Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Тренировка","Решайте тактические задачи, разбирайте свои партии, изучайте простые эндшпили и играйте в режиме «Тренировка» с подсказками. Полезно решать по 10–15 тактических задач в день и разбирать каждую проигранную партию, отмечая момент, где оценка позиции изменилась. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Шахматная нотация","Ходы записывают алгебраической нотацией: буква фигуры и клетка, например Кф3; взятие — x, шах — +, рокировка — 0-0. Полная запись партии — список пар ходов (1.е4 е5 2.Нф3 Нк6); короткая рокировка записывается 0-0, длинная — 0-0-0, превращение — е8=Q. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Детский мат","Самый быстрый мат — за два хода чёрных (1.ф3 е5 2.г4 Кх4#); он возможен только при грубых ошибках соперника. Похожий на него «мат Шоляра» (1.е4 е5 2.Кх5 Нк6 3.Бк4 Нф6 4.Кксф7#) ставят начинающим за четыре хода, если они забывают защитить пункт ф7. В настройках игры доступно до двадцати параметров, среди которых: Случайность ходов ИИ (шахматы), Глубина поиска ИИ (шахматы), Превращение пешки (шахматы); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Упрощения портала","В версии портала нет рокировки и взятия на проходе, пешка превращается по выбору в настройках, ничья возможна только при пате. Отсутствие рокировки и взятия на проходе делает оценку позиции проще, а превращение пешки по выбору позволяет изучать эндшпили с ферзём, ладьёй, слоном или конём. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Шахматы Фишера (случайная расстановка) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Неон можно ослабить."]],"checkers":[["История","Предки шашек — древние игры вроде алькерка (Египет, Ближний Восток); современные правила сложились в Европе в КСИИ–16 веках. В России игра развивалась параллельно с шашками других стран, а первые турниры появились в 19 веке. Чтобы лучше почувствовать эту историю, сыграйте партию в «Шашки» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается."],["Правила","Шашки ходят по тёмным клеткам по диагонали вперёд. Бить обязательно, можно и назад, цепочкой. Дойдя до последнего ряда, шашка становится дамкой (♛) и ходит во все стороны (в этой версии — на одну клетку). Проигрывает тот, у кого не осталось ходов. Ход всегда делается по диагонали по тёмным клеткам, а побеждает тот, кто лишил соперника ходов. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","В 1994 году программа Чинук победила чемпиона мира по английским шашкам. Английские шашки были полностью решены в 2007 году: при идеальной игре — ничья. Русские шашки: дамка ходит на любое расстояние (здесь упрощено). Шашечная доска 8×8 — это та же доска, что и шахматная, но используются только тёмные клетки. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Современность","Международные турниры по русским, международным (100 клеток) и английским шашкам; популярны онлайн-платформы. Международные турниры собирают игроков из десятков стран, а онлайн-шашки доступны круглосуточно. Сегодня игра «Шашки» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Будущее","Английские шашки решены (ничья); для русских и международных развиваются нейросетевые движки и обучающие сервисы. Движки на основе обучения с подкреплением анализируют партии и подсказывают лучшие продолжения. Развитие технологий приносит в «Шашки» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Поле","8×8, играют на тёмных клетках; по 12 шашек у каждого. У каждого игрока по 12 шашек, занимающих три нижних ряда. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Время","Партия 10–60 минут; в блице — 3–5 минут на игрока. Блиц-партия занимает пять минут, а классическая — до часа и более. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Счёт","Победа — 1 очко, ничья — ½, поражение — 0. Победа — 1 очко, ничья — по половине, поэтому в турнирах ничьи важны. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Стратегия и тактика","Удержание центра, обмены при преимуществе, защита задней горизонтали, жертвы ради комбинации. Держите шашки связанными в группы, чтобы соперник не мог вклиниться между ними. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Известные игроки","Мариан Тинсли, Исер Куперман, Александр Шварцман, Михаил Корхов. Мариан Тинсли за свою карьеру проиграл всего несколько партий. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Разновидности","Русские, международные, английские, бразильские, турецкие, поддаваться. В бразильских шашках на доске 8×8 действуют правила международных шашек. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Правила ходов","Простая шашка ходит вперёд по диагонали на одну клетку, а бьёт вперёд и назад, перепрыгивая шашку соперника. Простая шашка ходит вперёд на одну клетку и не может отступать, но бьёт во все стороны. В настройках игры доступно до двадцати параметров, среди которых: Рядов шашек у каждого (шашки), Обязательное взятие (шашки), Простые шашки бьют назад; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Дамка","Дойдя до последней горизонтали, шашка становится дамкой; в портале дамка ходит и бьёт на одну клетку. Дамка сильнее обычной, но в портале ходит всего на одну клетку. Раздел «Дамка» относится к игре «Шашки» и дополняет её описание: читайте его перед партией или во время обучения. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Музыка включается отдельно."],["Обязательное взятие","По умолчанию бить обязательно; в настройках «Обязательное взятие» можно отключить. Если можно бить несколькими способами, игрок выбирает любой, но обязан бить. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Обязательное взятие» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Рядов шашек у каждого (шашки), Обязательное взятие (шашки), Простые шашки бьют назад; изменения применяются сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Комбинации","Жертва шашки ради многократного взятия — главный тактический приём. Классический удар «трёх шашек» заставляет соперника отдать несколько фигур за одну. В настройках игры доступно до двадцати параметров, среди которых: Рядов шашек у каждого (шашки), Обязательное взятие (шашки), Простые шашки бьют назад; изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Режимы выбираются на странице игры. Музыка включается отдельно."],["Дебютные принципы","Занимайте центр, держите задние шашки как можно дольше и не выдвигайтесь на фланги. Не торопитесь с выходом на центр, сохраняйте шашки на задней линии как можно дольше. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Эндшпиль","Дамки сильнее простых шашек; несколько дамок против одной обычно выигрывают при правильной игре. Три дамки против одной нередко ведут к победе, но нужно загнать дамку в «большак». В настройках игры доступно до двадцати параметров, среди которых: Рядов шашек у каждого (шашки), Обязательное взятие (шашки), Простые шашки бьют назад; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Поддавки","В режиме «Поддавки» побеждает тот, кто остался без ходов; тактика — отдавать шашки. В поддавках нужно вынуждать соперника бить, чтобы быстрее избавиться от своих шашек. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Все дамки","В режиме «Все дамки» игра начинается с дамок, поэтому важна осторожность при разменах. С самого начала доступны сильные фигуры, поэтому ошибки наказываются быстрее. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Все дамки» остаётся прежним. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Тренировка","Режим «Тренировка» подсвечивает шашки, которыми можно ходить. Подсветка показывает шашки, которыми можно ходить, и помогает не пропустить обязательное взятие. В настройках игры доступно до двадцати параметров, среди которых: Рядов шашек у каждого (шашки), Обязательное взятие (шашки), Простые шашки бьют назад; изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Тренировка с подсказками; Поддавки (остаться без ходов — победа) — используют ту же основу, а различаются условиями партии. Режимы выбираются на странице игры. Неон можно ослабить."]],"corners":[["История","Русская игра, родственная китайским шашкам (Халма изобретена в США в 1880-х). Чтобы лучше почувствовать эту историю, сыграйте партию в «Уголки» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Правила","У каждого по 9 фишек в углу 3×3. Фишка ходит на соседнюю клетку (в любую из 8 сторон) или прыгает через соседнюю фишку на свободную клетку за ней, цепочкой. Цель — занять все клетки угла соперника. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Интересные факты","Побеждает не самый быстрый, а тот, кто строит «лестницы» для прыжков. Игра развивает пространственное мышление. Лимит в 200 ходов: тогда побеждает тот, кто ближе к цели. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Уголки» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Музыка включается отдельно."],["Современность","Игра популярна как семейная и школьная; близки по правилам китайские шашки и Халма. Сегодня игра «Уголки» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Будущее","Онлайн-версии и ИИ-тренеры, обучающие построению «лестниц» для цепочек прыжков. Развитие технологий приносит в «Уголки» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Будущее» остаётся прежним. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Поле","Доска 8×8; у каждого в углу по 9 фишек в квадрате 3×3. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Время","Партия 10–25 минут; в портале ограничена 200 ходами. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Счёт","Побеждает тот, кто первым занял все клетки угла соперника; при лимите ходов — тот, кто ближе к цели. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Неон можно ослабить."],["Стратегия и тактика","Стройте «лестницы» для цепочек прыжков, не оставляйте отставших фишек, мешайте цепочкам соперника. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Неон можно ослабить."],["Известные игроки","Профессионального спорта нет; игра известна в основном школьникам и любителям. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры."],["Разновидности","Китайские шашки, Халма, уголки 9×9, командные уголки на четверых. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Расстановка","У каждого по 9 фишек в углу 3×3 на доске 8×8; цель — занять противоположный угол. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Расстановка» остаётся прежним. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Шаг","Фишка делает шаг на соседнюю клетку в любую из восьми сторон. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Прыжок","Можно перепрыгнуть через соседнюю фишку (любую) на свободную клетку за ней, цепочкой. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Прыжок» остаётся прежним. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Лестницы","Выстраивайте фишки так, чтобы они образовывали «лестницу» для цепочки прыжков. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Режим «Только по прямой»","Диагональные шаги и прыжки запрещены — игра медленнее и стратегичнее. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Лимит ходов","Настройка «Лимит ходов» (100, 200, 400) задаёт предел партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Прыжки в настройках","Настройка «Прыжки разрешены» отключает цепочки прыжков. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (уголки), Лимит ходов (уголки), Прыжки разрешены (уголки); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Поведение ИИ","ИИ оценивает продвижение фишек к цели; на высоком уровне учитывает ответ соперника. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Типичные ошибки","Оставление фишек позади, блокировка собственных цепочек и ходы без плана. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Только по прямой (без диагоналей); Только одиночные прыжки — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."]],"reversi":[["История","Придумана в Англии в 1883 году; в 1970-х Гото Гоити в Японии выпустил современную версию Отелло. Современное название «Отелло» связано с трагедией Шекспира: чёрные и белые фишки намекают на противостояние героев. Чтобы лучше почувствовать эту историю, сыграйте партию в «Реверси» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Правила","Чёрные ходят первыми. Ход должен «зажать» фишки соперника по прямой между новой и вашей фишкой — они переворачиваются. Нет хода — пас. Побеждает тот, у кого больше фишек. Если у игрока нет допустимых ходов, он пасует, а если нет ходов у обоих — игра заканчивается. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках."],["Интересные факты","Стартовая позиция — 4 фишки в центре. Угловые клетки нельзя перевернуть — они ключевые. Программа Логистелло в 1997 году разгромила чемпиона мира. На доске 8×8 максимальная партия занимает 60 ходов, потому что четыре клетки заняты сразу. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Реверси» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Современность","С 1977 года проводятся чемпионаты мира по Отелло; сильнейшие программы играют на недостижимом для людей уровне. Мировые чемпионаты проводятся ежегодно, а онлайн-серверы позволяют игра
