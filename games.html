аметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Будущее","ИИ-соперники с оценкой вероятностей и версии с несколькими игроками. Развитие технологий приносит в «Дурак» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Неон можно ослабить."],["Поле","Стол с колодой, козырем и картами в бою; рука из шести карт. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Время","Партия занимает 5–15 минут. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Счёт","Проигрывает последний игрок с картами; победителем становится тот, кто избавился от карт первым. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Неон можно ослабить."],["Стратегия и тактика","Берегите козыри, подкидывайте карты, не нужные вам, и запоминайте вышедшие карты. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков."],["Известные игроки","Чемпионатов с мировой известностью немного: игра остаётся любительской и дворовой. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Музыка включается отдельно."],["Разновидности","Подкидной, переводной, командный дурак, дурак с джокерами. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; Короткая колода (24 карты). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Козырь","Козырь определяется нижней картой колоды и бьёт любую карту другой масти. Звуки и три фоновых трека включаются отдельно, а громкость музыки и эффектов настраивается независимо. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Атака","Атакующий выкладывает карту, затем может подкидывать карты тех же достоинств. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Атака» на практике. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Звуки включаются отдельно."],["Защита","Защитник бьёт карту старшей картой той же масти или козырем. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Раздел «Защита» относится к игре «Дурак» и дополняет её описание: читайте его перед партией или во время обучения. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Взять","Если побить нельзя, защитник берёт все карты со стола. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Бито","Если все карты отбиты, раунд завершается и карты уходят в отбой. Режимы игры в портале — 1 против ИИ; Короткая колода (24 карты) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Добор","После раунда игроки добирают карты до шести, атакующий первым. Попробуйте сначала режим «1 против ИИ», затем «Короткая колода (24 карты)» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Режимы выбираются на странице игры."],["Поведение ИИ","ИИ бьёт минимальной подходящей картой и подкидывает дешёвые карты. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Упрощения портала","Нет перевода и нескольких соперников; играют вдвоём. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Типичные ошибки","Ранняя трата козырей, игра старшими картами в начале и подкидывание козырей без нужды. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."]],"poker":[["История","Техасский холдем сложился в Техасе в начале 20 века и стал популярным благодаря чемпионату Ворлд Сериес оф Покер. Название «холдем» закрепилось за вариантом, популярность которого выросла после 1970 года, когда турнир Ворлд Сериес оф Покер начали проводить в Лас-Вегасе, а общие карты сделали игру понятнее для зрителей. Чтобы лучше почувствовать эту историю, сыграйте партию в «Покер» и подумайте, как менялись правила от первых версий до портальной. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Правила","Каждому дают по две карты; на стол выкладывают флоп (3), тёрн и ривер. На каждом этапе вы можете сбросить, проверить/уравнять или повысить. В конце сильнейшая комбинация из 5 карт забирает банк. В версии портала хедз-ап, один раунд торгов на этап без переповышений. Сначала делаются обязательные ставки, затем сдаются карты и начинается круг торгов; победитель — тот, кто не сбросил карты и имеет лучшую комбинацию, либо тот, чья ставка осталась без ответа. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Интересные факты","Старшая комбинация — роял-флеш. В покере важны вероятности и психология. Разглядывающая судьбу руки — «блеф». Вероятность получить пару тузов в начальной раздаче — около 0,45%, то есть примерно один раз на 220 раздач. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Покер» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Современность","Онлайн-покер и крупные турниры (Ворлд Сериес оф Покер, ЕПТ) собирают тысячи участников и транслируются. Тренажёры показывают равновесные стратегии по каждой позиции, а профессионалы изучают их, чтобы свести к минимуму ошибки в торговле. Сегодня игра «Покер» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Музыка включается отдельно."],["Будущее","ИИ (Либратус, Плурибус) обыгрывает профессионалов; развиваются тренажёры и анализ рук. Алгоритмы нового поколения учатся на самоигре и не требуют знаний о человеческой стратегии, поэтому всё чаще применяются и в других играх с неполной информацией. Развитие технологий приносит в «Покер» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Поле","Игровой стол с общими картами (пять на столе) и двумя закрытыми картами у каждого. Общие карты выкладываются в центре стола: три на флопе, по одной на тёрне и ривере, и их могут использовать оба игрока. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Время","Раздача занимает 1–3 минуты; турниры идут часами. Хедз-ап раздачи идут быстро: решение занимает от нескольких секунд до минуты, а матч до банкротства одного из игроков — от четверти часа до часа. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Счёт","Выигрывает сильнейшая комбинация из пяти карт; банк достаётся победителю или делится при ничьей. При равных комбинациях сравниваются старшие карты и кикеры, а точное равенство даёт ничью с разделом банка. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Стратегия и тактика","Играйте сильные стартовые руки, учитывайте шансы банка, чередуйте блеф и ставки за ценность. В хедз-апе играют больше рук, чем за столом из девяти человек, и чаще повышают, потому что у обоих игроков руки в среднем слабее. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Известные игроки","Дойл Брансон, Фил Айви, Крис Манимейкер, Дэниэл Негреану. Дойл Брансон выиграл десять браслетов главной серии, а Фил Хельмут — более пятнадцати. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Хедз-ап против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Разновидности","Омаха, стад, дро-покер, лимитный и безлимитный холдем. В омахе каждому раздают по четыре карты, из которых нужно использовать ровно две, а в стад-покере общих карт нет вовсе. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Хедз-ап против ИИ. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Комбинации","От старшей карты до роял-флеша: пара, две пары, сет, стрит, флеш, фулл-хаус, каре, стрит-флеш. Старшинство от слабой к сильной: старшая карта, пара, две пары, тройка, стрит, флеш, фулл-хаус, каре, стрит-флеш и роял-флеш. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Комбинации» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Этапы раздачи","Префлоп, флоп (3 карты), тёрн и ривер, затем шоудаун. На каждом этапе торговля начинается заново, но банк копится, поэтому решения на ривере зависят от всех предыдущих ставок. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Блайнды","Обязательные ставки в начале раздачи; в портале размер блайнда задаётся настройкой. Блайнды растут со временем в турнирах, заставляя игроков действовать активнее, а в портале размер блайнда задаётся один раз в настройках. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Действия","Сброс, чек или колл и рейз; в портале рейз фиксирован и без перебития. Чек допускается только если ставки на этом этапе ещё не было, а колл уравнивает последнюю ставку; в портале доступен один рейз за этап. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Блеф","Ставка со слабой рукой, чтобы заставить соперника сбросить карты; ИИ иногда блефует. Хороший блеф рассказывает правдоподобную историю: поведение на предыдущих этапах должно соответствовать сильной руке. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Шансы банка","Сравните цену колла с размером банка и вероятностью улучшить руку. Если колл стоит четверть банка, вам нужно выигрывать примерно в одном случае из пяти, чтобы остаться в плюсе. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Поведение ИИ","ИИ оценивает силу руки и повышает с сильными картами; уровень сложности сдвигает его осторожность. ИИ добавляет небольшой случайный шум к оценке силы руки, чтобы не быть полностью предсказуемым. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Банкролл","Следите за размером стека и не рискуйте всем на слабых руках. В турнирах рекомендуется не рисковать более небольшой доли банка на одном входе, чтобы пережить серию неудач. Попробуйте сначала режим «Хедз-ап против ИИ», затем «Хедз-ап против ИИ» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Размер рейза (покер), Стартовые фишки (покер), Блайнд (покер); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Типичные ошибки","Игра слабыми руками, игнорирование размера банка и слишком частые блефы. Многие игроки слишком долго держат пары на ривере после явных сигналов силы соперника и коллируют из любопытства. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."]],"go":[["История","Го возникло в Китае более 2500 лет назад; в Японии, Корее и Китае её называют го, бадук и вэйци. Легенда приписывает изобретение го императору Яо около 2300 года до н. э.; в Японию игра попала в 7 веке, а в 17 веке там появились профессиональные школы. Чтобы лучше почувствовать эту историю, сыграйте партию в «Го» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Правила","Чёрные и белые по очереди ставят камни на пересечения. Группа без «дыханий» (свободных соседних клеток) захватывается. Ход без дыханий запрещён, и нельзя сразу воссоздать прошлую позицию (ко). После двух пасов считаются камни и территория; белым даётся коми. Камни не двигаются после установки; захваченные камни снимаются с доски, а игрок может пасовать, если не видит полезного хода. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Интересные факты","В го больше позиций, чем атомов во Вселенной. АльфаГо в 2016 году обыграл Чён Се-доля. Коми компенсирует преимущество первого хода. Число возможных позиций на доске 19×19 оценивается приблизительно в 2,1×10^170, что намного превышает число атомов в наблюдаемой Вселенной. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере."],["Современность","Профессиональные лиги в Китае, Японии и Корее, мировые турниры и онлайн-серверы (КГС, ОГС). Профессиональные игроки в Китае, Японии и Корее проходят многолетнюю подготовку в школах; крупные титулы разыгрываются в многочасовых матчах. Сегодня игра «Го» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Будущее","ИИ (АльфаГо, КатаГо) изменил теорию дебютов; растёт число онлайн-обучающих платформ. Программы вроде КатаГо используются для анализа партий, подсказывая вероятность выигрыша для каждого хода. Развитие технологий приносит в «Го» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Поле","Квадратная доска 19×19 (в портале 7–13); камни ставятся на пересечения линий. Звёздные точки (хоси) на доске служат ориентирами и местами установки камней форы; на малых досках их три или пять. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры. Неон можно ослабить."],["Время","Партия занимает от 10 минут (малые доски) до нескольких часов; в турнирах используют бьё-ёми. В профессиональных партиях применяют контроль «бьё-ёми»: после основного времени игроки получают короткие периоды на каждый ход. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Музыка включается отдельно."],["Счёт","Подсчёт по территории: камни и окружённые пустые пункты, белым добавляется коми. Подсчёт по территории учитывает камни и окружённые пустые пункты, а при японских правилах считают только территорию и пленных. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков."],["Стратегия и тактика","Балансируйте территорию и влияние, соединяйте группы, создавайте два глаза. Начало партии играют в углах, затем на сторонах и только потом в центре, потому что углы позволяют занять территорию меньшим числом камней. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Известные игроки","Ли Седоль, Ке Цзе, Го Сэйген, Такэмия Масаки, Чо Хунхён. Го Сэйген (1914–2014) считается одним из величайших игроков 20 века и автором новой теории дебюта «синфусэки». Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Разновидности","Рэнго (пять в ряд), парное го, го на досках 9×9 и 13×13. Рэнго — игра в пять в ряд на доске для го, а парное го разыгрывается двумя командами по два игрока. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается."],["Дыхания","Свободные соседние пункты группы называются дыханиями; без дыханий группа захватывается. Камни по диагонали не считаются соседними, поэтому группа соединяется только по горизонталям и вертикалям. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Захват","Окружив группу соперника, вы снимаете её с доски и получаете пленные камни. Одним ходом можно захватить сразу несколько групп, если у всех осталось последнее дыхание. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Захват» на практике. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Два глаза","Группа с двумя отдельными глазами не может быть захвачена и считается живой. Если глаз один, группу можно захватить, поставив камень внутрь, когда у группы нет других дыханий. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Правило ко (го), Размер доски (го), Коми (го); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Правило ко","Нельзя сразу воссоздавать прошлую позицию — это защита от бесконечных повторов. Правило запрещает повторение позиции через ход, но допускает повторение через несколько ходов; в разных вариантах правил есть ужесточения — «суперко». Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Правило ко» на практике. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Самоубийство","Ход, не оставляющий группе дыханий, запрещён, если он не захватывает камни соперника. В большинстве правил такие ходы запрещены; в некоторых вариантах они разрешены, и тогда сам камень снимается. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Пас и конец игры","Два паса подряд завершают игру и запускают подсчёт. После двух пасов подряд игроки договариваются о статусе спорных групп, а в портале подсчёт идёт автоматически. Раздел «Пас и конец игры» относится к игре «Го» и дополняет её описание: читайте его перед партией или во время обучения. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Коми","Компенсация белым за второй ход; настройка позволяет выбрать значение. Значение 6,5 исключает ничью и применяется в большинстве правил; 7,5 используют по китайским правилам. Ежедневный вызов даёт всем игрокам одинаковую задачу в течение суток, и результаты удобно сравнивать с друзьями. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Захват первым (кто первым взял камни) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Поведение ИИ","ИИ оценивает захваты, дыхания и положение камней; на высоких уровнях меньше случайности. ИИ учитывает шанс захвата, число свободных пунктов у группы и расстояние до центра, добавляя случайность на низких уровнях. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Типичные ошибки","Лишние локальные бои, ходы в собственную территорию и игнорирование слабых групп. Начинающие часто играют слишком близко к камням соперника и теряют инициативу, а также забывают проверить дыхания своих групп. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."]],"hive":[["История","«Улей» (Улей) — бесполевая игра двух противников, выпущена Джоном Адамсом в 2000 году. Игра вышла в 2001 году и сразу получила награды; её фишки изготавливают из бакелита, а отсутствие доски делает партию удобной для путешествий. Чтобы лучше почувствовать эту историю, сыграйте партию в «Улей» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Правила","У каждого игрока королева, два жука, два кузнечика и три муравья. Фишки выкладываются шестиугольниками рядом с другими своими (не рядом с чужими). Королеву нужно выкладывать не позже 4-го хода. Цель — окружить королеву соперника со всех шести сторон. В этой версии упрощено: жуки не лезут на фишки, нет точного правила «проталкивания» фишки в щель, нет пауков и комаров. Игрок обязан выложить королеву до четвёртого хода и лишь затем может двигать фишки; если ни один ход невозможен, ход переходит к сопернику. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Интересные факты","Игру отмечали в списках лучших абстрактных игр. Правило одного улья держит игру связной. Королеву можно окружить фишками обоих цветов. В оригинальной игре у каждого игрока по 11 фишек, а в версии портала их восемь: королева, два жука, два кузнечика и три муравья. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Улей» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Неон можно ослабить."],["Современность","Улей продаётся по всему миру и входит в списки лучших абстрактных игр; проводятся онлайн-турниры. Существуют онлайн-платформы и официальные чемпионаты по улью; игру любят за короткие правила и глубокую стратегию. Сегодня игра «Улей» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Будущее","Нейросетевые боты и дополнения (комар, божья коровка, мокрица) расширяют стратегию. Боты уровня сильных игроков уже играют на платформах, а разработчики расширяют игру новыми фишками, меняющими баланс. Развитие технологий приносит в «Улей» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Поле","Стола нет: поле формируется самими фишками, шестиугольники выкладываются рядом друг с другом. Поле строится из шестиугольников; координаты удобно описывать осями q и r, при этом у каждой клетки ровно шесть соседей. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Время","Партия занимает 10–30 минут. Партия длится 10–30 минут; на турнирах используют таймер на ход, чтобы игроки не затягивали выбор. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Счёт","Побеждает тот, кто окружил королеву соперника со всех шести сторон. Ничья возможна, если обе королевы окружены одновременно или если ни у кого нет допустимых ходов. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Стратегия и тактика","Выставляйте муравьёв для гибкости, прикрывайте королеву и держите кузнечиков для прыжков. Не спешите выкладывать королеву на край улья: подвижные фишки соперника легко её окружат. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Известные игроки","Игру придумал Джон Адамс; сообщество проводит чемпионаты на онлайн-платформах. Сильнейшие игроки сообщества проводят анализ дебютов и публикуют разборы, поэтому теория игры развивается быстро. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Разновидности","Улей Покет, Улей Карбон, версии с дополнениями. Существуют карманная версия с магнитными фишками и версии с дополнительными насекомыми, которые усложняют тактику. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Фишки","Королева, два жука, два кузнечика и три муравья на каждого игрока. Каждый тип фишки двигается по-своему, и именно сочетание способов движения делает игру богатой при очень простых правилах. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Звуки включаются отдельно."],["Выкладывание","Новая фишка должна касаться своих и не касаться чужих фишек. Выкладывать фишку нужно так, чтобы она касалась хотя бы одной своей и не касалась чужих, кроме второго хода игры. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Королева","Королеву нужно выложить не позже четвёртого хода. Королева — самая слабая по движению, но её защита определяет исход: потеря подвижности королевы почти всегда проигрывает. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Движение королевы и жука","Скользят на одну клетку, оставаясь в контакте с ульем (в портале жуки без залезания). Скольжение на одну клетку не позволяет разрывать улей, поэтому каждое такое движение нужно проверять на связность. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Кузнечик","Перепрыгивает по прямой через ряд фишек на первую свободную клетку. Кузнечик перепрыгивает по прямой над непрерывным рядом фишек и приземляется на первую пустую клетку за ним. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Муравей","Перемещается на любое расстояние по свободным клеткам вокруг улья. Муравей — самая подвижная фишка: он обходит улей по периметру и быстро перекрывает королеву соперника. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Муравей» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Правило одного улья","Нельзя разрывать улей на части, поэтому не каждую фишку можно двигать. Если после удаления фишки остаются отдельные группы, ход запрещён, поэтому центральные фишки часто неподвижны. В настройках игры доступно до двадцати параметров, среди которых: Отступ внутри игровой области, Скругление игровой области, Подложка игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Поведение ИИ","ИИ стремится к клеткам рядом с вашей королевой; на высоких уровнях меньше случайности. ИИ оценивает расстояние до вашей королевы и предпочитает ходы, приближающие фишки к ней, добавляя шум на низких уровнях. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Типичные ошибки","Позднее выкладывание королевы и фишки, закрывающие собственную королеву. Начинающие забывают, что их фишки тоже могут быть заблокированы, и теряют инициативу, потому что слишком рано выложили все подвижные фишки. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Звуки включаются отдельно."]],"munchkin":[["История","«Манчкин» — юмористическая карточная игра Стива Джексона, выпущена в 2001 году. Игру придумал Стив Джексон; она высмеивает ролевые игры и подземелья и породила десятки продолжений с разными сеттингами. Чтобы лучше почувствовать эту историю, сыграйте партию в «Манчкин» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Правила","В этой упрощённой версии вы открываете дверь и встречаете монстра. Если ваш уровень плюс бонусы вещей больше уровня монстра — вы побеждаете, получаете уровень и сокровища. Иначе можно убежать (кубик 5–6) или потерять уровень. Побеждает достигший целевого уровня (по умолчанию 10). Нет проклятий, классов, рас и торговли. Побеждает первый игрок, достигший целевого уровня; в оригинале финальный уровень нужно получить только победой над монстром. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Интересные факты","В оригинале побеждает тот, кто первым добрался до 10 уровня. Игра пародирует ролевые игры и подземелья. Есть множество дополнений и тематических версий. Название пришло из ролевых игр, где «манчкин» — игрок, стремящийся получить максимум уровней и предметов. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Манчкин» и сравнить свои наблюдения. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Современность","Игра выходит с 2001 года, у неё десятки тематических версий и дополнений. Существуют цифровые версии и множество дополнений; игра популярна на вечеринках благодаря юмору и интригам между игроками. Сегодня игра «Манчкин» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Будущее","Цифровые версии с онлайн-мультиплеером и ИИ-соперниками. Цифровые варианты позволяют автоматически считать бонусы и добавляют режимы с разными правилами для нескольких игроков. Развитие технологий приносит в «Манчкин» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Поле","Стол с колодами; в портале — экран с уровнем, бонусами и монстром. В настольной версии игроки раскладывают перед собой экипировку, а общий стол служит для боя и торговли. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Время","Партия занимает 10–20 минут в упрощённой версии. Настольная партия занимает час и дольше; в упрощённой версии портала она длится 10–20 минут. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Счёт","Побеждает первый, достигший целевого уровня (по умолчанию 10). Уровень растёт на единицу за победу над обычным монстром и на два — за победу над самыми сильными, а при проигрыше падает. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Стратегия и тактика","Копите бонусные вещи, вступайте в бой с монстрами по силам и вовремя убегайте. Накапливайте бонусы заранее и вступайте в бой, когда ваша сила явно превосходит силу монстра хотя бы на одно очко. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры. Неон можно ослабить."],["Известные игроки","Автор игры — Стив Джексон; турниры проходят на конвентах настольных игр. Автор игры Стив Джексон известен и другими настольными проектами; турниры проходят на конвентах. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Разновидности","Манчкин Космос, Манчкин Зомби, Манчкин Вилд Вест и десятки других. Кроме космической, ковбойской и зомби-версий, выпущены версии по мотивам сказок и мультфильмов. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Уровень","Уровень — основа силы; его повышают победы над монстрами. Уровень — единственная постоянная характеристика; бонусы вещей временные и теряются вместе с экипировкой. Ежедневный вызов даёт всем игрокам одинаковую задачу в течение суток, и результаты удобно сравнивать с друзьями. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Вещи","Каждая вещь даёт бонус к силе; активируйте их до боя. Вещи нужно активировать до боя; ИИ сразу экипирует всё, что у него есть. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Вещи» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Монстры","Чем выше уровень монстра, тем сложнее победить и тем выше награда. Монстры бывают от слизней до драконов; чем выше уровень, тем реже выпадает монстр, который вам по силам. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Бой","Вы побеждаете, если ваша сила (уровень плюс бонусы) больше силы монстра. Ничья считается победой монстра, поэтому для победы нужна сила, строго большая силы монстра. Попробуйте сначала режим «1 против ИИ», затем «1 против ИИ» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Побег","Кубик д6: 5 и 6 позволяют убежать; иначе вы теряете уровень. Бросок кубика д6 решает судьбу: значения 5 и 6 позволяют убежать без последствий, остальные — теряют уровень. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Сокровища","Победа даёт вещи; над сильными монстрами — две вещи. Случайные вещи дают бонусы от +1 до +3; сильные монстры приносят две вещи. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Целевой уровень","Настройка «Целевой уровень» (5, 8, 10) меняет длину партии. Меньшая цель делает партию короче и стремительнее, а большая даёт больше времени на развитие. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Целевой уровень» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Целевой уровень (манчкин), Отступ внутри игровой области, Скругление игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Поведение ИИ","ИИ экипирует все вещи, сражается, если сильнее, и иначе убегает. ИИ сражается, если его сила выше силы монстра, иначе в 70% случаев пытается убежать. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Типичные ошибки","Бой с монстром сильнее вас без бонусов и трата вещей слишком рано. Игроки часто вступают в бой без бонусов, надеясь на удачу, и теряют уровни, которые сложно вернуть. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."]]};
