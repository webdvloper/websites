ыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Польза для детей","Игра знакомит с логикой, предвидением ходов и понятием ничьей. Игра учит ждать ход соперника и просчитывать на один-два шага вперёд. Ежедневный вызов даёт всем игрокам одинаковую задачу в течение суток, и результаты удобно сравнивать с друзьями. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["ИИ в портале","На высоких уровнях на поле 3×3 ИИ использует полный перебор и не проигрывает; на больших полях — выигрыш и блок. На средних уровнях ИИ блокирует очевидные угрозы, но иногда пропускает двойные. В настройках игры доступно до двадцати параметров, среди которых: Задержка хода ИИ (крестики-нолики), Подсветка выигрышной линии (крестики-нолики), Длина выигрышной линии; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Компьютерная история","Одной из первых компьютерных игр была ОХО (1952, Кембридж) для машины ЭДСАК. Версия на машине ЭДСАК считается одной из первых игр, где человек играл против программы. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Мизер (кто собрал линию — проиграл); Исчезающие метки (не более 3 у каждого) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."]],"tetris":[["История","Создан Алексеем Пажитновым в 1984 году в Москве; стал глобальным феноменом после выхода на Гаме Бой. Первая версия Тетрис была написана на компьютере «Электроника 60» в Вычислительном центре Академии наук СССР; права на игру позднее получила Нинтендо для Гаме Бой (1989). Чтобы лучше почувствовать эту историю, сыграйте партию в «Тетрис» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Правила","Собирайте полные горизонтальные линии из падающих фигур-тетрамино. Стрелки — движение, ↑ — поворот, пробел — мгновенный сброс. Фигура фиксируется, когда не может опуститься ниже; заполненные ряды исчезают, а всё, что выше, сдвигается вниз. Игра заканчивается, когда новая фигура не помещается в стакан. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","Семь фигур: I, O, T, S, Z, J, L. Название — от «тетра» и «теннис». Одновременная очистка 4 линий называется «тетрис». Очки растут нелинейно: четыре линии за раз дают в восемь раз больше очков, чем одна, поэтому игроки копят «колодец» под фигуру I. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Тетрис» и сравнить свои наблюдения. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Современность","Проводятся чемпионаты мира по классическому Тетрис, популярны мультиплеерные версии и рекорды скорости. Классический чемпионат мира по НЭС Тетрис проходит ежегодно; игроки используют техники «быстрых нажатий», чтобы двигать фигуры быстрее. Сегодня игра «Тетрис» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Неон можно ослабить."],["Будущее","Игра развивается на ВР/АР-платформах; ИИ-боты играют на уровне, недоступном человеку. Боты ищут оптимальные расположения фигур перебором с оценочной функцией (высота, дыры, неровность поверхности) и играют быстрее человека. Развитие технологий приносит в «Тетрис» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Поле","10 клеток по ширине и 20 по высоте. Стандартный стакан — 10×20 клеток; верхние строки над стаканом служат для появления новых фигур. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Время","Классика — до проигрыша; спринт — 40 линий; марафон — 150 линий; ультра — 2–3 минуты. Партия в классическом режиме не ограничена по времени и длится, пока игрок справляется со скоростью падения; спринт на 40 линий лучшие игроки проходят за считанные десятки секунд. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Счёт","Линии: 1 — 100, 2 — 300, 3 — 500, 4 — 800 (умножается на уровень). Очки за линии умножаются на уровень, поэтому при высоких уровнях тетрис (четыре линии) приносит особенно много; в портале множитель можно изменить настройкой. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Стратегия и тактика","Гладкая поверхность, колодец под палку I, не оставлять «дыр», готовить тетрис. Держите поверхность ровной, не создавайте колодцы глубже двух клеток без фигуры I и размещайте S и Z так, чтобы не оставлять дыр. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Известные игроки","Йонас Нойбауэр — семикратный чемпион мира; Уиллис Гибсон первым «прошёл» НЭС Тетрис до крэша (2023). Йонас Нойбауэр семь раз выигрывал чемпионат мира по классическому Тетрис; Уиллис Гибсон в декабре 2023 года довёл игру до «крэша» на уровне 157. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Классика» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Разновидности","Тетрис ДС, Тетрис Еффект, Пуйо Пуйо Тетрис, Тетрис 99. В Пуйо Пуйо Тетрис игроки соревнуются, сбрасывая мусорные блоки на поле соперника, а Тетрис Еффект добавляет музыкальное сопровождение и визуальные эффекты. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Классика; Спринт 40 линий; Дзен (без ускорения). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры. Неон можно ослабить."],["Тетрамино","Семь фигур по четыре квадрата: I, O, T, S, Z, J, L; каждую можно поворачивать. Из четырёх квадратов можно собрать ровно семь разных фигур (с учётом зеркальных отражений). Режимы игры в портале — Классика; Спринт 40 линий; Дзен (без ускорения); Ультра (2 минуты на очки) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Тень фигуры (тетрис), Цель спринта, линий (тетрис), Стартовый уровень; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры."],["Скорость и уровни","С каждыми десятью линиями в классическом режиме уровень растёт и фигуры падают быстрее; стартовый уровень задаётся в настройках. Скорость падения растёт с уровнем; в портале начальная скорость, предел падения и стартовый уровень задаются настройками, поэтому сложность можно подобрать точно. Режимы игры в портале — Классика; Спринт 40 линий; Дзен (без ускорения); Ультра (2 минуты на очки) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается."],["Техники","Колодец под фигуру I, ровная поверхность без дыр и заранее продуманное размещение фигур — основа высоких результатов. «Тень» показывает, куда упадёт фигура, а мгновенный сброс экономит время, но требует точности; опытные игроки заранее выбирают место для следующей фигуры. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Техники» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Типичные ошибки","Дыры под фигурами, высокая башня у края стакана, ставить фигуры без плана и поворачивать в последний момент. Нетерпеливое заполнение стакана и игнорирование высоты середины поля быстро приводят к «башне», из которой трудно выйти. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Тренировка","Начните со стартового уровня 1 и включите «Тень фигуры»; затем добавляйте стартовый мусор. Начните с замедленной скорости и режима «Дзен», затем переходите к спринту; практикуйте разные способы поворота и сброса. Режимы игры в портале — Классика; Спринт 40 линий; Дзен (без ускорения); Ультра (2 минуты на очки) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Режимы портала","Классика, спринт на 20–80 линий, марафон на 150, ультра на 2 минуты, дзен без ускорения и невидимые блоки. Режим «Дождь мусора» имитирует соревновательные атаки, «Без поворотов» учит планировать заранее, а «Ультра» тренирует набор очков за ограниченное время. Режимы игры в портале — Классика; Спринт 40 линий; Дзен (без ускорения); Ультра (2 минуты на очки) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Управление и сброс","Мгновенный сброс пробелом экономит время, но требует точного прицела; мягкое падение — стрелка вниз. Нажатие стрелки вниз ускоряет падение на одну клетку, а пробел мгновенно ставит фигуру на место; на сенсорных экранах доступны экранные кнопки. В настройках игры доступно до двадцати параметров, среди которых: Тень фигуры (тетрис), Цель спринта, линий (тетрис), Стартовый уровень; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Рекорды","Классический чемпионат мира по Тетрис включает скоростные дисциплины и рекорды очков, а лучшие игроки доходят до экстремально высоких уровней. Рекорды очков в классическом Тетрис — миллионы; для сравнения результатов важно указывать версию игры и начальный уровень. В настройках игры доступно до двадцати параметров, среди которых: Тень фигуры (тетрис), Цель спринта, линий (тетрис), Стартовый уровень; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Эргономика","На мобильных устройствах доступны экранные кнопки поворота и сброса, а опытные игроки быстрее играют с клавиатуры. Игровая область масштабируется настройкой «Масштаб игровой области», а прозрачность и подложка помогают на светлых экранах. Режимы игры в портале — Классика; Спринт 40 линий; Дзен (без ускорения); Ультра (2 минуты на очки) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."]],"monopoly":[["История","Игру создала Элизабет Мэги в 1904 году как Те Ландлорд'с Гаме; в 1935 году Паркер Бротерс выпустила Монополй, ставшую мировым хитом. Чтобы лучше почувствовать эту историю, сыграйте партию в «Монополия» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Правила","Игроки ходят по кругу из 24 клеток, бросая два кубика. Незанятую улицу можно купить, на чужой — платишь ренту (вдвое больше, если у хозяина обе улицы одной пары). Шанс даёт или забирает деньги, налог — минус 100, проход «Старта» — плюс 200. Банкрот выбывает. Побеждает последний оставшийся или самый богатый после 40 кругов (15 в быстрой). Это упрощённая версия без аукционов, тюрьмы и домов. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Музыка включается отдельно. Неон можно ослабить."],["Интересные факты","Оригинальная игра задумывалась как критика монополий. Играют более чем в 100 странах. Проводятся чемпионаты мира по Монополй. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Монополия» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Современность","Проводятся национальные и мировые чемпионаты Хасбро; существует множество тематических изданий. Сегодня игра «Монополия» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Будущее","Цифровые версии, онлайн-мультиплеер, ИИ-соперники и АР-доски. Развитие технологий приносит в «Монополия» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Поле","Кольцо клеток: улицы, шанс, налог; в портале — 24 клетки. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Неон можно ослабить."],["Время","Классическая партия длится 1–3 часа; в портале — 15 или 40 кругов. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Быстрая (15 кругов); Двойная рента — используют ту же основу, а различаются условиями партии. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Счёт","Побеждает последний небанкрот; по лимиту кругов — самый богатый. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Быстрая (15 кругов); Двойная рента — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Стратегия и тактика","Скупайте пары улиц для двойной ренты, держите запас денег на налоги и ренту. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно. Неон можно ослабить."],["Известные игроки","Мировые чемпионаты проходят с участием национальных чемпионов разных стран. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Разновидности","Классическая, Монополй Деал (карточная), электронная, тематические издания. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 3 ИИ; Быстрая (15 кругов). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Разновидности» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Движение","Игроки бросают два кубика и движутся по кольцу из 24 клеток; проход «Старта» приносит зарплату. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Покупка улиц","На свободной улице можно купить её за указанную цену или пропустить. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Покупка улиц» на практике. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Рента","Попав на чужую улицу, платите ренту; она вдвое выше, если у хозяина обе улицы пары. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Быстрая (15 кругов); Двойная рента — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Шанс и налог","Шанс даёт или забирает деньги, налог — фиксированный платёж из настроек. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Банкротство","Игрок с отрицательным балансом выбывает, а его улицы освобождаются. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Раздел «Банкротство» относится к игре «Монополия» и дополняет её описание: читайте его перед партией или во время обучения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Режимы выбираются на странице игры."],["Двойная рента","Режим «Двойная рента» удваивает все платежи — игра становится жёстче. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Двойная рента» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Стартовый капитал","Настройка «Стартовые деньги» (800, 1500, 3000) меняет темп игры. Раздел «Стартовый капитал» относится к игре «Монополия» и дополняет её описание: читайте его перед партией или во время обучения. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Лимит кругов","Быстрая партия ограничена 15 кругами, обычная — 40; побеждает самый богатый. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Лимит кругов» на практике. Режимы игры в портале — 1 против ИИ; 1 против 3 ИИ; Быстрая (15 кругов); Двойная рента — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Типичные ошибки","Покупка всех подряд, нехватка денег на ренту и налоги и игнорирование пар улиц. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Кубики (монополия), Цены улиц (монополия), Стартовые деньги (монополия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."]],"mafia":[["История","Мафию придумал в 1986 году студент МГУ Дмитрий Давыдов; игра быстро распространилась по миру как «Мафиа» и «Вереволф». Чтобы лучше почувствовать эту историю, сыграйте партию в «Мафия» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Правила","Игроки получают тайные роли: мафия, доктор, шериф, мирные. Ночью мафия выбирает жертву, доктор лечит, шериф проверяет игрока. Днём все голосуют, кого казнить. Мафия побеждает, когда её численность не меньше остальных; город побеждает, когда мафии не осталось. Здесь участвуете вы и ИИ-игроки; «обсуждения» нет, только голосование. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Интересные факты","Шериф узнаёт только «мафия» или «не мафия». Если доктор лечит жертву мафии, ночью никто не погибает. Спортивная мафия — это турнирный формат с жёсткими правилами. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Мафия» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Современность","Спортивная мафия — организованный формат с рейтингами и турнирами; популярны клубы и онлайн-площадки. Сегодня игра «Мафия» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Будущее","Онлайн-платформы с видеосвязью, анализ поведения и ИИ-ведущие. Развитие технологий приносит в «Мафия» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Поле","Игровой стол без поля: участники сидят по кругу, роли скрыты. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Время","Партия длится 30–60 минут; в спортивной мафии на речь даётся около минуты. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Счёт","Побеждает город или мафия; в турнирах начисляют очки за роль и вклад в победу. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Звуки включаются отдельно."],["Стратегия и тактика","Следите за голосованием, анализируйте поведение, не доверяйте слишком уверенным заявлениям. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Известные игроки","Сильнейшие игроки известны в клубных турнирах России и Европы. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Вы + 5 ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Разновидности","Вервольф, Ресистансе, «Город засыпает», расширенные роли — маньяк, любовница. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Роли","Мафия убивает ночью, доктор лечит, шериф проверяет игроков, мирные днём ищут мафию голосованием. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Ночь","Ночью мафия выбирает жертву; если доктор лечит ту же цель, никто не погибает. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Музыка включается отдельно."],["День","Днём все голосуют: казнён игрок с наибольшим числом голосов; при ничьей никто не казнён. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Победа города","Город побеждает, когда вся мафия выбыла. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Победа города» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Победа мафии","Мафия побеждает, когда её число не меньше числа остальных живых игроков. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Победа мафии» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Скрытые роли","В режиме «Скрытые роли» роли выбывших не раскрываются — труднее вычислять мафию. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Скрытые роли» на практике. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Настройки состава","Число мафии (1–3), наличие доктора и шерифа настраиваются. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Поведение ИИ","ИИ-мирные чаще голосуют по настоящей мафии на высоких уровнях сложности; мафия голосует против мирных. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Число игроков (мафия), Число мафии (мафия), Доктор в игре (мафия); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Типичные ошибки","Голосование наугад, игнорирование результатов проверки шерифа и защита очевидно подозрительных игроков. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Режимы игры в портале — Вы + 5 ИИ; Вы + 8 ИИ; Скрытые роли (роли погибших не раскрываются); Кровавая ночь (мафия убивает двоих) — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."]],"sudoku":[["История","Современная форма создана американцем Говардом Гарнсом в 1979 году; популярность пришла из Японии в 1980-х. Предшественником судоку считается «латинский квадрат» Леонарда Эйлера 18 века. Чтобы лучше почувствовать эту историю, сыграйте партию в «Судоку» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Правила","Заполните сетку 9×9 цифрами 1–9 так, чтобы они не повторялись в строке, столбце и каждом блоке 3×3. Выберите клетку и введите цифру; конфликты подсвечиваются. Цифры 1–9 в каждой строке, столбце и блоке 3×3 встречаются ровно один раз. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Интересные факты","Слово «судоку» — сокращение японской фразы о «единственных цифрах». Шесть квинтиллионов с лишним готовых сеток. Минимальное число подсказок для единственного решения — 17. Количество различных заполненных сеток судоку составляет около 6,67 секстиллиона. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры. Музыка включается отдельно."],["Современность","Проводятся чемпионаты мира по судоку; популярны приложения с ежедневными задачами. Чемпионаты мира собирают участников из десятков стран, а решение на время стало отдельным видом спорта. Сегодня игра «Судоку» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Будущее","Генерация задач ИИ с заданной сложностью и обучающие подсказки. Алгоритмы подбирают задачи по стилю игрока и показывают подсказки по логике, а не по перебору. Развитие технологий приносит в «Судоку» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Музыка включается отдельно."],["Поле","Сетка 9×9 из девяти блоков 3×3. Сетка делится жирными линиями на девять блоков, и каждый нужно заполнить без повторов. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Время","Новичку нужно 10–20 минут, сильнейшие решают за несколько минут; в портале есть режим на 10 минут. Лёгкую задачу решают за пять минут, трудную — за 30 и дольше. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Счёт","Победа — когда сетка заполнена без конфликтов; результат фиксируется по времени. Результат фиксируется по времени решения: чем меньше, тем лучше. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Стратегия и тактика","Одиночки и скрытые одиночки, пары, Кс-винг, цепочки; начинайте с цифр, которых на поле больше. Просматривайте кандидатов в клетке, строке и блоке по очереди, а не гоняйтесь за случайными клетками. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Известные игроки","Томас Снайдер и Ян Мрозовский — чемпионы мира. Томас Снайдер и Ян Мрозовский входят в число сильнейших решателей мира. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Классика» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Разновидности","Килер-судоку, диагональное, 16×16, самурай, гипер-судоку. В диагональном судоку цифры не должны повторяться и на двух главных диагоналях. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Классика; На время (10 мин); Ежедневный вызов. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Базовые приёмы","Одиночки: если в клетке возможна только одна цифра, ставьте её; скрытые одиночки — когда цифра возможна в единственной клетке блока. Ищите клетки, где остаётся единственный кандидат, а затем клетки, где цифра подходит лишь в одно место. Режимы игры в портале — Классика; На время (10 мин); Ежедневный вызов; Память (подсказки исчезают через 8 с) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Пары","Голые пары — две клетки с одинаковыми двумя кандидатами; их цифры можно исключить из остальных клеток группы. Если две клетки группы содержат одни и те же два кандидата, исключайте их из остальных клеток. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Продвинутые техники","Кс-винг и цепочки помогают на сложных уровнях, когда простые приёмы закончились. Кс-винг основан на том, что кандидат образует прямоугольник в двух строках и столбцах. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Режим «Память»","Подсказки исчезают через 8 секунд: запомните начальные цифры, пока они видны. Подсказки исчезают через несколько секунд, поэтому нужно хорошо запомнить расположение цифр. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Число подсказок","Чем меньше цифр дано, тем сложнее; настройка «Число подсказок» задаёт от 24 до 50. Чем меньше подсказок, тем больше шагов нужно для логического решения. Режимы игры в портале — Классика; На время (10 мин); Ежедневный вызов; Память (подсказки исчезают через 8 с) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Музыка включается отдельно."],["Ежедневный вызов (судоку)","Сетка зависит от даты, поэтому у всех игроков в один день одна и та же задача. Одна и та же сетка на день позволяет сравнивать результаты с другими игроками. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Ежедневный вызов (судоку)» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Подсветка ошибок","Включите подсветку, чтобы видеть конфликты сразу; отключите для честной проверки себя. Красный цвет показывает конфликт цифр в строке, столбце или блоке, но не подсказывает решение. В настройках игры доступно до двадцати параметров, среди которых: Лимит подсказок (судоку), Число подсказок (судоку), Подсветка строки, столбца и блока (судоку); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Музыка включается отдельно."],["Типичные ошибки","Угадывание цифр без логики и поспешная подстановка без проверки строки, столбца и блока. Попытки угадать цифру без проверки кандидатов быстро приводят к противоречию. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Единственность решения","Генератор не гарантирует единственное решение; победа засчитывается, когда сетка заполнена без конфликтов. Генератор портала не проверяет уникальность, поэтому возможны несколько верных заполнений. Режимы игры в портале — Классика; На время (10 мин); Ежедневный вызов; Память (подсказки исчезают через 8 с) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."]],"lotto":[["История","Русское лото известно с 19 века и восходит к итальянской лотерее; в СССР стало семейной настольной игрой. Чтобы лучше почувствовать эту историю, сыграйте партию в «Лото» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Правила","Карточка 3×9, в каждой строке по 5 чисел (1–90). Бочонки достают по одному; если число есть на вашей карточке — кликните по нему. Побеждает тот, кто первым закроет все 15 чисел. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Интересные факты","Классические бочонки — деревянные, с числами 1–90. Числа в столбцах идут по возрастанию сверху вниз. Игровые объявления бочонков имеют фольклорные прозвища. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Лото» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Современность","Лото остаётся популярным семейным развлечением; существуют телевизионные розыгрыши и онлайн-версии. Сегодня игра «Лото» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Будущее","Мультиплеер на большое число участников и озвучка бочонков. Развитие технологий приносит в «Лото» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Музыка включается отдельно."],["Поле","Карточка 3×9: в каждой строке по 5 чисел, столбцы соответствуют десяткам. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры."],["Время","Партия длится 10–20 минут. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Счёт","Побеждает тот, кто первым закрыл все числа на карточке. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Стратегия и тактика","Играйте несколько карточек и внимательно следите за числами; успех зависит от скорости реакции. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Стратегия и тактика» остаётся прежним. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Известные игроки","Чемпионатов нет: это преимущественно семейная и клубная игра. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Разновидности","Русское лото, итальянская томбола, бинго, кено. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Карточка","Карточка 3×9: в каждой строке по 5 чисел (по настройкам 3–6), числа в столбцах по возрастанию. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Бочонки","Бочонки 1–90 достаются по одному; скорость зависит от настройки. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Отметка","Кликайте только по выпавшим числам; ошибочный клик вызывает сигнал. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Автоотметка","Настройка «Автоотметка чисел» отмечает ваши числа сама. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Режим «Одна строка»","Побеждает тот, кто первым закроет любую строку. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Соло","Режим «Соло» считает, за сколько бочонков закрыта карточка. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается."],["Чисел в строке","Настройка «Чисел в строке» (3–6) меняет длину партии. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Поведение ИИ","ИИ отмечает числа с вероятностью, зависящей от сложности. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Бочонков уже выпало в начале (лото), Чисел в строке (лото), Автоотметка чисел (лото); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Типичные ошибки","Невнимательность, пропуск числа и отвлечение на соперника. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Режимы игры в портале — 1 против ИИ; Соло: минимум бочонков; Одна строка (закрыть любую строку); Один столбец — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."]],"bingo":[["История","Происходит от итальянской лотереи Ло Гиуоко дел Лотто д'италиа (16 век); в США с 1929 года известна как Бинго. Чтобы лучше почувствовать эту историю, сыграйте партию в «Бинго» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры."],["Правила","У каждого карточка 5×5 (центр свободен). Шары 1–75 выпадают по одному: если число есть на вашей карточке — кликните по нему. Побеждает тот, кто первым закроет линию: строку, столбец или диагональ. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Интересные факты","Колонки карточки соответствуют буквам Б-И-Н-Г-О. В Великобритании популярна версия с 90 шарами. Название, по одной из версий, пришло от возгласа «Беано». Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Бинго» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Современность","Бинго популярно в клубах и на благотворительных вечерах; существуют онлайн-залы и телевизионные шоу. Сегодня игра «Бинго» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Звуки включаются отдельно."],["Будущее","Мобильные и онлайн-версии с общими комнатами; генерация карточек и розыгрышей с помощью ИИ. Развитие технологий приносит в «Бинго» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Поле","Карточка 5×5 с числами 1–75; центр свободен; колонки соответствуют буквам Б-И-Н-Г-О. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Музыка включается отдельно."],["Время","Партия длится 5–15 минут в зависимости от скорости вызова шаров. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Счёт","Побеждает тот, кто первым закрыл линию: строку, столбец или диагональ. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Стратегия и тактика","Играйте несколько карточек одновременно, быстро отмечайте числа и следите за линиями соперников. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Известные игроки","Соревновательных чемпионатов мало: игра в основном любительская и клубная. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Разновидности","Британское бинго (90 шаров), американское (75), «Блэкаут» (закрыть всю карточку), скоростное бинго. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Разновидности» остаётся прежним. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Карточка","Карточка 5×5 с числами 1–75; колонки соответствуют буквам Б-И-Н-Г-О. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Вызов шаров","Шары выпадают случайно; интервал зависит от настройки скорости. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Отметка чисел","Отмечайте только выпавшие числа: неверный клик сопровождается сигналом ошибки. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Отметка чисел» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Условие победы","Настройка «Условие победы» задаёт линию, четыре угла или всю карточку. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Свободный центр","Центральная клетка по умолчанию свободна; её можно отключить в настройках. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Свободный центр» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Блэкаут","Режим «Блэкаут» требует закрыть всю карточку. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Музыка включается отдельно."],["Соло-режим","Режим «Соло» считает, за сколько шаров вы закроете линию. Режимы игры в портале — 1 против ИИ; Соло: минимум шаров; Блэкаут (закрыть всю карточку); Две линии — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Поведение ИИ","ИИ отмечает выпавшие числа с вероятностью, зависящей от сложности. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Музыка включается отдельно. Звуки включаются отдельно."],["Типичные ошибки","Невнимательность к выпавшим числам, поспешные клики и игнорирование прогресса соперника. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Подсветка выпавших чисел (бинго), Свободный центр (бинго), Условие победы (бинго); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."]],"words":[["История","Игры в слова популярны давно (балда, эрудит); формат угадывания слова с цветными подсказками стал массовым с 2021 года (Вордл). Чтобы лучше почувствовать эту историю, сыграйте партию в «Слова» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Правила","Загадано слово из 5 букв. Вводите слова: зелёная клетка — буква на месте, жёлтая — буква есть в другом месте, серая — такой буквы нет. Количество попыток зависит от сложности ИИ (в настройках). Проверка словаря не используется: можно вводить любые 5 букв. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","Букву «ё» в этой версии заменяет «е». «Слово дня» одинаково для всех в один и тот же день. Словарь здесь — около 50 загаданных слов. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Слова» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Современность","Игры в слова — от кроссвордов до Скрабл, Вордл и «Эрудита»; проводятся чемпионаты по скраблу. Сегодня игра «Слова» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Будущее","Адаптивная сложность, подбор слов ИИ и образовательные версии для изучения языков. Развитие технологий приносит в «Слова» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Поле","Сетка из 5 колонок и от 4 до 8 строк попыток; экранная клавиатура. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Время","Одна партия — 3–10 минут; режим «На время» — 3 минуты. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Счёт","В классике победа — угадать слово; в режиме «На время» очки — число отгаданных слов. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Стратегия и тактика","Начинайте со слов с частыми буквами, исключайте буквы, учитывайте позиции и повторы. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Стратегия и тактика» на практике. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Известные игроки","Чемпионаты мира по скраблу проводятся давно; сильнейшие игроки знают словари почти наизусть. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Классика» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Режимы выбираются на странице игры. Музыка включается отдельно."],["Разновидности","Вордл, «Эрудит», Скрабл, кроссворды, «Балда». Разновидности меня
