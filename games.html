ют привычные правила, а портал воспроизводит часть из них в режимах: Классика; Слово дня; На время (3 мин). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Правила игры","Угадайте слово из 5 букв; после каждой попытки клетки окрашиваются подсказками. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Цвета","Зелёный — буква на месте, жёлтый — буква есть в другом месте, серый — такой буквы нет. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Попытки","Число попыток зависит от сложности ИИ или настройки «Попыток». Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Попытки» на практике. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Слово дня","Режим «Слово дня» даёт одно и то же слово всем игрокам в течение суток. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Музыка включается отдельно."],["Режим на время","В режиме «На время» нужно угадать как можно больше слов за отведённое время. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Режим на время» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Три попытки","Режим «Три попытки» ужесточает правила: промахнуться почти нельзя. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Раздел «Три попытки» относится к игре «Слова» и дополняет её описание: читайте его перед партией или во время обучения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Стартовые слова","Хорошие стартовые слова содержат частые буквы: А, О, Е, Н, Р, Т. Раздел «Стартовые слова» относится к игре «Слова» и дополняет её описание: читайте его перед партией или во время обучения. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Клавиатура","Экранная клавиатура показывает статус букв; можно играть и с обычной клавиатуры. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Клавиатура» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Типичные ошибки","Повтор уже исключённых букв, игнорирование позиций и поспешные попытки. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Цвета на клавиатуре (слова), Попыток (слова), Время режима «на время», с (слова); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."]],"dobble":[["История","Карточная игра на внимательность, выпущена во Франции в 2009 году (в США — Спот Ит!). Чтобы лучше почувствовать эту историю, сыграйте партию в «Доббль» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков."],["Правила","На любых двух картах есть ровно один общий символ. Найдите его на своей карте и кликните раньше соперника. Победитель — тот, кто первым наберёт 10 очков (или больше очков за 60 секунд). Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Интересные факты","Колода построена на конечной проективной плоскости. Полная колода — 55 карт по 8 символов. Здесь — упрощённая колода: 31 карта по 6 символов. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Доббль» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Современность","Игра издаётся с 2009 года; популярны турниры на скорость реакции и множество тематических колод. Сегодня игра «Доббль» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Музыка включается отдельно."],["Будущее","Цифровые версии с мультиплеером и ИИ-соперниками разной скорости. Развитие технологий приносит в «Доббль» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Поле","Круглые карточки с 8 символами; в портале — упрощённая колода из 31 карты по 6 символов. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Звуки включаются отдельно."],["Время","Партия 10–15 минут; в портале — до 10 очков или 60 секунд. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Счёт","Очко получает тот, кто первым нашёл общий символ. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Стратегия и тактика","Сканируйте карту целиком, а не ищите по одному символу; сначала замечайте крупные и необычные картинки. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Режимы выбираются на странице игры. Неон можно ослабить."],["Известные игроки","Профессиональных чемпионатов немного; сильнейшие — любители с отличной реакцией. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ (до 10)» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Разновидности","Мини-игры Башня, Колодец, Горячая картошка, Отравленный подарок, Триплет. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Колода","Колода построена на конечной проективной плоскости: на любых двух картах ровно один общий символ. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Раунд","Ищите общий символ на нижней карте и кликайте по нему быстрее соперника. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Режим на время","В режиме «На время» нужно набрать как можно больше очков за отведённые секунды. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Режим со штрафом","В режиме «Со штрафом» ошибка отнимает очко, поэтому спешка опасна. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Очков до победы","Настройка «Очков до победы» (5, 10, 15) задаёт длину партии. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры."],["Время режима","Настройка «Время режима «на время»» (30, 60, 120) меняет длительность раунда. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Время режима» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Поведение ИИ","ИИ находит общий символ через время, зависящее от сложности и скорости. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Тренировка зрения","Игра развивает скорость реакции и внимание к деталям. В настройках игры доступно до двадцати параметров, среди которых: Скорость ИИ (доббль), Очков до победы (доббль), Время режима «на время», с (доббль); изменения применяются сразу. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере."],["Типичные ошибки","Поиск по одному символу вместо сканирования всей карты и нажатия наугад. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Режимы игры в портале — 1 против ИИ (до 10); На время (60 с); Со штрафом (ошибка −1 очко, на время); Мелкие символы — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."]],"connect4":[["История","Игра «Четыре в ряд» (Коннект Фоур) выпущена Милтон Брадлей в 1974 году; в 1988 году было доказано, что первый игрок при идеальной игре выигрывает. Игра выпущена в 1974 году компанией Милтон Брэдли; её простота сделала её классикой для обучения программированию ИИ и перебору позиций. Чтобы лучше почувствовать эту историю, сыграйте партию в «4 в ряд» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Правила","Игроки по очереди бросают диски в колонки поля 7×6; диск падает на самую низкую свободную клетку. Побеждает тот, кто первым собрал четыре диска по горизонтали, вертикали или диагонали. Диск нельзя вставить в заполненную колонку, а победная линия может идти по горизонтали, вертикали или любой из двух диагоналей. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Интересные факты","Поле 7×6 даёт 4 531 985 219 092 позиций. Центральная колонка — самая выгодная. Решение игры найдено компьютерным перебором в конце 1980-х. Первый игрок может гарантированно выиграть, если начнёт с центральной колонки и будет играть без ошибок. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «4 в ряд» и сравнить свои наблюдения. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере."],["Современность","Существуют любительские турниры и онлайн-платформы; игра используется для обучения алгоритмам ИИ. Популярны онлайн-версии с рейтингами и режимы с блицем, где на ход отводится всего несколько секунд. Сегодня игра «4 в ряд» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Будущее","Версии с дополненной реальностью и нейросетевые соперники, обучающиеся на миллионах партий. Обучающиеся программы анализируют сотни миллионов позиций, поэтому тренировка против них быстро показывает слабые места. Развитие технологий приносит в «4 в ряд» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Поле","Вертикальная сетка 7 колонок на 6 рядов; диски падают на нижнюю свободную клетку. Шесть рядов и семь колонок образуют 42 клетки, а общее число различных позиций исчисляется триллионами. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Время","Партия занимает 3–7 минут; в турнирах задают лимит времени на ход. Типичная партия заканчивается за несколько минут, если игроки думают над каждым ходом. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Счёт","Победа — четыре диска подряд по горизонтали, вертикали или диагонали; заполненное поле — ничья. Партия не приносит очков кроме победы, поэтому в турнирах играют серии матчей до нескольких побед. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Стратегия и тактика","Занимайте центральную колонку, создавайте двойные угрозы и блокируйте тройки соперника. Контролируйте центральные колонки: они входят в наибольшее число возможных линий для четырёх дисков подряд. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Известные игроки","Игру в 1988 году независимо решили джеймс Аллен и Виктор Аллис с помощью программ. Профессионального спорта по этой игре почти нет, но анализ первых ходов хорошо известен и в литературе по теории игр. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков."],["Разновидности","Поп Оут, Коннект 5, трёхмерная версия и поля большего размера. В Поп Оут диски можно вытаскивать снизу, что полностью меняет тактику, а в версиях с большим полем нужны линии из пяти. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Мизер (собрал четыре — проиграл). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Падение дисков","Диск не зависает: он занимает самую нижнюю свободную клетку выбранной колонки. Из-за падения вниз каждая колонка заполняется снизу вверх, поэтому клетка над вашей угрозой часто становится опасной для соперника. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Двойная угроза","Выстройте две тройки одновременно — соперник сможет закрыть только одну. Ловушка из двух открытых троек в разных направлениях почти всегда выигрывает, если соперник не успел её заметить. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере. Звуки включаются отдельно."],["Чётные и нечётные ряды","Первый игрок обычно выигрывает на нечётных рядах, второй — на чётных: это важно в эндшпиле. Знание этого правила помогает в эндшпиле решать, какие колонки не стоит заполнять первыми. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Дебют","Первый ход в центр — лучший; ход в соседние колонки даёт ничью, в крайние проигрывает. Ответ на первый центральный ход в соседнюю колонку чаще всего ведёт к тяжёлой защите, поэтому второй игрок старается играть в центр. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Поведение ИИ","ИИ перебирает ходы вперёд с отсечением; на низких уровнях ходит случайно. На высоких уровнях ИИ оценивает позиции на несколько ходов вперёд и ищет принудительные последовательности. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Кто ходит первым","Настройка «Кто ходит первым» передаёт первый ход ИИ. Передача первого хода ИИ полезна для тренировки защиты, потому что у первого игрока теоретическое преимущество. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Кто ходит первым» на практике. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Задержка ИИ","Настройка «Задержка хода ИИ» меняет паузу перед ответом. Нулевая задержка делает игру максимально быстрой, а большая помогает следить за каждым ходом и анализировать позицию. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Режимы выбираются на странице игры."],["Режим «1 vs 1»","Два игрока по очереди играют на одном устройстве. Два человека могут играть на одном экране, передавая управление; цвета дисков берутся из настроек игроков. В настройках игры доступно до двадцати параметров, среди которых: Длина выигрышной линии (4 в ряд), Кто ходит первым (4 в ряд), Задержка хода ИИ (4 в ряд); изменения применяются сразу. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Мизер (собрал четыре — проиграл) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Типичные ошибки","Игнорирование угроз по диагонали и ходы в крайние колонки без плана. Многие игроки пропускают угрозу по диагонали и открывают сопернику клетку над собственной тройкой. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере. Музыка включается отдельно."]],"g2048":[["История","Игру 2048 создал в 2014 году молодой разработчик Габриэлье Чиратти; она происходит от игры 1024 и Трис. Игру создал в марте 2014 года Габриэле Чиратти за выходные, а вдохновением послужили игры 1024 и Трис. Чтобы лучше почувствовать эту историю, сыграйте партию в «2048» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры. Музыка включается отдельно."],["Правила","Сдвигайте плитки стрелками или свайпом: одинаковые числа сливаются в сумму. После каждого хода появляется 2 или 4. Цель — плитка «2048» (в настройках можно выбрать 512–4096). После каждого сдвига все плитки скользят до упора, объединяются только пары одинаковых плиток, а за один ход плитка может участвовать в слиянии только один раз. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Интересные факты","Максимальная плитка на поле 4×4 — 131072. Стратегия «угол»: держите большую плитку в углу. Игра открыта как опен-соурсе проект. Теоретически на поле 4×4 можно собрать плитку 131072, но для этого нужно почти безупречное планирование каждого хода. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «2048» и сравнить свои наблюдения. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Современность","Игра стала вирусной в 2014 году; существуют клоны, соревнования на рекорд и скоростные заезды. Любители соревнуются в скорости получения плитки 2048 и в числе очков за заданное время, публикуя записи прохождения. Сегодня игра «2048» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Будущее","ИИ-алгоритмы достигают плиток 32768 и выше; растёт число вариантов на других полях. Алгоритмы вроде поиска по дереву с оценкой угловой монотонности достигают плиток выше 32768 и подходят для обучения студентов. Развитие технологий приносит в «2048» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Поле","Квадратная сетка 4×4 (в портале 3×3–6×6), плитки со степенями двойки. Сетка не ограничена четырьмя клетками: в портале можно выбрать размер от 3×3 до 6×6, что меняет баланс сложности. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Неон можно ослабить."],["Время","Партия занимает 5–20 минут; в портале есть режим на 3 минуты. Партия на 4×4 обычно занимает 5–20 минут, а в режиме на время ограничена тремя минутами. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Счёт","Очки за каждое слияние равны значению новой плитки. За слияние двух плиток вы получаете число очков, равное значению новой плитки, поэтому крупные плитки приносят всё больше очков. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Звуки включаются отдельно."],["Стратегия и тактика","Держите большую плитку в углу, двигайтесь в двух направлениях и избегайте обратного хода. Выбирайте две пары направлений для повторяющихся ходов (например, влево и вниз), а четвёртое используйте только при необходимости. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Известные игроки","Рекордсмены достигают плиток 131072 на классическом поле. Лучшие игроки поддерживают угловую монотонность и умеют откладывать крупные слияния, чтобы не терять управление над полем. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Классика» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Звуки включаются отдельно."],["Разновидности","2048 на других сетках, Трис, 2048 с шестиугольниками и 3D. В Трис плитки сливаются попарно по правилам 1+2=3, а в шестиугольных версиях есть шесть направлений сдвига. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Классика; Только четвёрки; На время (3 мин). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Неон можно ослабить."],["Слияние","Две одинаковые плитки при сдвиге объединяются в одну с удвоенным числом. Если три одинаковые плитки стоят в ряд, при сдвиге сливаются первые две, а третья остаётся на месте. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Вероятность двойки (2048), Размер поля (2048), Цель (2048); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры."],["Новая плитка","После хода появляется 2 (90%) или 4 (10%). Появление четвёрки реже, но именно она иногда разрушает аккуратный порядок, поэтому настройка вероятности сильно влияет на сложность. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Новая плитка» на практике. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Цель","Настройка задаёт целевую плитку от 512 до 4096. Цель 512 подходит для быстрой партии, а 4096 требует предельно аккуратной игры на большом поле. На телефоне интерфейс адаптируется под экран, а режим «Сниженная нагрузка» отключает неон и анимации на слабых устройствах. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Размер поля","Меньшее поле сложнее: меньше пространства для манёвра. На большом поле больше места для манёвра и можно строить несколько цепочек слияния одновременно. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Размер поля» остаётся прежним. В настройках игры доступно до двадцати параметров, среди которых: Вероятность двойки (2048), Размер поля (2048), Цель (2048); изменения применяются сразу. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Режим «Только четвёрки»","Новые плитки всегда 4 — игра идёт быстрее. В этом режиме появляются только четвёрки, поэтому цепочки начинаются сразу со второй ступени и партия идёт быстрее. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Режим «Только четвёрки»» на практике. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Режим на время","За три минуты нужно набрать максимум очков. Здесь важнее скорость решений, чем идеальный порядок: поддерживайте большую плитку в углу, но не тратьте секунды на сложные планы. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу."],["Свайп","На мобильных можно играть жестами по полю. Касание и протяжка по полю распознаются по преобладающему направлению; для клавиатуры доступны четыре стрелки. В настройках игры доступно до двадцати параметров, среди которых: Вероятность двойки (2048), Размер поля (2048), Цель (2048); изменения применяются сразу. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Допустимый ход","Ход засчитывается только если плитки сдвинулись; иначе игра ждёт. Если сдвиг не меняет положение плиток, он не засчитывается и новая плитка не появляется, поэтому «пустые» сдвиги не вредят. Режимы игры в портале — Классика; Только четвёрки; На время (3 мин); Отмена хода (3 раза) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Вероятность двойки (2048), Размер поля (2048), Цель (2048); изменения применяются сразу. Звуки и музыку можно отключить в настройках. Настройки портала сохраняются в браузере."],["Типичные ошибки","Хаотичные сдвиги, разрушение углового порядка и блокировка плитками малого значения. Самая частая ошибка — сдвиг в направление, из которого вы убрали крупную плитку из угла, из-за чего поле сразу теряет порядок. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."]],"guess":[["История","Игра «Угадай число» — классика программирования и детских игр, где ведущий подсказывает «больше» или «меньше». Игра известна с детства: ведущий загадывает число, а остальные ищут его по подсказкам; в информатике это классический пример алгоритма. Чтобы лучше почувствовать эту историю, сыграйте партию в «Угадай число» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры. Неон можно ослабить."],["Правила","Загадано число в заданном диапазоне. Введите предположение — игра скажет «больше» или «меньше». Угадайте за отведённое число попыток. В режиме «Дуэль» ИИ угадывает то же число поочерёдно с вами. Каждая попытка уменьшает неопределённость: подсказка исключает половину или более вариантов, а на ввод принимаются только числа в диапазоне. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."],["Интересные факты","Двоичный поиск угадывает число до 1000 за 10 попыток. Диапазон 1–10000 угадывается максимум за 14 ходов. Такая игра — первое задание многих начинающих программистов. Для диапазона 1–1000 двоичный поиск требует не более 10 попыток, а для 1–10000 — не более 14. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Угадай число» и сравнить свои наблюдения. Сложность ИИ меняется в настройках игры. Неон можно ослабить."],["Современность","Игра применяется в обучении программированию и на уроках информатики как пример бинарного поиска. Игра используется в школьных задачах по программированию и в экзаменационных заданиях по алгоритмам. Сегодня игра «Угадай число» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно. Звуки включаются отдельно."],["Будущее","Интерактивные версии с адаптивной сложностью и соревновательными рейтингами. Цифровые версии могут подстраивать диапазон под результаты игрока и хранить рейтинг по числу попыток. Развитие технологий приносит в «Угадай число» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Поле","Диапазон чисел от 1 до выбранного максимума (10, 100, 1000 или 10000). Вместо поля — строка ввода и список ваших предыдущих попыток с подсказками. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Время","Партия занимает 1–3 минуты. Партия занимает 1–3 минуты, а в дуэли чуть дольше из-за ходов соперника. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Музыка включается отдельно. Звуки включаются отдельно."],["Счёт","Результат — число попыток; чем меньше, тем лучше. Чем меньше попыток вы потратили, тем лучше результат; при исчерпании лимита партия проиграна. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Музыка включается отдельно."],["Стратегия и тактика","Делите диапазон пополам: так любое число находится за лог₂N попыток. Называйте число посередине известного диапазона — так вы сокращаете его вдвое при любом ответе. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается."],["Известные игроки","Алгоритм двоичного поиска знаком каждому программисту; рекордов среди игроков не ведётся. Лучшие результаты у тех, кто строго придерживается метода деления пополам и не отвлекается на «интуитивные» числа. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «Классика» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков."],["Разновидности","Горячо-холодно, «Быки и коровы», «Угадай слово», игра с лжецом. «Быки и коровы» требует угадывать многозначное число по числу совпадений, а «Горячо-холодно» работает с расстоянием. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: Классика; Дуэль с ИИ; Горячо-холодно. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Подсказки","После каждой попытки игра говорит «больше» или «меньше». Если подсказки «больше» и «меньше» всегда верны, диапазон можно сужать с абсолютной уверенностью. Режимы игры в портале — Классика; Дуэль с ИИ; Горячо-холодно; Лжец (подсказки иногда врут) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Двоичный поиск","Называйте середину диапазона — это гарантирует минимум попыток. Метод гарантирует найти число за логарифм числа вариантов, поэтому он оптимален при честных подсказках. Режимы игры в портале — Классика; Дуэль с ИИ; Горячо-холодно; Лжец (подсказки иногда врут) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Диапазон","Настройка «Диапазон числа» меняет сложность от 1–10 до 1–10000. С ростом диапазона количество попыток растёт медленно, поэтому большие диапазоны не сильно сложнее маленьких. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Попытки","Настройка «Попыток» задаёт лимит; «Авто» даёт запас лог₂N + 2. Лимит «Авто» включает небольшой запас, поэтому оптимальная стратегия не проиграет. Раздел «Попытки» относится к игре «Угадай число» и дополняет её описание: читайте его перед партией или во время обучения. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается."],["Режим «Дуэль»","ИИ угадывает то же число поочерёдно с вами; кто первым назвал число, тот выигрывает. Соперник использует тот же диапазон, поэтому чем быстрее вы сужаете его, тем меньше у ИИ шансов угадать число раньше вас. Режимы игры в портале — Классика; Дуэль с ИИ; Горячо-холодно; Лжец (подсказки иногда врут) — используют ту же основу, а различаются условиями партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Режим «Горячо-холодно»","Вместо «больше» и «меньше» игра говорит, как близко ваше число. Расстояние оценивается долей от всего диапазона: «очень горячо» — меньше двух процентов, «ледяной» — дальше сорока. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Режим «Лжец»","ИИ иногда лжёт в подсказках «больше» и «меньше» — не доверяйте слепо. Вероятность лжи около одной пятой, поэтому полезно перепроверять подозрительные подсказки близкими числами. В настройках игры доступно до двадцати параметров, среди которых: Диапазон числа (угадай число), Попыток (угадай число), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Поведение ИИ","В дуэли ИИ выбирает середину известного диапазона; на низких уровнях добавляет шум. На высоких уровнях ИИ называет почти ровную середину диапазона, а на низких отклоняется от неё случайно. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Музыка включается отдельно."],["Типичные ошибки","Угадывание наугад, игнорирование сужения диапазона и повтор уже названных чисел. Игроки часто повторяют уже названные числа или называют число вне уже суженного диапазона. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Музыка включается отдельно."]],"dots":[["История","Игра «Точки» (Дотс анд Боксес) описана впервые в 1889 году французским математиком Люкасом и называлась Ла Пипопипетте. Игру описал в 1889 году математик Эдуар Люка; в англоязычном мире она известна как Дотс анд Боксес. Чтобы лучше почувствовать эту историю, сыграйте партию в «Точки» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Правила","Игроки по очереди рисуют один отрезок между соседними точками. Закрывший квадратик получает очко и ходит ещё раз. Побеждает тот, кто закрыл больше квадратиков. Отрезок ставится только между соседними точками; закрыв клетку, вы получаете очко и ходите снова, даже если закрыли несколько клеток подряд. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Интересные факты","На поле 3×3 благодаря цепочкам можно взять сразу много клеток. Игру анализировал учёный Элвин Берлекэмп. Важна тактика «жертвы» — отдать несколько клеток ради последних. На доске 5×5 клеток существует множество позиций, но теория длинных цепочек позволяет эксперту выиграть у новичка почти всегда. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Режимы выбираются на странице игры. Неон можно ослабить."],["Современность","Игра популярна среди школьников и в мобильных приложениях; существуют турниры и теоретические разборы. Игра остаётся популярной в школе и в мобильных версиях, а математики используют её для изучения комбинаторных игр. Сегодня игра «Точки» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Будущее","Сильные ИИ на основе перебора и нейросетей решают малые поля и обучают новичков цепочкам. Алгоритмы находят выигрышные стратегии на малых полях и объясняют, когда выгодно жертвовать клетки. Развитие технологий приносит в «Точки» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Настройки портала сохраняются в браузере. Режимы выбираются на странице игры."],["Поле","Сетка точек: n+1 на n+1 точек образуют n×n клеток; в портале n от 3 до 6. Размер определяется числом клеток по стороне; чем больше поле, тем длиннее цепочки и тем важнее контроль над ними. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Неон можно ослабить."],["Время","Партия занимает 3–10 минут в зависимости от размера поля. Партия занимает от трёх минут на малом поле до десяти на большом. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Счёт","Каждая закрытая клетка даёт одно очко; побеждает набравший больше клеток. Побеждает набравший больше клеток; при чётном их числе возможна ничья. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Стратегия и тактика","Не создавайте клетки с тремя сторонами, жертвуйте клетки в конце ради контроля над цепочками. В конце игры часто выгодно отдать две клетки, чтобы сохранить право хода и забрать длинную цепочку целиком. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Известные игроки","Математик Элвин Берлекэмп описал теорию игры в книге «Те Дотс анд Боксес Гаме». Теорию игры в книгах разбирали Элвин Берлекэмп и другие математики, поэтому её правила хорошо изучены. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере. Неон можно ослабить."],["Разновидности","Шестиугольная версия, игра с цветными точками, версии на треугольной сетке. Существуют игры на треугольной и шестиугольной сетках, а также версии с цветными точками. Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; 1 против 1 (локально); Без дополнительного хода. Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Размер шрифта интерфейса тоже настраивается."],["Цепочки и петли","Длинные цепочки клеток закрываются одним ходом; контроль над ними решает партию. Длинная цепочка закрывается одним ходом; петля отдаёт на две клетки меньше, поэтому выгоднее. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Жертва","Отдать две клетки, чтобы сохранить ход, — основной приём эндшпиля. Жертва двух клеток лишает соперника хода и вынуждает его открыть следующую цепочку. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без дополнительного хода — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка»."],["Безопасные ходы","Ход безопасен, если он не оставляет клетку с тремя сторонами; ИИ на высоких уровнях выбирает такие ходы. Пока безопасные ходы есть, никто не открывает цепочки; когда они кончаются, начинается борьба за контроль. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Лишний ход","Закрывший клетку ходит снова — это ключевое правило игры. Каждый закрытый квадрат — это дополнительный ход, поэтому серия закрытий может перевернуть партию. Настройки и прогресс кампании сохраняются в браузере, поэтому к материалу можно вернуться в любой момент. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается."],["Размер поля","Настройка «Размер поля» меняет число клеток и сложность. Увеличение поля повышает роль длинных цепочек и делает партию менее предсказуемой. Режимы игры в портале — 1 против ИИ; 1 против 1 (локально); Без дополнительного хода — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Неон можно ослабить."],["Режим «1 vs 1»","Два игрока по очереди играют на одном устройстве. Два игрока играют по очереди на одном экране, а цвета отрезков берутся из настроек игроков. Ежедневный вызов даёт всем игрокам одинаковую задачу в течение суток, и результаты удобно сравнивать с друзьями. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка»."],["Поведение ИИ","ИИ закрывает клетки, если может, и избегает небезопасных ходов; на низких уровнях ходит случайно. ИИ забирает клетки, если может, и избегает открытия цепочек, пока есть безопасные ходы. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Длинные цепочки","Число точек определяет, кому выгоднее начинать — это правило длинных цепочек. Число точек определяет, кому выгоднее начинать, — это известное правило длинных цепочек. В настройках игры доступно до двадцати параметров, среди которых: Размер поля (точки), Нарисованных отрезков в начале (точки), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Типичные ошибки","Преждевременные жертвы, создание трёхсторонних клеток и игнорирование цепочек. Начинающие закрывают клетки слишком рано и открывают соперникам длинные цепочки. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Музыка включается отдельно."]],"domino":[["История","Домино появилось в Китае около 12 века и пришло в Европу в 18 веке. Чтобы лучше почувствовать эту историю, сыграйте партию в «Домино» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Размер шрифта интерфейса тоже настраивается. Музыка включается отдельно."],["Правила","Комплект из 28 костей, по 7 у каждого. Кости прикладывают к концам цепочки одинаковым числом очков. Нет подходящей — берите из базара. Побеждает тот, кто избавился от всех костей; при блоке — у кого меньше очков. Правила одинаковы во всех режимах, меняются лишь стартовые условия, цель партии или ограничения, которые описаны в названии режима. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Цвета игры меняются в настройках сразу. Режимы выбираются на странице игры. Неон можно ослабить."],["Интересные факты","Слово «домино» связывают с раскраской зимних одеяний священников. Кости можно ставить в длинные цепочки для шоу «падающее домино». В игре столько же вариантов комплектов до «двойной девятки». Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Домино» и сравнить свои наблюдения. Цвета игры меняются в настройках сразу. Для слабых устройств есть режим «Сниженная нагрузка». Настройки портала сохраняются в браузере."],["Современность","Проводятся любительские турниры по «козлу» и «морскому» домино; игра популярна во дворах и онлайн. Сегодня игра «Домино» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Цвета игры меняются в настройках сразу. Настройки портала сохраняются в браузере."],["Будущее","Мобильные версии и ИИ, считающий вероятность оставшихся костей. Развитие технологий приносит в «Домино» новые способы обучения, анализа партий и игры против всё более сильного ИИ. Портал уже сейчас показывает часть этих возможностей: пять уровней ИИ, турнир и кампанию с растущей сложностью. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Для слабых устройств есть режим «Сниженная нагрузка». Неон можно ослабить."],["Поле","Цепочка костей на столе; концы цепочки задают допустимые значения. Цвет поля, сетки и фигур настраивается в разделе настроек игры и сразу применяется к текущему экрану без перезагрузки страницы. Модификаторы вроде зеркала, переворота или тусклого света меняют вид игрового поля, но никак не затрагивают правила. Модификаторы — зеркало, переворот поля, хаос, туман, качка и другие — меняют вид игры, но смысл раздела «Поле» остаётся прежним. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Время","Партия занимает 5–15 минут. Если нужна партия на скорость, выберите режим «Блиц» на две минуты или задайте в настройках «Лимит партии» на два, пять или десять минут. Без лимита партия идёт в вашем темпе: ИИ не торопит игрока, поэтому можно спокойно обдумывать каждый ход. Попробуйте сначала режим «1 против ИИ», затем «Без базара (кости не берутся)» и сравните, как меняются приёмы и темп партии. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Счёт","Побеждает тот, кто избавился от всех костей; при блоке — у кого меньше очков на костях. Итог каждой партии показывается в верхней панели и на экране окончания, где можно сразу начать новую партию кнопкой «Ещё раз». В турнире и кампании результаты отдельных партий складываются в общий итог серии, а победа в финале приносит титул. Турнир против ИИ из трёх раундов и кампания из десяти уровней позволяют применить знания из раздела «Счёт» на практике. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков."],["Стратегия и тактика","Избавляйтесь от дублей и больших костей, запоминайте вышедшие числа. Лучший способ отработать стратегию — режимы с подсказками, где ИИ слабее, а затем «Сложный» и «Невозможный» уровни для проверки. Играйте вдумчиво: сначала оцените позицию целиком, затем выберите план и только потом считайте конкретные варианты. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Известные игроки","Турниры по «козлу» проводятся любительскими лигами; чемпионов мирового масштаба нет. Изучение партий сильных игроков — один из самых быстрых способов расти: повторяйте их идеи в режиме «1 против ИИ» и сравнивайте результат. Даже имена и рекорды лучших игроков служат ориентиром: они показывают, какого уровня мастерства можно достичь. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Сложность ИИ меняется в настройках игры. Режимы выбираются на странице игры."],["Разновидности","«Козёл», «Морской козёл», «Мексиканский поезд», «Матадор». Разновидности меняют привычные правила, а портал воспроизводит часть из них в режимах: 1 против ИИ; Без базара (кости не берутся). Знакомство с вариантами помогает глубже понять базовую игру и находить в ней новые приёмы. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Размер шрифта интерфейса тоже настраивается."],["Комплект","Двойная шестёрка включает 28 костей — все пары значений от 0 до 6. Попробуйте сначала режим «1 против ИИ», затем «Без базара (кости не берутся)» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Раздача","Каждому по 7 костей, остальные образуют базар. Попробуйте сначала режим «1 против ИИ», затем «Без базара (кости не берутся)» и сравните, как меняются приёмы и темп партии. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Режимы выбираются на странице игры. Музыка включается отдельно."],["Ход","Прикладывайте кость к концу цепочки с совпадающим числом. Попробуйте сначала режим «1 против ИИ», затем «Без базара (кости не берутся)» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается."],["Базар","Если нет подходящей кости, берите из базара, пока не найдёте. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Пас","Пасовать можно, когда подходящей кости нет и базар пуст. Сложность ИИ выбирается из пяти уровней — от «Очень легко» до «Невозможный», — поэтому игра подходит и новичку, и опытному игроку. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Блок","Когда оба игрока пасуют подряд, игра блокируется и считаются очки. Режимы игры в портале — 1 против ИИ; Без базара (кости не берутся) — используют ту же основу, а различаются условиями партии. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Цвета игры меняются в настройках сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Режимы выбираются на странице игры."],["Поведение ИИ","ИИ ходит самой тяжёлой подходящей костью и берёт из базара при необходимости. На разных уровнях ИИ играет по-разному: от случайных ходов на «Очень легко» до глубокого расчёта на «Невозможный». Если ИИ кажется слишком сильным или слабым, переключите сложность в настройках игры: изменение действует с новой партии. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Дубли","Дубли выгодно ставить рано: их труднее пристроить позже. Попробуйте сначала режим «1 против ИИ», затем «Без базара (кости не берутся)» и сравните, как меняются приёмы и темп партии. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка». Размер шрифта интерфейса тоже настраивается. Настройки портала сохраняются в браузере."],["Типичные ошибки","Хранение тяжёлых костей до конца и игнорирование чисел, которыми закрывается цепочка. Чаще всего ошибки возникают из-за спешки, поэтому делайте паузу перед каждым решающим ходом и проверяйте ответ соперника. Анализируйте проигранные партии: ошибка, найденная один раз, обычно перестаёт повторяться. В настройках игры доступно до двадцати параметров, среди которых: Костей в руке (домино), Комплект (домино), Отступ внутри игровой области; изменения применяются сразу. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Звуки включаются отдельно."]],"durak":[["История","«Дурак» — популярная русская карточная игра, известная с 18 века; играют колодой из 36 карт. Чтобы лучше почувствовать эту историю, сыграйте партию в «Дурак» и подумайте, как менялись правила от первых версий до портальной. Знание происхождения игры помогает понять, почему её правила устроены именно так, а не иначе. В настройках игры доступно до двадцати параметров, среди которых: Карт в руке (дурак), Макс. карт в атаке (дурак), Отступ внутри игровой области; изменения применяются сразу. Цвета игры меняются в настройках сразу. Звуки включаются отдельно. Неон можно ослабить."],["Правила","Каждому раздаётся по 6 карт; нижняя карта колоды определяет козырь. Атакующий подкидывает карты, защитник бьёт их старшей картой той же масти или козырём. Если не может — берёт карты. Подкидывать можно карты того же достоинства, что уже на столе. Проигрывает тот, кто остался с картами. В этой версии нет перевода и двух одновременных оппонентов. Если в ходе партии возник спорный момент, вернитесь к этому разделу: портал строго следит за допустимостью ходов и не принимает нарушения. Сложность ИИ меняется в настройках игры. Для слабых устройств есть режим «Сниженная нагрузка»."],["Интересные факты","В русском фольклоре игра популярна во всех поколениях. Есть варианты «подкидной» и «переводной» дурак. Козырь определяется нижней картой колоды. Эти факты удобно использовать как повод для знакомства с игрой в компании: расскажите их перед партией и сравните впечатления после неё. Каждый факт можно проверить на практике: достаточно сыграть несколько партий в «Дурак» и сравнить свои наблюдения. Звуки и музыку можно отключить в настройках. Сложность ИИ меняется в настройках игры. Ежедневный вызов одинаков для всех игроков. Для слабых устройств есть режим «Сниженная нагрузка»."],["Современность","Проводятся турниры по подкидному и переводному дураку, популярны онлайн-версии. Сегодня игра «Дурак» доступна не только за столом, но и на экране, и портал показывает, как привычная игра выглядит в цифровом виде. Онлайн-сообщества, рейтинги и турниры поддерживают интерес к игре и привлекают новых участников. В настройках игры доступно до двадцати пар
