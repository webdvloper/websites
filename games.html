<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Неон Аркада — игровой портал</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--a1:#00e5ff;--a2:#ff2bd6;--neon:1;--bg:#080b1c;--panel:rgba(255,255,255,.075);--tx:#e8ecff;--mut:#9aa3d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-width:thin;scrollbar-color:var(--a1) #0d1226}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
body.bg-grad{background:linear-gradient(135deg,#0a0f2e,#240a3a 60%,#05222b)}
body.bg-anim{background:#0a0f2e}body.bg-anim::before{content:'';position:fixed;inset:-60%;z-index:-1;background:linear-gradient(120deg,#0a0f2e,#2a0a45,#04283a,#2b0a2a);animation:bgr 60s linear infinite;will-change:transform;pointer-events:none}@keyframes bgr{to{transform:rotate(360deg)}}
body.noanim *{animation:none!important;transition:none!important}
@keyframes bgm{50%{background-position:100% 50%}}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0d1226}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--a1),var(--a2));border-radius:8px;box-shadow:0 0 8px var(--a1)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;position:sticky;top:0;z-index:5;background:rgba(8,11,28,.94);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:Orbitron,sans-serif;font-weight:800;font-size:22px;letter-spacing:2px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 calc(8px*var(--neon)) var(--a1));cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:22px}
h1,h2,h3{font-family:Orbitron,sans-serif;margin:.2em 0 .5em}
.btn{position:relative;overflow:hidden;border:1px solid var(--a1);background:rgba(0,229,255,.08);color:var(--tx);padding:10px 18px;border-radius:12px;font:600 14px Inter,sans-serif;cursor:pointer;transition:.2s;box-shadow:0 0 calc(10px*var(--neon)) color-mix(in srgb,var(--a1) 50%,transparent)}
.btn:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--a1) 25%,transparent)}
.btn.alt{border-color:var(--a2);background:rgba(255,43,214,.08);box-shadow:0 0 calc(10px*var(--neon)) color-mix(in srgb,var(--a2) 50%,transparent)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-5px) scale(1.02);border-color:var(--a1);box-shadow:0 0 calc(22px*var(--neon)) color-mix(in srgb,var(--a1) 60%,transparent)}
.card .em{font-size:42px}.card.lock{opacity:.45}
.badge{font-size:11px;color:var(--mut)}
.glass{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.mut{color:var(--mut);line-height:1.6}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;border-radius:14px;background:var(--ui,var(--panel));border:1px solid rgba(255,255,255,.1)}
.stage{display:flex;flex-direction:column;align-items:center}
.over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:20}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px}
.modal .glass{background:#10152e;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
select,input[type=range]{background:#0d1226;color:var(--tx);border:1px solid var(--a1);border-radius:8px;padding:5px}
input[type=color]{width:42px;height:28px;border:none;background:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10152e;border:1px solid var(--a2);padding:10px 18px;border-radius:12px;z-index:50}
.board{display:grid;gap:4px;padding:8px;border-radius:12px;touch-action:manipulation}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:800 calc(var(--cs,60px)*.6) Orbitron,sans-serif;cursor:pointer;border-radius:6px;position:relative}
canvas{max-width:100%;border-radius:12px;touch-action:none}
.pad{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
ul.f{padding-left:20px}
@media(max-width:600px){main{padding:12px}.logo{font-size:17px}}
</style>
</head>

const PRESETS=[['#00e5ff','#ff2bd6'],['#a259ff','#00e5ff'],['#39ff14','#ffd400'],['#ff9500','#ff2bd6']];
function openSettings(keys){const m=document.createElement('div');m.className='modal';
m.innerHTML='<div class="glass"><h2>⚙ '+t('settings')+'</h2><div class="row" id="pre"></div><div id="fl"></div><div class="row"><button class="btn alt" id="rs">'+t('reset')+'</button><button class="btn" id="cl">OK</button></div></div>';
document.body.appendChild(m);m.addEventListener('pointerdown',ev=>{if(ev.target===m){m.remove();if(!location.hash.startsWith('#/play/'))route()}});
PRESETS.forEach(p=>{const b=document.createElement('button');b.className='btn';b.style.background=`linear-gradient(90deg,${p[0]},${p[1]})`;b.textContent='  ';b.onclick=()=>{S.accent=p[0];S.accent2=p[1];save();apply();m.remove();openSettings(keys)};$('#pre',m).appendChild(b)});
FIELDS.filter(f=>!keys||keys.includes(f[0])).forEach(([k,l,ty,a,b,c])=>{const w=document.createElement('div');w.className='fld';w.innerHTML='<span>'+l+'</span>';let i;
if(ty==='sel'){i=document.createElement('select');a.forEach(([v,n])=>{const o=document.createElement('option');o.value=v;o.textContent=n;i.appendChild(o)});i.value=S[k];i.onchange=()=>{S[k]=isNaN(+i.value)?i.value:+i.value;save();apply()}}
else if(ty==='chk'){i=document.createElement('input');i.type='checkbox';i.checked=S[k];i.onchange=()=>{S[k]=i.checked;save();apply()}}
else{i=document.createElement('input');i.type=ty;if(ty==='range'){i.min=a;i.max=b;i.step=c}i.value=S[k];i.oninput=()=>{S[k]=ty==='range'?+i.value:i.value;save();apply()}}
w.appendChild(i);$('#fl',m).appendChild(w)});
$('#cl',m).onclick=()=>{m.remove();route()};$('#rs',m).onclick=()=>{S={...DEF};save();apply();m.remove();openSettings(keys)}}
$('#setBtn').onclick=()=>openSettings();

battleship:{h:'Бумажная игра начала XX века; в 1967 году Milton Bradley выпустил настольную версию, позже появились компьютерные.',r:'У каждого флот: корабли на 5, 4, 3, 3 и 2 клетки на поле 10×10. Игроки по очереди стреляют по клеткам соперника. Побеждает тот, кто первым потопит весь флот. В режиме «Залп» после попадания стреляете снова.',f:['Стрелять по шахматной диагонали — эффективная стратегия поиска.','Корабли в этой версии могут стоять рядом.','Во время Первой мировой игра ходила в виде листков бумаги.']},
sudoku:{h:'Современная форма создана американцем Говардом Гарнсом в 1979 году; популярность пришла из Японии в 1980-х.',r:'Заполните сетку 9×9 цифрами 1–9 так, чтобы они не повторялись в строке, столбце и каждом блоке 3×3. Выберите клетку и введите цифру; конфликты подсвечиваются.',f:['Слово «судоку» — сокращение японской фразы о «единственных цифрах».','Шесть квинтиллионов с лишним готовых сеток.','Минимальное число подсказок для единственного решения — 17.']},
bingo:{h:'Происходит от итальянской лотереи Lo Giuoco del Lotto d\'Italia (XVI век); в США с 1929 года известна как Bingo.',r:'У каждого карточка 5×5 (центр свободен). Шары 1–75 выпадают по одному: если число есть на вашей карточке — кликните по нему. Побеждает тот, кто первым закроет линию: строку, столбец или диагональ.',f:['Колонки карточки соответствуют буквам B-I-N-G-O.','В Великобритании популярна версия с 90 шарами.','Название, по одной из версий, пришло от возгласа «Beano».']},
dobble:{h:'Карточная игра на внимательность, выпущена во Франции в 2009 году (в США — Spot It!).',r:'На любых двух картах есть ровно один общий символ. Найдите его на своей карте и кликните раньше соперника. Победитель — тот, кто первым наберёт 10 очков (или больше очков за 60 секунд).',f:['Колода построена на конечной проективной плоскости.','Полная колода — 55 карт по 8 символов.','Здесь — упрощённая колода: 31 карта по 6 символов.']},
checkers:{h:'Предки шашек — древние игры вроде алькерка (Египет, Ближний Восток); современные правила сложились в Европе в XII–XVI веках.',r:'Шашки ходят по тёмным клеткам по диагонали вперёд. Бить обязательно, можно и назад, цепочкой. Дойдя до последнего ряда, шашка становится дамкой (♛) и ходит во все стороны (в этой версии — на одну клетку). Проигрывает тот, у кого не осталось ходов.',f:['В 1994 году программа Chinook победила чемпиона мира по английским шашкам.','Английские шашки были полностью решены в 2007 году: при идеальной игре — ничья.','Русские шашки: дамка ходит на любое расстояние (здесь упрощено).']},
corners:{h:'Русская игра, родственная китайским шашкам (Halma изобретена в США в 1880-х).',r:'У каждого по 9 фишек в углу 3×3. Фишка ходит на соседнюю клетку (в любую из 8 сторон) или прыгает через соседнюю фишку на свободную клетку за ней, цепочкой. Цель — занять все клетки угла соперника.',f:['Побеждает не самый быстрый, а тот, кто строит «лестницы» для прыжков.','Игра развивает пространственное мышление.','Лимит в 200 ходов: тогда побеждает тот, кто ближе к цели.']},
airhockey:{h:'Аэрохоккей изобрели в 1972 году в США инженеры Brunswick; быстро стал классикой залов игровых автоматов.',r:'Бейте шайбу рукояткой (мышь или палец) и забивайте в ворота соперника. Шайба скользит почти без трения и отскакивает от бортов. Игра идёт до целевого счёта (в настройках).',f:['Шайба парит на воздушной подушке из отверстий в столе.','Скорость шайбы в профессиональных играх превышает 100 км/ч.','Существует международная федерация и чемпионаты мира.']},
lotto:{h:'Русское лото известно с XIX века и восходит к итальянской лотерее; в СССР стало семейной настольной игрой.',r:'Карточка 3×9, в каждой строке по 5 чисел (1–90). Бочонки достают по одному; если число есть на вашей карточке — кликните по нему. Побеждает тот, кто первым закроет все 15 чисел.',f:['Классические бочонки — деревянные, с числами 1–90.','Числа в столбцах идут по возрастанию сверху вниз.','Игровые объявления бочонков имеют фольклорные прозвища.']},
chess:{h:'Шахматы возникли в Индии (чатуранга) около VI века, через Персию и арабский мир пришли в Европу; современные правила сложились в XV веке.',r:'Белые ходят первыми. Каждая фигура ходит по-своему: ладья по прямой, слон по диагонали, ферзь как оба, конь буквой Г, король на 1 клетку, пешка вперёд (бьёт по диагонали). Цель — поставить королю соперника мат. В этой версии нет рокировки и взятия на проходе, пешка автоматически превращается в ферзя, ничья — только пат.',f:['В 1997 году Deep Blue обыграл Гарри Каспарова.','Число возможных партий оценивается больше числа атомов во Вселенной.','Самый быстрый мат в партии — 2 хода (детский мат за чёрных).','Мировой чемпионат проводится с 1886 года.','Современные движки типа Stockfish сильнее любого человека.']},
uno:{h:'Уно придумал в 1971 году американский парикмахер Мерл Роббинс; в 1992 году права купила Mattel.',r:'У каждого по 7 карт. Играйте карту того же цвета или значения, что и верхняя. Пропуск, разворот, +2 и дикие карты (выбор цвета, +4) меняют ход игры. Нет подходящей — берите карту. Побеждает тот, кто первым избавился от всех карт. В этой версии нет объявления «Уно!».',f:['Колода содержит 108 карт; здесь она упрощена.','Игра продаётся более чем в 80 странах.','Рекордное число сыгранных подряд партий измеряется сутками.']},
billiards:{h:'Бильярд возник в Европе в XIV–XV веках как «настольный крокет»; современные правила сложились в XIX веке, когда на кий стали наклеивать кожаную наклейку.',r:'Оттяните курсор от битка и отпустите — чем дальше, тем сильнее удар. Забивайте шары в лузы. Забил — бьёте снова, не забил — ход переходит. Если забит биток (штраф), он возвращается на стол, а ход переходит. Побеждает тот, кто забил больше шаров, когда стол очищен. Это упрощённый вариант без номеров и цветов.',f:['Современные столы для снукера имеют длину 3,57 м.','Слово «кий» имеет французское происхождение.','Рекордный брейк в снукере — 147 очков (максимум).']},
words:{h:'Игры в слова популярны давно (балда, эрудит); формат угадывания слова с цветными подсказками стал массовым с 2021 года (Wordle).',r:'Загадано слово из 5 букв. Вводите слова: зелёная клетка — буква на месте, жёлтая — буква есть в другом месте, серая — такой буквы нет. Количество попыток зависит от сложности ИИ (в настройках). Проверка словаря не используется: можно вводить любые 5 букв.',f:['Букву «ё» в этой версии заменяет «е».','«Слово дня» одинаково для всех в один и тот же день.','Словарь здесь — около 50 загаданных слов.']},
backgammon:{h:'Нарды — одна из древнейших настольных игр: близкие к ним игры найдены в Месопотамии и Египте (III тыс. до н. э.). Здесь — длинные нарды.',r:'У каждого 15 шашек в «голове». Бросаются две кости, ходы равны очкам на них (при дубле — четыре хода). Шашки идут по кругу против часовой стрелки до своего «дома» (последняя четверть), затем снимаются с доски. На пункт с шашками соперника вставать нельзя. Побеждает тот, кто первым снял все 15. В этой версии нет ограничения «одна шашка с головы за ход» и запрета блока из шести пунктов подряд.',f:['Короткие нарды (триктрак) отличаются тем, что шашки соперника можно бить.','Кубики придают игре случайность, но стратегия решает больше.','В странах Ближнего Востока нарды — национальная игра, проводятся турниры.']},
mafia:{h:'Мафию придумал в 1986 году студент МГУ Дмитрий Давыдов; игра быстро распространилась по миру как «Mafia» и «Werewolf».',r:'Игроки получают тайные роли: мафия, доктор, шериф, мирные. Ночью мафия выбирает жертву, доктор лечит, шериф проверяет игрока. Днём все голосуют, кого казнить. Мафия побеждает, когда её численность не меньше остальных; город побеждает, когда мафии не осталось. Здесь участвуете вы и ИИ-игроки; «обсуждения» нет, только голосование.',f:['Шериф узнаёт только «мафия» или «не мафия».','Если доктор лечит жертву мафии, ночью никто не погибает.','Спортивная мафия — это турнирный формат с жёсткими правилами.']},
shogi:{h:'Сёги — японские шахматы; современная форма сложилась в XVI веке, а ввод взятых фигур обратно на доску появился около 1500 года.',r:'Поле 9×9, у каждого по 20 фигур. Ходят по очереди; фигуры бьют, как и ходят. Взятую фигуру можно выставить на любую пустую клетку как свою (сброс). Пешка, копьё, конь и серебро, дойдя до трёх дальних рядов, становятся «золотом», слон и ладья усиливаются. Побеждает тот, кто поставил мат королю. В этой версии превращение происходит автоматически, нет запрета на мат пешкой при сбросе.',f:['Сброс фигур делает сёги единственными шахматоподобными играми без ничьих.','Лучшие профессионалы Японии — настоящие знаменитости.','Фуджи Сота стал самым молодым профессионалом в 2016 году.']},
monopoly:{h:'Игру создала Элизабет Мэги в 1904 году как The Landlord\'s Game; в 1935 году Parker Brothers выпустила Monopoly, ставшую мировым хитом.',r:'Игроки ходят по кругу из 24 клеток, бросая два кубика. Незанятую улицу можно купить, на чужой — платишь ренту (вдвое больше, если у хозяина обе улицы одной пары). Шанс даёт или забирает деньги, налог — минус 100, проход «Старта» — плюс 200. Банкрот выбывает. Побеждает последний оставшийся или самый богатый после 40 кругов (15 в быстрой). Это упрощённая версия без аукционов, тюрьмы и домов.',f:['Оригинальная игра задумывалась как критика монополий.','Играют более чем в 100 странах.','Проводятся чемпионаты мира по Monopoly.']}};
// ---------- router ----------
let cur=null;
function stop(){if(cur){cur.stop&&cur.stop();cur=null}xfxClear()}
function route(){stop();if(!location.hash.startsWith('#/play/'))restoreS();const p=location.hash.replace('#/','').split('/'),app=$('#app');
if(p[0]==='game'&&p[1]){card(p[1],app)}
else if(p[0]==='play'&&p[1]){play(p[1],p[2],app)}
else menu(app);apply();window.scrollTo(0,0)}
function menu(app){app.innerHTML='<h1 data-t="menu"></h1><p class="mut">30 игр. Выберите игру, режим и настройте поле под себя.</p><div class="grid"></div>';
G.forEach(g=>{const c=document.createElement('div');c.className='card'+(g[4]?'':' lock');c.innerHTML=`<div class="em">${g[1]}</div><h3>${S.lang==='ru'?g[2]:g[3]}</h3><div class="badge">${g[4]?'20 режимов':t('soon')}</div>`;
c.onclick=()=>g[4]?location.hash='#/game/'+g[0]:toast(t('soon'));$('.grid',app).appendChild(c)})}
function card(id,app){const g=G.find(x=>x[0]===id);if(!g||!g[4])return location.hash='#/';const i=INFO[id];
app.innerHTML=`<button class="btn" onclick="location.hash='#/'">${t('back')}</button><h1>${g[1]} ${g[2]}</h1><div class="glass"><h3>${t('modes')}</h3><div class="row" id="md"></div><div class="row"><button class="btn alt" onclick="openSettings(GK(location.hash.split('/')[2]))">⚙ Настройки игры (20)</button></div><p class="mut">${t('pick')}. Цвета, скорость, размер и сложность ИИ — в ⚙ Настройках.</p></div>
<div class="glass" style="margin-top:16px"><h3>История</h3><p class="mut">${i.h}${(INFO4[id]||{})['История']||''}</p><h3>Правила</h3><p class="mut">${i.r}${(INFO4[id]||{})['Правила']||''}</p><h3>Интересные факты</h3><ul class="f mut">${i.f.map(x=>'<li>'+x+'</li>').join('')}</ul><p class="mut">${(INFO4[id]||{})['Интересные факты']||''}</p>${secs(id)}</div>`;
[...MODES[id],['tour','🏆 Турнир против ИИ (3 раунда)'],['camp','🎯 Кампания (10 уровней)'],...XM,...XM2.slice(0,Math.max(0,20-MODES[id].length-2))].forEach(([m,n])=>{const b=document.createElement('button');b.className='btn';b.textContent='▶ '+n;b.onclick=()=>location.hash=`#/play/${id}/${m}`;$('#md',app).appendChild(b)})}
const IMPL={};
function play(id,mode,app){if(!IMPL[id])return location.hash='#/';restoreS();const xm=mode.startsWith('x-'),k=xm?mode.slice(2):'',meta=mode==='tour'||mode==='camp',gm=(meta||xm)?(({tetris:'sprint',monopoly:'quick'})[id]||MODES[id][0][0]):mode;let M=null;if(xm){META.base={ai:S.ai,speed:S.speed,target:S.target,size:S.size};applyMod(k)}
const setLvl=m=>{S.ai=m.k==='tour'?Math.min(5,META.base.ai+m.r-1):Math.min(5,Math.ceil(m.r/2));if(m.k==='camp')S.speed=Math.min(10,2+m.r)};
if(meta){M=mode==='tour'?{k:'tour',r:1,n:3}:{k:'camp',r:Math.min(10,LC('na-c-'+id)+1),n:10};META.base={ai:S.ai,speed:S.speed,target:S.target,size:S.size};setLvl(M)}
const bn=()=>{const e=$('#bn');if(e&&M)e.textContent=(M.k==='tour'?'🏆 Турнир · раунд '+M.r+'/'+M.n:'🎯 Кампания · уровень '+M.r+'/'+M.n)+' · ИИ ур. '+S.ai};
const metaEnd=(msg,again)=>{const w=msg.startsWith(t('win'))||msg.startsWith('Победа')||msg.startsWith('Спринт');if(msg.startsWith(t('draw'))){over('Ничья — переигровка',again);return}
if(!w){over('Поражение. '+(M.k==='tour'?'Вы вылетели из турнира в раунде '+M.r:'Уровень '+M.r+' не пройден'),again);return}
if(M.k==='camp')try{localStorage.setItem('na-c-'+id,M.r)}catch{}
if(M.r>=M.n){over(M.k==='tour'?'🏆 Вы выиграли турнир!':'🎯 Кампания пройдена!',()=>{M.r=1;setLvl(M);again()});return}
M.r++;setLvl(M);over('Победа! Дальше: '+(M.k==='tour'?'раунд ':'уровень ')+M.r,again)};
app.innerHTML=`<div class="stage"><div class="hud"><button class="btn" id="bk">${t('back')}</button><b id="ttl"></b><span id="sc"></span><button class="btn alt" id="rst">↻</button></div><div id="bn" class="mut" style="margin-bottom:8px"></div><div id="host"></div></div>`;
$('#bk').onclick=()=>location.hash='#/game/'+id;
const start=()=>{stop();$('#host').innerHTML='';bn();if(k==='daily')xfxSeed();cur=IMPL[id]($('#host'),gm,{score:v=>$('#sc').textContent=v,title:v=>$('#ttl').textContent=v,end:msg=>M?metaEnd(msg,start):over(msg,start)});xfx(k,start)};
$('#rst').onclick=start;start()}
function over(msg,again){const o=document.createElement('div');o.className='over';o.innerHTML=`<div class="glass" style="text-align:center"><h2>${msg}</h2><div class="row" style="justify-content:center"><button class="btn" id="ag">${t('again')}</button><button class="btn alt" id="mn">${t('menu')}</button></div></div>`;document.body.appendChild(o);
$('#ag',o).onclick=()=>{o.remove();again()};$('#mn',o).onclick=()=>{o.remove();location.hash='#/'}}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
// ---------- TIC TAC TOE ----------
IMPL.ttt=(h,mode,ui)=>{const mis=mode==='misere',fade=mode==='fade',blind=mode==='blind',q={};if(mis||fade||blind)mode='ai';const N=S.tn,W=Math.min(N,S.tw||(N===3?3:4)),b=Array.from({length:N*N},(_,i)=>S.tblock&&N%2&&i===(N*N-1)/2?'■':''),cs=Math.max(44,Math.min(110,Math.floor(Math.min(innerWidth-60,520)/N)));let turn='X',done=false;
const el=document.createElement('div');el.className='board';el.style.cssText=`grid-template-columns:repeat(${N},${cs}px);background:${S.field};--cs:${cs}px`;h.appendChild(el);
const lines=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const L=[];for(let k=0;k<W;k++){const x=r+dr*k,y=c+dc*k;if(x<0||y<0||x>=N||y>=N)break;L.push(x*N+y)}if(L.length===W)lines.push(L)}
const win=(bd,p)=>lines.some(L=>L.every(i=>bd[i]===p)),full=bd=>bd.every(Boolean);
const cells=b.map((_,i)=>{const c=document.createElement('div');c.className='cell';c.style.cssText=`border:1px solid ${S.grid}`;c.onclick=()=>click(i);el.appendChild(c);return c});
const paint=()=>{cells.forEach((c,i)=>{c.textContent=b[i]&&!(blind&&b[i]==='O'&&!done)?(({xo:{X:'X',O:'O'},st:{X:'★',O:'●'},em:{X:'❌',O:'⭕'}})[S.tsym||'xo'][b[i]]||b[i]):'';c.style.color=b[i]==='X'?S.p1:(mode==='ai'?S.pc:S.p2);c.style.textShadow=b[i]?`0 0 ${12*S.neon}px currentColor`:''});ui.title(mode==='ai'?'Вы: X  ИИ: O':'Ход: '+turn)};
function mm(bd,p,me,a,be){if(win(bd,me))return 1;const o=me==='X'?'O':'X';if(win(bd,o))return-1;if(full(bd))return 0;const e=bd.map((v,i)=>v?-1:i).filter(i=>i>=0);
if(p===me){let v=-2;for(const i of e){bd[i]=p;v=Math.max(v,mm(bd,o,me,a,be));bd[i]='';a=Math.max(a,v);if(a>=be)break}return v}
let v=2;for(const i of e){bd[i]=p;v=Math.min(v,mm(bd,me,me,a,be));bd[i]='';be=Math.min(be,v);if(a>=be)break}return v}
function ai(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0),lv=S.ai;if(lv===1)return rnd(e);if(mis){const sf=e.filter(i=>{b[i]='O';const w=win(b,'O');b[i]='';return !w});return rnd(sf.length?sf:e)}
const find=p=>e.find(i=>{b[i]=p;const w=win(b,p);b[i]='';return w});
if(lv>=2){const w=find('O');if(w!==undefined)return w;const bl=find('X');if(bl!==undefined)return bl}
if(lv===2)return rnd(e);

const allM=id=>[...MODES[id],['tour','🏆 Турнир против ИИ (3 раунда)'],['camp','🎯 Кампания (10 уровней)'],...XM,...XM2.slice(0,Math.max(0,20-MODES[id].length-2))];
const GKB=['p1','p2','pc','field','grid','ui','ai','speed','size','target','dur','neon','accent','accent2','bg','anim','sound','vol','music','mvol'];
function GK(id){const R={ttt:{accent2:'tn',neon:'tw',bg:'tfirst',anim:'tsym',ui:'tdelay',mvol:'tblock',size:'twinhl'},tetris:{target:'tgar',pc:'tlv',p1:'tghost',p2:'tspr',accent2:'tbag',grid:'tnext',ui:'tmul',ai:'tset',anim:'tmin'},pong:{neon:'pph',bg:'pacc',ui:'pai',mvol:'pwrap',accent2:'pbs',anim:'pps'},reversi:{neon:'rcw',bg:'rhint',anim:'rdelay',mvol:'rpos',ui:'rdepth',size:'rmob'},checkers:{neon:'cforce',bg:'cback',anim:'ckdelay',pc:'ckrows',mvol:'ckfly'},chess:{neon:'cpromo',bg:'cfora',anim:'cdelay',ui:'cdepth',pc:'cnoise',mvol:'cqv',vol:'cgs'},uno:{neon:'uhand',bg:'uwild',ui:'uadelay',accent2:'ucols'},battleship:{neon:'bsfleet',bg:'bssize',ui:'bsdelay',mvol:'bsadj'},sudoku:{neon:'sdclues',bg:'sderr',ui:'sdhl',mvol:'sdsame',accent2:'sdrel',anim:'sdtl'},airhockey:{neon:'ahfric',bg:'ahgoal',ui:'ahmax',mvol:'ahbn'},billiards:{neon:'bfric',bg:'brows',ui:'bpow',mvol:'bcu'},backgammon:{neon:'bgn',bg:'bgd',ui:'bgdelay',mvol:'bgdbl'},mafia:{neon:'mmaf',bg:'mdoc',anim:'msher',ui:'mpl',mvol:'mtie'},monopoly:{neon:'mcash',bg:'mgo',anim:'mtax',ui:'mprice',mvol:'mrent',grid:'mdice'},bingo:{neon:'bgfree',bg:'bgwin',ui:'bghl',mvol:'bgpre'},dobble:{neon:'dbt',bg:'dbsec',ui:'dbai',mvol:'dbsz'},corners:{neon:'cornlim',bg:'cornjump',ui:'cndelay',mvol:'cornhint'},lotto:{neon:'ltper',bg:'ltauto',ui:'ltpre',mvol:'lthl'},words:{neon:'wtries',bg:'wtime',ui:'wkb',mvol:'wdict'},shogi:{neon:'sgdrop',bg:'sgpromo',ui:'sgdelay',mvol:'sgdepth'}}[id];return R?GKB.map(k=>R[k]||k):GKB}
const CTRL={ttt:'Клик по клетке.',reversi:'Клик по клетке; точки показывают допустимые ходы.',pong:'W/S, ↑/↓ или мышь и палец.',tetris:'← и →, ↑ — поворот, ↓ — вниз, пробел — сброс; кнопки на экране.',battleship:'Клик по клетке поля противника.',sudoku:'Клик по клетке и цифра с клавиатуры или с панели.',bingo:'Клик по числам, которые уже выпали.',dobble:'Клик по общему символу на нижней карте.',checkers:'Клик по шашке, затем по клетке.',corners:'Клик по фишке, затем по клетке.',airhockey:'Мышь или палец для нижней колотушки; WASD для верхней в режиме 1 vs 1.',lotto:'Клик по выпавшим числам на карточке.',chess:'Клик по фигуре, затем по клетке.',uno:'Клик по карте; кнопки «Взять карту» и «Пас».',billiards:'Оттяните курсор от биткa и отпустите.',words:'Экранная или обычная клавиатура, Enter.',backgammon:'Клик по пункту с шашкой, затем по цели; кнопка «Снять шашку».',mafia:'Кнопки выбора игрока.',shogi:'Клик по фигуре или по резерву, затем по клетке.',monopoly:'Кнопки «Бросить кубики», «Купить», «Пропустить».'};
function secs(id){const sp=[...Object.entries(INFO2[id]||{}),...Object.entries(INFO3[id]||{})],lab=GK(id).map(k=>FIELDS.find(f=>f[0]===k)[1]),pv=MODES[id].some(m=>m[0]==='pvp');
const gen=[['Режимы игры',allM(id).map(x=>x[1]).join('; ')+'.'],['Турнир против ИИ','Серия из трёх матчей: с каждым раундом уровень ИИ растёт. Поражение выбивает из турнира, победа в финале приносит титул.'],['Кампания','Десять уровней с растущей сложностью ИИ и скоростью; пройденный уровень сохраняется.'],['Сложность ИИ','Пять уровней: Очень легко, Легко, Средне, Сложно, Невозможный; выбирается в настройках игры.'],['Настройки игры',lab.join(', ')+'.'],['Управление',CTRL[id]],['Ежедневный вызов','Одинаковая раздача для всех в течение суток — сравните результат с друзьями.'],['Блиц и лимит партии','Режим «Блиц» ограничивает партию двумя минутами; настройка «Лимит партии» задаёт 2, 5 или 10 минут.'],['Модификаторы','Ускорение, замедление, крупные и мелкие объекты, зеркало, переворот, хаос, радуга, тусклый свет, туман и качка меняют вид или темп игры.'],['Звук и музыка','Три синтезированных трека и звуковые эффекты; громкость настраивается отдельно.'],['Цвета и тема','Цвета поля, сетки, игроков, ИИ и интерфейса меняются сразу.'],['Сохранение','Настройки и прогресс кампании хранятся в браузере (localStorage).'],['Мобильная версия','Интерфейс адаптивен, игры управляются касанием.'],['Производительность','Режим «Сниженная нагрузка» отключает неон и анимации; игра не требует внешних сервисов, кроме шрифтов.'],['Совет новичку','Начните с режима «Тренировка»: ИИ очень лёгкий, можно спокойно изучить правила.'],['Вызов для опытных','Попробуйте «Невозможный ИИ», «Блиц» и «Зеркало» в одной серии партий.'],['Игра вдвоём',pv?'Режим «1 vs 1» работает на одном устройстве: передавайте управление по очереди.':'В этой игре нет режима «1 vs 1»: соревнуйтесь с ИИ или сравнивайте результаты с друзьями.']];
return [...sp,...gen.slice(0,17-sp.length)].map(([a,v])=>'<h3>'+a+'</h3><p class="mut">'+v+(INFO4[id]&&INFO4[id][a]?' '+INFO4[id][a]:'')+'</p>').join('')}
const INFO3={
chess:{'Дебюты':'Классические начала — итальянская партия, испанская партия, сицилианская защита, ферзевый гамбит. Главные принципы: занять центр, развить фигуры, увести короля в безопасность.','Миттельшпиль':'Здесь решают планы: атака на короля, игра на слабых пешках, захват открытых линий ладьями и борьба за лучшие поля для коней.','Эндшпиль':'Король становится активной фигурой. Важны оппозиция, проходная пешка и активность ладьи, стоящей за пешкой.','Тактические приёмы':'Вилка, связка, двойной удар, отвлечение, завлечение и вскрытый шах — основа большинства комбинаций.','Типичные ошибки':'Лишние ходы одной фигурой в дебюте, ранний выход ферзя, игнорирование угроз соперника и поспешные размены.','Тренировка':'Решайте тактические задачи, разбирайте свои партии, изучайте простые эндшпили и играйте в режиме «Тренировка» с подсказками.','Шахматная нотация':'Ходы записывают алгебраической нотацией: буква фигуры и клетка, например Кf3; взятие — x, шах — +, рокировка — 0-0.','Детский мат':'Самый быстрый мат — за два хода чёрных (1.f3 e5 2.g4 Qh4#); он возможен только при грубых ошибках соперника.','Упрощения портала':'В версии портала нет рокировки и взятия на проходе, пешка превращается по выбору в настройках, ничья возможна только при пате.'},
tetris:{'Тетрамино':'Семь фигур по четыре квадрата: I, O, T, S, Z, J, L; каждую можно поворачивать.','Скорость и уровни':'С каждыми десятью линиями в классическом режиме уровень растёт и фигуры падают быстрее; стартовый уровень задаётся в настройках.','Техники':'Колодец под фигуру I, ровная поверхность без дыр и заранее продуманное размещение фигур — основа высоких результатов.','Типичные ошибки':'Дыры под фигурами, высокая башня у края стакана, ставить фигуры без плана и поворачивать в последний момент.','Тренировка':'Начните со стартового уровня 1 и включите «Тень фигуры»; затем добавляйте стартовый мусор.','Режимы портала':'Классика, спринт на 20–80 линий, марафон на 150, ультра на 2 минуты, дзен без ускорения и невидимые блоки.','Управление и сброс':'Мгновенный сброс пробелом экономит время, но требует точного прицела; мягкое падение — стрелка вниз.','Рекорды':'Классический чемпионат мира по Tetris включает скоростные дисциплины и рекорды очков, а лучшие игроки доходят до экстремально высоких уровней.','Эргономика':'На мобильных устройствах доступны экранные кнопки поворота и сброса, а опытные игроки быстрее играют с клавиатуры.'},
ttt:{'Математика':'На поле 3×3 всего 765 принципиально разных позиций; при идеальной игре обеих сторон партия заканчивается ничьей.','Идеальная стратегия':'Если вы ходите первым, занимайте угол; на ответ в центр отвечайте противоположным углом, на ответ в угол — занимайте центр.','Двойная угроза':'Поставьте метку так, чтобы создать две незакрытые линии одновременно — соперник сможет закрыть только одну.','Расширенные поля':'На полях 4×4 и 5×5 с линией 4 важнее блокирование: преимущество первого игрока заметно выше.','Мизер':'В режиме «Мизер» проигрывает тот, кто собрал линию, поэтому тактика обратная — не создавайте собственных угроз.','Исчезающие метки':'В режиме «Исчезающие метки» у каждого не более трёх меток: самые старые пропадают, и ничьи случаются реже.','Польза для детей':'Игра знакомит с логикой, предвидением ходов и понятием ничьей.','ИИ в портале':'На высоких уровнях на поле 3×3 ИИ использует полный перебор и не проигрывает; на больших полях — выигрыш и блок.','Компьютерная история':'Одной из первых компьютерных игр была OXO (1952, Кембридж) для машины EDSAC.'},
checkers:{'Правила ходов':'Простая шашка ходит вперёд по диагонали на одну клетку, а бьёт вперёд и назад, перепрыгивая шашку соперника.','Дамка':'Дойдя до последней горизонтали, шашка становится дамкой; в портале дамка ходит и бьёт на одну клетку.','Обязательное взятие':'По умолчанию бить обязательно; в настройках «Обязательное взятие» можно отключить.','Комбинации':'Жертва шашки ради многократного взятия — главный тактический приём.','Дебютные принципы':'Занимайте центр, держите задние шашки как можно дольше и не выдвигайтесь на фланги.','Эндшпиль':'Дамки сильнее простых шашек; несколько дамок против одной обычно выигрывают при правильной игре.','Поддавки':'В режиме «Поддавки» побеждает тот, кто остался без ходов; тактика — отдавать шашки.','Все дамки':'В режиме «Все дамки» игра начинается с дамок, поэтому важна осторожность при разменах.','Тренировка':'Режим «Тренировка» подсвечивает шашки, которыми можно ходить.'},
reversi:{'Дебютные принципы':'В начале игры стремитесь к малому числу фишек и высокой мобильности: чем меньше ходов у соперника, тем лучше.','Углы и края':'Угловые клетки нельзя перевернуть; клетки рядом с углом (X- и C-клетки) опасны, пока угол свободен.','Мобильность':'Мобильность — число доступных ходов. Ограничивайте ходы соперника и сохраняйте свои.','Чётность':'В эндшпиле важна чётность свободных зон: стремитесь сделать последний ход в каждой области.','Типичные ошибки':'Жадный захват фишек в дебюте, ранняя игра на краях и ходы рядом со свободным углом.','Анти-реверси':'В режиме «Анти-реверси» побеждает тот, у кого меньше фишек; тактика обратная.','Подсказки':'Режим «Тренировка» и настройка «Подсказки» показывают допустимые ходы точками.','Ценность углов':'Настройка «Ценность углов для ИИ» меняет стиль ИИ: от осторожного до агрессивного захвата углов.','Тренировка с ИИ':'Начинайте с очень лёгкого ИИ и постепенно повышайте сложность, отслеживая, сколько фишек вы теряете в конце.'},
pong:{'Физика отскока':'Угол отскока зависит от точки касания ракетки: край отправляет мяч круче, центр — прямее.','Ускорение':'Настройка «Ускорение мяча при ударе» делает розыгрыши быстрее с каждым отбитием.','Размер ракетки':'Короткая ракетка сложнее для обороны, но точнее при ударе; длинная упрощает игру.','Режим выживания':'Справа стена, а счёт — число отбитых мячей; игра заканчивается, когда вы пропускаете мяч.','Невидимый мяч':'В режиме «Невидимый мяч» он пропадает в центре поля — нужно предугадывать траекторию.','Подготовка':'Следите за мячом, а не за ракеткой; возвращайтесь к центру после каждого удара.','Типичные ошибки':'Преследование мяча вместо предугадывания, удары центром ракетки и паника при ускорении.','Мультиплеер':'В режиме «1 vs 1» один игрок управляет клавишами W/S, второй — стрелками.','Целевой счёт':'Режим «Бесконечный» отключает целевой счёт: играйте, пока не надоест.'},
uno:{'Раздача':'Каждому раздают 7 карт; в портале размер руки настраивается от 5 до 12, а в режиме «Горка» — 14.','Действующие карты':'Пропуск, разворот, +2 и дикие карты меняют ход игры; при двух игроках разворот работает как пропуск.','Дикие карты':'Дикая карта позволяет выбрать цвет, «+4» заставляет соперника взять 4 карты и пропустить ход.','Взять карту':'Если подходящей карты нет, берите из колоды; сыграйте её, если подходит, иначе пасуйте.','Стратегия цвета':'Меняйте цвет на тот, которого у вас больше, и придерживайте дикие карты до решающего момента.','Против нескольких ИИ':'В режиме «1 vs 3 ИИ» разворот меняет направление хода, а карты +2 и +4 бьют по следующему игроку.','Типичные ошибки':'Ранний расход диких карт, слишком много цветов в руке и игнорирование карт соперников.','Настройка диких карт':'Настройка «Диких карт каждого вида» (2, 4 или 8) меняет колоду: чем больше диких, тем больше хаоса.','Объявление «Уно!»':'В этой версии нет объявления «Уно!» при одной карте, поэтому штрафа за забывчивость нет.'},
sudoku:{'Базовые приёмы':'Одиночки: если в клетке возможна только одна цифра, ставьте её; скрытые одиночки — когда цифра возможна в единственной клетке блока.','Пары':'Голые пары — две клетки с одинаковыми двумя кандидатами; их цифры можно исключить из остальных клеток группы.','Продвинутые техники':'X-Wing и цепочки помогают на сложных уровнях, когда простые приёмы закончились.','Режим «Память»':'Подсказки исчезают через 8 секунд: запомните начальные цифры, пока они видны.','Число подсказок':'Чем меньше цифр дано, тем сложнее; настройка «Число подсказок» задаёт от 24 до 50.','Ежедневный вызов (судоку)':'Сетка зависит от даты, поэтому у всех игроков в один день одна и та же задача.','Подсветка ошибок':'Включите подсветку, чтобы видеть конфликты сразу; отключите для честной проверки себя.','Типичные ошибки':'Угадывание цифр без логики и поспешная подстановка без проверки строки, столбца и блока.','Единственность решения':'Генератор не гарантирует единственное решение; победа засчитывается, когда сетка заполнена без конфликтов.'},
battleship:{'Расстановка флота':'Расставляйте корабли неравномерно: не прижимайте все к краям и не ставьте их в предсказуемых местах.','Поиск кораблей':'Стреляйте «шахматкой» по каждой второй клетке: так любой корабль длиной от двух клеток будет найден быстрее.','Добивание':'После попадания обстреливайте четыре соседние клетки, пока не определите направление корабля.','Режим «Залп»':'Попали — стреляйте снова: серия попаданий может быстро решить исход партии.','Двойной выстрел ИИ':'В этом режиме соперник делает второй выстрел после промаха — расставляйте корабли осторожнее.','Размер флота':'Настройка «Флот» задаёт малый (3), обычный (5) или большой (7) набор кораблей.','Размер поля':'Поле 8×8, 10×10 или 12×12: чем оно больше, тем дольше поиск.','Поведение ИИ':'На высоких уровнях ИИ ищет корабли «шахматкой» и добивает по соседним клеткам; на низких стреляет случайно.','Типичные ошибки':'Хаотичный поиск, пропуск соседних клеток после попадания и корабли, стоящие рядом друг с другом.'},
airhockey:{'Управление колотушкой':'Колотушка следует за мышью или пальцем; быстрый рывок передаёт шайбе больше скорости.','Отбивание от бортов':'Бейте по шайбе под углом: отскок от бортов часто обманывает защиту.','Защита ворот':'Держите колотушку между шайбой и воротами, не уходите далеко от центра линии.','Атакующие приёмы':'Короткий удар в центр, затем быстрый добивающий — типичная схема для голов.','Режим «Лёд»':'Шайба почти не тормозит: игра становится быстрой, а отскоки — непредсказуемыми.','Трение шайбы':'Настройка «Трение шайбы» задаёт, как быстро шайба замедляется.','Ширина ворот':'Узкие ворота усложняют гол, широкие — упрощают.','Режим «1 vs 1»':'Нижний игрок использует мышь, верхний — клавиши WASD.','Типичные ошибки':'Погоня за шайбой в чужой половине, слишком сильные удары без прицела и оставленные без защиты ворота.'},
billiards:{'Удар':'Оттяните курсор от битка и отпустите: направление противоположно оттягиванию, сила пропорциональна длине.','Выбор шара':'Выбирайте шар, который можно забить в ближайшую лузу, и цельтесь в точку «призрачного шара».','Положение битка':'Планируйте положение битка после удара, чтобы следующий шар был удобным.','Защита (сэйф)':'Если забить нельзя, оставьте биток в положении, неудобном для соперника.','Режим «Соло»':'Забивайте все шары в одиночку: удобно для тренировки точности и силы удара.','Скользкое сукно':'В этом режиме шары почти не тормозят, поэтому нужны осторожность и контроль силы.','Рядов в пирамиде':'Настройка «Рядов в пирамиде» (2–5) меняет число шаров на столе.','Трение сукна':'Чем выше трение, тем быстрее шары останавливаются и тем важнее сила удара.','Типичные ошибки':'Слишком сильные удары, игнорирование положения битка и попытки забить без точного прицела.'},
backgammon:{'Правила движения':'Шашки движутся против часовой стрелки до последней четверти, затем снимаются с доски.','Блокировка':'Нельзя вставать на пункт, занятый шашками соперника; цепочки пунктов мешают его ходу.','Дубль':'При выпадении одинаковых костей игрок делает четыре хода по этому числу.','Снятие шашек':'Снимать можно только когда все шашки в «доме»; при большем числе можно снимать самую дальнюю шашку.','Режим «Только дубли»':'Каждый бросок даёт четыре хода по выпавшему числу — партия идёт быстрее.','Число шашек':'Настройка «Шашек у каждого» (5, 10, 15) меняет длину партии.','Грани кости':'Кости с 4, 6 или 8 гранями меняют ритм и риск игры.','Стратегия блокировки':'Стройте плотные цепочки подряд идущих пунктов, чтобы перекрыть путь сопернику.','Типичные ошибки':'Раскидывание шашек по всей доске, затягивание снятия и игнорирование блокирующих цепочек соперника.'},
mafia:{'Роли':'Мафия убивает ночью, доктор лечит, шериф проверяет игроков, мирные днём ищут мафию голосованием.','Ночь':'Ночью мафия выбирает жертву; если доктор лечит ту же цель, никто не погибает.','День':'Днём все голосуют: казнён игрок с наибольшим числом голосов; при ничьей никто не казнён.','Победа города':'Город побеждает, когда вся мафия выбыла.','Победа мафии':'Мафия побеждает, когда её число не меньше числа остальных живых игроков.','Скрытые роли':'В режиме «Скрытые роли» роли выбывших не раскрываются — труднее вычислять мафию.','Настройки состава':'Число мафии (1–3), наличие доктора и шерифа настраиваются.','Поведение ИИ':'ИИ-мирные чаще голосуют по настоящей мафии на высоких уровнях сложности; мафия голосует против мирных.','Типичные ошибки':'Голосование наугад, игнорирование результатов проверки шерифа и защита очевидно подозрительных игроков.'},
monopoly:{'Движение':'Игроки бросают два кубика и движутся по кольцу из 24 клеток; проход «Старта» приносит зарплату.','Покупка улиц':'На свободной улице можно купить её за указанную цену или пропустить.','Рента':'Попав на чужую улицу, платите ренту; она вдвое выше, если у хозяина обе улицы пары.','Шанс и налог':'Шанс даёт или забирает деньги, налог — фиксированный платёж из настроек.','Банкротство':'Игрок с отрицательным балансом выбывает, а его улицы освобождаются.','Двойная рента':'Режим «Двойная рента» удваивает все платежи — игра становится жёстче.','Стартовый капитал':'Настройка «Стартовые деньги» (800, 1500, 3000) меняет темп игры.','Лимит кругов':'Быстрая партия ограничена 15 кругами, обычная — 40; побеждает самый богатый.','Типичные ошибки':'Покупка всех подряд, нехватка денег на ренту и налоги и игнорирование пар улиц.'},
bingo:{'Карточка':'Карточка 5×5 с числами 1–75; колонки соответствуют буквам B-I-N-G-O.','Вызов шаров':'Шары выпадают случайно; интервал зависит от настройки скорости.','Отметка чисел':'Отмечайте только выпавшие числа: неверный клик сопровождается сигналом ошибки.','Условие победы':'Настройка «Условие победы» задаёт линию, четыре угла или всю карточку.','Свободный центр':'Центральная клетка по умолчанию свободна; её можно отключить в настройках.','Блэкаут':'Режим «Блэкаут» требует закрыть всю карточку.','Соло-режим':'Режим «Соло» считает, за сколько шаров вы закроете линию.','Поведение ИИ':'ИИ отмечает выпавшие числа с вероятностью, зависящей от сложности.','Типичные ошибки':'Невнимательность к выпавшим числам, поспешные клики и игнорирование прогресса соперника.'},
dobble:{'Колода':'Колода построена на конечной проективной плоскости: на любых двух картах ровно один общий символ.','Раунд':'Ищите общий символ на нижней карте и кликайте по нему быстрее соперника.','Режим на время':'В режиме «На время» нужно набрать как можно больше очков за отведённые секунды.','Режим со штрафом':'В режиме «Со штрафом» ошибка отнимает очко, поэтому спешка опасна.','Очков до победы':'Настройка «Очков до победы» (5, 10, 15) задаёт длину партии.','Время режима':'Настройка «Время режима «на время»» (30, 60, 120) меняет длительность раунда.','Поведение ИИ':'ИИ находит общий символ через время, зависящее от сложности и скорости.','Тренировка зрения':'Игра развивает скорость реакции и внимание к деталям.','Типичные ошибки':'Поиск по одному символу вместо сканирования всей карты и нажатия наугад.'},
corners:{'Расстановка':'У каждого по 9 фишек в углу 3×3 на доске 8×8; цель — занять противоположный угол.','Шаг':'Фишка делает шаг на соседнюю клетку в любую из восьми сторон.','Прыжок':'Можно перепрыгнуть через соседнюю фишку (любую) на свободную клетку за ней, цепочкой.','Лестницы':'Выстраивайте фишки так, чтобы они образовывали «лестницу» для цепочки прыжков.','Режим «Только по прямой»':'Диагональные шаги и прыжки запрещены — игра медленнее и стратегичнее.','Лимит ходов':'Настройка «Лимит ходов» (100, 200, 400) задаёт предел партии.','Прыжки в настройках':'Настройка «Прыжки разрешены» отключает цепочки прыжков.','Поведение ИИ':'ИИ оценивает продвижение фишек к цели; на высоком уровне учитывает ответ соперника.','Типичные ошибки':'Оставление фишек позади, блокировка собственных цепочек и ходы без плана.'},
lotto:{'Карточка':'Карточка 3×9: в каждой строке по 5 чисел (по настройкам 3–6), числа в столбцах по возрастанию.','Бочонки':'Бочонки 1–90 достаются по одному; скорость зависит от настройки.','Отметка':'Кликайте только по выпавшим числам; ошибочный клик вызывает сигнал.','Автоотметка':'Настройка «Автоотметка чисел» отмечает ваши числа сама.','Режим «Одна строка»':'Побеждает тот, кто первым закроет любую строку.','Соло':'Режим «Соло» считает, за сколько бочонков закрыта карточка.','Чисел в строке':'Настройка «Чисел в строке» (3–6) меняет длину партии.','Поведение ИИ':'ИИ отмечает числа с вероятностью, зависящей от сложности.','Типичные ошибки':'Невнимательность, пропуск числа и отвлечение на соперника.'},
words:{'Правила':'Угадайте слово из 5 букв; после каждой попытки клетки окрашиваются подсказками.','Цвета':'Зелёный — буква на месте, жёлтый — буква есть в другом месте, серый — такой буквы нет.','Попытки':'Число попыток зависит от сложности ИИ или настройки «Попыток».','Слово дня':'Режим «Слово дня» даёт одно и то же слово всем игрокам в течение суток.','Режим на время':'В режиме «На время» нужно угадать как можно больше слов за отведённое время.','Три попытки':'Режим «Три попытки» ужесточает правила: промахнуться почти нельзя.','Стартовые слова':'Хорошие стартовые слова содержат частые буквы: А, О, Е, Н, Р, Т.','Клавиатура':'Экранная клавиатура показывает статус букв; можно играть и с обычной клавиатуры.','Типичные ошибки':'Повтор уже исключённых букв, игнорирование позиций и поспешные попытки.'},
shogi:{'Фигуры':'Король, ладья, слон, золото, серебро, конь, копьё и пешка; у каждой свой ход.','Превращение':'В зоне превращения фигуры усиливаются; в портале превращение автоматическое, но его можно отключить настройкой.','Сброс':'Взятую фигуру можно сбросить на любую свободную клетку как свою — главная особенность сёги.','Режим «Без сброса»':'В этом режиме взятые фигуры не возвращаются, игра ближе к шахматам.','Крепости':'Строя крепость вокруг короля (например, Мино или Ягура), вы защищаетесь от атак.','Ловушки':'Часто игроки забывают о возможности сброса фигур и попадают в мат.','Настройки':'Настройки «Сброс фигур» и «Автопревращение» меняют правила партии.','Поведение ИИ':'ИИ оценивает материал, включая фигуры в резерве, и ищет мат на несколько ходов вперёд.','Типичные ошибки':'Забвение сброса, ранний обмен ладей и слабая защита короля.'}};

Object.assign(INFO,{
connect4:{h:'Игра «Четыре в ряд» (Connect Four) выпущена Milton Bradley в 1974 году; в 1988 году было доказано, что первый игрок при идеальной игре выигрывает.',r:'Игроки по очереди бросают диски в колонки поля 7×6; диск падает на самую низкую свободную клетку. Побеждает тот, кто первым собрал четыре диска по горизонтали, вертикали или диагонали.',f:['Поле 7×6 даёт 4 531 985 219 092 позиций.','Центральная колонка — самая выгодная.','Решение игры найдено компьютерным перебором в конце 1980-х.']},
g2048:{h:'Игру 2048 создал в 2014 году молодой разработчик Габриэлье Чиратти; она происходит от игры 1024 и Threes.',r:'Сдвигайте плитки стрелками или свайпом: одинаковые числа сливаются в сумму. После каждого хода появляется 2 или 4. Цель — плитка «2048» (в настройках можно выбрать 512–4096).',f:['Максимальная плитка на поле 4×4 — 131072.','Стратегия «угол»: держите большую плитку в углу.','Игра открыта как open-source проект.']},
guess:{h:'Игра «Угадай число» — классика программирования и детских игр, где ведущий подсказывает «больше» или «меньше».',r:'Загадано число в заданном диапазоне. Введите предположение — игра скажет «больше» или «меньше». Угадайте за отведённое число попыток. В режиме «Дуэль» ИИ угадывает то же число поочерёдно с вами.',f:['Двоичный поиск угадывает число до 1000 за 10 попыток.','Диапазон 1–10000 угадывается максимум за 14 ходов.','Такая игра — первое задание многих начинающих программистов.']}});

const GK0=GK;GK=id=>{const X={g2048:{neon:'g48n',bg:'g48t'},guess:{neon:'gmax',bg:'gtr'},connect4:{neon:'c4first',bg:'c4dly'}}[id];return X?GKB.map(k=>X[k]||k):GK0(id)};
IMPL.connect4=(h,mode,ui)=>{const mis=mode==='misere4';if(mis)mode='ai';const R=6,C=7;let b=Array.from({length:R},()=>Array(C).fill(0)),t0=1,done=false,busy=false;
const win=(b,p)=>{for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(b[r][c]!==p)continue;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){let k=1;while(k<(+S.c4win||4)&&r+dr*k>=0&&r+dr*k<R&&c+dc*k>=0&&c+dc*k<C&&b[r+dr*k][c+dc*k]===p)k++;if(k===(+S.c4win||4))return true}}return false};
const drop=(b,c,p)=>{for(let r=R-1;r>=0;r--)if(!b[r][c]){const n=b.map(x=>x.slice());n[r][c]=p;return n}return null};
const wsc=w=>{const a=w.filter(v=>v===-1).length,u=w.filter(v=>v===1).length;if(a&&u)return 0;const T=[0,1,5,50,1e4];return a?-T[a]:T[u]};
const ev=b=>{let s=0;for(let r=0;r<R;r++){if(b[r][3])s+=b[r][3]*3;for(let c=0;c<C;c++)for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const w=[];for(let k=0;k<4;k++){const y=r+dr*k,x=c+dc*k;if(y<0||y>=R||x<0||x>=C)break;w.push(b[y][x])}if(w.length===4)s+=wsc(w)}}return s};
const mm=(b,d,p,a,be)=>{if(win(b,1))return 1e6+d;if(win(b,-1))return -1e6-d;const cols=[3,2,4,1,5,0,6].filter(c=>!b[0][c]);if(!d||!cols.length)return ev(b);if(p===1){let v=-1e9;for(const c of cols){v=Math.max(v,mm(drop(b,c,1),d-1,-1,a,be));a=Math.max(a,v);if(a>=be)break}return v}let v=1e9;for(const c of cols){v=Math.min(v,mm(drop(b,c,-1),d-1,1,a,be));be=Math.min(be,v);if(a>=be)break}return v};
const pick=()=>{const cols=[...Array(C).keys()].filter(c=>!b[0][c]),lv=S.ai;if(mis){const sf=cols.filter(c=>!win(drop(b,c,-1),-1));return rnd(sf.length?sf:cols)}if(lv===1||(lv===2&&Math.random()<.3))return rnd(cols);let best=1e9,bc=[];for(const c of cols){const v=mm(drop(b,c,-1),[0,2,3,5,6][lv-1]-1,1,-1e9,1e9);if(v<best){best=v;bc=[c]}else if(v===best)bc.push(c)}return rnd(bc)};
const cs=Math.min(60,Math.floor((innerWidth-50)/C)),el=document.createElement('div');el.className='board';el.style.cssText=`grid-template-columns:repeat(${C},${cs}px);background:${S.field};gap:3px`;h.appendChild(el);

const targets=()=>sel?(sel.t?places(1):moves(sel.from[0],sel.from[1])):[];
function draw(){x.fillStyle=S.field;x.fillRect(0,0,W,H);const tg=targets();const hex=(cx,cy,fill,stroke)=>{x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);x.lineTo(cx+SZ*.95*Math.cos(a),cy+SZ*.95*Math.sin(a))}x.closePath();if(fill){x.fillStyle=fill;x.fill()}x.strokeStyle=stroke;x.lineWidth=2;x.stroke()};
tg.forEach(([q,r])=>{const[cx,cy]=pt(q,r);hex(cx,cy,S.accent+'33',S.accent)});B.forEach((v,k)=>{const[q,r]=pl(k),[cx,cy]=pt(q,r);hex(cx,cy,v.p>0?S.p1:(S.pc),sel&&sel.from&&sel.from[0]===q&&sel.from[1]===r?'#fff':S.grid);x.fillStyle='#000';x.font='700 15px Orbitron,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText({Q:'К',B:'Ж',G:'З',A:'М'}[v.t],cx,cy)});
hb.innerHTML=Object.keys(hand[1]).map(ty=>`<button class='btn${sel&&sel.t===ty?' alt':''}' data-t='${ty}' style='opacity:${hand[1][ty]>0&&(!must(1)||ty==='Q')?1:.35}'>${{Q:'К',B:'Ж',G:'З',A:'М'}[ty]}×${hand[1][ty]}</button>`).join('')+`<button class='btn alt' data-pass='1'>Пас</button>`;ui.title(turn===1?'Ваш ход (К королева, Ж жук, З кузнечик, М муравей)':'Ход ИИ');ui.score('Фишек в резерве: '+Object.values(hand[1]).reduce((a,b)=>a+b,0))}
function after(){if(!check()){turn=-1;draw();aiMove()}}
function aiMove(){busy=true;setTimeout(()=>{busy=false;if(done)return;const p=-1,opts=[],pls=places(p),types=must(p)?['Q']:Object.keys(hand[p]).filter(ty=>hand[p][ty]>0);types.forEach(ty=>pls.forEach(([q,r])=>opts.push({k:'p',t:ty,q,r})));if(hand[p].Q===0)B.forEach((v,k)=>{if(v.p!==p)return;const[q0,r0]=pl(k);moves(q0,r0).forEach(([q,r])=>opts.push({k:'m',q0,r0,q,r}))});if(!opts.length){turn=1;draw();return}
let eq=null;B.forEach((v,k)=>{if(v.t==='Q'&&v.p===1)eq=pl(k)});opts.forEach(o=>{let s=Math.random()*[8,5,3,1,0][S.ai-1];if(eq){const d=Math.max(Math.abs(o.q-eq[0]),Math.abs(o.r-eq[1]),Math.abs(o.q+o.r-eq[0]-eq[1]));s+=(3-Math.min(d,3))*2}if(o.k==='p'&&o.t==='Q')s+=1;o.s=s});opts.sort((a,b)=>b.s-a.s);const o=opts[0];if(o.k==='p')placeAt(p,o.t,o.q,o.r);else moveTo(o.q0,o.r0,o.q,o.r);sfx.move();if(!check()){turn=1;draw()}},600)}
cv.onclick=e=>{if(done||busy||turn!==1)return;const q0=cv.getBoundingClientRect(),px=(e.clientX-q0.left)*W/q0.width,py=(e.clientY-q0.top)*H/q0.height,hit=cells=>{let best=null,bd=1e9;cells.forEach(([q,r])=>{const[cx,cy]=pt(q,r),d=Math.hypot(px-cx,py-cy);if(d<bd){bd=d;best=[q,r]}});return bd<SZ?best:null};
if(sel){const c=hit(targets());if(c){if(sel.t)placeAt(1,sel.t,c[0],c[1]);else moveTo(sel.from[0],sel.from[1],c[0],c[1]);sel=null;after();return}sel=null;draw();return}
const own=[];B.forEach((v,k)=>{if(v.p===1)own.push(pl(k))});const c=hit(own);if(c&&hand[1].Q===0&&moves(c[0],c[1]).length)sel={from:c};draw()};
hb.onclick=e=>{if(done||busy||turn!==1)return;const b=e.target.closest('[data-t],[data-pass]');if(!b)return;if(b.dataset.pass){sel=null;turn=-1;draw();aiMove();return}const ty=b.dataset.t;if(hand[1][ty]>0&&(!must(1)||ty==='Q')){sel={t:ty};draw()}else sfx.err()};
draw();return{stop(){done=true}}};
IMPL.munchkin=(h,mode,ui)=>{const WIN=+S.mkwin||10,MON=[['Слизень',1],['Гоблин',3],['Крысы-мутанты',4],['Огр',6],['Тролль',8],['Дракон',12]],IT=[['Меч',2],['Щит',1],['Шлем',1],['Секира',3],['Броня',2],['Посох',2]];
let lv=[1,1],gear=[0,0],hand=[[],[]],mon=null,done=false,busy=false,log=[];const drawIt=()=>{const n=rnd(IT);return{n:n[0],b:n[1]}},mk=p=>{const m=rnd(MON.filter(x=>x[1]<=lv[p]+4));return{n:m[0],l:m[1]}};hand[0]=[drawIt(),drawIt(),drawIt()];hand[1]=[drawIt(),drawIt(),drawIt()];
const el=document.createElement('div');el.style.cssText='display:flex;flex-direction:column;gap:12px;align-items:center;max-width:640px';h.appendChild(el);
function paint(){el.innerHTML=`<div><b>Вы: уровень ${lv[0]} + бонус ${gear[0]} = ${lv[0]+gear[0]}</b> · ИИ: уровень ${lv[1]}</div>${mon?`<div style='padding:10px;border:2px solid ${S.pc};border-radius:10px'>Монстр: ${mon.n} (уровень ${mon.l})</div>`:''}<div style='display:flex;flex-wrap:wrap;gap:8px;justify-content:center'>${hand[0].map((c,i)=>`<button class='btn' data-e='${i}'>${c.n} +${c.b}</button>`).join('')||'<span class=mut>Нет вещей</span>'}</div><div class='row'>${mon?"<button class='btn' data-a='fight'>Сражаться</button><button class='btn alt' data-a='flee'>Бежать</button>":"<button class='btn' data-a='open'>Открыть дверь</button>"}</div><div class='mut'>${log.slice(-6).join('<br>')}</div>`;ui.title(mon?'Монстр перед вами':'Ваш ход');ui.score(`Уровни: ${lv[0]} : ${lv[1]} (цель ${WIN})`)}
function chk(){if(lv[0]>=WIN){done=true;sfx.win();paint();setTimeout(()=>ui.end(t('win')),400);return true}if(lv[1]>=WIN){done=true;sfx.err();paint();setTimeout(()=>ui.end(t('lose')),400);return true}return false}
function resolve(p,flee){const tot=lv[p]+gear[p],who=p===0?'Вы':'ИИ';if(!flee&&tot>mon.l){lv[p]+=mon.l>=8?2:1;hand[p].push(drawIt());if(mon.l>=6)hand[p].push(drawIt());log.push(`${who} победили монстра ${mon.n}`);sfx.win()}else{const d=1+Math.floor(Math.random()*6);if(d>=5){log.push(`${who} сбежали (кубик ${d})`)}else{lv[p]=Math.max(1,lv[p]-1);log.push(`${who} не сбежали (${d}) и теряют уровень`);sfx.err()}}mon=null}
function aiTurn(){busy=true;setTimeout(()=>{busy=false;if(done)return;hand[1].forEach(c=>gear[1]+=c.b);hand[1]=[];mon=mk(1);resolve(1,lv[1]+gear[1]<=mon.l&&Math.random()<.7);paint();chk()},700)}
el.onclick=e=>{if(done||busy)return;const q=e.target.closest('[data-e],[data-a]');if(!q)return;sfx.click();const d=q.dataset;
if(d.e!==undefined){const c=hand[0].splice(+d.e,1)[0];gear[0]+=c.b;paint();return}
if(d.a==='open'){mon=mk(0);log.push('Вы открыли дверь: '+mon.n+' ('+mon.l+')');paint();return}
if(d.a==='fight'||d.a==='flee'){resolve(0,d.a==='flee');paint();if(!chk())aiTurn()}};
paint();return{stop(){done=true}}};

chess:{'История':'Первые чёткие правила европейских шахмат оформились в Испании и Италии около 1475 года, когда ферзь и слон получили современную силу; в XIX веке появились первые турниры и шахматные часы.','Правила':'Фигуры не могут перепрыгивать через другие, кроме коня; пешка ходит вперёд, но бьёт по диагонали. Король не может ходить под шах, а игрок, чей король под шахом, обязан его устранить.','Интересные факты':'Самая длинная официальная партия — Николич–Арсович (1989) — длилась 269 ходов и более 20 часов.','Современность':'Онлайн-платформы проводят блиц-арены и командные матчи, а профессиональный тур включает Grand Chess Tour и командные чемпионаты стран.','Будущее':'Нейросети оценивают позиции лучше традиционных эвристик, а тренировочные сервисы разбирают партии игрока и подсказывают типичные ошибки.','Поле':'Клетка a1 в левом нижнем углу у белых всегда тёмная; вертикали обозначают буквами, горизонтали — цифрами, что позволяет записать любой ход двумя символами.','Время':'В турнирах по классике на партию отводят 90 минут на 40 ходов плюс 30 минут и прибавку 30 секунд за ход; в блице — 3 минуты на партию.','Счёт':'В турнирах очки суммируются; при равенстве применяют дополнительные показатели (коэффициент Бухгольца, личные встречи).','Стратегия и тактика':'Ладьи лучше ставить на открытые вертикали, коней — на форпосты, которые нельзя атаковать пешкой, а слон хорош в позициях с открытыми диагоналями.','Известные игроки':'Эмануил Ласкер удерживал звание чемпиона мира 27 лет (1894–1921) — дольше всех; Магнус Карлсен достиг рейтинга Эло 2882 в 2014 году.','Разновидности':'В Chess960 расстановка фигур выбирается случайно из 960 вариантов, что снижает значение домашней подготовки дебютов.','Дебюты':'Сицилианская защита (1.e4 c5) — самый популярный ответ чёрных на 1.e4; в ферзевом гамбите (1.d4 d5 2.c4) белые предлагают пешку ради центра.','Миттельшпиль':'Типичные планы — меньшинственная атака на ферзевом фланге, атака на короля при рокировках на разные фланги и создание проходной пешки.','Эндшпиль':'Король и пешка против короля выигрывают, если король защищает пешку и занимает поле перед ней в нужный момент (правило оппозиции); ладейные эндшпили часто ничейные.','Тактические приёмы':'Вилка конём одновременно атакует две фигуры; связка не позволяет фигуре ходить, потому что за ней стоит более ценная.','Типичные ошибки':'Многие начинающие не проверяют ответные угрозы соперника перед ходом и теряют фигуры «на ровном месте».','Тренировка':'Полезно решать по 10–15 тактических задач в день и разбирать каждую проигранную партию, отмечая момент, где оценка позиции изменилась.','Шахматная нотация':'Полная запись партии — список пар ходов (1.e4 e5 2.Nf3 Nc6); короткая рокировка записывается 0-0, длинная — 0-0-0, превращение — e8=Q.','Детский мат':'Похожий на него «мат Шоляра» (1.e4 e5 2.Qh5 Nc6 3.Bc4 Nf6 4.Qxf7#) ставят начинающим за четыре хода, если они забывают защитить пункт f7.','Упрощения портала':'Отсутствие рокировки и взятия на проходе делает оценку позиции проще, а превращение пешки по выбору позволяет изучать эндшпили с ферзём, ладьёй, слоном или конём.'},
tetris:{'История':'Первая версия Tetris была написана на компьютере «Электроника 60» в Вычислительном центре Академии наук СССР; права на игру позднее получила Nintendo для Game Boy (1989).','Правила':'Фигура фиксируется, когда не может опуститься ниже; заполненные ряды исчезают, а всё, что выше, сдвигается вниз. Игра заканчивается, когда новая фигура не помещается в стакан.','Интересные факты':'Очки растут нелинейно: четыре линии за раз дают в восемь раз больше очков, чем одна, поэтому игроки копят «колодец» под фигуру I.','Современность':'Классический чемпионат мира по NES Tetris проходит ежегодно; игроки используют техники «быстрых нажатий», чтобы двигать фигуры быстрее.','Будущее':'Боты ищут оптимальные расположения фигур перебором с оценочной функцией (высота, дыры, неровность поверхности) и играют быстрее человека.','Поле':'Стандартный стакан — 10×20 клеток; верхние строки над стаканом служат для появления новых фигур.','Время':'Партия в классическом режиме не ограничена по времени и длится, пока игрок справляется со скоростью падения; спринт на 40 линий лучшие игроки проходят за считанные десятки секунд.','Счёт':'Очки за линии умножаются на уровень, поэтому при высоких уровнях тетрис (четыре линии) приносит особенно много; в портале множитель можно изменить настройкой.','Стратегия и тактика':'Держите поверхность ровной, не создавайте колодцы глубже двух клеток без фигуры I и размещайте S и Z так, чтобы не оставлять дыр.','Известные игроки':'Йонас Нойбауэр семь раз выигрывал чемпионат мира по классическому Tetris; Уиллис Гибсон в декабре 2023 года довёл игру до «крэша» на уровне 157.','Разновидности':'В Puyo Puyo Tetris игроки соревнуются, сбрасывая мусорные блоки на поле соперника, а Tetris Effect добавляет музыкальное сопровождение и визуальные эффекты.','Тетрамино':'Из четырёх квадратов можно собрать ровно семь разных фигур (с учётом зеркальных отражений).','Скорость и уровни':'Скорость падения растёт с уровнем; в портале начальная скорость, предел падения и стартовый уровень задаются настройками, поэтому сложность можно подобрать точно.','Техники':'«Тень» показывает, куда упадёт фигура, а мгновенный сброс экономит время, но требует точности; опытные игроки заранее выбирают место для следующей фигуры.','Типичные ошибки':'Нетерпеливое заполнение стакана и игнорирование высоты середины поля быстро приводят к «башне», из которой трудно выйти.','Тренировка':'Начните с замедленной скорости и режима «Дзен», затем переходите к спринту; практикуйте разные способы поворота и сброса.','Режимы портала':'Режим «Дождь мусора» имитирует соревновательные атаки, «Без поворотов» учит планировать заранее, а «Ультра» тренирует набор очков за ограниченное время.','Управление и сброс':'Нажатие стрелки вниз ускоряет падение на одну клетку, а пробел мгновенно ставит фигуру на место; на сенсорных экранах доступны экранные кнопки.','Рекорды':'Рекорды очков в классическом Tetris — миллионы; для сравнения результатов важно указывать версию игры и начальный уровень.','Эргономика':'Игровая область масштабируется настройкой «Масштаб игровой области», а прозрачность и подложка помогают на светлых экранах.'}};

Object.assign(INFO4,{go:{'История':'Легенда приписывает изобретение го императору Яо около 2300 года до н. э.; в Японию игра попала в VII веке, а в XVII веке там появились профессиональные школы.','Правила':'Камни не двигаются после установки; захваченные камни снимаются с доски, а игрок может пасовать, если не видит полезного хода.','Интересные факты':'Число возможных позиций на доске 19×19 оценивается приблизительно в 2,1×10^170, что намного превышает число атомов в наблюдаемой Вселенной.','Современность':'Профессиональные игроки в Китае, Японии и Корее проходят многолетнюю подготовку в школах; крупные титулы разыгрываются в многочасовых матчах.','Будущее':'Программы вроде КатаГо используются для анализа партий, подсказывая вероятность выигрыша для каждого хода.','Поле':'Звёздные точки (хоси) на доске служат ориентирами и местами установки камней форы; на малых досках их три или пять.','Время':'В профессиональных партиях применяют контроль «бьё-ёми»: после основного времени игроки получают короткие периоды на каждый ход.','Счёт':'Подсчёт по территории учитывает камни и окружённые пустые пункты, а при японских правилах считают только территорию и пленных.','Стратегия и тактика':'Начало партии играют в углах, затем на сторонах и только потом в центре, потому что углы позволяют занять территорию меньшим числом камней.','Известные игроки':'Го Сэйген (1914–2014) считается одним из величайших игроков XX века и автором новой теории дебюта «синфусэки».','Разновидности':'Рэнго — игра в пять в ряд на доске для го, а парное го разыгрывается двумя командами по два игрока.','Дыхания':'Камни по диагонали не считаются соседними, поэтому группа соединяется только по горизонталям и вертикалям.','Захват':'Одним ходом можно захватить сразу несколько групп, если у всех осталось последнее дыхание.','Два глаза':'Если глаз один, группу можно захватить, поставив камень внутрь, когда у группы нет других дыханий.','Правило ко':'Правило запрещает повторение позиции через ход, но допускает повторение через несколько ходов; в разных вариантах правил есть ужесточения — «суперко».','Самоубийство':'В большинстве правил такие ходы запрещены; в некоторых вариантах они разрешены, и тогда сам камень снимается.','Пас и конец игры':'После двух пасов подряд игроки договариваются о статусе спорных групп, а в портале подсчёт идёт автоматически.','Коми':'Значение 6,5 исключает ничью и применяется в большинстве правил; 7,5 используют по китайским правилам.','Поведение ИИ':'ИИ учитывает шанс захвата, число свободных пунктов у группы и расстояние до центра, добавляя случайность на низких уровнях.','Типичные ошибки':'Начинающие часто играют слишком близко к камням соперника и теряют инициативу, а также забывают проверить дыхания своих групп.'}});

poker:{'История':'Название «холдем» закрепилось за вариантом, популярность которого выросла после 1970 года, когда турнир World Series of Poker начали проводить в Лас-Вегасе, а общие карты сделали игру понятнее для зрителей.','Правила':'Сначала делаются обязательные ставки, затем сдаются карты и начинается круг торгов; победитель — тот, кто не сбросил карты и имеет лучшую комбинацию, либо тот, чья ставка осталась без ответа.','Интересные факты':'Вероятность получить пару тузов в начальной раздаче — около 0,45%, то есть примерно один раз на 220 раздач.','Современность':'Тренажёры показывают равновесные стратегии по каждой позиции, а профессионалы изучают их, чтобы свести к минимуму ошибки в торговле.','Будущее':'Алгоритмы нового поколения учатся на самоигре и не требуют знаний о человеческой стратегии, поэтому всё чаще применяются и в других играх с неполной информацией.','Поле':'Общие карты выкладываются в центре стола: три на флопе, по одной на тёрне и ривере, и их могут использовать оба игрока.','Время':'Хедз-ап раздачи идут быстро: решение занимает от нескольких секунд до минуты, а матч до банкротства одного из игроков — от четверти часа до часа.','Счёт':'При равных комбинациях сравниваются старшие карты и кикеры, а точное равенство даёт ничью с разделом банка.','Стратегия и тактика':'В хедз-апе играют больше рук, чем за столом из девяти человек, и чаще повышают, потому что у обоих игроков руки в среднем слабее.','Известные игроки':'Дойл Брансон выиграл десять браслетов главной серии, а Фил Хельмут — более пятнадцати.','Разновидности':'В омахе каждому раздают по четыре карты, из которых нужно использовать ровно две, а в стад-покере общих карт нет вовсе.','Комбинации':'Старшинство от слабой к сильной: старшая карта, пара, две пары, тройка, стрит, флеш, фулл-хаус, каре, стрит-флеш и роял-флеш.','Этапы раздачи':'На каждом этапе торговля начинается заново, но банк копится, поэтому решения на ривере зависят от всех предыдущих ставок.','Блайнды':'Блайнды растут со временем в турнирах, заставляя игроков действовать активнее, а в портале размер блайнда задаётся один раз в настройках.','Действия':'Чек допускается только если ставки на этом этапе ещё не было, а колл уравнивает последнюю ставку; в портале доступен один рейз за этап.','Блеф':'Хороший блеф рассказывает правдоподобную историю: поведение на предыдущих этапах должно соответствовать сильной руке.','Шансы банка':'Если колл стоит четверть банка, вам нужно выигрывать примерно в одном случае из пяти, чтобы остаться в плюсе.','Поведение ИИ':'ИИ добавляет небольшой случайный шум к оценке силы руки, чтобы не быть полностью предсказуемым.','Банкролл':'В турнирах рекомендуется не рисковать более небольшой доли банка на одном входе, чтобы пережить серию неудач.','Типичные ошибки':'Многие игроки слишком долго держат пары на ривере после явных сигналов силы соперника и коллируют из любопытства.'},
connect4:{'История':'Игра выпущена в 1974 году компанией Милтон Брэдли; её простота сделала её классикой для обучения программированию ИИ и перебору позиций.','Правила':'Диск нельзя вставить в заполненную колонку, а победная линия может идти по горизонтали, вертикали или любой из двух диагоналей.','Интересные факты':'Первый игрок может гарантированно выиграть, если начнёт с центральной колонки и будет играть без ошибок.','Современность':'Популярны онлайн-версии с рейтингами и режимы с блицем, где на ход отводится всего несколько секунд.','Будущее':'Обучающиеся программы анализируют сотни миллионов позиций, поэтому тренировка против них быстро показывает слабые места.','Поле':'Шесть рядов и семь колонок образуют 42 клетки, а общее число различных позиций исчисляется триллионами.','Время':'Типичная партия заканчивается за несколько минут, если игроки думают над каждым ходом.','Счёт':'Партия не приносит очков кроме победы, поэтому в турнирах играют серии матчей до нескольких побед.','Стратегия и тактика':'Контролируйте центральные колонки: они входят в наибольшее число возможных линий для четырёх дисков подряд.','Известные игроки':'Профессионального спорта по этой игре почти нет, но анализ первых ходов хорошо известен и в литературе по теории игр.','Разновидности':'В Pop Out диски можно вытаскивать снизу, что полностью меняет тактику, а в версиях с большим полем нужны линии из пяти.','Падение дисков':'Из-за падения вниз каждая колонка заполняется снизу вверх, поэтому клетка над вашей угрозой часто становится опасной для соперника.','Двойная угроза':'Ловушка из двух открытых троек в разных направлениях почти всегда выигрывает, если соперник не успел её заметить.','Чётные и нечётные ряды':'Знание этого правила помогает в эндшпиле решать, какие колонки не стоит заполнять первыми.','Дебют':'Ответ на первый центральный ход в соседнюю колонку чаще всего ведёт к тяжёлой защите, поэтому второй игрок старается играть в центр.','Поведение ИИ':'На высоких уровнях ИИ оценивает позиции на несколько ходов вперёд и ищет принудительные последовательности.','Кто ходит первым':'Передача первого хода ИИ полезна для тренировки защиты, потому что у первого игрока теоретическое преимущество.','Задержка ИИ':'Нулевая задержка делает игру максимально быстрой, а большая помогает следить за каждым ходом и анализировать позицию.','Режим «1 vs 1»':'Два человека могут играть на одном экране, передавая управление; цвета дисков берутся из настроек игроков.','Типичные ошибки':'Многие игроки пропускают угрозу по диагонали и открывают сопернику клетку над собственной тройкой.'},
g2048:{'История':'Игру создал в марте 2014 года Габриэле Чиратти за выходные, а вдохновением послужили игры 1024 и Threes.','Правила':'После каждого сдвига все плитки скользят до упора, объединяются только пары одинаковых плиток, а за один ход плитка может участвовать в слиянии только один раз.','Интересные факты':'Теоретически на поле 4×4 можно собрать плитку 131072, но для этого нужно почти безупречное планирование каждого хода.','Современность':'Любители соревнуются в скорости получения плитки 2048 и в числе очков за заданное время, публикуя записи прохождения.','Будущее':'Алгоритмы вроде поиска по дереву с оценкой угловой монотонности достигают плиток выше 32768 и подходят для обучения студентов.','Поле':'Сетка не ограничена четырьмя клетками: в портале можно выбрать размер от 3×3 до 6×6, что меняет баланс сложности.','Время':'Партия на 4×4 обычно занимает 5–20 минут, а в режиме на время ограничена тремя минутами.','Счёт':'За слияние двух плиток вы получаете число очков, равное значению новой плитки, поэтому крупные плитки приносят всё больше очков.','Стратегия и тактика':'Выбирайте две пары направлений для повторяющихся ходов (например, влево и вниз), а четвёртое используйте только при необходимости.','Известные игроки':'Лучшие игроки поддерживают угловую монотонность и умеют откладывать крупные слияния, чтобы не терять управление над полем.','Разновидности':'В Threes плитки сливаются попарно по правилам 1+2=3, а в шестиугольных версиях есть шесть направлений сдвига.','Слияние':'Если три одинаковые плитки стоят в ряд, при сдвиге сливаются первые две, а третья остаётся на месте.','Новая плитка':'Появление четвёрки реже, но именно она иногда разрушает аккуратный порядок, поэтому настройка вероятности сильно влияет на сложность.','Цель':'Цель 512 подходит для быстрой партии, а 4096 требует предельно аккуратной игры на большом поле.','Размер поля':'На большом поле больше места для манёвра и можно строить несколько цепочек слияния одновременно.','Режим «Только четвёрки»':'В этом режиме появляются только четвёрки, поэтому цепочки начинаются сразу со второй ступени и партия идёт быстрее.','Режим на время':'Здесь важнее скорость решений, чем идеальный порядок: поддерживайте большую плитку в углу, но не тратьте секунды на сложные планы.','Свайп':'Касание и протяжка по полю распознаются по преобладающему направлению; для клавиатуры доступны четыре стрелки.','Допустимый ход':'Если сдвиг не меняет положение плиток, он не засчитывается и новая плитка не появляется, поэтому «пустые» сдвиги не вредят.','Типичные ошибки':'Самая частая ошибка — сдвиг в направление, из которого вы убрали крупную плитку из угла, из-за чего поле сразу теряет порядок.'}});
